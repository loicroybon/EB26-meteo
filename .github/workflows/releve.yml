name: Relevé partagé

# Un seul relevé pour tous les appareils, au lieu d'un par appareil et par visite.
# C'est ce qui borne la consommation de quota : elle ne dépend plus du nombre de
# consultations. Les clés restent dans les variables de dépôt, jamais dans un
# appel fait depuis un téléphone.
on:
  schedule:
    # Tentative toutes les 30 minutes, pour que le cache partagé soit frais au
    # plus tard une demi-heure après la publication d'un run.
    #
    # Cela n'augmente PAS la consommation des fournisseurs, et c'est le point
    # qu'il fallait vérifier avant de doubler la cadence : le garde-fou agit
    # avant toute dépense. interroger() compare le relevé partagé au dernier run
    # publié et refuse si le cache le contient déjà. La consommation reste donc
    # bornée par la cadence de publication — 3 h pour les mailles fines — et non
    # par celle du cron.
    #
    # Ce qui double, c'est le temps de runner. On l'écourte : le script demande
    # d'abord à la page si elle refuserait, via releveInutile(), et sort sans
    # rien charger de plus. Cinq tentatives sur six sortiront par ce chemin.
    - cron: '5,35 * * * *'
  workflow_dispatch:            # déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write               # nécessaire pour committer data/dernier.json

concurrency:
  group: releve
  cancel-in-progress: false     # deux relevés qui se chevauchent produiraient un conflit

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Surchargent config.js pendant le relevé. Voir .env.example.
      EB26_METEOBLUE_CLES: ${{ vars.EB26_METEOBLUE_CLES }}
      EB26_WINDY_CLES: ${{ vars.EB26_WINDY_CLES }}
      EB26_METEOFRANCE_CLES: ${{ vars.EB26_METEOFRANCE_CLES }}
      EB26_OPENMETEO_CLES: ${{ vars.EB26_OPENMETEO_CLES }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Selenium
        run: pip install --quiet selenium

      - name: Vérifier que Chrome est présent
        run: google-chrome --version

      # AROME 1,3 km : le seul modèle qui résolve Belledonne, et il est gratuit
      # et sans clé. ecCodes vient avec la roue pip sous Linux. Le script décline
      # tout seul (code 3) tant que la course n'est pas dans la portée de 51 h du
      # dernier run, donc avant le 19/08 03Z il ne télécharge rien.
      # Attention à la temporalité : l'asset produit ici n'est visible de la page
      # déployée qu'au cycle suivant, puisque la page lit le fichier publié. Avec
      # un cron horaire, le décalage est d'une heure.
      - name: AROME 1,3 km depuis les données ouvertes
        id: arome
        continue-on-error: true
        run: |
          pip install --quiet meteofetch cfgrib xarray
          set +e
          python scripts/arome.py --sortie data/arome.json
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "hors portée, rien écrit"
          elif [ "$code" != "0" ]; then
            echo "AROME en échec (code $code), on continue sans lui"
          fi

      - name: Relevé sur la page déployée
        id: releve
        # Le script rend 3 quand aucun run nouveau n'est publié : ce n'est pas
        # une erreur, c'est le cas normal deux fois sur trois. On enchaîne alors
        # sans contrôler ni publier.
        run: |
          set +e
          python scripts/releve.py "https://loicroybon.github.io/EB26-meteo/" data/dernier.json
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "rien_de_neuf=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "rien_de_neuf=false" >> "$GITHUB_OUTPUT"
          exit $code
        env:
          FORCER: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Contrôler le paquet produit
        if: steps.releve.outputs.rien_de_neuf != 'true'
        run: |
          python - <<'PY'
          import json, sys
          with open('data/dernier.json', encoding='utf-8') as f:
              p = json.load(f)
          m = p.get('modeles') or {}
          assert m, "paquet sans modèle : on ne publie pas"
          assert p.get('ts'), "paquet sans horodatage"
          print(f"{len(m)} modèle(s), {len(p.get('jalons') or [])} jalons")
          PY

      - name: Publier
        # on publie meme si le releve a decline : AROME peut avoir change seul
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dernier.json
          [ -f data/arome.json ] && git add data/arome.json || true
          if git diff --cached --quiet; then
            echo "Relevé identique au précédent, rien à publier."
          else
            git commit -m "data: relevé partagé $(date -u +'%Y-%m-%dT%H:%MZ')"
            # Un asset pousse a la main depuis le poste pendant que le job
            # tournait ferait echouer un push direct. On se rebase donc avant,
            # et on retente : le rebase ne touche que data/dernier.json, dont
            # notre version contient deja les modeles de la precedente puisque
            # la page fusionne au demarrage.
            for essai in 1 2 3; do
              git push && break
              echo "push refuse, rebase sur l'origine puis nouvelle tentative ($essai/3)"
              git pull --rebase --strategy-option=ours origin main || exit 1
            done
          fi
