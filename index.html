/* ---- Ponderation par la couverture ----
   Principe, et il est important : une valeur livree est valide, qu'elle vienne
   d'une livraison complete ou partielle. Une couverture partielle est le cas
   NORMAL - un modele hors domaine, hors portee, ou dont quelques requetes ont
   echoue. Le multimodele ne doit donc PAS etre degrade parce qu'un fournisseur
   n'a repondu que sur une partie des points : la ou il a repondu, sa valeur
   vaut celle des autres. ICON-EU et ICON-CH2 a 29 points sur 52 gardent ainsi
   tout leur poids.
   Le seul cas attenue est la couverture si faible que la valeur ne peut plus
   etre recoupee : mesure du 17/08, ARPEGE Europe repondait sur 4 points sur 52
   avec un biais de +3,4 C et +2,9 mm/h, en portant un poids de 0,80. Sur si
   peu de points son biais ne peut pas etre estime, et il tire le consensus
   precisement la ou il est seul a parler. En dessous de 15 % de couverture le
   modele s'efface donc progressivement, sans jamais etre exclu : il reste
   visible, comparable et exportable. */
const COUV_PLEINE = 0.15;
let COUV = {};
function majCouverture(){
  const n = POIS.length || 1;
  const c = {};
  for(const id in DATA){
    let k = 0;
    for(let i=0;i<n;i++){
      let e = null;
      try{ e = extraitPoi(DATA[id], i); }catch(err){ e = null; }
      if(e && e.t!==null && e.t!==undefined) k++;
    }
    c[id] = k / n;
  }
  COUV = c;
}
function facteurCouverture(id){
  const part = COUV[id];
  if(part===undefined || part===null) return 1;     /* couverture inconnue : on ne penalise pas */
  return Math.max(0.05, Math.min(1, part / COUV_PLEINE));
}

/* une famille ne peut pas peser plus que 1,4 fois son meilleur membre */
function poidsFamille(ids){
  const parFam={};
  ids.forEach(id=>{ const f=famille(id); (parFam[f]=parFam[f]||[]).push(id); });
  const w={};
  Object.keys(parFam).forEach(f=>{
    const membres=parFam[f];
    const somme=membres.reduce((a,id)=>a+poidsBase(id),0);
    const plafond=Math.max.apply(null,membres.map(poidsBase))*1.4;
    const k = somme>plafond? plafond/somme : 1;
    membres.forEach(id=>{ w[id]=poidsBase(id)*k; });
  });
  return w;
}

function medPond(paires){        // [[valeur, poids], …]
  const v=paires.filter(p=>p[0]!==null&&p[0]!==undefined&&p[1]>0)
                .sort((a,b)=>a[0]-b[0]);
  if(!v.length) return null;
  const tot=v.reduce((a,p)=>a+p[1],0);
  let c=0;
  for(const p of v){ c+=p[1]; if(c>=tot/2) return p[0]; }
  return v[v.length-1][0];
}

/* un modèle très éloigné du groupe voit son poids réduit, jamais annulé :
   il peut avoir raison, mais il ne doit pas tirer la médiane à lui seul */
function penaliteDivergence(valeurs, poids, mediane){
  const ecarts=valeurs.map(v=>v===null?null:Math.abs(v-mediane));
  const bruts=valeurs.filter(v=>v!==null);
  if(bruts.length<3) return poids.map(()=>1);
  const mad=medPond(ecarts.map((e,i)=>[e,poids[i]]));
  const etendue=Math.max.apply(null,bruts)-Math.min.apply(null,bruts);
  /* plancher : plusieurs modèles partagent la même analyse et se ressemblent
     beaucoup ; sans plancher, un écart normal passerait pour une aberration */
  const sigma=Math.max((mad||0)*1.4826, etendue*0.15, 1e-6);
  return ecarts.map(e=>{
    if(e===null) return 1;
    const z=e/sigma;
    return z<=1.8? 1 : 1/(1+(z-1.8));
  });
}

/* ================= NIVEAUX DE PRESSION ================= */
/* À 2887 m, la température « 2 m » d'un modèle à 11 km de maille est une
   extrapolation depuis une orographie à ~1900 m. Le profil de pression donne
   la température de l'air libre au bon niveau, et le vent de crête. */
const NIVEAUX = [850, 750, 700];

function profil(e){
  const P=[];
  NIVEAUX.forEach(n=>{
    const z=e['z'+n], t=e['t'+n];
    if(z!==null&&z!==undefined&&t!==null&&t!==undefined) P.push({n, z, t});
  });
  return P.sort((a,b)=>a.z-b.z);
}
function tAuNiveau(e, alt){
  const P=profil(e);
  if(P.length<2) return null;
  if(alt<=P[0].z) return P[0].t + (P[0].z-alt)*0.0065;
  if(alt>=P[P.length-1].z) return P[P.length-1].t - (alt-P[P.length-1].z)*0.0065;
  for(let i=0;i<P.length-1;i++) if(alt>=P[i].z&&alt<=P[i+1].z){
    const f=(alt-P[i].z)/((P[i+1].z-P[i].z)||1);
    return P[i].t + f*(P[i+1].t-P[i].t);
  }
  return null;
}
function isothermeZero(e){
  const P=profil(e);
  for(let i=0;i<P.length-1;i++){
    if(P[i].t>=0&&P[i+1].t<0){
      const f=P[i].t/((P[i].t-P[i+1].t)||1);
      return Math.round(P[i].z + f*(P[i+1].z-P[i].z));
    }
  }
  if(P.length&&P[P.length-1].t>0) return null;
  return null;
}
/* vent au niveau de pression le plus proche au-dessus du point : c'est celui
   qui souffle sur la crête, pas le vent 10 m d'une vallée fictive */
function ventCrete(e, alt){
  const cand=[[700,e.v700,e.z700],[750,e.v750,e.z750]]
    .filter(c=>c[1]!==null&&c[1]!==undefined&&c[2]!==null&&c[2]!==undefined);
  if(!cand.length) return null;
  const dessus=cand.filter(c=>c[2]>=alt-150).sort((a,b)=>a[2]-b[2]);
  return (dessus[0]||cand.sort((a,b)=>Math.abs(a[2]-alt)-Math.abs(b[2]-alt))[0])[1];
}

let ENS = {};   // par nom de point : probabilités issues des ensembles


async function ensembles(points, cible){
  const jours=(new Date(POIS[0].t[SCENARIO]) - Date.now())/864e5;
  const modeles=[['ecmwf_ifs025','ECMWF ENS',15],['gfs025','GEFS',16],
                 ['icon_eu','ICON-EU EPS',5],['meteoswiss_icon_ch2','ICON-CH2 EPS',5],
                 ['meteoswiss_icon_ch1','ICON-CH1 EPS',1.4],
                 ['meteofrance_arpege_europe','ARPEGE EPS',4]]
                .filter(m=>m[2]>=jours);
  const acc={};
  await Promise.all(modeles.map(async function(m){
    for(let d=0;d<points.length;d+=26){
      const lot=points.slice(d,d+26);
      const qp=new URLSearchParams();
      qp.set('latitude',  lot.map(p=>p.lat).join(','));
      qp.set('longitude', lot.map(p=>p.lon).join(','));
      qp.set('elevation', lot.map(p=>p.alt).join(','));
      qp.set('hourly','temperature_2m,precipitation,wind_gusts_10m');
      qp.set('models', m[0]); qp.set('timezone','Europe/Paris');
      qp.set('start_hour',FENETRE.h0); qp.set('end_hour',FENETRE.h1);
      let j=null;
      for(let essai=0; essai<3 && !j; essai++){
        const rr=await appel(ORD_OM, 'https://ensemble-api.open-meteo.com/v1/ensemble?'+qp.toString());
        if(!rr||!rr.ok){ await new Promise(z=>setTimeout(z,1200*(essai+1))); continue; }
        try{ j=await rr.json(); }catch(e){ }
      }
      if(!j) continue;
      if(!Array.isArray(j)) j=[j];
      j.forEach((o,k)=>{
        const p=lot[k]; if(!o||!o.hourly) return;
        const T=o.hourly.time||[]; if(!T.length) return;
        const vise=new Date(cible(p)).getTime();
        let bi=-1, dt=1e15;
        for(let i2=0;i2<T.length;i2++){ const dd=Math.abs(new Date(T[i2]).getTime()-vise);
          if(dd<dt){dt=dd;bi=i2;} }
        if(bi<0||dt>2*3.6e6) return;
        const rec=acc[p.nom]=acc[p.nom]||{t:[],pr:[],raf:[],src:[]};
        Object.keys(o.hourly).forEach(cle=>{
          if(cle==='time') return;
          const v=o.hourly[cle][bi];
          if(v===null||v===undefined) return;
          if(cle.indexOf('temperature_2m')===0) rec.t.push(v);
          else if(cle.indexOf('precipitation')===0) rec.pr.push(v);
          else if(cle.indexOf('wind_gusts_10m')===0) rec.raf.push(v);
        });
        if(rec.src.indexOf(m[1])<0) rec.src.push(m[1]);
      });
    }
  }));
  const out={};
  Object.keys(acc).forEach(nom=>{
    const r=acc[nom];
    if(!r.t.length) return;
    const s=r.t.slice().sort((a,b)=>a-b);
    const pct=q2=>s[Math.min(s.length-1, Math.max(0, Math.floor(q2*s.length)))];
    /* Quantile sur une s\u00e9rie de membres quelconque. La pluie est asym\u00e9trique
       et pleine de z\u00e9ros : une fourchette p25-p75 dit ce qu'un chiffre unique
       cache, \u00e0 savoir qu'un quart des membres peut annoncer z\u00e9ro pendant
       qu'un autre quart annonce beaucoup. Aucun appel r\u00e9seau : les membres
       sont d\u00e9j\u00e0 t\u00e9l\u00e9charg\u00e9s. */
    const quant=(arr,q2)=>{
      if(!arr.length) return null;
      const z=arr.slice().sort((a,b)=>a-b);
      return z[Math.min(z.length-1, Math.max(0, Math.floor(q2*z.length)))];
    };
    const q1=v=>v===null? null : Math.round(v*10)/10;
    const q0=v=>v===null? null : Math.round(v);
    out[nom]={
      membres:r.t.length, sources:r.src,
      t10:+pct(.1).toFixed(1), t50:+pct(.5).toFixed(1), t90:+pct(.9).toFixed(1),
      pluie02: r.pr.length? Math.round(100*r.pr.filter(v=>v>0.2).length/r.pr.length) : null,
      pluie1:  r.pr.length? Math.round(100*r.pr.filter(v=>v>1.0).length/r.pr.length) : null,
      pluie5:  r.pr.length? Math.round(100*r.pr.filter(v=>v>5.0).length/r.pr.length) : null,
      raf50:   r.raf.length? Math.round(100*r.raf.filter(v=>v>50).length/r.raf.length) : null,
      pr25:q1(quant(r.pr,.25)), pr50:q1(quant(r.pr,.50)), pr75:q1(quant(r.pr,.75)),
      rafP50:q0(quant(r.raf,.50)), rafP90:q0(quant(r.raf,.90))
    };
  });
  return out;
}

/* ================= CACHE LOCAL ================= */
const CLE_CACHE='cache:v3';
const PERIME_H=3;              // au-delà, on rafraîchit tout seul
let TS_DONNEES=null, EN_COURS=false, HORS_LIGNE=false;
/* date de rafraichissement par modele : un paquet porte un seul horodatage
   mais ses modeles peuvent venir de moments differents, puisque livrer()
   fusionne au fur et a mesure et qu'un modele en echec reste en place. */
let MAJ_MODELE = {};
/* Horodatage du releve partage, distinct de TS_DONNEES qui melange local et
   partage. Sert a detecter une panne de la chaine automatique : si le cron
   meurt, TS_DONNEES peut rester frais grace au cache local alors que plus
   personne n'alimente les autres appareils. Rien ne le dirait sans ca. */
let TS_PARTAGE = null;

/* on ne stocke pas les réponses brutes (trop volumineuses) mais les valeurs extraites,
   arrondies et débarrassées des champs vides */
function compacte(e){
  if(!e) return null;
  const o={};
  for(const k in e){
    const v=e[k];
    if(v===null||v===undefined) continue;
    o[k] = typeof v==='number'? Math.round(v*10)/10 : v;
  }
  return o;
}
async function cacheEcrire(){
  const m={};
  for(const id in DATA){
    m[id]={nom:DATA[id].nom,
           maj:MAJ_MODELE[id]||null,
           pts:POIS.map((p,i)=>compacte(extraitPoi(DATA[id], i))),
           jal:JALONS.map((j,k)=>compacte(extraitJalonD(DATA_J[id], k)))};
  }
  const paquet={ts:Date.now(), scenario:SCENARIO, jalons:JALONS,
                reportes:REPORTES, echecs:ECHECS, modeles:m, ens:ENS};
  try{ await MEM.set(CLE_CACHE, JSON.stringify(paquet)); }
  catch(e){ log('Cache non écrit ('+e.message+') — les données restent affichées.'); }
}
async function cacheLire(){
  try{
    const r=await MEM.get(CLE_CACHE);
    if(!r) return null;
    const c=JSON.parse(r.value);
    return (c&&c.modeles&&Object.keys(c.modeles).length)? c : null;
  }catch(e){ return null; }
}
/* Releve partage, produit toutes les 3 h par .github/workflows/releve.yml et
   servi par Pages. Un seul releve pour tous les appareils : la consommation de
   quota ne depend plus du nombre de consultations. Facultatif : si le fichier
   est absent, la page se comporte comme avant. */
const URL_PARTAGE = 'data/dernier.json';
async function partageLire(){
  try{
    /* le CDN de Pages garde le fichier une dizaine de minutes */
    const r = await fetch(URL_PARTAGE + '?t=' + Math.floor(Date.now()/60000),
                          {cache:'no-store'});
    if(!r.ok) return null;
    const c = await r.json();
    return (c && c.modeles && Object.keys(c.modeles).length)? c : null;
  }catch(e){ return null; }
}
/* Fusionne deux paquets de cache au lieu d'en sacrifier un. La v43 gardait le
   plus recent, ce qui faisait remplacer 11 modeles en cache local par les 2
   d'un releve partage produit pendant une panne de quota. C'est exactement
   l'erreur que la v17 avait corrigee dans livrer() : on fusionne, on ne
   remplace pas. Un modele present des deux cotes est pris dans le paquet le
   plus recent ; les autres sont conserves.
   La fusion exige le meme scenario et le meme nombre de jalons, sinon les
   tableaux pts et jal ne sont pas comparables. */
function fusionneCaches(a, b){
  if(!a) return b || null;
  if(!b) return a;
  const recent = ((b.ts||0) >= (a.ts||0))? b : a;
  const autre  = (recent === b)? a : b;
  if(recent.scenario !== autre.scenario
     || (recent.jalons||[]).length !== (autre.jalons||[]).length){
    return recent;                 /* pas comparables : on ne bricole pas */
  }
  const c = Object.assign({}, autre, recent);
  /* modele par modele : on garde la version la plus fraiche de CHACUN, et non
     celle du paquet globalement le plus recent. `maj` est la date propre du
     modele ; a defaut on retombe sur l'horodatage de son paquet. */
  c.modeles = {};
  const quand = (paquet, id) => (paquet.modeles[id] && paquet.modeles[id].maj) || paquet.ts || 0;
  const tous = new Set(Object.keys(autre.modeles||{}).concat(Object.keys(recent.modeles||{})));
  tous.forEach(function(id){
    const dansR = recent.modeles && recent.modeles[id];
    const dansA = autre.modeles && autre.modeles[id];
    if(dansR && dansA) c.modeles[id] = (quand(recent,id) >= quand(autre,id))? dansR : dansA;
    else c.modeles[id] = dansR || dansA;
  });
  /* les ensembles ne se fusionnent pas point par point : on garde le jeu le
     plus fourni des deux */
  const eR = recent.ens && Object.keys(recent.ens).length;
  const eA = autre.ens && Object.keys(autre.ens).length;
  c.ens = (eR >= eA)? (recent.ens||{}) : (autre.ens||{});
  c.fusion = {recent:Object.keys(recent.modeles||{}).length,
              autre:Object.keys(autre.modeles||{}).length,
              total:Object.keys(c.modeles).length};
  return c;
}
function appliqueCache(c){
  DATA={}; DATA_J={}; JALONS=c.jalons||[];
  MAJ_MODELE={};
  for(const id in (c.modeles||{})) MAJ_MODELE[id]=c.modeles[id].maj || c.ts || null;
  for(const id in c.modeles){
    DATA[id]  ={nom:c.modeles[id].nom, pts:{[c.scenario]:c.modeles[id].pts}};
    DATA_J[id]={nom:c.modeles[id].nom, jal:c.modeles[id].jal};
  }
  REPORTES=(c.reportes||[]).filter(r=>!r[2]||modeleConnu(r[2]));
  ECHECS=c.echecs||[]; ENS=c.ens||{};
  const purges=purgerInconnus();
  if(purges) log(purges+' modèle'+(purges>1?'s':'')+' obsolète'+(purges>1?'s':'')
    +' retiré'+(purges>1?'s':'')+' du cache.');
  TS_DONNEES=c.ts; SCENARIO=c.scenario;
  const sel=q('#scen'); if(sel) sel.value=String(SCENARIO);
}
function ageHeures(){ return TS_DONNEES? (Date.now()-TS_DONNEES)/3.6e6 : Infinity; }
function ageTexte(){
  if(!TS_DONNEES) return 'aucune donnée';
  const min=Math.round((Date.now()-TS_DONNEES)/6e4);
  if(min<2) return 'à l\'instant';
  if(min<60) return 'il y a '+min+' min';
  const hh=Math.floor(min/60);
  if(hh<24) return 'il y a '+hh+' h'+(min%60?String(min%60).padStart(2,'0'):'');
  return 'il y a '+Math.floor(hh/24)+' j';
}
function majEtat(){
  const el=q('#etat'); if(!el) return;
  el.className='etat';
  let txt;
  if(EN_COURS){ el.classList.add('charge');
    txt='<span class="pulse">mise à jour…</span>'
        + (TS_DONNEES? ' <b>'+ageTexte()+'</b>' : ''); }
  else if(!TS_DONNEES){ el.classList.add('vieux'); txt='aucune donnée'; }
  else {
    const n=Object.keys(DATA).length;
    const fam={}; modelesDisponibles().forEach(function(id){
      const d=DOUBLON[id];
      if(!(d && DATA[d.parent])) fam[famille(id)]=1;
    });
    const nS=Object.keys(fam).length;
    txt='<b>'+nS+'</b> source'+(nS>1?'s':'')+' · '+n+' modèles · '+ageTexte();
    if(HORS_LIGNE){ el.classList.add('horsligne'); txt+=' · <b>hors ligne</b>'; }
    else if(ageHeures()>PERIME_H) el.classList.add('vieux');
    /* Etat de la chaine automatique. Le cron tente chaque heure et les runs
       changent toutes les 3 h : au-dela de 5 h sans relevé partagé, quelque
       chose est casse et il vaut mieux le voir maintenant qu'en course. */
    const SEUIL_PARTAGE_H = 5;
    if(TS_PARTAGE===null){
      txt+=' · <b title="Aucun relèvement partagé n’a été lu : '
        +'données de cet appareil uniquement">serveur muet</b>';
      el.classList.add('vieux');
    } else {
      const hp=(Date.now()-TS_PARTAGE)/36e5;
      if(hp>SEUIL_PARTAGE_H){
        txt+=' · <b title="La chaîne automatique ne publie plus">serveur '
          +Math.round(hp)+' h</b>';
        el.classList.add('vieux');
      }
    }
  }
  el.innerHTML='<span class="pastille"></span><span>'+txt+'</span>'
    + '';
}

/* ================= MÉTÉOGRAMME ================= */
/* Jalons horaires : où suis-je à H+0, H+1, … et quel temps là-bas. */
function dureeCourse(){
  return (new Date(POIS[POIS.length-1].t[SCENARIO]) - new Date(POIS[0].t[SCENARIO]))/3.6e6;
}
function construireJalons(){
  const t0=new Date(POIS[0].t[SCENARIO]).getTime();
  const kmP=POIS.map(p=>p.km), hP=POIS.map(p=>(new Date(p.t[SCENARIO]).getTime()-t0)/3.6e6);
  const kmDeH=h=>{
    if(h<=hP[0]) return kmP[0];
    for(let i=0;i<hP.length-1;i++) if(h>=hP[i]&&h<=hP[i+1]){
      const f=(h-hP[i])/((hP[i+1]-hP[i])||1); return kmP[i]+f*(kmP[i+1]-kmP[i]); }
    return kmP[kmP.length-1];
  };
  const surTrace=km=>{
    for(let i=0;i<TRACE.length-1;i++) if(km>=TRACE[i][0]&&km<=TRACE[i+1][0]){
      const f=(km-TRACE[i][0])/((TRACE[i+1][0]-TRACE[i][0])||1);
      return {alt:Math.round(TRACE[i][1]+f*(TRACE[i+1][1]-TRACE[i][1])),
              lat:+(TRACE[i][2]+f*(TRACE[i+1][2]-TRACE[i][2])).toFixed(5),
              lon:+(TRACE[i][3]+f*(TRACE[i+1][3]-TRACE[i][3])).toFixed(5)};
    }
    const d=TRACE[TRACE.length-1]; return {alt:d[1], lat:d[2], lon:d[3]};
  };
  const J=[], D=Math.ceil(dureeCourse());
  for(let h=0;h<=D;h++){
    const km=kmDeH(h), g=surTrace(km);
    J.push({h, km:+km.toFixed(2), ...g,
            t:isoLocal(new Date(t0+h*3.6e6)),   /* heure locale : les modèles répondent en Europe/Paris */
            nom:'H+'+h});
  }
  return J;
}
function abrege(n){
  const M={'Croix de Belledonne':'Belledonne','R2 Refuge de la Pra':'La Pra',
    'R3 Refuge Jean Collet':'Jean Collet','R4 Habert d\'Aiguebelle':'Aiguebelle',
    'R5 Fond de France Base vie':'Fond de France','R10 Le Bourget-en-Huile':'Le Bourget',
    'Arrivée Aiguebelle':'ARRIVÉE','Col de Morétan':'Morétan','Col de la Vache':'Col Vache',
    'Sommet du Grand Chat':'Grand Chat','Col de la Mine de Fer':'Mine de Fer',
    'R1 Arselle':'Arselle','R6 Gleyzin':'Gleyzin','R7 Périoule':'Périoule',
    'R8 Super Collet':'Super Collet','R9 Val Pelouse':'Val Pelouse',
    'Col de l\'Aigleton':'Aigleton','Rochers Rouges':'Roch. Rouges','Col de Freydane':'Freydane',
    'Vizille':'Vizille'};
  return M[n] || n.replace(/^R\d+ /,'').replace('Refuge ','').replace(/^Col (de la|de l'|du|de|des|d')\s*/,'')
                  .trim().slice(0,16);
}
function altAuKm(km){
  for(let i=0;i<TRACE.length-1;i++) if(km>=TRACE[i][0]&&km<=TRACE[i+1][0]){
    const f=(km-TRACE[i][0])/((TRACE[i+1][0]-TRACE[i][0])||1);
    return TRACE[i][1]+f*(TRACE[i+1][1]-TRACE[i][1]); }
  return TRACE[TRACE.length-1][1];
}
function heureAuKm(km){
  const t0=new Date(POIS[0].t[SCENARIO]).getTime();
  const kmP=POIS.map(p=>p.km), hP=POIS.map(p=>(new Date(p.t[SCENARIO]).getTime()-t0)/3.6e6);
  if(km<=kmP[0]) return 0;
  for(let i=0;i<kmP.length-1;i++) if(km>=kmP[i]&&km<=kmP[i+1]){
    const f=(km-kmP[i])/((kmP[i+1]-kmP[i])||1); return hP[i]+f*(hP[i+1]-hP[i]); }
  return hP[hP.length-1];
}

/* couleur du ciel selon l'heure locale — lit le jour et la nuit d'un coup d'oeil */
function luminance(hex){
  const v=[1,3,5].map(k=>parseInt(hex.substr(k,2),16)/255)
    .map(c=>c<=0.03928? c/12.92 : Math.pow((c+0.055)/1.055,2.4));
  return 0.2126*v[0]+0.7152*v[1]+0.0722*v[2];
}
/* noir ou blanc selon le fond : sur la même ligne le ciel passe du bleu pâle
   de midi à l'indigo de minuit, une couleur fixe serait illisible quelque part */
function contraste(hex){ return luminance(hex)>0.42? '#0A1018' : '#FFFFFF'; }

function couleurCiel(hLoc){
  const s = (PAL.jour==='clair')
    ? [[0,'#22314C'],[4.5,'#35496B'],[6.2,'#C89A80'],[7.2,'#E4C6B0'],[8.5,'#BCDBF0'],
       [13,'#A9D4F3'],[17,'#B5D9F0'],[19.5,'#E1B18A'],[20.8,'#8D7A8C'],[21.8,'#3C4A67'],[24,'#22314C']]
    : [[0,'#0A1020'],[4.5,'#101B33'],[6.2,'#4A3B55'],[7.2,'#6E5A66'],[8.5,'#2F5F87'],
       [13,'#3C7CA8'],[17,'#3A6E94'],[19.5,'#7A5147'],[20.8,'#3A2E43'],[21.8,'#111B31'],[24,'#0A1020']];
  const x=Math.max(0,Math.min(23.999,hLoc));
  for(let i=0;i<s.length-1;i++) if(x>=s[i][0]&&x<=s[i+1][0]){
    const f=(x-s[i][0])/(s[i+1][0]-s[i][0]);
    const hx=c=>[1,3,5].map(k=>parseInt(c.substr(k,2),16));
    const a=hx(s[i][1]), b=hx(s[i+1][1]);
    return '#'+a.map((v,k)=>Math.round(v+(b[k]-v)*f).toString(16).padStart(2,'0')).join('');
  }
  return '#0A1020';
}

/* pictogrammes dessinés à la main : lisibles à 22 px sur un téléphone */
function picto(code, cx, cy, r, nuit){
  if(code===null||code===undefined) return '';
  const g=[];
  const soleil=(x,y,rr)=>{ let o='<circle cx="'+x+'" cy="'+y+'" r="'+rr+'" fill="'+PAL.pSoleil+'"/>'; return o; };
  const astre=(x,y,rr)=>{
    if(nuit) return '<path d="M '+(x+rr*.45)+' '+(y-rr)+' a '+rr+' '+rr+' 0 1 0 '+(rr*.72)+' '+(rr*1.5)
      +' a '+(rr*.8)+' '+(rr*.8)+' 0 1 1 '+(-rr*.72)+' '+(-rr*1.5)+' z" fill="'+PAL.pLune+'"/>';
    let o='<circle cx="'+x+'" cy="'+y+'" r="'+(rr*.62)+'" fill="'+PAL.pSoleil+'"/>';
    for(let k=0;k<8;k++){ const a=k*Math.PI/4;
      o+='<line x1="'+(x+Math.cos(a)*rr*.85)+'" y1="'+(y+Math.sin(a)*rr*.85)
        +'" x2="'+(x+Math.cos(a)*rr*1.25)+'" y2="'+(y+Math.sin(a)*rr*1.25)
        +'" stroke="'+PAL.pSoleil+'" stroke-width="1.5" stroke-linecap="round"/>'; }
    return o;
  };
  const nuage=(x,y,w,c)=>'<path d="M '+(x-w/2)+' '+y+' a '+(w*.22)+' '+(w*.22)+' 0 0 1 '+(w*.1)+' '+(-w*.26)
    +' a '+(w*.28)+' '+(w*.28)+' 0 0 1 '+(w*.52)+' '+(-w*.04)
    +' a '+(w*.2)+' '+(w*.2)+' 0 0 1 '+(w*.38)+' '+(w*.3)+' z" fill="'+(c||PAL.pNuage)+'"/>';
  const gouttes=(x,y,n,c)=>{ let o=''; for(let k=0;k<n;k++){ const dx=(k-(n-1)/2)*r*.5;
    o+='<line x1="'+(x+dx)+'" y1="'+y+'" x2="'+(x+dx-r*.12)+'" y2="'+(y+r*.5)
      +'" stroke="'+(c||PAL.pGoutte)+'" stroke-width="1.7" stroke-linecap="round"/>'; } return o; };
  const flocons=(x,y,n)=>{ let o=''; for(let k=0;k<n;k++){ const dx=(k-(n-1)/2)*r*.5;
    o+='<text x="'+(x+dx)+'" y="'+(y+r*.45)+'" fill="'+PAL.pFlocon+'" font-size="'+(r*.62)+'" text-anchor="middle">✳</text>'; } return o; };
  const eclair=(x,y)=>'<path d="M '+x+' '+y+' l '+(-r*.22)+' '+(r*.5)+' l '+(r*.2)+' 0 l '+(-r*.14)+' '+(r*.46)
    +' l '+(r*.5)+' '+(-r*.66)+' l '+(-r*.24)+' 0 l '+(r*.2)+' '+(-r*.3)+' z" fill="'+PAL.pSoleil+'"/>';

  if(code===0) g.push(astre(cx,cy,r*.8));
  else if(code<=2){ g.push(astre(cx-r*.42,cy-r*.28,r*.58)); g.push(nuage(cx+r*.2,cy+r*.5,r*1.5)); }
  else if(code===3) g.push(nuage(cx,cy+r*.35,r*1.75,PAL.pNuageF));
  else if(code<=48){ g.push(nuage(cx,cy,r*1.5,PAL.pNuageF));
    for(let k=0;k<3;k++) g.push('<line x1="'+(cx-r*.7)+'" y1="'+(cy+r*.3+k*r*.3)+'" x2="'+(cx+r*.7)
      +'" y2="'+(cy+r*.3+k*r*.3)+'" stroke="'+PAL.pNuage+'" stroke-width="1.4" stroke-linecap="round"/>'); }
  else if(code<=57){ g.push(nuage(cx,cy-r*.1,r*1.6,PAL.pNuage)); g.push(gouttes(cx,cy+r*.45,2)); }
  else if(code<=67){ g.push(nuage(cx,cy-r*.1,r*1.65,PAL.pNuageF)); g.push(gouttes(cx,cy+r*.45,3)); }
  else if(code<=77){ g.push(nuage(cx,cy-r*.1,r*1.65,PAL.pNuage)); g.push(flocons(cx,cy+r*.35,2)); }
  else if(code<=82){ g.push(astre(cx-r*.5,cy-r*.35,r*.5)); g.push(nuage(cx+r*.18,cy+r*.15,r*1.5,PAL.pNuageF));
    g.push(gouttes(cx+r*.18,cy+r*.6,3)); }
  else if(code<=86){ g.push(nuage(cx,cy-r*.1,r*1.65,PAL.pNuage)); g.push(flocons(cx,cy+r*.35,3)); }
  else { g.push(nuage(cx,cy-r*.15,r*1.7,PAL.pNuageS)); g.push(eclair(cx,cy+r*.15)); g.push(gouttes(cx-r*.6,cy+r*.5,1)); }
  return g.join('');
}

/* flèche de vent : pointe dans le sens où le vent va, épaisseur selon la force */
function flecheVent(dir, force, cx, cy, L){
  if(dir===null||dir===undefined) return '';
  const a=(dir+180)*Math.PI/180;   // direction "vers"
  const dx=Math.sin(a)*L/2, dy=-Math.cos(a)*L/2;
  const c = force>60?'#F0553D' : force>40?'#F0A24B' : force>22?'#E8D48A' : '#8FA8C4';
  const w = force>60?2.6 : force>40?2.2 : 1.7;
  const tx=cx+dx, ty=cy+dy, b=Math.atan2(dy,dx);
  const p1x=tx-Math.cos(b-.45)*L*.3, p1y=ty-Math.sin(b-.45)*L*.3;
  const p2x=tx-Math.cos(b+.45)*L*.3, p2y=ty-Math.sin(b+.45)*L*.3;
  return '<line x1="'+(cx-dx)+'" y1="'+(cy-dy)+'" x2="'+tx+'" y2="'+ty+'" stroke="'+c
    +'" stroke-width="'+w+'" stroke-linecap="round"/>'
    +'<path d="M '+tx+' '+ty+' L '+p1x+' '+p1y+' L '+p2x+' '+p2y+' z" fill="'+c+'"/>';
}

/* ---------- rendu du météogramme ---------- */
const L = {ciel:52, nuages:40, profil:170, pluie:48, vent:46, axe:30};
const HAUT = L.ciel+L.nuages+L.profil+L.pluie+L.vent+L.axe;
const GUT = 52;
const yNu=L.ciel, yPro=yNu+L.nuages, yPl=yPro+L.profil, yVe=yPl+L.pluie, yAx=yVe+L.vent;
const ALT_MAX = 3200;
const yAlt = a => yPro+8+(1-a/ALT_MAX)*(L.profil-20);

function fenetre(){
  if(!SEG) return [0, Math.ceil(dureeCourse())];
  const s=SEGMENTS[SEG-1];
  const idx=segPois();
  const t0=new Date(POIS[0].t[SCENARIO]).getTime();
  const hh=i=>(new Date(POIS[i].t[SCENARIO]).getTime()-t0)/3.6e6;
  if(!idx.length) return [Math.floor(heureAuKm(s.km0)), Math.ceil(heureAuKm(s.km1))];
  return [Math.floor(hh(idx[0])), Math.ceil(hh(idx[idx.length-1]))];
}

/* la gouttière ne défile pas : les noms de rangée restent lisibles en toute position */
function gouttiere(){
  const g=q('#gouttiere');
  g.setAttribute('viewBox','0 0 '+GUT+' '+HAUT);
  g.setAttribute('width',GUT); g.setAttribute('height',HAUT);
  const T=['<rect x="0" y="0" width="'+GUT+'" height="'+HAUT+'" fill="'+PAL.fond+'"/>'];
  const lib=(y,t,c)=>T.push('<text x="'+(GUT-9)+'" y="'+y+'" fill="'+(c||PAL.libelle)
    +'" font-size="8.5" text-anchor="end" font-family="sans-serif">'+t+'</text>');
  lib(L.ciel/2+4,'ciel',PAL.libelleFort);
  ['hautes','moyennes','basses'].forEach((n,e)=>lib(yNu+e*(L.nuages/3)+9.5, n));
  [1000,2000,3000].forEach(a=>lib(yAlt(a)+3, a));
  lib(yPl+12,'mm/h',PAL.libelleFort);
  lib(yVe+18,'vent',PAL.libelleFort); lib(yVe+38,'rafales');
  T.push('<line x1="'+(GUT-.5)+'" y1="0" x2="'+(GUT-.5)+'" y2="'+HAUT+'" stroke="'+PAL.bord+'"/>');
  g.innerHTML=T.join('');
}

function dessine(){
  gouttiere();
  const bornes=fenetre(), h0=bornes[0], h1=bornes[1], NH=Math.max(1,h1-h0);
  const large = (typeof window!=='undefined' && window.innerWidth)? window.innerWidth : 900;
  /* On MESURE le conteneur qui defile (#scroller) au lieu d'estimer depuis
     window.innerWidth : les marges de .wrap et du cadre faisaient surestimer
     la place disponible, d'ou une barre de defilement residuelle. */
  const scr = q('#scroller');
  const dispo = (scr && scr.clientWidth > 200)? scr.clientWidth
                                             : Math.max(320, large - 40);
  const utile = Math.max(320, dispo - GUT - 8);
  /* on essaie de faire tenir la fenêtre entière à l'écran ; en dessous d'un
     seuil de lisibilité on laisse défiler */
  const px = SEG? Math.max(46, Math.min(110, utile/NH))
                /* parcours complet sur grand ecran : on laisse la largeur
                   par heure descendre jusqu'a ce que tout tienne, plutot que
                   d'imposer un plancher qui force un defilement horizontal */
                : (large>=1100? Math.min(52, utile/NH)
                              : Math.max(34, Math.min(52, utile/NH)));
  /* sur grand ecran on ne depasse pas l'espace disponible : pas de barre
     de defilement pour le parcours complet */
  const Wvoulu = NH*px+GUT+16;
  /* parcours complet sur grand ecran : on ne depasse jamais le conteneur
     mesure, donc aucune barre de defilement */
  const W = (!SEG && large>=1100)? Math.min(Wvoulu, dispo)
                                 : Math.max(880, Wvoulu);
  const x=hh=>GUT+8+(hh-h0)*(W-GUT-24)/NH;
  const t0=new Date(POIS[0].t[SCENARIO]).getTime();
  const hLoc=hh=>{ const d=new Date(t0+hh*3.6e6); return d.getHours()+d.getMinutes()/60; };
  const j=k=>sondeJalon(k);
  const S=[];
  const pas = px>=70? 1 : (px>=46? (SEG?1:2) : 2);

  S.push('<defs><linearGradient id="gCiel" x1="0" x2="1">');
  for(let hh=h0;hh<=h1;hh++) S.push('<stop offset="'+((hh-h0)/NH*100).toFixed(2)+'%" stop-color="'+couleurCiel(hLoc(hh))+'"/>');
  S.push('</linearGradient><linearGradient id="gTemp" x1="0" x2="1">');
  for(let hh=h0;hh<=h1;hh++){ const s=j(hh);
    S.push('<stop offset="'+((hh-h0)/NH*100).toFixed(2)+'%" stop-color="'+couleurT(s&&s.t?s.t.m:null)
      +'" stop-opacity="'+(s&&s.t? Math.max(.42,1-(s.t.hi-s.t.lo)/14).toFixed(2) : .5)+'"/>'); }
  S.push('</linearGradient></defs>');
  S.push('<rect x="'+GUT+'" y="0" width="'+(W-GUT)+'" height="'+yPl+'" fill="url(#gCiel)"/>');

  for(let hh=h0;hh<=h1;hh+=pas){
    const s=j(hh); if(!s) continue;
    const nuit = hLoc(hh)>=20.5||hLoc(hh)<6.3;
    S.push(picto(s.code, x(hh), 22, 11, nuit));
    if(s.t&&s.t.m!==null) S.push('<text x="'+x(hh)+'" y="45" fill="'+contraste(couleurCiel(hLoc(hh)))
      +'" font-size="12.5" font-weight="700" text-anchor="middle">'+s.t.m.toFixed(0)+'\u00b0</text>');
  }

  S.push('<rect x="'+GUT+'" y="'+yNu+'" width="'+(W-GUT)+'" height="'+L.nuages+'" fill="'+PAL.nuagesFond+'"/>');
  [['nuh',0],['num',1],['nub',2]].forEach(function(e){
    const cle=e[0], yy=yNu+e[1]*(L.nuages/3);
    for(let hh=h0;hh<h1;hh++){
      const s=j(hh); if(!s||!s[cle]||s[cle].m===null) continue;
      S.push('<rect x="'+x(hh)+'" y="'+yy+'" width="'+(x(hh+1)-x(hh))+'" height="'+(L.nuages/3-1)
        +'" fill="'+PAL.nuage+'" opacity="'+(Math.min(1,s[cle].m/100)*(PAL.jour==='clair'?.72:.8)).toFixed(2)+'"/>');
      if((hh-h0)%(pas*3)===0&&s[cle].m>=15) S.push('<text x="'+((x(hh)+x(hh+1))/2)+'" y="'+(yy+L.nuages/3-3.5)
        +'" fill="'+(PAL.jour==='clair'? (s[cle].m>45?PAL.nuageChiffre:PAL.nuageChiffreFaible)
                     : (s[cle].m>55?PAL.nuageChiffre:PAL.nuageChiffreFaible))
        +'" font-size="8" font-weight="600" text-anchor="middle">'
        +s[cle].m.toFixed(0)+'</text>');
    }
  });

  [1000,2000,3000].forEach(a=>S.push('<line x1="'+GUT+'" y1="'+yAlt(a)+'" x2="'+(W-8)+'" y2="'+yAlt(a)
    +'" stroke="'+PAL.grille+'" stroke-width="1" opacity=".55"/>'));
  const pts=TRACE.filter(p=>{const t=heureAuKm(p[0]); return t>=h0-.25&&t<=h1+.25;});
  if(pts.length){
    const cx=km=>x(Math.min(h1,Math.max(h0,heureAuKm(km))));
    let d='M '+cx(pts[0][0])+' '+yAlt(0);
    pts.forEach(p=>{ d+=' L '+cx(p[0])+' '+yAlt(p[1]); });
    d+=' L '+cx(pts[pts.length-1][0])+' '+yAlt(0)+' Z';
    S.push('<path d="'+d+'" fill="url(#gTemp)"/>');
    S.push('<path d="'+d.replace(/ Z$/,'')+'" fill="none" stroke="'+PAL.contour+'" stroke-width="1.2" opacity=".45"/>');
  }

  const CLEFS=['Croix de Belledonne','Col de Mor\u00e9tan','Col de la Vache','Sommet du Grand Chat',
               'Col de la Mine de Fer','Col de Freydane'];
  let dX=-999;
  POIS.forEach(function(p,i){
    const th=heureAuKm(p.km);
    if(th<h0-.15||th>h1+.15) return;
    const maj = p.type==='Ravito'||CLEFS.indexOf(p.nom)>=0;
    if(!SEG && !maj && p.alt<=2500) return;
    const xx=x(th);
    if(!maj && xx-dX<(SEG?52:62)) return;
    if(maj && xx-dX<24) return;
    dX=xx;
    const hy=yAlt(p.alt), dec=maj?19:14;
    S.push('<line x1="'+xx+'" y1="'+hy+'" x2="'+xx+'" y2="'+(hy-(maj?15:10))
      +'" stroke="'+PAL.tige+'" stroke-width="1" opacity=".6"/>');
    S.push('<circle cx="'+xx+'" cy="'+hy+'" r="'+(maj?3.6:2.4)+'" fill="'+(i===SEL?PAL.pointActif:PAL.point)+'"/>');
    S.push('<g class="tick" tabindex="0" data-i="'+i+'" style="cursor:pointer">'
      +'<rect x="'+(xx-17)+'" y="'+(hy-24)+'" width="34" height="32" fill="transparent"/>'
      +'<text x="'+xx+'" y="'+(hy-dec)+'" fill="'+(i===SEL?PAL.pointActif:PAL.texte)
      +'" font-size="9" font-weight="'+(PAL.fond==='#FFFFFF'?'600':'400')
      +'" text-anchor="middle" transform="rotate(-30 '+xx+' '+(hy-dec)+')">'
      +abrege(p.nom)+'</text></g>');
  });

  /* pluie : échelle adaptée à la fenêtre, sinon 0,1 et 1,1 mm se ressemblent */
  let prMax=0.6;
  for(let hh=h0;hh<=h1;hh++){ const s=j(hh); if(s&&s.pr&&s.pr.hi!==null) prMax=Math.max(prMax,s.pr.hi); }
  prMax=Math.ceil(prMax*2)/2;
  const base=yPl+L.pluie-10, hMax=L.pluie-16, yPr=v=>base-Math.min(hMax, v/prMax*hMax);
  S.push('<line x1="'+GUT+'" y1="'+base+'" x2="'+(W-8)+'" y2="'+base+'" stroke="'+PAL.grille+'" stroke-width="1.2"/>');
  [prMax/2, prMax].forEach(v=>{
    S.push('<line x1="'+GUT+'" y1="'+yPr(v)+'" x2="'+(W-8)+'" y2="'+yPr(v)+'" stroke="'+PAL.bord+'" stroke-dasharray="2 4"/>');
    S.push('<text x="'+(GUT+4)+'" y="'+(yPr(v)-2)+'" fill="'+PAL.pluie+'" font-size="8" text-anchor="start">'
      +(v<1?v.toFixed(1):v.toFixed(0))+' mm</text>');
  });
  for(let hh=h0;hh<h1;hh++){
    const s=j(hh); if(!s||!s.pr||s.pr.m===null) continue;
    const w=x(hh+1)-x(hh), xb=x(hh)+w*.22, wb=w*.56;
    if(s.pr.hi>0.02) S.push('<rect x="'+xb+'" y="'+yPr(s.pr.hi)+'" width="'+wb+'" height="'
      +(base-yPr(s.pr.hi))+'" fill="'+PAL.pluie+'" opacity=".22" rx="1"/>');
    if(s.pr.m>0.02) S.push('<rect x="'+xb+'" y="'+yPr(s.pr.m)+'" width="'+wb+'" height="'
      +(base-yPr(s.pr.m))+'" fill="'+PAL.pluie+'" rx="1"/>');
    if(s.pp&&s.pp.m>=40&&(hh-h0)%pas===0) S.push('<text x="'+((x(hh)+x(hh+1))/2)+'" y="'+(yPl+L.pluie-1)
      +'" fill="'+PAL.pluieTexte+'" font-size="8.5" text-anchor="middle">'+s.pp.m.toFixed(0)+'%</text>');
  }

  for(let hh=h0;hh<=h1;hh+=pas){
    const s=j(hh); if(!s) continue;
    const f=s.raf&&s.raf.m!==null? s.raf.m : (s.v&&s.v.m!==null? s.v.m*1.6 : null);
    if(s.dir&&s.dir.m!==null) S.push(flecheVent(s.dir.m, f||0, x(hh), yVe+16, 18));
    if(f!==null) S.push('<text x="'+x(hh)+'" y="'+(yVe+39)+'" fill="'
      +(f>60?PAL.alerte:f>40?PAL.chaud:PAL.libelleFort)+'" font-size="10.5" text-anchor="middle" font-weight="'
      +(f>40?'600':'400')+'">'+f.toFixed(0)+'</text>');
  }

  for(let hh=h0;hh<=h1;hh+=pas){
    const dd=new Date(t0+hh*3.6e6);
    const jr=['dim','lun','mar','mer','jeu','ven','sam'][dd.getDay()];
    S.push('<line x1="'+x(hh)+'" y1="'+yAx+'" x2="'+x(hh)+'" y2="'+(yAx+4)+'" stroke="'+PAL.grille+'"/>');
    S.push('<text x="'+x(hh)+'" y="'+(yAx+14)+'" fill="'+PAL.texte+'" font-size="10" text-anchor="middle">'
      +String(dd.getHours()).padStart(2,'0')+'h</text>');
    if(dd.getHours()<pas||hh===h0) S.push('<text x="'+x(hh)+'" y="'+(yAx+25)+'" fill="'+PAL.chaud+'" font-size="9" '
      +'text-anchor="middle" font-weight="600">'+jr+'</text>');
    else if(hh%6===0) S.push('<text x="'+x(hh)+'" y="'+(yAx+25)+'" fill="'+PAL.texteFaible+'" font-size="8.5" '
      +'text-anchor="middle">H+'+hh+'</text>');
  }

  const svg=q('#ruban');
  svg.setAttribute('viewBox','0 0 '+W+' '+HAUT);
  svg.setAttribute('width',W); svg.setAttribute('height',HAUT);
  svg.innerHTML=S.join('');
  svg.querySelectorAll('.tick').forEach(function(g){
    const go=function(){SEL=+g.dataset.i; rendreTout(); majChips();
      q('#fiche').scrollIntoView({behavior:'smooth',block:'center'});};
    g.addEventListener('click',go);
    g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
  const hmg=q('#hmg');
  if(hmg) hmg.textContent = SEG? 'M\u00e9t\u00e9ogramme \u2014 segment '+String(SEG).padStart(2,'0')
    : 'M\u00e9t\u00e9ogramme de course';
  const nMod=Object.keys(DATA).length;
  q('#mgnote').textContent = nMod? '' : 'en attente des mod\u00e8les\u2026';
}

/* ---------- segments ---------- */
function segPois(){
  if(!SEG) return POIS.map(function(p,i){return i;});
  const s=SEGMENTS[SEG-1];
  return POIS.map(function(p,i){return i;}).filter(i=>POIS[i].km>=s.km0-0.4&&POIS[i].km<=s.km1+0.4);
}
function segChips(){
  const c=q('#segchips'); c.innerHTML='';
  const faire=function(n,titre,sous){
    const b=document.createElement('button');
    b.className='segchip'; b.dataset.n=n; b.setAttribute('aria-pressed',(n===SEG)+'');
    b.innerHTML=titre+'<small>'+sous+'</small>';
    b.onclick=function(){ SEG=n;
      const dedans=segPois(); if(dedans.length) SEL=dedans[0];
      segChips(); chips(); rendreTout(); };
    c.appendChild(b);
  };
  faire(0,'Tout le parcours','149,5 km \u00b7 11 000 m D+');
  SEGMENTS.forEach(s=>faire(s.n,'S'+String(s.n).padStart(2,'0')+' \u00b7 '+abrege(s.vers),
    s.km0.toFixed(0)+'\u2192'+s.km1.toFixed(0)+' km \u00b7 +'+s.dp+' m'));
}
function resumeSegment(){
  const el=q('#segresume');
  el.style.display='';
  const idx=segPois();
  if(!idx.length){ el.style.display='none'; return; }
  const dep=POIS[idx[0]], arr=POIS[idx[idx.length-1]];
  const duree=(new Date(arr.t[SCENARIO])-new Date(dep.t[SCENARIO]))/6e4;
  const s = SEG? SEGMENTS[SEG-1] : null;
  const dist = s? s.dist : 149.5, dp = s? s.dp : 11000, dm = s? s.dm : 11000;
  const titre = s? 'Segment '+String(s.n).padStart(2,'0')+' \u00b7 '+abrege(s.de)+' \u2192 '+abrege(s.vers)
                 : 'Parcours complet \u00b7 Vizille \u2192 Aiguebelle';

  let h='<div class="rtete"><b>'+titre+'</b><span>'+dist.toFixed(1)+' km \u00b7 +'+dp+' m \u00b7 \u2212'+dm
   +' m \u00b7 '+hhmm(dep.t[SCENARIO])+' \u2192 '+hhmm(arr.t[SCENARIO])+' \u00b7 '
   +Math.floor(duree/60)+' h '+String(Math.round(duree%60)).padStart(2,'0')+'</span></div>';

  const bornes=fenetre(); const T=[],RES=[],P=[],PP=[],R=[],N=[],C=[],V=[],D=[];
  for(let hh=bornes[0];hh<=bornes[1];hh++){ const jj=sondeJalon(hh); if(!jj) continue;
    if(jj.t&&jj.t.m!==null) T.push(jj.t.m);
    if(jj.res&&jj.res.m!==null) RES.push(jj.res.m);
    if(jj.pr_moy&&jj.pr_moy.m!==null) P.push(jj.pr_moy.m);
    else if(jj.pr&&jj.pr.m!==null) P.push(jj.pr.m);
    if(jj.pp&&jj.pp.m!==null) PP.push(jj.pp.m);
    if(jj.raf&&jj.raf.m!==null) R.push(jj.raf.m);
    if(jj.nu&&jj.nu.m!==null) N.push(jj.nu.m);
    if(jj.v&&jj.v.m!==null) V.push(jj.v.m);
    if(jj.dir&&jj.dir.m!==null) D.push(jj.dir.m);
    if(jj.code!==null&&jj.code!==undefined) C.push(jj.code); }
  if(!T.length){ h+='<div class="hnote">Pas encore de donn\u00e9es sur cette partie.</div>';
    el.innerHTML=h; return; }

  const mn=Math.min.apply(null,T), mx=Math.max.apply(null,T);
  const cum=P.reduce((a,b)=>a+b,0);
  const hPluie=P.filter(v=>v>0.15).length;
  const rafMax=R.length? Math.max.apply(null,R) : null;
  const pire=C.length? C.slice().sort((a,b)=>b-a)[0] : null;
  const altMax=Math.max.apply(null, idx.map(i=>POIS[i].alt));
  const dirMoy=D.length? cap(med(D)) : '';
  const resMin=RES.length? Math.min.apply(null,RES) : null;

  const cases=[
    ['temp\u00e9rature', Math.round(mn)+'\u00b0 \u00e0 '+Math.round(mx)+'\u00b0',
      resMin!==null? 'ressenti min '+Math.round(resMin)+'\u00b0':'', couleurT((mn+mx)/2)],
    ['pluie cumul\u00e9e', cum.toFixed(1)+' mm',
      hPluie? hPluie+' h de pluie sur '+P.length : 'aucune pluie', cum>2?'var(--pluie)':''],
    ['rafale max', rafMax!==null? Math.round(rafMax)+' km/h':'\u2014',
      V.length? 'vent moyen '+Math.round(med(V))+' '+dirMoy:'',
      rafMax>60?'var(--alerte)':rafMax>40?'var(--chaud)':''],
    ['nuages', N.length? Math.round(med(N))+' %':'\u2014',
      PP.length? 'risque pluie '+Math.round(med(PP))+' %':'', ''],
    ['point haut', altMax+' m', '', ''],
    ['pire ciel', pire!==null? (WMO[pire]||'\u2014'):'\u2014', '', pire>=95?'var(--alerte)':'']
  ];
  h+='<div class="rgrille">';
  cases.forEach(c=>{ h+='<div class="rcase"><s>'+c[0]+'</s><b'
    +(c[3]?' style="color:'+c[3]+'"':'')+'>'+c[1]+'</b>'+(c[2]?'<em>'+c[2]+'</em>':'')+'</div>'; });
  h+='</div>';
  el.innerHTML=h;
}

/* ---------- message SMS pour les proches ---------- */
/* Contrainte : pas de réseau data en course. Le message doit être court,
   lisible d'un coup d'oeil, et sans jargon. */

const CIEL_COURT={0:'ciel clair',1:'peu nuageux',2:'nuageux',3:'couvert',
  45:'brouillard',48:'brouillard givrant',
  51:'bruine',53:'bruine',55:'bruine forte',56:'bruine verglacante',57:'bruine verglacante',
  61:'pluie faible',63:'pluie',65:'pluie forte',66:'pluie verglacante',67:'pluie verglacante',
  71:'neige faible',73:'neige',75:'neige forte',77:'neige',
  80:'averses',81:'averses',82:'averses fortes',85:'averses de neige',86:'averses de neige',
  95:'orage',96:'orage et grele',99:'orage violent'};

function descMeteo(s){
  if(!s||!s.t) return 'pas de donnees';
  const p=[];
  let ciel = (s.code!==null&&s.code!==undefined)? (CIEL_COURT[s.code]||'') : '';
  /* la couche basse est ce qui compte en montagne : brouillard sur les crêtes */
  if(s.nub&&s.nub.m>=65&&s.code<=3) ciel='nuages bas';
  else if(s.nu&&s.nu.m<=25&&s.code<=1) ciel='ciel degage';
  if(ciel) p.push(ciel);
  if(s.pr&&s.pr.m>=0.05) p.push('pluie '+s.pr.m.toFixed(1)+'mm');
  if(s.neige&&s.neige.m>=0.2) p.push('neige '+s.neige.m.toFixed(1)+'cm');
  if(s.v&&s.v.m!==null){
    let v='vent '+Math.round(s.v.m);
    if(s.raf&&s.raf.m!==null) v+=' raf '+Math.round(s.raf.m);
    p.push(v+'km/h');
  }
  if(s.t&&s.t.m!==null){
    let t=Math.round(s.t.m)+'\u00b0';
    if(s.res&&s.res.m!==null&&Math.abs(s.res.m-s.t.m)>=2) t+=' ressenti '+Math.round(s.res.m)+'\u00b0';
    p.push(t);
  }
  if(s.vis&&s.vis.m!==null&&s.vis.m<1200) p.push('visi '+(s.vis.m/1000).toFixed(1)+'km');
  /* inutile de répéter : si le ciel dit déjà « orage », on n'ajoute rien */
  if(s.code<95 && s.cape && s.cape.hi>900) p.push('risque orage');
  return p.join(', ');
}

function hCourt(iso){
  const d=new Date(iso);
  return String(d.getHours()).padStart(2,'0')+'h'+String(d.getMinutes()).padStart(2,'0');
}

/* mode court : ravitos et points clés seulement, pour tenir en 2 SMS */
function pointsSMS(complet){
  const idx=segPois();
  if(complet) return idx;
  const CLEFS=['Croix de Belledonne','Col de Mor\u00e9tan','Col de la Vache','Sommet du Grand Chat',
               'Col de la Mine de Fer'];
  let gardes=idx.filter(i=>POIS[i].type==='Ravito'||CLEFS.indexOf(POIS[i].nom)>=0);
  if(gardes.length>=2){
    /* plus de 2h30 entre deux points : on intercale le sommet du trou */
    const sortie=[];
    for(let k=0;k<gardes.length;k++){
      sortie.push(gardes[k]);
      if(k===gardes.length-1) break;
      const a=gardes[k], b=gardes[k+1];
      const ecart=(new Date(POIS[b].t[SCENARIO])-new Date(POIS[a].t[SCENARIO]))/3.6e6;
      if(ecart>2.5){
        const entre=idx.filter(i=>i>a&&i<b);
        if(entre.length){
          const haut=entre.slice().sort((u,v)=>POIS[v].alt-POIS[u].alt)[0];
          sortie.push(haut);
        }
      }
    }
    return sortie;
  }
  /* segment sans deux ravitos : on garde le début, la fin et le point haut */
  const haut=idx.slice().sort((a,b)=>POIS[b].alt-POIS[a].alt)[0];
  return [...new Set([idx[0], haut, idx[idx.length-1]])].sort((a,b)=>a-b);
}

function texteSMS(complet){
  const idx=pointsSMS(complet);
  if(!idx.length) return '';
  const L=[];
  if(SEG){
    const s=SEGMENTS[SEG-1];
    L.push('S'+String(s.n).padStart(2,'0')+' '+abrege(s.de)+'-'+abrege(s.vers));
  } else {
    L.push('EB26 parcours complet');
  }
  let jourPrec=null;
  idx.forEach(i=>{
    const p=POIS[i], s=Object.keys(DATA).length? sonde(i):null;
    const d=new Date(p.t[SCENARIO]);
    const jr=['dim','lun','mar','mer','jeu','ven','sam'][d.getDay()];
    const marq = (jr!==jourPrec)? jr+' ' : '';
    jourPrec=jr;
    L.push(abrege(p.nom)+' '+marq+hCourt(p.t[SCENARIO])+' - '+descMeteo(s));
  });
  if(TS_DONNEES) L.push('(prev. '+new Date(TS_DONNEES).toLocaleString('fr-FR',
    {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+')');
  return L.join('\n');
}

function majSMS(){
  const el=q('#smszone'); if(!el) return;
  const complet = q('#smscomplet') && q('#smscomplet').getAttribute('aria-pressed')==='true';
  const txt=texteSMS(complet);
  const ta=q('#smstexte'); ta.value=txt;
  const n=txt.length, parts=n? Math.ceil(n/153) : 0;
  q('#smsinfo').textContent = n+' caract\u00e8res \u00b7 '+parts+' SMS'
    + (n>306? ' \u2014 pense au mode court' : '');
}

function copierSMS(){
  const txt=q('#smstexte').value;
  const fini=ok=>{ const b=q('#smscopie');
    b.textContent = ok? 'Copi\u00e9' : 'S\u00e9lectionne le texte';
    setTimeout(()=>{ b.textContent='Copier le SMS'; }, 2200); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>fini(true)).catch(()=>{
      try{ q('#smstexte').select(); document.execCommand('copy'); fini(true); }
      catch(e){ fini(false); }
    });
  } else {
    try{ q('#smstexte').select(); document.execCommand('copy'); fini(true); }
    catch(e){ fini(false); }
  }
}

/* ---------- export Markdown pour analyse ---------- */
/* Objectif : un seul fichier lisible par un modèle de langage, contenant
   toutes les valeurs brutes par modèle, plus l'historique des relevés
   pour qu'il puisse juger la dérive des prévisions d'un jour à l'autre. */

const COLS = [
  ['t','T °C',1],['res','Ress °C',1],['ros','Rosée °C',1],['hum','Hum %',0],
  ['nub','Nb %',0],['num','Nm %',0],['nuh','Nh %',0],['nu','Ntot %',0],
  ['sol','Soleil %',0],['pr','Pluie mm/h',2],['pp','P.pluie %',0],['neige','Neige cm',1],
  ['v','Vent km/h',0],['raf','Raf km/h',0],['dir','Dir °',0],
  ['vis','Visi m',0],['iso0','Iso0 m',0],['iso0calc','Iso0 calculé m',0],
  ['cape','CAPE',0],['li','LI',1],['uv','UV',1],['pres','P hPa',0],
  ['pr_moy','Pluie moyenne mm/h',2],['ressT','Ressenti terrain °C',1],['tw','T humide °C',1],['tpi','Position topo m',0],
  ['vterrain','Vent du lieu km/h',0],['speedup','Facteur relief',2],
  ['tlibre','T air libre °C',1],['vcrete','Vent crête km/h',0],['ecart_relief','Écart relief m',0]
];

function cel(e, cle, dec){
  if(!e) return '';
  let v = e[cle];
  if(cle==='sol' && v!==null && v!==undefined) v = v/36;   // secondes -> % de l'heure
  if(v===null||v===undefined) return '';
  return typeof v==='number'? v.toFixed(dec) : String(v);
}

function ligneMD(prefixe, e){
  return '| '+prefixe+' | '+COLS.map(c=>cel(e,c[0],c[2])).join(' | ')+' |';
}
function enteteMD(prefixe){
  return '| '+prefixe+' | '+COLS.map(c=>c[1]).join(' | ')+' |\n'
       + '|'+'---|'.repeat(prefixe.split('|').length+COLS.length);
}

async function exportMD(){
  const b=q('#exportmd');
  /* exporter un cache d'une heure produit un fichier daté d'aujourd'hui
     mais rempli de données d'hier : on rafraîchit d'abord */

    b.textContent='Attente du relevé…';
    log('Une actualisation est en cours : l\'export attend qu\'elle finisse.');
    while(EN_COURS) await new Promise(z=>setTimeout(z,1000));
  } else if(ageHeures()>0.75){
    b.textContent='Actualisation…';
    log('Données vieilles de '+ageTexte()+' : actualisation avant export.');

  }
  b.disabled=true; b.textContent='Génération…';
  /* v32 : l'export porte toujours sur le consensus complet. Un export fait
     alors qu'un modèle est isolé ne contiendrait que ce modèle, sans mesure

  M.push('');

  M.push('');
  M.push('**Sur l\'altitude** : mesurer l\'altitude de la maille native de chaque modèle s\'est '

    +'pas celle du modèle météo. La colonne a été retirée plutôt que de laisser un chiffre faux. '
    +'Au-dessus de 1400 m, c\'est `T air libre` qu\'il faut lire : elle vient du profil de pression '
    +'et ne dépend d\'aucune extrapolation depuis le relief. De même, `Vent crête` est le vent au '
    +'niveau de pression du point, bien plus représentatif qu\'un vent 10 m sur une vallée fictive.');
  M.push('');

  M.push('## Modèles interrogés');
  M.push('');
  M.push('| Modèle | Identifiant | Portée annoncée | Données à cette échéance |');
  M.push('|---|---|---|---|');
  const TOUS = MODELES.concat(WY_MODELES.map(w=>['windy_'+w[0], w[1], w[2]]));
  TOUS.forEach(function(m){

  POIS.forEach(function(p,i){

        Object.fromEntries(COLS.map(c=>[c[0], cons[c[0]]? cons[c[0]].m : null]))));
      M.push(ligneMD(pre+'_étendue min–max_ |  | dispersion',

/* Deux blocs au-dessus de la ligne de flottaison : un résumé en toutes lettres
   du point choisi, puis la bande horaire que tout le monde connaît. */

const VENT_MOTS = [[3,'air calme'],[12,'vent faible'],[25,'vent modéré'],
                   [40,'vent soutenu'],[60,'vent fort'],[999,'vent violent']];
function motVent(v){ if(v===null||v===undefined) return ''; 
  for(const [s,m] of VENT_MOTS) if(v<s) return m; return ''; }

/* Le libelle doit decrire les chiffres affiches, sinon il les contredit.
   "Ciel clair" a ete affiche avec 85 % de nuages : s.code est une mediane de
   CODES de modeles, tandis que s.nu est une mediane de COUVERTURES, et rien ne
   les lie. Avec beaucoup de modeles la mediane des codes reste plausible ; avec
   deux elle tombe sur l un ou l autre arbitrairement.
   On derive donc le ciel des valeurs consensuelles elles-memes, via mbCode()
   qui fait deja exactement cette traduction. La contradiction devient
   impossible par construction. Repli sur s.code si les nuages manquent. */
function cielCoherent(s){
  if(!s) return null;
  const nu = (s.nu && s.nu.m!==null && s.nu.m!==undefined)? s.nu.m : null;
  if(nu===null) return (s.code!==null&&s.code!==undefined)? s.code : null;
  const pr = (s.pr && s.pr.m!==null)? s.pr.m
           : ((s.pr_moy && s.pr_moy.m!==null)? s.pr_moy.m : 0);
  const neige = (s.neige && s.neige.m!==null)? s.neige.m : 0;
  const orage = (s.code!==null && s.code>=95)
             || (s.cape && s.cape.m!==null && s.cape.m>900);
  return mbCode(pr||0, nu, neige, !!orage);
}
function phraseMeteo(s, p){
  if(!s||!s.t) return '';
  const bouts=[];
  const cc = cielCoherent(s);
  const ciel = (cc!==null&&cc!==undefined)? (WMO[cc]||'') : '';
  if(ciel) bouts.push(ciel.charAt(0).toUpperCase()+ciel.slice(1));
  const v = s.v&&s.v.m!==null? s.v.m : null;
  const mv = motVent(v);
  if(mv) bouts.push(mv + (s.dir&&s.dir.m!==null? ' de '+cap(s.dir.m) : ''));
  if(s.res&&s.t&&Math.abs(s.res.m-s.t.m)>=2)
    bouts.push('ressenti '+Math.round(s.res.m)+'\u00b0');
  return bouts.join(' \u00b7 ');
}

function alertesSimples(s, p){
  const A=[];
  if(s.raf&&s.raf.hi>60) A.push(['\u26a0','Rafales jusqu\'\u00e0 '+Math.round(s.raf.hi)+' km/h']);
  else if(s.raf&&s.raf.hi>40) A.push(['\u2691','Rafales '+Math.round(s.raf.hi)+' km/h']);
  if(s.code>=95 || (s.cape&&s.cape.hi>900)) A.push(['\u26a1','Risque d\'orage']);
  if(s.cbase&&s.cbase.m!==null&&s.cbase.m<p.alt) A.push(['\u2601','Vous serez dans les nuages']);
  if(s.res&&s.res.lo!==null&&s.res.lo<3) A.push(['\u2744','Ressenti possible \u00e0 '+Math.round(s.res.lo)+'\u00b0']);
  if(s.pr&&s.pr.hi>2) A.push(['\u2614','Averses jusqu\'\u00e0 '+s.pr.hi.toFixed(1)+' mm/h']);
  return A;
}

/* ---------- fiche POI ---------- */
function fiche(){
  const p=POIS[SEL], s=Object.keys(DATA).length? sonde(SEL):null;
  const f=q('#fiche');
  const nDispo=modelesDisponibles().length;
  /* Lien vers le site public de Windy, centre sur le point.
     Pourquoi un lien et pas la carte embarquee : le Map Forecast API gratuit est
     lui aussi un niveau "Testing", declare "not intended for production", limite
     a GFS seul et a trois couches - vent, temperature, pression - donc SANS
     couche nuages, justement celle qui servirait ici. Le site public, lui, est
     gratuit, sans cle, sans restriction d'usage, et donne toutes les couches.
     Un lien ne pese rien, n'ajoute aucune dependance externe au fichier unique,
     et ne casse rien si Windy est injoignable en montagne. */
  const wy = 'https://www.windy.com/?clouds,'+p.lat.toFixed(3)+','+p.lon.toFixed(3)+',11';
  let h='<h3>'+p.nom+'</h3><div class="meta">km '+p.km.toFixed(1)+' \u00b7 '+p.alt+' m \u00b7 '
    +hhmm(p.t[SCENARIO])
    +' \u00b7 <a href="'+wy+'" target="_blank" rel="noopener noreferrer"'
    +' style="color:var(--froid)">nuages sur Windy \u2197</a></div>';
  if(!s){ h+='<div class="note" style="margin-top:12px">Pas encore de données. Lance « Interroger les modèles ».</div>';
    f.innerHTML=h; return; }

  /* null-safe : un modèle qui ne fournit pas la variable ne casse plus le rendu */
  const V=(o,d=1,su='')=> (o&&o.m!==null&&o.m!==undefined)? o.m.toFixed(d)+su : '—';
  const E=(o,d=0,su='')=> (o&&o.lo!==null&&o.lo!==undefined)? o.lo.toFixed(d)+' à '+o.hi.toFixed(d)+su : '';

  const ccF=cielCoherent(s);
  if(ccF!==null) h+='<div style="margin:10px 0 2px;font-size:15px">'+(WMO[ccF]||'—')+'</div>';
  if(!MODELE_ACTIF && s.lignes.length<nDispo)
    h+='<div class="note alerte" style="margin:4px 0 0">'+s.lignes.length+'/'+nDispo
      +' mod\u00e8les couvrent ce point</div>';
  if(s.confiance){
    const c=s.confiance;
    const coul = c.niveau==='bonne'?'var(--accord)':c.niveau==='moyenne'?'var(--chaud)':'var(--alerte)';
    h+= (s.lignes.length<2)
      ? '<div class="note alerte" style="margin:4px 0 0">mod\u00e8le unique \u2014 aucune incertitude mesur\u00e9e</div>'
      : '<div class="note" style="margin:4px 0 0">confiance <b style="color:'+coul+'">'+c.niveau
        +'</b> \u00b7 '+c.familles+' source'+(c.familles>1?'s':'')
        +' \u00b7 \u00b1'+(c.etendue/2).toFixed(1)+' \u00b0C</div>';
  }
  const en=ENS[p.nom];
  if(en) h+='<div class="note" style="margin:4px 0 0;color:var(--froid)">ens. '+en.membres+'m \u00b7 '
    +'pluie '+(en.pluie02!==null?en.pluie02+'%':'?')
    /* fourchette interquartile : ce qu'un chiffre unique cache */
    +(en.pr75!==null? ' \u00b7 '+en.pr25+'\u2013'+en.pr75+' mm/h':'')
    +(en.pluie1!==null? ' (>1mm '+en.pluie1+'%)':'')
    +(en.rafP90!==null? ' \u00b7 raf '+en.rafP50+'/'+en.rafP90:'')
    +(en.raf50!==null? ' (>50 '+en.raf50+'%)':'')
    +' \u00b7 T '+en.t10+'\u2013'+en.t90+'\u00b0</div>';

  h+='<div class="gros">'
   +'<div><b style="color:'+couleurT(s.t?s.t.m:null)+'">'+V(s.t,1,'°')+'</b><s>température</s>'
     +'<div class="spread">'+E(s.t,0,'°')+'</div></div>'
   +'<div><b>'+V((s.ressT&&s.ressT.m!==null)? s.ressT : s.res,1,'°')+'</b><s>ressenti terrain</s>'
     +((s.ressT&&s.res&&s.ressT.m!==null&&Math.abs(s.ressT.m-s.res.m)>=1)
        ? '<div class="spread">modèles '+s.res.m.toFixed(1)+'°</div>':'')+'</div>'
   +'<div><b style="color:'+(s.pr&&s.pr.m>0.2?'var(--pluie)':'')+'">'+V(s.pr,1,'')+'</b><s>pluie mm/h</s>'
     +'<div class="spread">'+(s.pp&&s.pp.m!==null? V(s.pp,0,' % de risque') : (s.pr?'max '+V(s.pr,1,' mm'):''))+'</div></div>'
   +'<div><b>'+V(s.raf,0,'')+'</b><s>rafales km/h</s>'
     +'<div class="spread">moyen '+V(s.v,0,'')+' de '+cap(s.dir?s.dir.m:null)+'</div></div>'
   +'</div>';

  /* grille secondaire : ce qu'on ne lit pas d'un coup d'oeil mais qui décide de l'équipement */
  const soleil = s.sol&&s.sol.m!==null? Math.round(s.sol.m/36) : null;
  const cellules=[
    ['air libre \u00e0 l\'altitude', V(s.tlibre,1,'\u00b0'),
      s.ecart_relief&&s.ecart_relief.m!==null? 'relief mod\u00e8le '+(-s.ecart_relief.m).toFixed(0)+' m sous le point':''],
    ['vent de cr\u00eate', V(s.vcrete,0,' km/h'), 'niveau de pression, pas le 10 m'],
    ['couverture nuageuse', s.nu&&s.nu.m!==null? V(s.nu,0,' %'):'—',
      s.nub&&s.nub.m!==null? 'basses '+V(s.nub,0)+' · moy '+V(s.num,0)+' · hautes '+V(s.nuh,0):''],
    ['ensoleillement', soleil!==null? soleil+' %':'—',
      s.ray&&s.ray.m!==null? V(s.ray,0)+' W/m²':''],
    ['humidité', V(s.hum,0,' %'), s.ros&&s.ros.m!==null? 'rosée '+V(s.ros,1,'°'):''],
    ['vent du lieu', V((s.vterrain&&s.vterrain.m!==null)? s.vterrain : s.v,0,' km/h'),
      (s.speedup&&s.speedup.m!==null&&Math.abs(s.speedup.m-1)>0.05
        ? (s.speedup.m>1? 'accéléré ×'+s.speedup.m.toFixed(2)+' par le relief'
                        : 'abrité ×'+s.speedup.m.toFixed(2)+' en creux')
        : 'de '+cap(s.dir?s.dir.m:null))],
    ['visibilité', s.vis&&s.vis.m!==null? (s.vis.m/1000).toFixed(1)+' km':'—',
      s.vis&&s.vis.m<1000? 'brouillard' : ''],
    ['indice UV', V(s.uv,1), soleil!==null&&soleil>50? 'crème et lunettes':''],
    ['thermomètre mouillé', V(s.tw,1,'°'),
      (s.tw&&s.tw.m!==null)? (s.tw.m<1.5? 'neige possible ici':'pluie') : ''],
    ['forme du terrain', (s.tpi&&s.tpi.m!==null)?
      (s.tpi.m>12? 'col ou croupe' : (s.tpi.m<-12? 'cuvette' : 'versant')) : '—',
      (s.tpi&&s.tpi.m!==null)? ((s.tpi.m>0?'+':'')+s.tpi.m.toFixed(0)+' m sur 1,5 km') : ''],
    ['limite pluie-neige', s.iso0&&s.iso0.m!==null? V(s.iso0,0,' m') : V(s.iso0calc,0,' m'),
      (s.iso0&&s.iso0.m!==null? (s.iso0.m-p.alt).toFixed(0)
       : (s.iso0calc&&s.iso0calc.m!==null? (s.iso0calc.m-p.alt).toFixed(0):null))!==null?
      'au-dessus du point':'au-dessus du sommet du profil'],
    ['indice de soul\u00e8vement', V(s.li,1), s.li&&s.li.m<-2?'atmosph\u00e8re instable':''],
    ['risque d\u2019orage', s.cape&&s.cape.m!==null? (s.cape.m>800?'\u00e9lev\u00e9':s.cape.m>300?'mod\u00e9r\u00e9':'faible'):'\u2014',
      s.cape&&s.cape.m!==null? V(s.cape,0,' J/kg')+' de CAPE':''],
    ['neige', V(s.neige,1,' cm'), ''],
    ['pression', V(s.pres,0,' hPa'), '']
  ].filter(c=>c[1]!=='—');

  h+='<div class="grille">';
  cellules.forEach(c=>{ h+='<div class="cel"><s>'+c[0]+'</s><b>'+c[1]+'</b>'
    +(c[2]?'<em>'+c[2]+'</em>':'')+'</div>'; });
  h+='</div>';

  const risques=[];
  if(s.cape&&s.cape.hi>800) risques.push('CAPE jusqu\'à '+s.cape.hi.toFixed(0)+' J/kg — potentiel orageux');
  if(s.raf&&s.raf.hi>55) risques.push('rafales possibles à '+s.raf.hi.toFixed(0)+' km/h');
  if(s.iso0&&s.iso0.lo!==null&&s.iso0.lo<p.alt+200) risques.push('isotherme 0 °C proche du point ('+s.iso0.lo.toFixed(0)+' m)');
  if(s.res&&s.res.lo!==null&&s.res.lo<3) risques.push('ressenti jusqu\'à '+s.res.lo.toFixed(0)+' °C');
  if(s.ressT&&s.res&&s.ressT.m!==null&&s.ressT.m<s.res.m-1.5)
    risques.push('creux par nuit claire : '+(s.res.m-s.ressT.m).toFixed(0)+' °C sous la maille');
  if(s.speedup&&s.speedup.m>1.35)
    risques.push('vent accéléré ×'+s.speedup.m.toFixed(2)+' par le relief');
  if(s.vis&&s.vis.lo!==null&&s.vis.lo<500) risques.push('visibilité réduite à '+(s.vis.lo/1000).toFixed(1)+' km');
  if(s.t&&s.t.hi-s.t.lo>8) risques.push('désaccord des modèles : '+(s.t.hi-s.t.lo).toFixed(0)+' °C d\'écart');
  if(risques.length) h+='<div class="note alerte" style="margin:10px 0">⚠ '+risques.join(' · ')+'</div>';

  h+='<div class="tw"><table><thead><tr><th>Mod\u00e8le</th><th>Poids</th><th>T</th><th>Air libre</th>'
   +'<th>Ress.</th><th>Hum.</th><th>Nuages</th><th>Pluie</th><th>Vent</th><th>Cr\u00eate</th>'
   +'<th>Raf.</th><th>Dir.</th></tr></thead><tbody>';
  const L=(o,k,d,su)=> (o[k]===null||o[k]===undefined)? '—' : o[k].toFixed(d)+su;
  if(s.lignes.length>1){
    h+='<tr class="consensus"><td>Consensus pond\u00e9r\u00e9 ('+s.lignes.length+')</td><td>'
     +(s.confiance?s.confiance.poidsTotal:'')+'</td><td>'+V(s.t,1)+'</td><td>'+V(s.tlibre,1)+'</td><td>'
     +V(s.res,1)+'</td><td>'+V(s.hum,0)+'</td><td>'+V(s.nu,0)+'</td><td>'+V(s.pr,1)+'</td><td>'
     +V(s.v,0)+'</td><td>'+V(s.vcrete,0)+'</td><td>'+V(s.raf,0)+'</td><td>'+cap(s.dir?s.dir.m:null)+'</td></tr>';
  }
  s.lignes.slice().sort((a,b)=>b.poids-a.poids).forEach(l=>{
    const rel = l.source_wy? 'via Windy \u00b7 points seulement, absent du m\u00e9t\u00e9ogramme'
      : l.source_mb? 'correction statistique sur le relief \u00b7 pas de niveaux de pression'
      : (l.ecart_relief===null||l.ecart_relief===undefined)? 'maille non sond\u00e9e'
      : 'relief mod\u00e8le '+Math.round(l.alt_modele)+' m ('+(l.ecart_relief>0?'+':'')+l.ecart_relief+' m)';
    h+='<tr'+(l.doublon?' style="opacity:.45"':(l.divergent?' style="opacity:.62"':''))+'><td>'+l.nom
     +(l.doublon?' <span style="color:var(--brume)">doublon</span>':'')
     +(l.divergent&&!l.doublon?' <span style="color:var(--chaud)">\u26a0 diverge</span>':'')
     +'</td>'
     +'<td>'+l.poids.toFixed(2)+'</td>'
     +'<td>'+L(l,'t',1,'')+'</td><td>'+L(l,'tlibre',1,'')+'</td><td>'+L(l,'res',1,'')+'</td>'
     +'<td>'+L(l,'hum',0,'')+'</td><td>'+L(l,'nu',0,'')+'</td><td>'+L(l,'pr',1,'')+'</td>'
     +'<td>'+L(l,'v',0,'')+'</td><td>'+L(l,'vcrete',0,'')+'</td><td>'+L(l,'raf',0,'')+'</td>'
     +'<td>'+cap(l.dir)+'</td></tr>';
  });
  h+='</tbody></table></div><div class="note" style="margin-top:8px">T, ressenti et rosée en °C · humidité, '
   +'nuages et soleil en % · pluie en mm/h · vent et rafales en km/h · visibilité en km. '
   +'\u00ab Air libre \u00bb = temp\u00e9rature lue sur le profil de pression \u00e0 '+p.alt
   +' m, sans extrapolation depuis le relief du mod\u00e8le. \u00ab Cr\u00eate \u00bb = vent au niveau '
   +'de pression du point, plus repr\u00e9sentatif qu\u2019un vent 10 m. Le poids tient compte de la '
   +'finesse de maille et du fait que plusieurs mod\u00e8les partagent la m\u00eame analyse. '
   +'Un tiret signifie que le modèle ne fournit pas la variable, pas qu\'elle vaut zéro.</div>';
  f.innerHTML=h;
}

function majChips(){
  q('#chips').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed', (+c.dataset.i===SEL)+''));
}
/* ---------- tableau global ---------- */
function tableauTous(){
  const tb=q('#tousp').querySelector('tbody');
  let h='<tr><th>Point</th><th>km</th><th>Alt</th><th>Passage</th><th>T</th><th>Ress.</th>'
   +'<th>Hum.</th><th>Nuages</th><th>Soleil</th><th>Pluie</th><th>Vent</th><th>Raf.</th><th>Dir.</th></tr>';
  const V=(o,d=0)=> (o&&o.m!==null&&o.m!==undefined)? o.m.toFixed(d) : '\u2014';
  let segCourant=-1;
  segPois().forEach(function(i){
    const p=POIS[i];
    if(!SEG){
      const tr=SEGMENTS.filter(s=>p.km>s.km0-0.4&&p.km<=s.km1+0.4)[0];
      if(tr&&tr.n!==segCourant){ segCourant=tr.n;
        h+='<tr><td colspan="13" style="background:#1A2438;color:var(--chaud);font-size:11px;padding:6px">S'
         +String(tr.n).padStart(2,'0')+' \u00b7 '+tr.de+' \u2192 '+tr.vers+' \u00b7 '
         +tr.dist.toFixed(1)+' km \u00b7 +'+tr.dp+' m</td></tr>'; }
    }
    const s=Object.keys(DATA).length? sonde(i):null;
    const sol = s&&s.sol&&s.sol.m!==null? Math.round(s.sol.m/36) : null;
    h+='<tr'+(i===SEL?' style="background:#1E2B44"':'')+'><td>'+p.nom+'</td><td>'+p.km.toFixed(1)+'</td>'
     +'<td>'+p.alt+'</td><td>'+hhmm(p.t[SCENARIO])+'</td>'
     +'<td'+(s&&s.t&&s.t.m!==null?' style="color:'+couleurT(s.t.m)+'"':'')+'>'+(s?V(s.t,1):'\u2014')+'</td>'
     +'<td>'+(s?V(s.res,1):'\u2014')+'</td><td>'+(s?V(s.hum):'\u2014')+'</td>'
     +'<td>'+(s?V(s.nu):'\u2014')+'</td><td>'+(sol!==null?sol:'\u2014')+'</td>'
     +'<td'+(s&&s.pr&&s.pr.m>0.2?' style="color:var(--pluie)"':'')+'>'+(s?V(s.pr,1):'\u2014')+'</td>'
     +'<td>'+(s?V(s.v):'\u2014')+'</td>'
     +'<td'+(s&&s.raf&&s.raf.m>50?' style="color:var(--alerte)"':'')+'>'+(s?V(s.raf):'\u2014')+'</td>'
     +'<td>'+(s&&s.dir?cap(s.dir.m):'\u2014')+'</td></tr>';
  });
  tb.innerHTML=h;
}

/* ---------- archivage & convergence ---------- */
async function archive(){
  const cle='snapshot:'+new Date().toISOString().slice(0,13).replace(/[-T:]/g,'');
  const inst={};
  const DECISION=['Croix de Belledonne','Col de la Mine de Fer','Col de la Vache',
    'R5 Fond de France Base vie','Col de Morétan','R8 Super Collet',
    'Sommet du Grand Chat','Arrivée Aiguebelle'];
  const detail={};
  POIS.forEach((p,i)=>{
    if(DECISION.indexOf(p.nom)<0) return;
    const s=sonde(i); if(!s) return;
    detail[p.nom]={};
    s.lignes.forEach(l=>{ detail[p.nom][l.nom]={t:l.t, pr:l.pr, raf:l.raf, nu:l.nu}; });
  });
  const g=(o,k)=>o&&o[k]!==null&&o[k]!==undefined?o[k]:null;
  POIS.forEach((p,i)=>{ const s=sonde(i); if(s&&s.t) inst[p.nom]={
    t:g(s.t,'m'), tlo:g(s.t,'lo'), thi:g(s.t,'hi'), pr:g(s.pr,'m'), prhi:g(s.pr,'hi'),
    raf:g(s.raf,'m'), nu:g(s.nu,'m'), hum:g(s.hum,'m'), v:g(s.v,'m'), n:s.lignes.length}; });
  try{ await MEM.set(cle, JSON.stringify({date:new Date().toISOString(), scen:SCENARIO, pts:inst, detail:detail})); }
  catch(e){}
  convergence();
}
async function convergence(){
  const el=q('#conv');
  let cles=[];
  try{ const r=await MEM.list('snapshot:'); cles=(r&&r.keys)||[]; }catch(e){ }
  if(cles.length<1){ el.textContent='Aucun relevé archivé pour l\'instant.'; return; }
  cles.sort();
  const snaps=[];
  for(const k of cles.slice(-10)){
    try{ const r=await MEM.get(k); if(r) snaps.push(JSON.parse(r.value)); }catch(e){}
  }
  if(!snaps.length){ el.textContent='Aucun relevé lisible.'; return; }
  const cible=POIS[SEL].nom;
  let h='<div class="tw"><table><thead><tr><th>Relevé</th><th>Mod.</th><th>T médiane</th><th>Écart</th>'
   +'<th>Pluie méd.</th><th>Nuages</th><th>Vent</th><th>Rafales</th></tr></thead><tbody>';
  snaps.forEach(s=>{
    const v=s.pts[cible];
    h+='<tr><td>'+new Date(s.date).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</td>'
     +'<td>'+(v&&v.n?v.n:'?')+'</td>'
     +'<td>'+(v&&v.t!=null?v.t.toFixed(1)+' °':'—')+'</td>'
     +'<td>'+(v&&v.thi!=null?(v.thi-v.tlo).toFixed(1)+' °':'—')+'</td>'
     +'<td>'+(v&&v.pr!=null?v.pr.toFixed(1):'—')+'</td>'
     +'<td>'+(v&&v.nu!=null?v.nu.toFixed(0)+' %':'—')+'</td>'
     +'<td>'+(v&&v.v!=null?v.v.toFixed(0):'—')+'</td>'
     +'<td>'+(v&&v.raf!=null?v.raf.toFixed(0):'—')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  el.innerHTML=h;
}

/* ---------- init ---------- */
(function(){
  const sel=q('#scen');
  for(let s=36;s<=52;s++){ const o=document.createElement('option'); o.value=s; o.textContent=s+' h'; if(s===43)o.selected=true; sel.appendChild(o); }
  sel.onchange=()=>{
    SCENARIO=+sel.value;
    /* les valeurs du cache sont extraites pour un scénario précis : si on en change,
       le relief et les horaires se redessinent tout de suite, la météo est réinterrogée */
    const surCache = Object.keys(DATA).some(id=>DATA[id].pts && !DATA[id].reps);
    dessine(); fiche(); tableauTous(); resumeSegment(); convergence();
    if(surCache && !(PRECHARGE && PRECHARGE.modeles)){
      log('Scénario '+SCENARIO+' h : les heures de passage changent, réinterrogation des modèles…');
      interroger();
    }
  };
  /* Un simple clic force le relev\u00e9 : quand on appuie sur le bouton, on veut
     des donn\u00e9es. Le garde-fou align\u00e9 sur le run ne s'applique donc plus qu'aux
     rafra\u00eechissements automatiques, o\u00f9 il \u00e9vite de d\u00e9penser du quota pour
     ret\u00e9l\u00e9charger une donn\u00e9e identique. Le relev\u00e9 partag\u00e9 reste consult\u00e9
     d'abord, gratuitement, pour un affichage imm\u00e9diat. */
  q('#go').onclick=function(){ interroger(true); };
  q('#raz').onclick=async()=>{
    if(!confirm('Effacer l\'historique des relevés ? C\'est lui qui permet de suivre la '
      +'convergence des modèles jour après jour, et il ne peut pas être reconstitué.')) return;
      try{ const r=await MEM.list('snapshot:'); for(const k of (r.keys||[])) await MEM.delete(k); }catch(e){}
    convergence(); log('Historique effacé.');
  };
  if(PRECHARGE && PRECHARGE.modeles){
    DATA = PRECHARGE.modeles;
    ECHECS = PRECHARGE.echecs || [];
    afficheDispo(Object.keys(DATA).map(id=>[DATA[id].nom,
      POIS.filter((p,i)=>extraitPoi(DATA[id], i)).length, POIS.length]));
    log('Relevé du '+new Date(PRECHARGE.releve).toLocaleString('fr-FR')
        +' — '+Object.keys(DATA).length+' modèles, données intégrées au fichier.'
        + (ECHECS.length? ' Non renvoyés : '+ECHECS.join(', ') : ''));
    q('#go').disabled=true; q('#go').textContent='Données intégrées';
    const sc=q('#scen'); [...sc.options].forEach(o=>{ if(!PRECHARGE.scenarios.includes(+o.value)) o.disabled=true; });
  }
  initTheme();
  ['clair','sombre','auto'].forEach(k=>{
    const b=q('#th-'+k); if(b) b.onclick=()=>appliquerTheme(k, true);
  });
  q('#modele').onchange=()=>{
    MODELE_ACTIF=q('#modele').value;
    majNoteFiabilite(); rendreTout();
  };
  segChips(); chips();
  q('#smscopie').onclick=copierSMS;
  q('#exportmd').onclick=exportMD;
  q('#smscourt').onclick=()=>{ q('#smscourt').setAttribute('aria-pressed','true');
    q('#smscomplet').setAttribute('aria-pressed','false'); majSMS(); };
  q('#smscomplet').onclick=()=>{ q('#smscomplet').setAttribute('aria-pressed','true');
    q('#smscourt').setAttribute('aria-pressed','false'); majSMS(); };

  /* 1. on affiche immédiatement ce qu'on a en mémoire, même périmé */
  (async()=>{
    if(!(PRECHARGE && PRECHARGE.modeles)){
      /* on interroge les deux en parallele et on garde le plus recent : le
         releve partage est en general plus frais que la memoire de l'appareil,
         mais l'inverse arrive si l'utilisateur vient de forcer une actualisation */
      const [local, partage] = await Promise.all([cacheLire(), partageLire()]);
      /* fusion : le partage apporte ce que l'appareil n'a pas, sans jamais
         retirer ce qu'il avait deja */
      if(partage && partage.ts) TS_PARTAGE = partage.ts;
      const c = fusionneCaches(local, partage);
      const dOu = (partage && c && c.ts === partage.ts)? 'partagé' : 'local';
      if(c){
        appliqueCache(c);
        afficheDispo(Object.keys(DATA).map(id=>[DATA[id].nom,
          POIS.filter((p,i)=>{const e=extraitPoi(DATA[id],i); return e&&e.t!==null&&e.t!==undefined;}).length,
          POIS.length]));
        if(dOu==='partagé'){
          const src=(c.partage&&c.partage.genere_par)||'serveur';
          log('Relevé partagé ('+src+') du '+ageTexte()+', '
              +Object.keys(c.modeles).length+' modèles — aucun quota consommé '
              +'par cet appareil.');
          /* on le recopie en memoire locale : la page reste utilisable hors ligne */
          try{ await cacheEcrire(); }catch(e){}
        } else {
          log('Données restaurées depuis la mémoire du téléphone, relevé '+ageTexte()+'.');
        }
      }
    }
    majSelecteurModele();
    rendreTout(); convergence();

    /* 2. le rafraîchissement ne part qu'une fois l'écran rempli, et il complète
       l'affichage au lieu de le remplacer */
    if(!(PRECHARGE && PRECHARGE.modeles) && ageHeures()>PERIME_H){
      await new Promise(z=>setTimeout(z,120));
      interroger();
    }
  })();

  /* 3. au retour sur l'onglet, on revérifie la fraîcheur */
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){
      majEtat();
      if(!EN_COURS && !(PRECHARGE && PRECHARGE.modeles) && ageHeures()>PERIME_H) interroger();
    }
  });
  setInterval(majEtat, 60000);
})();
</script>
