  else { g.push(nuage(cx,cy-r*.15,r*1.7,P.pNuageS)); g.push(eclair(cx,cy+r*.15)); g.push(gouttes(cx-r*.6,cy+r*.5,1)); }
  return g.join('');
}

/* flèche de vent : pointe dans le sens où le vent va, épaisseur selon la force */
function flecheVent(dir, force, cx, cy, L){
  if(dir===null||dir===undefined) return '';
  const a=(dir+180)*Math.PI/180;   // direction "vers"
  const dx=Math.sin(a)*L/2, dy=-Math.cos(a)*L/2;
  const c = force>60?'#F0553D' : force>40?'#F0A24B' : force>22?'#E8D48A' : '#8FA8C4';
  const w = force>60?2.6 : force>40?2.2 : 1.7;
  const tx=cx+dx, ty=cy+dy, b=Math.atan2(dy,dx);
  const p1x=tx-Math.cos(b-.45)*L*.3, p1y=ty-Math.sin(b-.45)*L*.3;
  const p2x=tx-Math.cos(b+.45)*L*.3, p2y=ty-Math.sin(b+.45)*L*.3;
  return '<line x1="'+(cx-dx)+'" y1="'+(cy-dy)+'" x2="'+tx+'" y2="'+ty+'" stroke="'+c
    +'" stroke-width="'+w+'" stroke-linecap="round"/>'
    +'<path d="M '+tx+' '+ty+' L '+p1x+' '+p1y+' L '+p2x+' '+p2y+' z" fill="'+c+'"/>';
}

/* ---------- rendu du météogramme ---------- */
/* nuages:0 - la bande a trois etages est retiree (v60). Elle doublait
   l'overlay du profil sans donner d'altitude reelle. Ses 40 px vont au
   profil, dont l'echelle verticale gagne d'autant. */
/* pluie:78 - la bande a double de hauteur utile, 62 px contre 32, a la demande
   de l'utilisateur. Les 30 px viennent du profil, qui garde 160 px utiles pour
   3200 m soit 25 px entre deux graduations de 500 m. Hauteur totale inchangee. */
const L = {ciel:52, nuages:0, profil:180, pluie:78, vent:46, axe:30};
const HAUT = L.ciel+L.nuages+L.profil+L.pluie+L.vent+L.axe;
const GUT = 52;
const yNu=L.ciel, yPro=yNu+L.nuages, yPl=yPro+L.profil, yVe=yPl+L.pluie, yAx=yVe+L.vent;
const ALT_MAX = 3200;
const yAlt = a => yPro+8+(1-a/ALT_MAX)*(L.profil-20);
const ALTS = [500,1000,1500,2000,2500,3000];
/* Definition OMM des etages nuageux. L'echelle s'arretant a 3200 m, l'etage
   moyen n'est visible que sur sa tranche basse et l'etage haut est hors cadre. */
const ETAGE_MOY = 2000, ETAGE_HAUT = 6000;

/* ---- Ou est la base du nuage, et le coureur est-il dedans ? ----
   Espy donne le niveau de condensation d'une parcelle soulevee depuis le sol :
   juste pour un cumulus, faux pour la pluie stratiforme d'un front, ou la couche
   est saturee bien plus bas. Et son terme etant toujours positif, une base SOUS
   le coureur y est inexprimable - alors que les modeles la placent entre 100 et
   800 m sur cette situation. On detecte donc l'etat sature separement. */
function airSature(nu, t, ros, nub, pr){
  /* il pleut et la couche basse est couvrante */
  if(pr!==null && pr>=0.2 && nub!==null && nub>=50) return true;
  /* le ciel est bouche et l'air est a saturation */
  if(nu!==null && nu>=95 && t!==null && ros!==null && (t-ros)<=1.5) return true;
  return false;
}
/* Base du nuage, en metres au-dessus du niveau de la mer. */
function baseNuage(sol, t, ros, nu, nub, pr, brouillard){
  let b = (t!==null && ros!==null)? sol + 125*Math.max(0, t-ros) : sol + 300;
  if(airSature(nu, t, ros, nub, pr)) b = sol - 150 - 350*((nub===null? 60 : nub)/100);
  if(brouillard) b = sol;                       /* colle au relief */
  return Math.max(0, Math.min(b, ALT_MAX-120));
}
/* geometrie de la bande de pluie, partagee : la gouttiere doit pouvoir
   placer les graduations exactement a la hauteur des lignes tracees. */
const yPlBase = yPl+L.pluie-10, hPlMax = L.pluie-16;

/* Echelle de pluie FIXE et par paliers, jamais recalculee sur la fenetre.
   Deux raisons, l'une de lisibilite, l'autre de comparabilite.

   Une echelle lineaire consacre sa hauteur aux fortes intensites, qui sont rares,
   et ecrase les faibles, qui sont la plupart du temps ce qu'on subit : a 4 mm/h
   de plafond, une bruine de 0,2 mm/h faisait 1,6 px, donc rien. Le premier
   millimetre recoit donc 45 % de la hauteur, la ou se joue la difference entre
   rester sec et etre mouille huit heures durant.

   Et une echelle recalculee sur la fenetre faisait changer de hauteur la meme
   pluie selon qu'on regardait le parcours complet ou un segment : deux ecrans du
   meme outil devenaient incomparables. C'est le defaut le plus insidieux d'un
   graphe, puisqu'il ne se voit jamais sur une seule capture. */
const PLUIE_PALIERS = [[0,0],[.5,.30],[1,.48],[4,.80],[10,1]];

/* Intensite de pluie a afficher : la MOYENNE inter-modeles, pas la mediane.
   La precipitation est tres dissymetrique et pleine de zeros ; il suffit que la
   moitie des modeles placent l'averse a une autre heure pour que la mediane
   horaire tombe a zero alors que chacun prevoit de la pluie. Mesure sur le
   releve du 18/08 : neuf points sur cinquante-deux affichaient 0,00 mm/h en
   mediane, dont Belledonne a 0,00 avec 88 % de risque, quand la moyenne y donne
   0,68. La mediane est le bon estimateur d'une temperature, le mauvais d'un
   cumul. Le bandeau de synthese lisait deja pr_moy : on aligne le reste. */
function pluieAffichee(s){
  if(!s) return null;
  if(s.pr_moy && s.pr_moy.m!==null && s.pr_moy.m!==undefined) return s.pr_moy.m;
  if(s.pr && s.pr.m!==null && s.pr.m!==undefined) return s.pr.m;
  return null;
}
const PLUIE_PLAFOND = 10;
function fracPluie(v){
  if(!(v>0)) return 0;
  for(let i=0;i<PLUIE_PALIERS.length-1;i++){
    const a=PLUIE_PALIERS[i], b=PLUIE_PALIERS[i+1];
    if(v<=b[0]) return a[1] + (v-a[0])/(b[0]-a[0])*(b[1]-a[1]);
  }
  return 1;
}
const yPr = v => yPlBase - fracPluie(v)*hPlMax;

function fenetre(){
  if(!SEG) return [0, Math.ceil(dureeCourse())];
  const s=SEGMENTS[SEG-1];
  const idx=segPois();
  const t0=new Date(POIS[0].t[SCENARIO]).getTime();
  const hh=i=>(new Date(POIS[i].t[SCENARIO]).getTime()-t0)/3.6e6;
  if(!idx.length) return [Math.floor(heureAuKm(s.km0)), Math.ceil(heureAuKm(s.km1))];
  return [Math.floor(hh(idx[0])), Math.ceil(hh(idx[idx.length-1]))];
}

/* la gouttière ne défile pas : les noms de rangée restent lisibles en toute position */
function gouttiere(){
  const g=q('#gouttiere');
  g.setAttribute('viewBox','0 0 '+GUT+' '+HAUT);
  g.setAttribute('width',GUT); g.setAttribute('height',HAUT);
  const T=['<rect x="0" y="0" width="'+GUT+'" height="'+HAUT+'" fill="'+PAL.fond+'"/>'];
  const lib=(y,t,c)=>T.push('<text x="'+(GUT-9)+'" y="'+y+'" fill="'+(c||PAL.libelle)
    +'" font-size="8.5" text-anchor="end" font-family="sans-serif">'+t+'</text>');
  lib(L.ciel/2+4,'ciel',PAL.libelleFort);
  /* six graduations la ou il y en avait trois : l'altitude se lit
     maintenant a 500 m pres sans compter les intervalles. */
  ALTS.forEach(a=>lib(yAlt(a)+3, a, a%1000? PAL.libelle : PAL.libelleFort));
  /* Repere de l'etage moyen, a 2000 m au sens OMM. Il est dans la GOUTTIERE et
     non dans le dessin : la gouttiere ne defile pas, donc ce repere reste
     visible sur un telephone ou le profil s'etale sur 1600 px. Toute position
     calculee dans le repere du dessin finit par sortir de l'ecran ou par entrer
     en conflit - c'est arrive deux fois de suite avec ce meme libelle. */
  T.push('<line x1="3" y1="'+(yAlt(2000)-0.5)+'" x2="15" y2="'+(yAlt(2000)-0.5)
    +'" stroke="'+PAL.grille+'" stroke-width="1" stroke-dasharray="1 5" opacity=".9"/>');
  /* L'echelle etait ecrite dans la zone de trace, par-dessus les premieres
     colonnes. Elle revient dans la gouttiere : le plafond au niveau de sa
     graduation, le nom de la rangee au niveau du zero. Le lecteur a donc
     l'unite et le maximum d'un seul coup d'oeil, hors du dessin. */
  /* Les graduations suivent les paliers fixes : le lecteur apprend une echelle
     une fois, et elle vaut sur tous les ecrans de l'outil. */
  lib(yPr(4)+3, '4 mm/h', PAL.libelleFort);
  lib(yPr(1)+3, '1');
  lib(yPlBase+3, 'pluie');
  lib(yVe+18,'vent',PAL.libelleFort); lib(yVe+38,'rafales');
  T.push('<line x1="'+(GUT-.5)+'" y1="0" x2="'+(GUT-.5)+'" y2="'+HAUT+'" stroke="'+PAL.bord+'"/>');
  g.innerHTML=T.join('');
}

function dessine(){
  const bornes=fenetre(), h0=bornes[0], h1=bornes[1], NH=Math.max(1,h1-h0);
  const large = (typeof window!=='undefined' && window.innerWidth)? window.innerWidth : 900;
  /* On MESURE le conteneur qui defile (#scroller) au lieu d'estimer depuis
     window.innerWidth : les marges de .wrap et du cadre faisaient surestimer
     la place disponible, d'ou une barre de defilement residuelle. */
  const scr = q('#scroller');
  const dispo = (scr && scr.clientWidth > 200)? scr.clientWidth
                                             : Math.max(320, large - 40);
  const utile = Math.max(320, dispo - GUT - 8);
  /* on essaie de faire tenir la fenêtre entière à l'écran ; en dessous d'un
     seuil de lisibilité on laisse défiler */
  const px = SEG? Math.max(46, Math.min(110, utile/NH))
                /* parcours complet sur grand ecran : on laisse la largeur
                   par heure descendre jusqu'a ce que tout tienne, plutot que
                   d'imposer un plancher qui force un defilement horizontal */
                : (large>=1100? Math.min(52, utile/NH)
                              : Math.max(34, Math.min(52, utile/NH)));
  /* sur grand ecran on ne depasse pas l'espace disponible : pas de barre
     de defilement pour le parcours complet */
  const Wvoulu = NH*px+GUT+16;
  /* parcours complet sur grand ecran : on ne depasse jamais le conteneur
     mesure, donc aucune barre de defilement */
  const W = (!SEG && large>=1100)? Math.min(Wvoulu, dispo)
                                 : Math.max(880, Wvoulu);
  const x=hh=>GUT+8+(hh-h0)*(W-GUT-24)/NH;
  const t0=new Date(POIS[0].t[SCENARIO]).getTime();
  const hLoc=hh=>{ const d=new Date(t0+hh*3.6e6); return d.getHours()+d.getMinutes()/60; };
  const j=k=>sondeJalon(k);
  const S=[];
  const pas = px>=70? 1 : (px>=46? (SEG?1:2) : 2);

  S.push('<defs><linearGradient id="gCiel" x1="0" x2="1">');
  for(let hh=h0;hh<=h1;hh++) S.push('<stop offset="'+((hh-h0)/NH*100).toFixed(2)+'%" stop-color="'+couleurCiel(hLoc(hh))+'"/>');
  /* Le plancher d'opacite doit dependre du socle. Sur le socle blanc du theme
     clair, 66 % donne un pastel ou 11 et 15 degres se confondent ; sur le socle
     gris-bleu du theme sombre, 66 % garde du corps. Meme intention, deux
     reglages, parce que les fonds sont opposes. */
  gouttiere();
  const OPMIN = (PAL.jour==='clair')? .86 : .66;
  S.push('</linearGradient><linearGradient id="gTemp" x1="0" x2="1">');
  for(let hh=h0;hh<=h1;hh++){ const s=j(hh);
    /* Plancher a 66 % et non 42 % : l'ecart entre modeles reste lisible comme un
       delavage, mais ne peut plus rendre la temperature indechiffrable la nuit. */
    S.push('<stop offset="'+((hh-h0)/NH*100).toFixed(2)+'%" stop-color="'+couleurT(s&&s.t?s.t.m:null)
      +'" stop-opacity="'+(s&&s.t? Math.max(OPMIN,1-(s.t.hi-s.t.lo)/14).toFixed(2)
                                 : (OPMIN+.04).toFixed(2))+'"/>'); }
  /* Ombre de relief : nulle sur la crete, forte au fond de vallee. La lumiere
     vient du ciel, donc c'est le sens physique, et c'est ce qui rend a la
     montagne sa masse apres l'ajout du socle opaque. Nulle en haut : la couleur
     de temperature reste fidele exactement la ou passe le coureur. */
  S.push('</linearGradient><linearGradient id="gProf" gradientUnits="userSpaceOnUse"'
    +' x1="0" y1="'+yAlt(ALT_MAX).toFixed(1)+'" x2="0" y2="'+yAlt(0).toFixed(1)+'">'
    +'<stop offset="0%" stop-color="'+PAL.ombre+'" stop-opacity="0"/>'
    +'<stop offset="45%" stop-color="'+PAL.ombre+'" stop-opacity="'
    +(PAL.jour==='clair'? '.05' : '.10')+'"/>'
    +'<stop offset="100%" stop-color="'+PAL.ombre+'" stop-opacity="'
    +(PAL.jour==='clair'? '.20' : '.46')+'"/></linearGradient></defs>');
  S.push('<rect x="'+GUT+'" y="0" width="'+(W-GUT)+'" height="'+yPl+'" fill="url(#gCiel)"/>');

  for(let hh=h0;hh<=h1;hh+=pas){
    const s=j(hh); if(!s) continue;
    const nuit = hLoc(hh)>=20.5||hLoc(hh)<6.3;
    /* cielCoherent et non s.code brut : le mode entre modeles affichait un
       grand soleil a 13 h sous 100 % de nuages et 85 % de risque de pluie. Il
       suffit que cinq modeles sur neuf renvoient 0 pour que le mode bascule.
       Meme seuil que contraste() pour la teinte : on regarde le fond
       reellement peint a cette heure-la, pas le theme. */
    S.push(picto(cielCoherent(s), x(hh), 22, 11, nuit,
                 luminance(couleurCiel(hLoc(hh))) <= 0.42));
    if(s.t&&s.t.m!==null) S.push('<text x="'+x(hh)+'" y="45" fill="'+contraste(couleurCiel(hLoc(hh)))
      +'" font-size="12.5" font-weight="700" text-anchor="middle">'+s.t.m.toFixed(0)+'\u00b0</text>');
  }

  /* ---- Couverture nuageuse, base calculee et intensite ----
     Deux choses que des etages fixes ne disaient pas.

     1. L'ALTITUDE DE LA BASE. Formule d'Espy, connue depuis 1841 et toujours
        utilisee en aviation : la base d'un nuage de convection est a environ
        125 m par degre d'ecart entre temperature et point de rosee, au-dessus du
        sol. On dispose deja de t et ros agreges, donc on obtient une base
        physique a ~100 m pres, la ou des paliers de 1000 m ne donnaient rien.
        C'est la limite qui compte : au-dessus, on est dans la purée.

     2. L'INTENSITE. Un brouillard et un cumulus d'orage ne se ressemblent pas.
        L'opacite suit la nebulosite totale, et la teinte distingue trois
        regimes : brouillard colle au sol (code OMM 45/48 ou visibilite basse),
        convection (CAPE elevee ou code >= 95), et nuage ordinaire.

     Toujours aucune donnee nouvelle et aucun cout de quota. Dessine avant le
     relief : le terrain repeint par-dessus, la teinte ne subsiste que dans l'air. */
  S.push('<defs><filter id="flouNu" x="-12%" y="-40%" width="124%" height="180%">'
    +'<feGaussianBlur stdDeviation="4.5"/></filter>'
    +'<filter id="flouEt" x="-6%" y="-30%" width="112%" height="160%">'
    +'<feGaussianBlur stdDeviation="6"/></filter></defs>');

  /* ---- Etages moyen et haut ----
     La base dit si l'on est mouille, le sommet dit si l'on peut percer. Sans
     l'etage moyen, impossible de distinguer une mer de nuages - basse et
     couvrante, degagee au-dessus - d'un ciel bouche sur toute son epaisseur.
     nub, num et nuh sont releves a chaque point et n'etaient plus utilises
     depuis le retrait de la bande a trois rangees ; on les redessine ici a leur
     altitude, ce qui etait justement le reproche fait a cette bande. */
  (function(){
    const ET = (PAL.jour==='clair')
      ? { moy:['#FFFFFF','#9AA9BE', .42], haut:['#FFFFFF','#B4C0D0', .34] }
      : { moy:['#EDF3FB','#7686A0', .40], haut:['#E6EDF7','#68788F', .30] };
    const yTop = yAlt(ALT_MAX), yMoy = yAlt(ETAGE_MOY);
    /* Un aplat uniforme couvrait le tiers superieur du cadre d'un gris plat et
       ecrasait le contraste des sommets. L'etage est dense a sa BASE, la ou il
       commence effectivement, et se dissout vers le haut, ou notre echelle
       s'arrete bien avant la sienne : meme honnetete que pour la couche basse,
       on ne peint pas franc ce qu'on ne sait pas. */
    S.push('<defs><linearGradient id="gEtMoy" gradientUnits="userSpaceOnUse"'
      +' x1="0" y1="'+yTop.toFixed(1)+'" x2="0" y2="'+yMoy.toFixed(1)+'">'
      +'<stop offset="0%" stop-color="'+ET.moy[1]+'" stop-opacity=".30"/>'
      +'<stop offset="55%" stop-color="'+ET.moy[1]+'" stop-opacity=".72"/>'
      +'<stop offset="100%" stop-color="'+ET.moy[1]+'" stop-opacity="1"/>'
      +'</linearGradient></defs>');
    let dm = '', nMoy = 0, nHaut = 0;
    for(let hh=h0; hh<h1; hh++){
      const s0 = j(hh); if(!s0) continue;
      const g = k => (s0[k] && s0[k].m!==null && s0[k].m!==undefined)? s0[k].m : null;
      const num = g('num'), nuh = g('nuh');
      const x0 = x(hh), x1 = x(hh+1);
      if(num!==null && num >= 15){
        nMoy++;
        S.push('<rect x="'+x0.toFixed(1)+'" y="'+yTop.toFixed(1)+'" width="'+(x1-x0).toFixed(1)
          +'" height="'+(yMoy-yTop).toFixed(1)+'" fill="url(#gEtMoy)" opacity="'
          +(ET.moy[2]*Math.min(1, num/100)).toFixed(3)+'" filter="url(#flouEt)"/>');
      }
      /* L'etage haut est hors cadre - au-dela de 6000 m. Un voile en lisiere
         superieure dit qu'il y a du cirrus sans pretendre le situer. */
      if(nuh!==null && nuh >= 20){
        nHaut++;
        S.push('<rect x="'+x0.toFixed(1)+'" y="'+(yTop-7).toFixed(1)+'" width="'+(x1-x0).toFixed(1)
          +'" height="7" fill="'+ET.haut[1]+'" opacity="'
          +(ET.haut[2]*Math.min(1, nuh/100)).toFixed(3)+'"/>');
      }
    }
    /* Reperes d'etage, une seule fois, discrets : sans eux la bande moyenne est
       une teinte sans signification. */
    if(nMoy){
      S.push('<line x1="'+GUT+'" y1="'+yMoy.toFixed(1)+'" x2="'+(W-8)+'" y2="'+yMoy.toFixed(1)
        +'" stroke="'+PAL.grille+'" stroke-width="1" stroke-dasharray="1 5" opacity=".5"/>');
      /* En lisiere superieure, au-dessus de 3000 m : c'est la seule bande
         vraiment libre du cadre, aucun sommet du parcours n'y montant - le point
         haut est a 2887 m. Partout ailleurs les noms de sommets, ecrits en
         oblique au-dessus des cretes, occupent l'air. Un echantillon du tiret
         precede le texte : le lien avec la ligne se fait par la forme, sans
         tirer de trait de rappel a travers le dessin. */
      /* Seulement quand le graphe tient a l'ecran. Des qu'il defile, la legende
         vient occuper ce coin et les deux se recouvrent ; le repere de la
         gouttiere prend alors le relais, lui qui ne defile jamais. */
      if(!(W > dispo + 4)){
        const yLib = yAlt(ALT_MAX) + 11, xLib = GUT + 12;
        S.push('<line x1="'+xLib+'" y1="'+(yLib-3).toFixed(1)+'" x2="'+(xLib+14)+'" y2="'
          +(yLib-3).toFixed(1)+'" stroke="'+PAL.grille+'" stroke-width="1"'
          +' stroke-dasharray="1 5" opacity=".8"/>');
        S.push('<text x="'+(xLib+20)+'" y="'+yLib.toFixed(1)+'" fill="'+PAL.libelle
          +'" font-size="8.5" text-anchor="start" font-family="sans-serif"'
          +' paint-order="stroke" stroke="'+PAL.fond+'" stroke-width="2.6">'
          +'\u00e9tage moyen \u00b7 2000 m+</text>');
      }
    }
  })();
  /* les colonnes servent deux fois : au dessin du nuage, puis au surlignage de
     la trace. On les expose donc au lieu de les enfermer. */
  let COL = null;
  /* altitude du plafond le plus etabli, portee par la legende */
  let PLAFOND_MED = null;
  /* les bancs sont rejoues apres le relief, decoupes par sa silhouette */
  const NUES = [];
  (function(){
    const col = [];
    for(let hh=h0; hh<=h1; hh++){
      const s0 = j(hh), J0 = JALONS[hh];
      if(!s0 || !J0){ col.push(null); continue; }
      const g = k => (s0[k] && s0[k].m!==null && s0[k].m!==undefined)? s0[k].m : null;
      /* Le code temps est un SCALAIRE, un mode entre modeles, pas un quantile.
         Le lire avec l'accesseur des quantiles renvoyait null aux 45 heures, si
         bien que les regimes brouillard et convectif n'ont jamais pu se
         declencher. Mesure a l'appui avant correction. */
      const code = (s0.code===null || s0.code===undefined)? null : +s0.code;
      const nu = g('nu'), t = g('t'), ros = g('ros');
      /* capeAdmis : sinon la CAPE d'un modele global dessinait des enclumes. */
      const cape = (s0.capeAdmis===null || s0.capeAdmis===undefined)? null : s0.capeAdmis;
      const vis = g('vis');
      const nub = g('nub'), pr = g('pr');
      const brouillard = (code===45 || code===48 || (vis!==null && vis < 900));
      /* Le brouillard se dessine meme si la couverture totale est faible : c'est
         un nuage au sol, et la variable de couverture ne le voit pas. */
      if(!brouillard && (nu===null || nu < 12)){ col.push(null); continue; }
      /* nebulosite de travail : le brouillard est dense par nature */
      const nuE = (nu===null)? 90 : nu;
      const sol = J0.alt || 0;
      /* voir airSature() et baseNuage() : la regle est nommee pour etre testable,
         et pour que la fiche et le SMS lisent la meme plutot que d'en inventer
         une autre. */
      const sature = airSature(nu, t, ros, nub, pr);
      let base = baseNuage(sol, t, ros, nu, nub, pr, brouillard);
      /* Seuil de CAPE abaisse a 300 : sur ce parcours de montagne le maximum
         mesure est de 380, un seuil a 800 ne se declenchait donc jamais. Le
         code d'orage, desormais lisible, reste le signal principal. */
      const convectif = (code!==null && code>=95) || (cape!==null && cape>300);
      /* Epaisseur bornee par la physique du regime. L'ancienne formule montait
         jusqu'a ALT_MAX des que nu depassait 80 % : plus de ciel visible, donc
         plus de contraste et plus rien de lisible. Un stratus fait quelques
         centaines de metres, un cumulonimbus plusieurs milliers. */
      /* La couche peut monter plus haut qu'avant sans mentir, puisque son sommet
         se dissout au lieu de s'arreter net : c'est la densite qui porte
         l'information, plus une frontiere inventee. */
      const ep = convectif  ? 900 + 2300*(nuE/100)
               : brouillard ? 140 +  520*(nuE/100)
                            : 320 + 1000*(nuE/100);
      let haut = Math.min(ALT_MAX, base + ep);
      /* Un coureur ne peut pas etre a la fois dans le nuage et au-dessus de son
         sommet. Quand l'air est sature, la couche l'englobe : son sommet passe
         au moins 600 m au-dessus de lui. Sans cela, entre Vizille et Arselle, le
         dessin annoncait "dans la nuee" avec un sommet 200 m sous la crete. */
      if(sature) haut = Math.min(ALT_MAX, Math.max(haut, sol + 600));
      /* Base de DESSIN, distincte de la base de donnee. Depuis que la base peut
         passer sous le coureur, la moitie dense du degrade se peignait derriere
         la montagne : il ne restait au-dessus de la crete que la partie
         transparente, et le ciel paraissait degage la ou l'on est dans la nuee.
         On borne donc le trace a 250 m sous le relief. Le surlignage et le trait
         de plafond continuent de lire la vraie base. */
      const baseDessin = Math.max(base, sol - 250);
      col.push({x:x(hh), base:base, haut:haut, sol:sol, bd:baseDessin, nu:nuE,
                num:g('num'), sature:!!sature,
                regime: brouillard? 'brouillard' : (convectif? 'convectif' : 'normal')});
    }
    /* ---- Plafond regional ----
       La base locale herite de l'altitude du coureur : elle est toujours
       au-dessus de lui par construction, donc infranchissable, et elle ondule
       avec le relief. Or un niveau de condensation est une propriete de la masse
       d'air. On lisse par mediane glissante sur cinq heures : le plafond se
       decouple du profil et redevient franchissable. Mediane et non moyenne,
       pour qu'une heure saturee isolee ne tire pas tout le plafond vers le bas.
       Le brouillard est exclu du lissage : il colle au sol par definition. */
    (function(){
      const FEN = 2;                       /* +/- 2 h, soit cinq heures */
      const brut = col.map(c => c? c.base : null);
      col.forEach(function(c, k){
        /* Le brouillard colle au sol et l'etat sature est un fait constate, pas
           l'estimation d'un plafond regional : ni l'un ni l'autre ne se lisse. */
        if(!c || c.regime==='brouillard' || c.sature) return;
        const v = [];
        for(let i=k-FEN;i<=k+FEN;i++) if(brut[i]!==null && brut[i]!==undefined
            && col[i] && col[i].regime!=='brouillard' && !col[i].sature) v.push(brut[i]);
        if(v.length < 2) return;
        v.sort((a,b)=>a-b);
        const med = v.length%2? v[(v.length-1)/2] : (v[v.length/2-1]+v[v.length/2])/2;
        /* l'epaisseur suit le plafond, sinon le sommet de couche se decale */
        c.haut += med - c.base;
        c.base = med;
        c.haut = Math.min(ALT_MAX, c.haut);
        /* et le sommet doit rester au-dessus de la base apres lissage */
        c.haut = Math.max(c.haut, c.base + 120);
        c.bd = Math.max(c.base, c.sol - 250);
      });
    })();
    /* ---- Y a-t-il vraiment un plafond ? ----
       Un plafond, au sens aeronautique, commence a 5/8 de couverture. En dessous
       on voit entre les nuages et l'affirmer serait faux. Hysteresis 60/45 :
       un seuil sec ferait clignoter le trait a chaque oscillation. */
    (function(){
      let ouvert = false;
      col.forEach(function(c){
        if(!c){ ouvert = false; return; }
        if(c.regime==='brouillard' || c.sature){ c.deck = true; ouvert = true; return; }
        if(!ouvert && c.nu >= 60) ouvert = true;
        else if(ouvert && c.nu < 45) ouvert = false;
        c.deck = ouvert;
      });
    })();
    COL = col;
    if(!col.some(Boolean)) return;
    /* Un nuage se voit CLAIR dans les deux themes : c'est un objet eclaire par
       le haut, pas une teinte d'interface. D'ou un degrade vertical du sommet
       ensoleille vers la base ombree, qui suffit a le faire lire comme un
       volume la ou un aplat donnait un lavis. En theme clair il faut une base
       franchement grise, sinon le blanc ne se detache pas du fond. */
    const REG = PAL.jour==='clair'
      /* base assombrie : c'est la partie ombree qui donne le volume, et c'est elle
         qui porte l'altitude du plafond. Le sommet reste franchement blanc. */
      ? { normal:     ['#FFFFFF','#8494AC', .92],
          brouillard: ['#EDF1F7','#6F8098', .95],
          convectif:  ['#FFF7F3','#7A5D66', .93] }
      /* En theme sombre un blanc translucide sur bleu nuit perd beaucoup : il
         faut monter plus haut qu'en theme clair pour un rendu equivalent. */
      : { normal:     ['#F4F8FD','#7E90AC', .62],
          brouillard: ['#E2E9F3','#677994', .78],
          convectif:  ['#FDF2ED','#A2685A', .70] };
    Object.keys(REG).forEach(function(reg){
      const pres = col.map(c => (c && c.regime===reg)? c : null);
      const vus = pres.filter(Boolean);
      if(!vus.length) return;
      /* On decoupe en bancs continus, puis on effile chaque extremite : le sommet
         redescend vers la base au premier et au dernier pas. Sans cela le chemin
         montait a la verticale d'un bord a l'autre, ce qui donnait un mur que le
         flou ne suffisait pas a effacer. */
      const bancs = []; let cur = [];
      pres.forEach(function(c){
        if(c) cur.push(c);
        else if(cur.length){ bancs.push(cur); cur = []; }
      });
      if(cur.length) bancs.push(cur);
      const t = REG[reg];
      /* Un degrade PAR BANC, et non un par regime. Un degrade unique s'etirait du
         sommet du banc le plus haut a la base du banc le plus bas : un banc
         intercale n'en recevait que la tranche moyenne, jamais la partie dense,
         et sa base ne marquait donc rien. Cale sur sa propre etendue, chaque banc
         porte sa matiere a sa propre base - qui est ce que la densite signifie. */
      bancs.forEach(function(b, bi){
        /* un banc d'une seule heure ne fait qu'un triangle sans sens */
        if(b.length < 2) return;
        const sommet = function(c, i){
          const bord = (i===0 || i===b.length-1);
          return bord? c.bd + (c.haut-c.bd)*0.22 : c.haut;
        };
        let d = ' M '+b[0].x.toFixed(1)+' '+yAlt(b[0].bd).toFixed(1);
        b.forEach(function(c, i){ d += ' L '+c.x.toFixed(1)+' '+yAlt(sommet(c,i)).toFixed(1); });
        d += ' L '+b[b.length-1].x.toFixed(1)+' '+yAlt(b[b.length-1].bd).toFixed(1)+' Z';
        const gid = 'gNu'+reg+bi;
        const yH = Math.min.apply(null, b.map(c=>yAlt(c.haut)));
        const yB = Math.max.apply(null, b.map(c=>yAlt(c.bd)));
        /* un banc plus mince que deux pixels ne peut pas porter cinq arrets */
        if(yB - yH < 3) return;
        S.push('<defs><linearGradient id="'+gid+'" gradientUnits="userSpaceOnUse"'
          +' x1="0" y1="'+yH.toFixed(1)+'" x2="0" y2="'+(yB+2).toFixed(1)+'">'
          +'<stop offset="0%" stop-color="'+t[0]+'" stop-opacity="0"/>'
          +'<stop offset="22%" stop-color="'+t[0]+'" stop-opacity=".38"/>'
          +'<stop offset="48%" stop-color="'+t[0]+'" stop-opacity=".82"/>'
          +'<stop offset="80%" stop-color="'+t[0]+'" stop-opacity="1"/>'
          +'<stop offset="100%" stop-color="'+t[1]+'"/></linearGradient></defs>');
        S.push('<path d="'+d.trim()+'" fill="url(#'+gid+')" opacity="'+t[2]
          +'" filter="url(#flouNu)"/>');
        NUES.push({d: d.trim(), gid: gid, op: t[2]});
      });
      /* La base reste soulignee, mais discretement : elle sera etiquetee a
         l'iteration suivante, un trait nu ne disant rien au lecteur. */
      /* seules les colonnes a plafond etabli portent le trait */
      const dk = pres.map(c => (c && c.deck)? c : null);
      let db = '', ouv = false;
      dk.forEach(function(c){
        if(!c){ ouv = false; return; }
        db += (ouv? ' L ' : ' M ')+c.x.toFixed(1)+' '+yAlt(c.base).toFixed(1);
        ouv = true;
      });
      /* Tirete et net : un trait plein se lit comme une courbe de donnee, un
         tirete comme une limite. Non floute, c'est la seule grandeur precise
         du dessin, celle qui decide si on est dedans ou dessous. */
      if(db){
        /* Liseré au ton du fond puis tirete au ton du texte : le premier detache
           le trait de la masse nuageuse claire au-dessus, le second du ciel
           sombre en dessous. Sans les deux, une teinte unique perd la moitie de
           son parcours sur cette frontiere. */
        S.push('<path d="'+db.trim()+'" fill="none" stroke="'+PAL.fond
          +'" stroke-width="3.6" opacity="'+(PAL.jour==='clair'? '.62':'.52')
          +'" stroke-linecap="round"/>');
        S.push('<path d="'+db.trim()+'" fill="none" stroke="'+PAL.plafond
          +'" stroke-width="1.7" opacity=".95" stroke-dasharray="7 4"'
          +' stroke-linecap="round"/>');
      }

      /* Etiquette sur le plus long palier continu de ce regime : un plafond
         qu'on n'ecrit pas ne se lit pas. */
      if(reg!=='brouillard'){
        let deb=-1, meilleur=null;
        for(let k=0;k<=dk.length;k++){
          if(dk[k]){ if(deb<0) deb=k; }
          else if(deb>=0){
            if(!meilleur || k-deb > meilleur[1]-meilleur[0]) meilleur=[deb,k];
            deb=-1;
          }
        }
        if(meilleur && meilleur[1]-meilleur[0] >= 3){
          const tr = dk.slice(meilleur[0], meilleur[1]).filter(Boolean);
          const alts = tr.map(c=>c.base).sort((a,b)=>a-b);
          const mid = alts.length%2? alts[(alts.length-1)/2]
                                   : (alts[alts.length/2-1]+alts[alts.length/2])/2;
          /* On se pose ou l'AIR LIBRE est le plus haut entre le plafond et la
             crete, et sous le trait. Choisir le relief le plus bas semblait
             prudent mais ne l'est pas : ce qui compte n'est pas l'altitude du
             sol, c'est la place que les noms de sommets viennent occuper par le
             bas. Un fond de vallee sous un plafond bas offre moins d'espace
             qu'une crete moyenne sous un plafond haut - c'est ce qui faisait
             chevaucher "Perioule", a quatre pixels pres. */
          let creux = tr[0], meilleurEcart = -Infinity;
          for(let k=meilleur[0]; k<meilleur[1]; k++){
            const J = JALONS[h0+k];
            if(!dk[k] || !J) continue;
            const ecart = yAlt(J.alt||0) - yAlt(dk[k].base);   /* px d'air libre */
            if(ecart > meilleurEcart){ meilleurEcart = ecart; creux = dk[k]; }
          }
          /* L'altitude part dans la legende plutot que dans le dessin. Quatre
             replacements ont montre qu'une etiquette flottante dans un dessin
             dense finit toujours par heurter un nom de sommet : ici Perioule,
             Super Collet et Val Pelouse se suivent et occupent tout l'air sous
             le plafond. La legende a une plaque opaque, une position deja
             resolue pour les deux largeurs, et l'entree a laquelle ce nombre se
             rapporte. La variable creux reste calculee : le critere de l'air
             libre est juste et servira a la prochaine annotation. */
          PLAFOND_MED = Math.round(mid/50)*50;
          void creux;
        }
      }
    });
  })();

  /* les milliers restent marques, les demi-milliers sont plus discrets :
     on lit une altitude sans que la grille concurrence le relief. */
  /* 28 % d'un gris clair sur du blanc ne se voit pas : le reglage avait ete fait
     en regardant le theme sombre uniquement. */
  const OPG = (PAL.jour==='clair')? ['.42','.72'] : ['.30','.58'];
  ALTS.forEach(a=>S.push('<line x1="'+GUT+'" y1="'+yAlt(a)+'" x2="'+(W-8)+'" y2="'+yAlt(a)
    +'" stroke="'+PAL.grille+'" stroke-width="1" opacity="'+(a%1000? OPG[0] : OPG[1])+'"/>'));
  const pts=TRACE.filter(p=>{const t=heureAuKm(p[0]); return t>=h0-.25&&t<=h1+.25;});
  if(pts.length){
    const cx=km=>x(Math.min(h1,Math.max(h0,heureAuKm(km))));
    let d='M '+cx(pts[0][0])+' '+yAlt(0);
    pts.forEach(p=>{ d+=' L '+cx(p[0])+' '+yAlt(p[1]); });
    d+=' L '+cx(pts[pts.length-1][0])+' '+yAlt(0)+' Z';
    /* Socle opaque : sans lui, un degrade a 66 % laissait passer le ciel, presque
       noir la nuit, et la couleur de temperature ne voulait plus dire la meme
       chose a 3 h du matin qu'a midi. */
    S.push('<path d="'+d+'" fill="'+PAL.socle+'"/>');
    S.push('<path d="'+d+'" fill="url(#gTemp)"/>');
    S.push('<path d="'+d+'" fill="url(#gProf)"/>');
    /* La nuit, le contour est le SEUL separateur entre un relief sombre et un
       ciel sombre : on le renforce. Le jour, le contraste de teinte suffit et il
       doit rester discret. On prend l'heure locale au milieu de la fenetre. */
    const nuitDom = (function(){
      let n = 0, tot = 0;
      for(let hh=h0; hh<=h1; hh++){ tot++; const l = hLoc(hh); if(l>=20.5||l<6.3) n++; }
      return tot? n/tot : 0;
    })();
    S.push('<path d="'+d.replace(/ Z$/,'')+'" fill="none" stroke="'+PAL.contour
      +'" stroke-width="'+(PAL.jour==='clair'? '1.2' : '1.4')+'" opacity="'
      +(PAL.jour==='clair'? '.45' : (0.42+0.28*nuitDom).toFixed(2))+'"/>');

    /* ---- Le versant se voile la ou il est dans la nuee ----
       On rejoue les memes bancs, decoupes par la silhouette du relief, a opacite
       reduite. La limite du voile EST la base des nuages : on lit l'entree dans
       la nuee sans suivre aucun trait. Aucune donnee nouvelle, aucun cout. */
    if(NUES.length){
      S.push('<defs><clipPath id="clipRelief"><path d="'+d+'"/></clipPath></defs>');
      S.push('<g clip-path="url(#clipRelief)">');
      NUES.forEach(function(n){
        S.push('<path d="'+n.d+'" fill="url(#'+n.gid+')" opacity="'
          +(n.op*0.62).toFixed(2)+'" filter="url(#flouNu)"/>');
      });
      S.push('</g>');
    }

    /* ---- Ou suis-je DANS la nuee ? ----
       On surligne la crete la ou elle depasse la base du nuage. La couleur est
       celle du nuage lui-meme : le lecteur associe sans apprendre de convention.
       Un liseré sombre dessous donne la lisibilite sur le vert du relief. */
    if(COL){
      /* On n'annonce pas au coureur qu'il est dans la nuee sur un ciel a 3/8 :
         seules les colonnes a plafond etabli comptent. */
      /* On interpole indifferemment la base ou le sommet : au-dessus de la
         couche on est degage, et le dire compte - c'est le coureur qui perce la
         mer de nuages. Tester la seule base l'aurait declare dans la nuee. */
      const niveau = function(th, quoi){
        const k = th - h0;
        if(k < 0 || k > COL.length-1) return null;
        const a = COL[Math.floor(k)], b = COL[Math.min(COL.length-1, Math.ceil(k))];
        if(!a || !b || !a.deck || !b.deck) return null;
        return a[quoi] + (b[quoi] - a[quoi]) * (k - Math.floor(k));
      };
      const plafond = th => niveau(th, 'base');
      /* Marge de 40 m : sans elle, la trace effleurant le plafond produisait un
         peigne de segments d'un point, artefact et non information. Et on jette
         les passages de moins de 400 m de developpe, trop courts pour valoir
         une alerte au coureur. */
      /* Percer la couche basse ne sert a rien si l'etage moyen est couvrant : on
         retombe sous une autre. Le degagement se lit donc sur num. */
      const degageDessus = function(th){
        const k = th - h0;
        if(k < 0 || k > COL.length-1) return false;
        const a = COL[Math.floor(k)];
        if(!a) return false;
        return a.num === null || a.num === undefined || a.num < 40;
      };
      const segs = [], segsHaut = [];
      let seg = [], segH = [];
      const clore = () => {
        if(seg.length){ segs.push(seg); seg = []; }
        if(segH.length){ segsHaut.push(segH); segH = []; }
      };
      pts.forEach(function(p){
        const th = heureAuKm(p[0]);
        const pl = plafond(th), so = niveau(th, 'haut');
        const dedans = pl !== null && p[1] >= pl + 40 && (so === null || p[1] <= so);
        /* au-dessus : la couche existe, son sommet est sous le coureur, et
           l'etage moyen laisse passer la lumiere */
        const dessus = !dedans && pl !== null && so !== null
                    && p[1] > so + 40 && degageDessus(th);
        if(dedans){ if(segH.length){ segsHaut.push(segH); segH = []; } seg.push(p); }
        else if(dessus){ if(seg.length){ segs.push(seg); seg = []; } segH.push(p); }
        else clore();
      });
      clore();
      /* Meme regle de duree pour les deux : moins de 400 m de developpe ne vaut
         pas une annonce, c'est du bruit d'interpolation. */
      const durable = liste => {
        const g = liste.filter(sg => sg.length >= 2 && (sg[sg.length-1][0] - sg[0][0]) >= 0.4);
        liste.length = 0; g.forEach(s2 => liste.push(s2));
      };
      durable(segs); durable(segsHaut);
      /* Liseré a la teinte d'ombre du theme, plus marque en theme clair ou le
         relief est pale. Le coeur reste blanc : c'est la couleur du nuage qui
         rend le surlignage lisible sans convention a apprendre. */
      const casing = PAL.ombre;
      const casOp = (PAL.jour==='clair')? '.80' : '.60';
      const casW  = (PAL.jour==='clair')? '6.4' : '5.4';
      const ruban = function(liste, coeur){
        liste.forEach(function(sg){
          if(sg.length < 2) return;
          let dd = 'M '+cx(sg[0][0]).toFixed(1)+' '+yAlt(sg[0][1]).toFixed(1);
          for(let i=1;i<sg.length;i++) dd += ' L '+cx(sg[i][0]).toFixed(1)+' '+yAlt(sg[i][1]).toFixed(1);
          S.push('<path d="'+dd+'" fill="none" stroke="'+casing+'" stroke-width="'+casW+'"'
            +' opacity="'+casOp+'" stroke-linecap="round" stroke-linejoin="round"/>');
          S.push('<path d="'+dd+'" fill="none" stroke="'+coeur+'" stroke-width="3.2"'
            +' opacity=".98" stroke-linecap="round" stroke-linejoin="round"/>');
        });
      };
      ruban(segs, '#FFFFFF');
      /* Au-dessus de la couche : la teinte du soleil, parce que c'est ce que ca
         veut dire. Blanc = dans le nuage, soleil = au-dessus : deux etats, deux
         couleurs qu'on n'a pas besoin d'apprendre. */
      ruban(segsHaut, PAL.pSoleil);
      /* Legende : l'utilisateur dit ne pas comprendre la lecture, un dessin muet
         ne suffit donc pas. Deux mots suffisent, cales en haut a droite. */
      /* Legende a deux entrees, sur une ligne, avec les mots du coureur. Elle
         est posee en haut a gauche : la ou l'oeil arrive, et ou le relief est
         toujours bas au depart de Vizille. */
      /* En haut a DROITE et empilee : a gauche se trouvent les etiquettes de
         sommets, et la legende masquait "Belledonne". Une plaque au ton du fond
         garantit le contraste quelle que soit la masse nuageuse derriere. */
      const ent = [];
      if(segs.length) ent.push(['nuee', 'je suis dans la nu\u00e9e']);
      if(segsHaut.length) ent.push(['dessus', 'au-dessus, ciel d\u00e9gag\u00e9']);
      ent.push(['base', PLAFOND_MED!==null
                        ? 'base des nuages \u00b7 ~'+PLAFOND_MED+' m'
                        : 'base des nuages']);
      /* Quand le graphe defile, une legende calee a droite est a plus de mille
         pixels hors de l'ecran d'arrivee : personne ne la voit. On la pose alors
         a gauche, la ou le regard arrive et ou le relief est bas au depart. */
      /* la plaque suit le texte : l'entree de base porte desormais une altitude */
      const lmax = ent.reduce((a,e)=>Math.max(a, e[1].length), 0);
      const lw = Math.max(128, 34 + lmax*5.1), lh = 13*ent.length + 8;
      const defile = W > dispo + 4;
      const lx0 = defile? (GUT + 10) : (W - lw - 14);
      const ly0 = yAlt(ALT_MAX) + 4;
      S.push('<rect x="'+lx0+'" y="'+ly0+'" width="'+lw+'" height="'+lh
        +'" rx="3" fill="'+PAL.fond+'" opacity="'+(PAL.jour==='clair'? '.78':'.62')
        +'" stroke="'+PAL.bord+'" stroke-width=".8"/>');
      ent.forEach(function(e, i){
        const yy = ly0 + 12 + i*13, px = lx0 + 8;
        if(e[0]==='nuee' || e[0]==='dessus'){
          S.push('<line x1="'+px+'" y1="'+(yy-3)+'" x2="'+(px+16)+'" y2="'+(yy-3)
            +'" stroke="'+casing+'" stroke-width="'+casW+'" opacity="'+casOp
            +'" stroke-linecap="round"/>');
          S.push('<line x1="'+px+'" y1="'+(yy-3)+'" x2="'+(px+16)+'" y2="'+(yy-3)
            +'" stroke="'+(e[0]==='nuee'? '#FFFFFF' : PAL.pSoleil)
            +'" stroke-width="3.2" opacity=".98" stroke-linecap="round"/>');
        } else {
          S.push('<line x1="'+px+'" y1="'+(yy-3)+'" x2="'+(px+16)+'" y2="'+(yy-3)
            +'" stroke="'+PAL.plafond+'" stroke-width="1.7"'
            +' stroke-dasharray="7 4" stroke-linecap="round"/>');
        }
        S.push('<text x="'+(px+22)+'" y="'+yy+'" fill="'+PAL.libelleFort
          +'" font-size="9.5" text-anchor="start" font-family="sans-serif">'+e[1]+'</text>');
      });
    }
  }

  const CLEFS=['Croix de Belledonne','Col de Mor\u00e9tan','Col de la Vache','Sommet du Grand Chat',
               'Col de la Mine de Fer','Col de Freydane'];
  let dX=-999;
  POIS.forEach(function(p,i){
    const th=heureAuKm(p.km);
    if(th<h0-.15||th>h1+.15) return;
    const maj = p.type==='Ravito'||CLEFS.indexOf(p.nom)>=0;
    if(!SEG && !maj && p.alt<=2500) return;
    const xx=x(th);
    if(!maj && xx-dX<(SEG?52:62)) return;
    if(maj && xx-dX<24) return;
    dX=xx;
    const hy=yAlt(p.alt), dec=maj?19:14;
    S.push('<line x1="'+xx+'" y1="'+hy+'" x2="'+xx+'" y2="'+(hy-(maj?15:10))
      +'" stroke="'+PAL.tige+'" stroke-width="1" opacity=".6"/>');
    S.push('<circle cx="'+xx+'" cy="'+hy+'" r="'+(maj?3.6:2.4)+'" fill="'+(i===SEL?PAL.pointActif:PAL.point)+'"/>');
    S.push('<g class="tick" tabindex="0" data-i="'+i+'" style="cursor:pointer">'
      +'<rect x="'+(xx-17)+'" y="'+(hy-24)+'" width="34" height="32" fill="transparent"/>'
      +'<text x="'+xx+'" y="'+(hy-dec)+'" fill="'+(i===SEL?PAL.pointActif:PAL.texte)
      +'" font-size="9" font-weight="'+(PAL.fond==='#FFFFFF'?'600':'400')
      +'" text-anchor="middle" transform="rotate(-30 '+xx+' '+(hy-dec)+')"'
      +' paint-order="stroke" stroke="'+PAL.fond+'" stroke-width="2.8"'
      +' stroke-linejoin="round">'
      +abrege(p.nom)+'</text></g>');
  });

  /* ---- Bande de pluie ----
     Echelle fixe a paliers (voir PLUIE_PALIERS) : identique sur tous les ecrans,
     et genereuse sur le premier millimetre. Graduations dans la gouttiere. */
  /* Sur fond sombre, #3A4A66 et #26344E sur #131C2C sont trois valeurs voisines :
     le cadre disparaissait, et sans cadre la hauteur d'une barre n'a pas de
     reference. On les remonte, la base davantage que les graduations pour
     qu'elle reste le repere principal. */
  const opBase = (PAL.jour==='clair')? '.75' : '.95';
  const opGrad = (PAL.jour==='clair')? '.55' : '.75';
  S.push('<line x1="'+GUT+'" y1="'+yPlBase+'" x2="'+(W-8)+'" y2="'+yPlBase
    +'" stroke="'+PAL.grille+'" stroke-width="1.3" opacity="'+opBase+'"/>');
  /* Un repere par millimetre, de 1 a 4. Leur espacement est INEGAL et c'est
     voulu : l'echelle a paliers consacre 48 % de la hauteur au premier
     millimetre, la ou se joue la difference entre sec et mouille. Voir les
     lignes se resserrer est la facon la plus directe d'apprendre l'echelle.
     Au-dela de 4 mm/h la compression rend un repere par millimetre illisible,
     et la moustache prend le relais avec son chevron. */
  [1, 2, 3, 4].forEach(function(v){
    const fort = (v===1 || v===4);          /* les deux reperes etiquetes */
    S.push('<line x1="'+GUT+'" y1="'+yPr(v).toFixed(1)+'" x2="'+(W-8)
      +'" y2="'+yPr(v).toFixed(1)+'" stroke="'+PAL.grille+'" stroke-dasharray="'
      +(fort? '2 4' : '1 5')+'" opacity="'+(fort? opGrad : (PAL.jour==='clair'? '.34':'.24'))
      +'"/>');
  });
  for(let hh=h0;hh<h1;hh++){
    const s=j(hh); if(!s||!s.pr) continue;
    const prA = pluieAffichee(s);
    if(prA===null) continue;
    const w=x(hh+1)-x(hh), xb=x(hh)+w*.22, wb=w*.56;
    /* Le doute est une MOUSTACHE, plus un bloc. Un rectangle pale monte a la
       hauteur du quantile haut pesait plus lourd a l'oeil que la prevision
       elle-meme, alors qu'il dit seulement ce qui pourrait arriver. Quand la
       moustache sort du cadre, un chevron le dit : on ne tronque pas en silence. */
    if(s.pr.hi!==null && s.pr.hi > prA + 0.05){
      const cx=(xb+wb/2), ym=yPr(prA), yh=yPr(s.pr.hi);
      const deborde = s.pr.hi > PLUIE_PLAFOND;
      const yt = deborde? (yPlBase-hPlMax) : yh;
      S.push('<line x1="'+cx.toFixed(1)+'" y1="'+ym.toFixed(1)+'" x2="'+cx.toFixed(1)
        +'" y2="'+yt.toFixed(1)+'" stroke="'+PAL.pluie+'" stroke-width="1.1" opacity=".6"/>');
      S.push(deborde
        ? '<path d="M '+(cx-2.8).toFixed(1)+' '+(yt+3).toFixed(1)+' L '+cx.toFixed(1)+' '+yt.toFixed(1)
          +' L '+(cx+2.8).toFixed(1)+' '+(yt+3).toFixed(1)+'" fill="none" stroke="'+PAL.pluie
          +'" stroke-width="1.2" opacity=".75" stroke-linecap="round" stroke-linejoin="round"/>'
        : '<line x1="'+(cx-2.8).toFixed(1)+'" y1="'+yt.toFixed(1)+'" x2="'+(cx+2.8).toFixed(1)
          +'" y2="'+yt.toFixed(1)+'" stroke="'+PAL.pluie+'" stroke-width="1.1" opacity=".6"/>');
    }
    /* Deux canaux : la HAUTEUR dit combien, la SOLIDITE dit a quel point c'est
       sur. Une barre haute et pale se lit alors "beaucoup, mais peut-etre pas",
       ce qui est la question posee avant de sortir une veste. */
    if(prA>0.02){
      const sur = (s.pp && s.pp.m!==null)? Math.max(.42, Math.min(1, s.pp.m/100)) : .88;
      /* Plancher de 3 px : meme apres les paliers, une pluie de 0,05 mm/h ferait
         moins d'un pixel. Or "il pleut un peu" et "il ne pleut pas" sont deux
         etats differents pour qui court, et le graphe doit les distinguer. */
      const hb = Math.max(3, yPlBase - yPr(prA));
      S.push('<rect x="'+xb+'" y="'+(yPlBase-hb).toFixed(1)+'" width="'+wb+'" height="'
        +hb.toFixed(1)+'" fill="'+PAL.pluie+'" opacity="'+sur.toFixed(2)+'" rx="1"/>');
    }
    /* Les chiffres ne restent qu'au-dessus de 70 % : en dessous, la palissade de
       pourcentages encombrait sans rien decider, la solidite de la barre le
       disant deja. Halo, car ils touchent la bande du vent. */
    if(s.pp&&s.pp.m>=70&&(hh-h0)%pas===0) S.push('<text x="'+((x(hh)+x(hh+1))/2)+'" y="'+(yPl+L.pluie-1)
      +'" fill="'+PAL.pluieTexte+'" font-size="8.5" text-anchor="middle" font-weight="600"'
      +' paint-order="stroke" stroke="'+PAL.fond+'" stroke-width="2.6">'+s.pp.m.toFixed(0)+'%</text>');
  }

  for(let hh=h0;hh<=h1;hh+=pas){
    const s=j(hh); if(!s) continue;
    const f=s.raf&&s.raf.m!==null? s.raf.m : (s.v&&s.v.m!==null? s.v.m*1.6 : null);
    if(s.dir&&s.dir.m!==null) S.push(flecheVent(s.dir.m, f||0, x(hh), yVe+16, 18));
    if(f!==null) S.push('<text x="'+x(hh)+'" y="'+(yVe+39)+'" fill="'
      +(f>60?PAL.alerte:f>40?PAL.chaud:PAL.libelleFort)+'" font-size="10.5" text-anchor="middle" font-weight="'
      +(f>40?'600':'400')+'">'+f.toFixed(0)+'</text>');
  }

  for(let hh=h0;hh<=h1;hh+=pas){
    const dd=new Date(t0+hh*3.6e6);
    const jr=['dim','lun','mar','mer','jeu','ven','sam'][dd.getDay()];
    S.push('<line x1="'+x(hh)+'" y1="'+yAx+'" x2="'+x(hh)+'" y2="'+(yAx+4)+'" stroke="'+PAL.grille+'"/>');
    S.push('<text x="'+x(hh)+'" y="'+(yAx+14)+'" fill="'+PAL.texte+'" font-size="10" text-anchor="middle">'
      +String(dd.getHours()).padStart(2,'0')+'h</text>');
    if(dd.getHours()<pas||hh===h0) S.push('<text x="'+x(hh)+'" y="'+(yAx+25)+'" fill="'+PAL.chaud+'" font-size="9" '
      +'text-anchor="middle" font-weight="600">'+jr+'</text>');
    else if(hh%6===0) S.push('<text x="'+x(hh)+'" y="'+(yAx+25)+'" fill="'+PAL.texteFaible+'" font-size="8.5" '
      +'text-anchor="middle">H+'+hh+'</text>');
  }

  /* ---- Dire l'absence de donnee ----
     Une zone grise muette laisse croire a une panne. C'est presque toujours une
     portee de modele depassee, c'est-a-dire une information, et une information
     datee. On l'ecrit, au centre de la plage concernee.
     A partir de trois heures consecutives seulement : en dessous, un trou d'une
     heure est du bruit, et l'annoncer generait plus que le trou lui-meme. */
  (function(){
    const vide = hh => { const s = j(hh); return !s || !s.t || s.t.m===null || s.t.m===undefined; };
    let deb = null;
    const plages = [];
    for(let hh=h0; hh<=h1+1; hh++){
      if(hh<=h1 && vide(hh)){ if(deb===null) deb = hh; }
      else if(deb!==null){ plages.push([deb, hh-1]); deb = null; }
    }
    plages.forEach(function(p){
      if(p[1] - p[0] < 2) return;                 /* moins de 3 heures : on se tait */
      const cx = (x(p[0]) + x(p[1]+1)) / 2, cy = yAlt(ALT_MAX) + 74;
      /* jusqu'ou va le modele : la derniere heure renseignee avant la plage */
      let fin = null;
      for(let hh=p[0]-1; hh>=h0; hh--){ if(!vide(hh)){ fin = hh; break; } }
      const quand = (fin!==null)
        ? new Date(t0+fin*3.6e6).toLocaleString('fr-FR',
            {weekday:'short', hour:'2-digit', minute:'2-digit'})
        : null;
      const nom = MODELE_ACTIF? nomModele(MODELE_ACTIF) : null;
      const l1 = nom? (nom + ' \u2014 port\u00e9e d\u00e9pass\u00e9e')
                    : 'aucune donn\u00e9e \u00e0 cette \u00e9ch\u00e9ance';
      const l2 = quand? ('va jusqu\u2019\u00e0 ' + quand) : '';
      const t = [l1, l2].filter(Boolean);
      t.forEach(function(ligne, k){
        S.push('<text x="'+cx.toFixed(1)+'" y="'+(cy + k*15).toFixed(1)+'" fill="'+PAL.libelle
          +'" font-size="'+(k? 9.5 : 11)+'" text-anchor="middle" font-family="sans-serif"'
          +(k? '' : ' font-weight="600"')
          +' paint-order="stroke" stroke="'+PAL.fond+'" stroke-width="3.2">'+ligne+'</text>');
      });
    });
  })();

  /* ---- Fenetre orageuse ----
     Posee en dernier, donc par-dessus tout : un marquage de fond serait masque
     par le socle opaque du relief et ne se verrait pas la ou il compte, sur la
     crete. Opacite tres faible pour ne rien effacer de la donnee.
     Seuls les niveaux modere et fort sont marques : signaler le risque faible
     teinterait la moitie du graphe et n'attirerait l'oeil nulle part. */
  (function(){
    let marques = 0;
    for(let hh=h0; hh<h1; hh++){
      /* seules les mailles fines votent sur l'orage : voir finPourOrage() */
      const ro = risqueOrage(sondeJalon(hh, finPourOrage), sondeJalon(hh));
      if(!ro || ro.n < 2) continue;
      marques++;
      const x0 = x(hh), x1 = x(hh+1);
      S.push('<rect x="'+x0.toFixed(1)+'" y="0" width="'+(x1-x0).toFixed(1)
        +'" height="'+(yAx+4)+'" fill="'+PAL.alerte+'" opacity="'
        +(ro.n>=3? '.16' : '.09')+'"/>');
    }
    if(!marques) return;
    /* un eclair par episode continu, en tete de colonne : un par heure ferait
       une rangee de symboles qui ne dit rien de plus */
    let ouvert = false;
    for(let hh=h0; hh<=h1; hh++){
      const ro = hh<h1? risqueOrage(sondeJalon(hh, finPourOrage), sondeJalon(hh)) : null;
      const actif = !!(ro && ro.n >= 2);
      if(actif && !ouvert){
        S.push('<text x="'+(x(hh)+5).toFixed(1)+'" y="11" fill="'+PAL.alerte
          +'" font-size="11" font-weight="700" font-family="sans-serif"'
          +' paint-order="stroke" stroke="'+PAL.fond+'" stroke-width="2.6">'
          +'\u26a1</text>');
      }
      ouvert = actif;
    }
  })();

  const svg=q('#ruban');
  svg.setAttribute('viewBox','0 0 '+W+' '+HAUT);
  svg.setAttribute('width',W); svg.setAttribute('height',HAUT);
  svg.innerHTML=S.join('');
  svg.querySelectorAll('.tick').forEach(function(g){
    const go=function(){SEL=+g.dataset.i; rendreTout(); majChips();
      q('#fiche').scrollIntoView({behavior:'smooth',block:'center'});};
    g.addEventListener('click',go);
    g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
  const hmg=q('#hmg');
  if(hmg) hmg.textContent = SEG? 'M\u00e9t\u00e9ogramme \u2014 segment '+String(SEG).padStart(2,'0')
    : 'M\u00e9t\u00e9ogramme de course';
  const nMod=Object.keys(DATA).length;
  q('#mgnote').textContent = nMod? '' : 'en attente des mod\u00e8les\u2026';
}

/* ---------- segments ---------- */
function segPois(){
  if(!SEG) return POIS.map(function(p,i){return i;});
  const s=SEGMENTS[SEG-1];
  return POIS.map(function(p,i){return i;}).filter(i=>POIS[i].km>=s.km0-0.4&&POIS[i].km<=s.km1+0.4);
}
function segChips(){
  const c=q('#segchips'); c.innerHTML='';
  const faire=function(n,titre,sous){
    const b=document.createElement('button');
    b.className='segchip'; b.dataset.n=n; b.setAttribute('aria-pressed',(n===SEG)+'');
    b.innerHTML=titre+'<small>'+sous+'</small>';
    b.onclick=function(){ SEG=n;
      const dedans=segPois(); if(dedans.length) SEL=dedans[0];
      segChips(); chips(); rendreTout(); };
    c.appendChild(b);
  };
  faire(0,'Tout le parcours','149,5 km \u00b7 11 000 m D+');
  SEGMENTS.forEach(s=>faire(s.n,'S'+String(s.n).padStart(2,'0')+' \u00b7 '+abrege(s.vers),
    s.km0.toFixed(0)+'\u2192'+s.km1.toFixed(0)+' km \u00b7 +'+s.dp+' m'));
}
function resumeSegment(){
  const el=q('#segresume');
  el.style.display='';
  const idx=segPois();
  if(!idx.length){ el.style.display='none'; return; }
  const dep=POIS[idx[0]], arr=POIS[idx[idx.length-1]];
  const duree=(new Date(arr.t[SCENARIO])-new Date(dep.t[SCENARIO]))/6e4;
  const s = SEG? SEGMENTS[SEG-1] : null;
  const dist = s? s.dist : 149.5, dp = s? s.dp : 11000, dm = s? s.dm : 11000;
  const titre = s? 'Segment '+String(s.n).padStart(2,'0')+' \u00b7 '+abrege(s.de)+' \u2192 '+abrege(s.vers)
                 : 'Parcours complet \u00b7 Vizille \u2192 Aiguebelle';

  let h='<div class="rtete"><b>'+titre+'</b><span>'+dist.toFixed(1)+' km \u00b7 +'+dp+' m \u00b7 \u2212'+dm
   +' m \u00b7 '+hhmm(dep.t[SCENARIO])+' \u2192 '+hhmm(arr.t[SCENARIO])+' \u00b7 '
   +Math.floor(duree/60)+' h '+String(Math.round(duree%60)).padStart(2,'0')+'</span></div>';

  const bornes=fenetre(); const T=[],RES=[],P=[],PP=[],R=[],N=[],C=[],V=[],D=[];
  /* etages et altitude du coureur : de quoi repondre a "puis-je percer ?" */
  const NUB=[], NUM=[], ALTH=[];
  /* niveaux de risque orageux heure par heure, et l'heure correspondante */
  const ORAGE=[], ORAGE_H=[];
  for(let hh=bornes[0];hh<=bornes[1];hh++){ const jj=sondeJalon(hh); if(!jj) continue;
    if(jj.t&&jj.t.m!==null) T.push(jj.t.m);
    if(jj.res&&jj.res.m!==null) RES.push(jj.res.m);
    if(jj.pr_moy&&jj.pr_moy.m!==null) P.push(jj.pr_moy.m);
    else if(jj.pr&&jj.pr.m!==null) P.push(jj.pr.m);
    if(jj.pp&&jj.pp.m!==null) PP.push(jj.pp.m);
    if(jj.raf&&jj.raf.m!==null) R.push(jj.raf.m);
    if(jj.nu&&jj.nu.m!==null) N.push(jj.nu.m);
    if(jj.v&&jj.v.m!==null) V.push(jj.v.m);
    if(jj.dir&&jj.dir.m!==null) D.push(jj.dir.m);
    /* cielCoherent et non le code brut : le mode inter-modeles vaut 0 assez
       souvent pour que le maximum ne signale rien, et la case "pire ciel"
       restait vide sur une course qui traverse 28 h de pluie. Une synthese qui
       se tait quand il pleut rassure a tort. */
    const cjj = cielCoherent(jj);
    if(cjj!==null&&cjj!==undefined) C.push(cjj);
    const ro = risqueOrage(sondeJalon(hh, finPourOrage), jj);
    ORAGE.push(ro? ro.n : null);
    ORAGE_H.push(hhmm(new Date(new Date(POIS[0].t[SCENARIO]).getTime()+hh*3.6e6)));
    NUB.push(jj.nub&&jj.nub.m!==null? jj.nub.m : null);
    NUM.push(jj.num&&jj.num.m!==null? jj.num.m : null);
    ALTH.push(JALONS[hh]? (JALONS[hh].alt||0) : null); }
  if(!T.length){ h+='<div class="hnote">Pas encore de donn\u00e9es sur cette partie.</div>';
    el.innerHTML=h; return; }

  const mn=Math.min.apply(null,T), mx=Math.max.apply(null,T);
  const cum=P.reduce((a,b)=>a+b,0);
  const hPluie=P.filter(v=>v>0.15).length;
  const rafMax=R.length? Math.max.apply(null,R) : null;
  const pire=C.length? C.slice().sort((a,b)=>b-a)[0] : null;
  const altMax=Math.max.apply(null, idx.map(i=>POIS[i].alt));
  const dirMoy=D.length? cap(med(D)) : '';
  const resMin=RES.length? Math.min.apply(null,RES) : null;

  const cases=[
    ['temp\u00e9rature', Math.round(mn)+'\u00b0 \u00e0 '+Math.round(mx)+'\u00b0',
      resMin!==null? 'ressenti min '+Math.round(resMin)+'\u00b0':'', couleurT((mn+mx)/2)],
    ['pluie cumul\u00e9e', cum.toFixed(1)+' mm',
      hPluie? hPluie+' h de pluie sur '+P.length : 'aucune pluie', cum>2?'var(--pluie)':''],
    ['rafale max', rafMax!==null? Math.round(rafMax)+' km/h':'\u2014',
      V.length? 'vent moyen '+Math.round(med(V))+' '+dirMoy:'',
      rafMax>60?'var(--alerte)':rafMax>40?'var(--chaud)':''],
    ['nuages', N.length? Math.round(med(N))+' %':'\u2014',
      PP.length? 'risque pluie '+Math.round(med(PP))+' %':'', ''],
    ['point haut', altMax+' m', '', ''],
    ['pire ciel', pire!==null? (WMO[pire]||'\u2014'):'\u2014', '', pire>=95?'var(--alerte)':''],
    merDeNuages(NUB, NUM, ALTH),
    orageFenetre(ORAGE, ORAGE_H)
  ];
  h+='<div class="rgrille">';
  cases.forEach(c=>{ h+='<div class="rcase"><s>'+c[0]+'</s><b'
    +(c[3]?' style="color:'+c[3]+'"':'')+'>'+c[1]+'</b>'+(c[2]?'<em>'+c[2]+'</em>':'')+'</div>'; });
  h+='</div>';
  el.innerHTML=h;
  /* Memorise pour l'export image : le bandeau est du HTML et sera redessine en
     SVG, faute de pouvoir rasteriser un foreignObject de facon fiable. */
  RESUME_EXPORT = {titre: titre, sous: dist.toFixed(1)+' km \u00b7 +'+dp+' m \u00b7 \u2212'+dm
    +' m \u00b7 '+hhmm(dep.t[SCENARIO])+' \u2192 '+hhmm(arr.t[SCENARIO])+' \u00b7 '
    +Math.floor(duree/60)+' h '+String(Math.round(duree%60)).padStart(2,'0'), cases: cases};
}

/* ---------- chips de points, limitées au segment ---------- */
function chips(){
  const c=q('#chips'); c.innerHTML='';
  segPois().forEach(function(i){
    const p=POIS[i];
    const b=document.createElement('button');
    b.className='chip'; b.dataset.i=i; b.setAttribute('aria-pressed',(i===SEL)+'');
    b.textContent=p.nom+' \u00b7 '+p.alt+' m';
    b.onclick=function(){SEL=i; majChips(); rendreTout();};
    c.appendChild(b);
  });
}

/* ---------- message SMS pour les proches ---------- */
/* Contrainte : pas de réseau data en course. Le message doit être court,
   lisible d'un coup d'oeil, et sans jargon. */

const CIEL_COURT={0:'ciel clair',1:'peu nuageux',2:'nuageux',3:'couvert',
  45:'brouillard',48:'brouillard givrant',
  51:'bruine',53:'bruine',55:'bruine forte',56:'bruine verglacante',57:'bruine verglacante',
  61:'pluie faible',63:'pluie',65:'pluie forte',66:'pluie verglacante',67:'pluie verglacante',
  71:'neige faible',73:'neige',75:'neige forte',77:'neige',
  80:'averses',81:'averses',82:'averses fortes',85:'averses de neige',86:'averses de neige',
  95:'orage',96:'orage et grele',99:'orage violent'};

function descMeteo(s, alt){
  if(!s||!s.t) return 'pas de donnees';
  const p=[];
  /* cielCoherent et non s.code brut. Le code temps est un mode entre modeles :
     il annoncait "ciel clair" a Belledonne quand le consensus de la meme page
     donnait 100 % de nuages. La correction existait pour la fiche du point et
     avait ete oubliee ici, c'est-a-dire dans le seul texte qui part a des tiers. */
  const cc = cielCoherent(s);
  let ciel = (cc!==null&&cc!==undefined)? (CIEL_COURT[cc]||'') : '';
  const m = k => (s[k] && s[k].m!==null && s[k].m!==undefined)? s[k].m : null;
  /* la couche basse est ce qui compte en montagne : brouillard sur les crêtes */
  if(s.nub&&s.nub.m>=65&&cc<=3) ciel='nuages bas';
  else if(s.nu&&s.nu.m<=25&&cc<=1) ciel='ciel degage';
  /* Air sature : le coureur est DANS le nuage. C'est ce qu'un proche comprend,
     et ce qui change la conduite - on ne cherche pas quelqu'un de la meme facon
     dans la purée. Voir airSature(). */
  if(airSature(m('nu'), m('t'), m('ros'), m('nub'), m('pr'))) ciel='dans la nuee';
  if(ciel) p.push(ciel);
  const prS = pluieAffichee(s);
  if(prS!==null && prS>=0.05) p.push('pluie '+prS.toFixed(1)+'mm');
  if(s.neige&&s.neige.m>=0.2) p.push('neige '+s.neige.m.toFixed(1)+'cm');
  if(s.v&&s.v.m!==null){
    let v='vent '+Math.round(s.v.m);
    if(s.raf&&s.raf.m!==null) v+=' raf '+Math.round(s.raf.m);
    p.push(v+'km/h');
  }
  if(s.t&&s.t.m!==null){
    let t=Math.round(s.t.m)+'\u00b0';
    if(s.res&&s.res.m!==null&&Math.abs(s.res.m-s.t.m)>=2) t+=' ressenti '+Math.round(s.res.m)+'\u00b0';
    p.push(t);
  }
  if(s.vis&&s.vis.m!==null&&s.vis.m<1200) p.push('visi '+(s.vis.m/1000).toFixed(1)+'km');
  /* inutile de répéter : si le ciel dit déjà « orage », on n'ajoute rien */
  /* Le code brut pouvait valoir 0 alors que le ciel derive dit deja orage : le
     SMS ajoutait donc "risque orage" a la suite du mot orage. On compare au meme
     ciel que celui qui est ecrit juste avant. */
  /* meme regle de maille que partout ailleurs */
  if((cc===null || cc<95) && s.capeAdmis!==null && s.capeAdmis!==undefined
     && s.capeAdmis>900) p.push('risque orage');
  return p.join(', ');
}

function hCourt(iso){
  const d=new Date(iso);
  return String(d.getHours()).padStart(2,'0')+'h'+String(d.getMinutes()).padStart(2,'0');
}

/* mode court : ravitos et points clés seulement, pour tenir en 2 SMS */
function pointsSMS(complet){
  const idx=segPois();
  if(complet) return idx;
  const CLEFS=['Croix de Belledonne','Col de Mor\u00e9tan','Col de la Vache','Sommet du Grand Chat',
               'Col de la Mine de Fer'];
  let gardes=idx.filter(i=>POIS[i].type==='Ravito'||CLEFS.indexOf(POIS[i].nom)>=0);
  if(gardes.length>=2){
    /* plus de 2h30 entre deux points : on intercale le sommet du trou */
    const sortie=[];
    for(let k=0;k<gardes.length;k++){
      sortie.push(gardes[k]);
      if(k===gardes.length-1) break;
      const a=gardes[k], b=gardes[k+1];
      const ecart=(new Date(POIS[b].t[SCENARIO])-new Date(POIS[a].t[SCENARIO]))/3.6e6;
      if(ecart>2.5){
        const entre=idx.filter(i=>i>a&&i<b);
        if(entre.length){
          const haut=entre.slice().sort((u,v)=>POIS[v].alt-POIS[u].alt)[0];
          sortie.push(haut);
        }
      }
    }
    return sortie;
  }
  /* segment sans deux ravitos : on garde le début, la fin et le point haut */
  const haut=idx.slice().sort((a,b)=>POIS[b].alt-POIS[a].alt)[0];
  return [...new Set([idx[0], haut, idx[idx.length-1]])].sort((a,b)=>a-b);
}

function texteSMS(complet){
  const idx=pointsSMS(complet);
  if(!idx.length) return '';
  const L=[];
  if(SEG){
    const s=SEGMENTS[SEG-1];
    L.push('S'+String(s.n).padStart(2,'0')+' '+abrege(s.de)+'-'+abrege(s.vers));
  } else {
    L.push('EB26 parcours complet');
  }
  let jourPrec=null;
  idx.forEach(i=>{
    const p=POIS[i], s=Object.keys(DATA).length? sonde(i):null;
    const d=new Date(p.t[SCENARIO]);
    const jr=['dim','lun','mar','mer','jeu','ven','sam'][d.getDay()];
    const marq = (jr!==jourPrec)? jr+' ' : '';
    jourPrec=jr;
    L.push(abrege(p.nom)+' '+marq+hCourt(p.t[SCENARIO])+' - '+descMeteo(s));
  });
  if(TS_DONNEES) L.push('(prev. '+new Date(TS_DONNEES).toLocaleString('fr-FR',
    {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+')');
  return L.join('\n');
}

function majSMS(){
  const el=q('#smszone'); if(!el) return;
  const complet = q('#smscomplet') && q('#smscomplet').getAttribute('aria-pressed')==='true';
  const txt=texteSMS(complet);
  const ta=q('#smstexte'); ta.value=txt;
  const n=txt.length, parts=n? Math.ceil(n/153) : 0;
  q('#smsinfo').textContent = n+' caract\u00e8res \u00b7 '+parts+' SMS'
    + (n>306? ' \u2014 pense au mode court' : '');
}

function copierSMS(){
  const txt=q('#smstexte').value;
  const fini=ok=>{ const b=q('#smscopie');
    b.textContent = ok? 'Copi\u00e9' : 'S\u00e9lectionne le texte';
    setTimeout(()=>{ b.textContent='Copier le SMS'; }, 2200); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>fini(true)).catch(()=>{
      try{ q('#smstexte').select(); document.execCommand('copy'); fini(true); }
      catch(e){ fini(false); }
    });
  } else {
    try{ q('#smstexte').select(); document.execCommand('copy'); fini(true); }
    catch(e){ fini(false); }
  }
}

/* ---------- export Markdown pour analyse ---------- */
/* Objectif : un seul fichier lisible par un modèle de langage, contenant
   toutes les valeurs brutes par modèle, plus l'historique des relevés
   pour qu'il puisse juger la dérive des prévisions d'un jour à l'autre. */

const COLS = [
  ['t','T °C',1],['res','Ress °C',1],['ros','Rosée °C',1],['hum','Hum %',0],
  ['nub','Nb %',0],['num','Nm %',0],['nuh','Nh %',0],['nu','Ntot %',0],
  ['sol','Soleil %',0],['pr','Pluie mm/h',2],['pp','P.pluie %',0],['neige','Neige cm',1],
  ['v','Vent km/h',0],['raf','Raf km/h',0],['dir','Dir °',0],
  ['vis','Visi m',0],['iso0','Iso0 m',0],['iso0calc','Iso0 calculé m',0],
  ['cape','CAPE',0],['li','LI',1],['uv','UV',1],['pres','P hPa',0],
  ['pr_moy','Pluie moyenne mm/h',2],['ressT','Ressenti terrain °C',1],['tw','T humide °C',1],['tpi','Position topo m',0],
  ['vterrain','Vent du lieu km/h',0],['speedup','Facteur relief',2],
  ['tlibre','T air libre °C',1],['vcrete','Vent crête km/h',0],['ecart_relief','Écart relief m',0]
];

function cel(e, cle, dec){
  if(!e) return '';
  let v = e[cle];
  if(cle==='sol' && v!==null && v!==undefined) v = v/36;   // secondes -> % de l'heure
  if(v===null||v===undefined) return '';
  return typeof v==='number'? v.toFixed(dec) : String(v);
}

function ligneMD(prefixe, e){
  return '| '+prefixe+' | '+COLS.map(c=>cel(e,c[0],c[2])).join(' | ')+' |';
}
function enteteMD(prefixe){
  return '| '+prefixe+' | '+COLS.map(c=>c[1]).join(' | ')+' |\n'
       + '|'+'---|'.repeat(prefixe.split('|').length+COLS.length);
}

const VENT_MOTS = [[3,'air calme'],[12,'vent faible'],[25,'vent modéré'],
                   [40,'vent soutenu'],[60,'vent fort'],[999,'vent violent']];
function motVent(v){ if(v===null||v===undefined) return ''; 
  for(const [s,m] of VENT_MOTS) if(v<s) return m; return ''; }

/* Le libelle doit decrire les chiffres affiches, sinon il les contredit.
   "Ciel clair" a ete affiche avec 85 % de nuages : s.code est une mediane de
   CODES de modeles, tandis que s.nu est une mediane de COUVERTURES, et rien ne
   les lie. Avec beaucoup de modeles la mediane des codes reste plausible ; avec
   deux elle tombe sur l un ou l autre arbitrairement.
   On derive donc le ciel des valeurs consensuelles elles-memes, via mbCode()
   qui fait deja exactement cette traduction. La contradiction devient
   impossible par construction. Repli sur s.code si les nuages manquent. */
/* ---- Puis-je percer la mer de nuages ? ----
   Une absence mesuree est une reponse, et elle doit etre ecrite : ne rien
   marquer se lit comme "on n'a pas regarde". On compte donc les heures passees
   au-dessus de la couche, et a defaut on dit POURQUOI il n'y en a aucune.

   Percer suppose trois choses simultanement : une couche basse qui existe, une
   crete au-dessus d'elle, et un etage moyen degage - sinon on emerge sous une
   autre couche et le soleil reste cache. Le motif d'echec distingue les deux cas
   qui n'appellent pas la meme conduite. */
function merDeNuages(nub, num, alt){
  let heures = 0, coucheBasse = 0, moyenCouvrant = 0, n = 0;
  for(let i=0;i<nub.length;i++){
    const b = nub[i], m = num[i], a = alt[i];
    if(b===null || b===undefined || a===null) continue;
    n++;
    const deck = b >= 50;
    if(deck) coucheBasse++;
    const degage = (m===null || m===undefined || m < 40);
    if(deck && !degage) moyenCouvrant++;
    /* sommet de couche basse : borne OMM de l'etage, ramenee a l'echelle */
    if(deck && degage && a > 2000) heures++;
  }
  if(!n) return ['au-dessus des nuages', '\u2014', '', ''];
  if(heures) return ['au-dessus des nuages', heures+' h',
                     'mer de nuages perc\u00e9e', 'var(--accord)'];
  if(!coucheBasse) return ['au-dessus des nuages', 'sans objet',
                           'pas de couche basse \u00e0 percer', ''];
  if(moyenCouvrant >= coucheBasse*0.8)
    return ['au-dessus des nuages', 'jamais',
            '\u00e9tage moyen couvrant sur '+moyenCouvrant+' h', ''];
  return ['au-dessus des nuages', 'jamais', 'cr\u00eate toujours sous la couche', ''];
}

let RESUME_EXPORT = null;

/* ---- Export image ----
   L'utilisateur veut exactement les deux zones qu'il regarde - le meteogramme et
   le bandeau - plus un titre datant les donnees. On reprend les SVG deja
   calcules par la page, ce qui garantit la fidelite, et on redessine le bandeau
   en SVG faute de pouvoir rasteriser un foreignObject de facon fiable. */
function svgExport(){
  const g = q('#gouttiere'), r = q('#ruban');
  if(!g || !r) return null;
  const W = +(r.getAttribute('width') || 0), H = +(r.getAttribute('height') || 0);
  const GG = +(g.getAttribute('width') || 0);
  if(!W || !H) return null;

  const TITRE = 34, ECART = 12;
  const nCase = RESUME_EXPORT? RESUME_EXPORT.cases.length : 0;
  const COLS = Math.min(4, Math.max(1, nCase));
  const RANGS = Math.ceil(nCase / COLS) || 0;
  const HC = nCase? (30 + RANGS*46) : 0;
  const LARG = GG + W, HAUTEUR = TITRE + H + (HC? ECART + HC : 0);

  const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const P = [];
  P.push('<svg xmlns="http://www.w3.org/2000/svg" width="'+LARG+'" height="'+HAUTEUR
    +'" viewBox="0 0 '+LARG+' '+HAUTEUR+'" font-family="ui-monospace,Menlo,Consolas,monospace">');
  P.push('<rect width="'+LARG+'" height="'+HAUTEUR+'" fill="'+PAL.fond+'"/>');

  /* le titre ne porte QUE la date des donnees, comme demande */
  const d = new Date(TS_DONNEES || Date.now());
  const deuxCh = n => String(n).padStart(2,'0');
  P.push('<text x="10" y="21" fill="'+PAL.texte+'" font-size="13" font-weight="700">'
    +esc('\u00c9chapp\u00e9e Belle 2026 \u00b7 donn\u00e9es du '
      +deuxCh(d.getDate())+'/'+deuxCh(d.getMonth()+1)+'/'+d.getFullYear()
      +' \u00e0 '+deuxCh(d.getHours())+'h'+deuxCh(d.getMinutes()))+'</text>');

  P.push('<g transform="translate(0,'+TITRE+')">'+g.innerHTML+'</g>');
  P.push('<g transform="translate('+GG+','+TITRE+')">'+r.innerHTML+'</g>');

  if(nCase){
    const y0 = TITRE + H + ECART, LC = LARG / COLS;
    P.push('<rect x="0" y="'+y0+'" width="'+LARG+'" height="'+HC+'" fill="'+PAL.fond
      +'" stroke="'+PAL.bord+'"/>');
    P.push('<text x="10" y="'+(y0+18)+'" fill="'+PAL.texte+'" font-size="12" font-weight="700">'
      +esc(RESUME_EXPORT.titre)+'</text>');
    P.push('<text x="10" y="'+(y0+32)+'" fill="'+PAL.texteFaible+'" font-size="9.5">'
      +esc(RESUME_EXPORT.sous)+'</text>');
    RESUME_EXPORT.cases.forEach(function(c, i){
      const cx = (i % COLS) * LC + 10, cy = y0 + 44 + Math.floor(i / COLS) * 46;
      P.push('<text x="'+cx+'" y="'+cy+'" fill="'+PAL.libelle+'" font-size="8.5">'
        +esc(String(c[0]).toUpperCase())+'</text>');
      P.push('<text x="'+cx+'" y="'+(cy+17)+'" fill="'+(c[3]? PAL.texte : PAL.texte)
        +'" font-size="14" font-weight="700">'+esc(c[1])+'</text>');
      if(c[2]) P.push('<text x="'+cx+'" y="'+(cy+30)+'" fill="'+PAL.texteFaible
        +'" font-size="8.5">'+esc(c[2])+'</text>');
    });
  }
  P.push('</svg>');
  return {svg: P.join(''), w: LARG, h: HAUTEUR, d: d};
}

/* ---- Export empile, un bandeau par modele ----
   On ne recompose rien a la main : on bascule MODELE_ACTIF, on rappelle
   dessine(), et on preleve le SVG que la page vient de produire. Chaque bandeau
   est donc exactement celui qu'on obtiendrait en selectionnant le modele dans la
   liste, texte de portee depassee compris - ce qui est precisement ce qu'on veut
   comparer d'un modele a l'autre. */
function svgPile(){
  const g0 = q('#gouttiere'), r0 = q('#ruban');
  if(!g0 || !r0) return null;
  const GG = +(g0.getAttribute('width') || 0);
  const H  = +(r0.getAttribute('height') || 0);
  if(!GG || !H) return null;

  /* meme ordre que la liste deroulante : poids decroissant, donc maille
     croissante depuis que la table suit la resolution */
  const ids = Object.keys(DATA).sort(function(a,b){
    const d = poidsBase(b) - poidsBase(a);
    return d || nomModele(a).localeCompare(nomModele(b), 'fr');
  });
  const vues = [''].concat(ids);          /* le multimodele ouvre la pile */

  const avant = MODELE_ACTIF;
  const TITRE = 26, HAUT_GLOBAL = 34;
  const parts = [];
  let larg = 0;
  try{
    vues.forEach(function(id){
      MODELE_ACTIF = id;
      dessine();
      const g = q('#gouttiere'), r = q('#ruban');
      const W = +(r.getAttribute('width') || 0);
      if(!W) return;
      larg = Math.max(larg, GG + W);
      let n = 0;
      if(id){
        const arr = (DATA[id].pts && DATA[id].pts[SCENARIO]) || [];
        arr.forEach(e => { if(e && e.t!==null && e.t!==undefined) n++; });
      }
      parts.push({id: id, gout: g.innerHTML, ruban: r.innerHTML, w: W, pts: n});
    });
  } finally {
    /* restauration systematique : une exception laisserait sinon la page bloquee
       sur un modele isole, ce qui serait pire que l'absence d'export */
    MODELE_ACTIF = avant;
    dessine();
  }
  if(!parts.length) return null;

  const p2 = v => String(v).padStart(2,'0');
  const quand = ms => { const d = new Date(ms);
    return p2(d.getDate())+'/'+p2(d.getMonth()+1)+' \u00e0 '+p2(d.getHours())+'h'+p2(d.getMinutes()); };
  const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const total = HAUT_GLOBAL + parts.length * (TITRE + H);
  const P = [];
  P.push('<svg xmlns="http://www.w3.org/2000/svg" width="'+larg+'" height="'+total
    +'" viewBox="0 0 '+larg+' '+total+'" font-family="ui-monospace,Menlo,Consolas,monospace">');
  P.push('<rect width="'+larg+'" height="'+total+'" fill="'+PAL.fond+'"/>');
  P.push('<text x="10" y="21" fill="'+PAL.texte+'" font-size="13" font-weight="700">'
    +esc('\u00c9chapp\u00e9e Belle 2026 \u00b7 un trac\u00e9 par mod\u00e8le \u00b7 '
        +'du plus r\u00e9solu au moins r\u00e9solu')+'</text>');

  let y = HAUT_GLOBAL;
  parts.forEach(function(p){
    const nom = p.id? nomModele(p.id) : 'Multimod\u00e8le';
    const ms  = p.id? (MAJ_MODELE[p.id] || TS_DONNEES) : TS_DONNEES;
    const cou = p.id? (p.pts + '/' + POIS.length + ' points') : '';
    const det = [ms? ('donn\u00e9es du '+quand(ms)) : '', cou].filter(Boolean).join(' \u00b7 ');
    P.push('<rect x="0" y="'+y+'" width="'+larg+'" height="'+TITRE+'" fill="'+PAL.panneauExport+'"/>');
    P.push('<text x="10" y="'+(y+17)+'" fill="'+PAL.texte
      +'" font-size="12" font-weight="700">'+esc(nom)+'</text>');
    if(det) P.push('<text x="'+(larg-10)+'" y="'+(y+17)+'" fill="'+PAL.texteFaible
      +'" font-size="10" text-anchor="end">'+esc(det)+'</text>');
    y += TITRE;
    P.push('<g transform="translate(0,'+y+')">'+p.gout+'</g>');
    P.push('<g transform="translate('+GG+','+y+')">'+p.ruban+'</g>');
    y += H;
  });
  P.push('</svg>');
  return {svg: P.join(''), w: larg, h: total, n: parts.length};
}
