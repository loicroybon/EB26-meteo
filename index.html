/* Un modèle retiré de la liste survit dans le cache du téléphone :
   il faut le purger explicitement, sinon il continue d'être affiché et compté. */
function modeleConnu(id){
  if(id===MB_ID) return true;
  if(MODELES.some(m=>m[0]===id)) return true;
  if(WY_MODELES.some(m=>('windy_'+m[0])===id)) return true;
  return false;
}
function purgerInconnus(){
  let n=0;
  Object.keys(DATA).forEach(function(id){
    if(!modeleConnu(id)){ delete DATA[id]; delete DATA_J[id]; n++; }
  });
  return n;
}

function modelesDisponibles(){
  purgerInconnus();
  return Object.keys(DATA).filter(id=>{
    for(let i=0;i<POIS.length;i++){ const e=extraitPoi(DATA[id], i);
      if(e&&e.t!==null&&e.t!==undefined) return true; }
    return false;
  });
}

function majSelecteurModele(){
  const sel=q('#modele'); if(!sel) return;
  const dispo=modelesDisponibles();
  /* si le modèle choisi a disparu, on retombe sur meteoblue puis sur le consensus */
  if(MODELE_ACTIF && dispo.indexOf(MODELE_ACTIF)<0){
    MODELE_ACTIF = (dispo.indexOf(MB_ID)>=0 && dispo.length===1)? MB_ID : '';
  }
  if(!dispo.length){ MODELE_ACTIF=''; }
  else if(dispo.length===1 && !MODELE_ACTIF){ /* un seul modèle : ce n'est pas un consensus */ }

  /* Tri par poids decroissant - donc par finesse de maille, depuis que la table
     des poids suit la resolution. A poids egal on departage par le NOM : sans
     cela l'ordre relatif suit celui d'arrivee des reponses reseau et change d'un
     relevé a l'autre, ce qui rend la liste immemorisable. Arbitraire mais
     stable, et c'est la seule qualite qui compte pour departager. */
  const nomDe = nomModele;
  const ordre=dispo.slice().sort(function(a,b){
    const d = poidsBase(b) - poidsBase(a);
    return d || nomDe(a).localeCompare(nomDe(b), 'fr');
  });
  /* le nombre de modèles flatte : ce qui compte, ce sont les sources indépendantes */
  const fam={}; dispo.forEach(function(id){
    const d=DOUBLON[id];
    if(!(d && dispo.indexOf(d.parent)>=0)) fam[famille(id)]=1;
  });
  const nSrc=Object.keys(fam).length;
  let h='<option value=""'+(MODELE_ACTIF===''?' selected':'')+'>'
       +(dispo.length>1? 'Multimodèle \u00b7 '+nSrc+' source'+(nSrc>1?'s':'') : 'Multimodèle')
       +'</option>';
  ordre.forEach(id=>{
    /* Couverture annoncee quand elle est partielle : sans cela on selectionne le
       modele et on decouvre un graphe a moitie vide, ce qui est arrive hier avec
       ARPEGE a 4 points sur 52. La portee de certaines mailles fines s'arrete au
       milieu de la course, et c'est une information, pas un defaut. */
    const arr = (DATA[id].pts && DATA[id].pts[SCENARIO]) || [];
    let n = 0;
    arr.forEach(e => { if(e && e.t!==null && e.t!==undefined) n++; });
    const part = (n && n < POIS.length)? ' \u00b7 '+n+'/'+POIS.length+' pts' : '';
    h+='<option value="'+id+'"'+(MODELE_ACTIF===id?' selected':'')+'>'
      +nomDe(id)+part+'</option>';
  });
  /* Les modeles hors de portee figurent dans la liste, desactives, avec leur
     date d'entree. Absents, on ne pouvait pas savoir qu'AROME arrive ni quand :
     un modele qu'on attend n'est pas un modele qui n'existe pas. */
  /* Les modeles a venir se DERIVENT de la table et de la date : c'est une
     soustraction entre la portee annoncee et le temps qui reste avant la course.
     Ils ne se memorisent pas. S'appuyer sur REPORTES, qui n'est rempli que
     pendant un relevé et remis a zero a chaque debut, faisait disparaitre tout
     le groupe sur une simple ouverture servie par le cache - exactement le
     defaut qui faisait disparaitre AROME. */
  const dep0 = new Date(POIS[0].t[SCENARIO]);
  const jours0 = (dep0 - Date.now()) / 864e5;
  const att = MODELES
    .filter(m => !DATA[m[0]] && m[2] < jours0)
    .map(m => [nomModele(m[0]), m[2], m[0]])
    .sort((a,b) => a[1]===b[1]? String(a[0]).localeCompare(String(b[0]),'fr') : b[1]-a[1]);
  if(att.length){
    h += '<optgroup label="\u00e0 venir">';
    att.forEach(function(r){
      const arr = new Date(dep0.getTime() - r[1]*864e5);
      const q = arr.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'});
      h += '<option value="" disabled>' + r[0] + ' \u00b7 vers le ' + q + '</option>';
    });
    h += '</optgroup>';
  }
  if(!dispo.length && !att.length) h='<option value="">Aucun modèle</option>';
  sel.innerHTML=h;
  majNoteFiabilite();
}

function majNoteFiabilite(){
  const el=q('#fiabilite'); if(!el) return;
  const r=q('#fiabresume');
  if(r){
    const n=modelesDisponibles().length;
    r.textContent = MODELE_ACTIF
      ? 'Modèle isolé : '+nomModele(MODELE_ACTIF)
        +' — aucune mesure d\'incertitude'
      : (n>1? 'Multimodèle : médiane pondérée de '+n+' modèles, familles plafonnées'
            : 'Un seul modèle disponible : ce n\'est pas un consensus');
  }
  const dispo=modelesDisponibles();
  let t = FIABILITE[MODELE_ACTIF] || 'Modèle sans note de fiabilité renseignée.';
  if(MODELE_ACTIF===''){
    if(dispo.length===1) t='Un seul modèle répond : ce n\'est pas un consensus, il n\'y a ni '
      +'écart ni confiance à en tirer. '+(FIABILITE[dispo[0]]||'');
    else if(!dispo.length) t='Aucun modèle en mémoire. Lance une actualisation.';
  } else {
    t = 'Modèle isolé — aucun écart inter-modèles, donc aucune mesure d\'incertitude. '+t;
  }
  el.textContent=t;
}

/* ---------- pipeline : quatre fournisseurs en parallèle ---------- */
let OM_PAUSE = 0;
async function attendreQuota(){}
function signalerQuota(){}

/* Les modeles ne changent de run que toutes les 3 a 6 h. Deux releves
   rapproches coutent deux fois le quota pour la meme donnee, et le quota
   gratuit Open-Meteo se compte en quelques releves par jour. */
/* Les mailles fines tournent aux heures UTC multiples de 3 et sont publi\u00e9es
   avec environ 3 h 30 de retard. Tant que le dernier relev\u00e9 contient d\u00e9j\u00e0 le
   dernier run publi\u00e9, un nouveau relev\u00e9 ret\u00e9l\u00e9chargerait la m\u00eame donn\u00e9e : il
   ne peut rien apporter, et le quota gratuit se compte en quelques relev\u00e9s
   par jour. On refuse alors, en annon\u00e7ant l'heure du prochain run. */
const RUN_H = 3;
const RUN_LAG_MS = 3.5*3600*1000;
const PLANCHER_MS = 5*60*1000;      /* contre le double appui accidentel */
function runPublie(maintenant){
  const d=new Date(maintenant-RUN_LAG_MS);
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(),
                  Math.floor(d.getUTCHours()/RUN_H)*RUN_H);
}
function prochainRun(maintenant){
  return runPublie(maintenant)+RUN_H*3600000+RUN_LAG_MS;
}
/* Combien de modeles devraient repondre a cette echeance : ceux dont la portee
   couvre le depart, moins les doublons stricts dont le parent est aussi la.
   C'est la meme regle que celle qui filtre la requete Open-Meteo. */
function modelesAttendus(){
  const j = (new Date(POIS[0].t[SCENARIO]) - Date.now())/864e5;
  const dedans = MODELES.filter(m=>m[2] >= j).map(m=>m[0]);
  const ens = new Set(dedans);
  return dedans.filter(function(id){
    const d = DOUBLON[id];
    return !(d && (!d.garde || !d.garde.length) && ens.has(d.parent));
  }).length;
}
async function interroger(force){
  if(EN_COURS) return;
  /* Avant de depenser le moindre quota : le releve partage est-il plus frais
     que ce qu'on affiche ? Si oui on l'applique gratuitement. C'est le cas
     courant sur un telephone qui revient sur la page. */
  if(!EN_COURS){
    const p = await partageLire();
    if(p && p.ts) TS_PARTAGE = p.ts;
    if(p && (p.ts||0) > (TS_DONNEES||0)){
      const avant = Object.keys(DATA).length;
      const f = fusionneCaches({ts:TS_DONNEES, scenario:SCENARIO, jalons:JALONS,
                                modeles:(await cacheLire()||{}).modeles || {}, ens:ENS}, p);
      if(f && f.modeles && Object.keys(f.modeles).length){
        appliqueCache(f); TS_DONNEES=f.ts; HORS_LIGNE=false;
        try{ await cacheEcrire(); }catch(e){}
        majSelecteurModele(); rendreTout();
        log('Relev\u00e9 partag\u00e9 plus frais appliqu\u00e9 : '
            +Object.keys(DATA).length+' mod\u00e8les (avant '+avant+') \u2014 '
            +'aucun quota consomm\u00e9.');
        if(!force) return;
      }
    }
  }
  if(!force && TS_DONNEES && !HORS_LIGNE){
    const age=Date.now()-TS_DONNEES;
    const dejaAJour = TS_DONNEES >= runPublie(Date.now());
    /* au-del\u00e0 de PERIME_H on autorise toujours : le rafra\u00eechissement
       automatique ne doit jamais \u00eatre bloqu\u00e9 */
    /* Un releve partiel ne doit pas geler la fenetre : si des modeles a portee
       manquent encore, on autorise une reprise. Bornee pour ne pas boucler sur
       un modele durablement muet : au moins deux manquants, et 20 min depuis la
       derniere tentative, donc trois reprises par heure au pire. */
    const manque = Math.max(0, modelesAttendus() - Object.keys(DATA).length);
    const repriseUtile = manque >= 2 && (Date.now() - TS_TENTATIVE) > 20*60*1000;
    if(repriseUtile){
      log(manque+' mod\u00e8le'+(manque>1?'s':'')+' \u00e0 port\u00e9e manque'+(manque>1?'nt':'')
          +' encore : nouvelle tentative.');
    }
    else if((dejaAJour && age < PERIME_H*3600000) || age < PLANCHER_MS){
      const min=Math.round(age/60000);
      const hh=new Date(prochainRun(Date.now()));
      log('Donn\u00e9es d\u2019il y a '+min+' min, conserv\u00e9es : elles contiennent d\u00e9j\u00e0 '
        + 'le dernier run publi\u00e9. Prochain run vers '
        + hh.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})
        + '. Le bouton force un relevé immédiat.');
      rendreTout(); return;
    }
  }
  const debut=Date.now();
  EN_COURS=true; majEtat(); q('#go').disabled=true;
  const anciens={D:DATA, J:DATA_J, ts:TS_DONNEES};
  /* on repart de ce qui est déjà à l'écran : chaque fournisseur remplace ses
     propres modèles au fur et à mesure, rien ne disparaît entre-temps */
  const nD=Object.assign({}, DATA), nJ=Object.assign({}, DATA_J);
  const rafraichis={};
  TS_TENTATIVE=Date.now();
  ECHECS=[]; REPORTES=[]; WY_APPELS=0; N429=0; WY_TEST=null;
  /* nouveau releve : on redonne sa chance a la premiere cle, les credits
     meteoblue se rechargeant au fil du temps */
  MB_ABANDON=false; CLE_RANG['meteoblue']=0;
  Object.keys(CLE_KO).forEach(k=>delete CLE_KO[k]);
  JALONS = construireJalons();
  const jours = (new Date(POIS[0].t[SCENARIO]) - Date.now())/864e5;
  const dispo=[];
  let rendus=0;

  /* On delegue a rendreTout() : il couvre exactement les memes blocs, plus
     heuresRender, heroRender et estimerGradient qui manquaient ici, et il
     isole chaque bloc dans son propre try comme la v26 l'a etabli. Le
     try/catch unique d'avant faisait qu'un seul bloc en echec emportait tous
     les suivants. */
  const rendre=()=>{ try{ afficheDispo(dispo); }catch(e){} rendreTout(); };
  const livrer=(etiquette, ids)=>{
    const maintenant=Date.now();
    /* On n'horodate que les modeles qui ont VRAIMENT livre des points ce tour-ci.
       nD[id] n'est renseigne que dans ce cas. Marquer comme frais un modele dont
       la requete n'a rien ramene lui laissait une prevision ancienne avec un
       horodatage neuf : l'affichage mentait, et surtout la decote d'age du
       consensus se trouvait annulee, le modele retrouvant tout son poids. */
    (ids||[]).forEach(id=>{
      if(!nD[id]) return;
      rafraichis[id]=1; MAJ_MODELE[id]=maintenant;
    });
    if(!Object.keys(nD).length) return;
    DATA=Object.assign({}, nD); DATA_J=Object.assign({}, nJ);
    if(Object.keys(rafraichis).length){ TS_DONNEES=Date.now(); HORS_LIGNE=false; rendus++; }
    log(etiquette+' \u00b7 '+Object.keys(rafraichis).length+' mod\u00e8le'
        +(Object.keys(rafraichis).length>1?'s':'')+' rafra\u00eechi'
        +(Object.keys(rafraichis).length>1?'s':'')+' sur '+Object.keys(nD).length
        +' affich\u00e9s ('+((Date.now()-debut)/1000).toFixed(0)+' s)');
    rendre();
  };

  /* ---- Open-Meteo : un seul appel pour tous les modèles à portée ---- */
  const tacheOM = (async()=>{
    const utiles=[];
    for(const [id,nom,portee] of MODELES){
      if(id===MB_ID || id===MN_ID || id===AR_ID) continue;
      if(portee < jours){ REPORTES.push([nom, portee, id]); continue; }
      utiles.push([id,nom]);
    }
    /* Un doublon strict n'a rien de propre a garder : des que son parent
       repond, ses valeurs sont ecartees du consensus. Le telecharger coute
       52 points x 27 variables pour rien. On ne le demande donc pas.
       Cas permanent : metno_seamless, parent ecmwf_ifs025 (portee 15 j). */
    const demandes = new Set(utiles.map(u=>u[0]));
    const ecartes = [];
    const retenus = utiles.filter(function([id,nom]){
      const d = DOUBLON[id];
      if(d && (!d.garde || !d.garde.length) && demandes.has(d.parent)){
        ecartes.push(nom); return false;
      }
      return true;
    });
    if(ecartes.length){
      utiles.length=0; retenus.forEach(u=>utiles.push(u));
      log('Doublons non interrog\u00e9s (leur source r\u00e9pond d\u00e9j\u00e0) : '+ecartes.join(', '));
    }
    if(!utiles.length) return;
    log('Open-Meteo : '+utiles.length+' mod\u00e8les en un appel group\u00e9\u2026');
    const ids=utiles.map(u=>u[0]);
    let repP=null;
    try{ repP = await lotOpenMeteo(ids, POIS, VARS); }
    catch(e){ ECHECS.push('Open-Meteo group\u00e9 — '+e.message); }
    /* repli : si l'appel groupé échoue, on repart modèle par modèle */
    if(!repP || !repP.filter(Boolean).length){
      log('Appel group\u00e9 sans r\u00e9ponse, repli mod\u00e8le par mod\u00e8le\u2026');
      for(const [id,nom] of utiles){
        try{
          const r = await lotOpenMeteo([id], POIS, VARS);
          const d={nom, reps:r, suffixe:''};
          const c=POIS.filter((p,i)=>{const e=extraitPoi(d,i); return e&&e.t!==null;}).length;
          if(c>0){ nD[id]=d; nJ[id]=d; }
          dispo.push([nom, c, POIS.length]);
        }catch(e){ ECHECS.push(nom+' — '+e.message); }
      }
      livrer('Open-Meteo', utiles.map(u=>u[0]));
      return;
    }
    utiles.forEach(([id,nom])=>{
      const d={nom, reps:repP, suffixe:'_'+id};
      const c=POIS.filter((p,i)=>{ const e=extraitPoi(d,i); return e&&e.t!==null&&e.t!==undefined; }).length;
      if(c>0){ nD[id]=d; nJ[id]=d; }
      dispo.push([nom, c, POIS.length]);
    });
    livrer('Open-Meteo', utiles.map(u=>u[0]));
  })();

  /* ---- meteoblue : points seulement, jalons dérivés de la même série ---- */
  const tacheMB = (async()=>{
    try{
      const raw = await meteoblueBrut(POIS, (f,n)=>{ if(f%16===0) log('meteoblue '+f+'/'+n); });
      const pts = POIS.map((p,i)=> raw[i]? mbExtrait(raw[i], p.t[SCENARIO], p) : null);
      const c = pts.filter(e=>e&&e.t!==null&&e.t!==undefined).length;
      if(c>0){
        const d={nom:MB_NOM, pts:{[SCENARIO]:pts},
                 serie:(i,iso)=> raw[i]? mbExtrait(raw[i], iso, POIS[i]) : null};
        nD[MB_ID]=d; nJ[MB_ID]=d;
        livrer('meteoblue', [MB_ID]);
      }
      dispo.push([MB_NOM, c, POIS.length]);
    }catch(e){ ECHECS.push(MB_NOM+' — '+e.message); }
  })();

  /* ---- AROME 1,3 km : asset committe, aucun quota ---- */
  const tacheAR = (async()=>{
    try{
      const c = await aromeAppliquer(nD, nJ);
      if(c>0){
        livrer('AROME direct', [AR_ID]);
        log('AROME 1,3 km : '+c+' points \u2014 asset commit\u00e9, aucun quota.');
      }
      dispo.push([AR_NOM, c, POIS.length]);
    }catch(e){ ECHECS.push(AR_NOM+' \u2014 '+e.message); }
  })();

  /* ---- MET Norway : libre et sans quota, donc toujours interroge ---- */
  const tacheMN = (async()=>{
    try{
      const raw = await mnBrut(POIS, (f,n)=>{ if(f%16===0) log('met.no '+f+'/'+n); });
      const pts = POIS.map((p,i)=> raw[i]? mnExtrait(raw[i], p.t[SCENARIO], p) : null);
      const c = pts.filter(e=>e&&e.t!==null&&e.t!==undefined).length;
      if(c>0){
        const d={nom:MN_NOM, pts:{[SCENARIO]:pts},
                 serie:(i,iso)=> raw[i]? mnExtrait(raw[i], iso, POIS[i]) : null};
        nD[MN_ID]=d; nJ[MN_ID]=d;
        livrer('met.no', [MN_ID]);
      }
      dispo.push([MN_NOM, c, POIS.length]);
    }catch(e){ ECHECS.push(MN_NOM+' \u2014 '+e.message); }
  })();

  /* ---- Windy : modèles à portée, en parallèle entre eux ---- */
  const tacheWY = (async()=>{
    const utiles=WY_MODELES.filter(m=>{
      if(m[2] < jours){ REPORTES.push([m[1], m[2], 'windy_'+m[0]]); return false; }
      return true; });
    await Promise.all(utiles.map(async function([mid,mnom]){
      try{
        const s=await windySerie(POIS, p=>p.t[SCENARIO], mid, null);
        const c=s.filter(e=>e&&e.t!==null).length;
        if(c>0){
          const enr=s.map((e,i)=>e? enrichir(e,POIS[i].alt,null,POIS[i]):null);
          nD['windy_'+mid]={nom:mnom, pts:{[SCENARIO]:enr}};
          livrer('Windy '+mnom, ['windy_'+mid]);
        }
        dispo.push([mnom, c, POIS.length, 'windy']);
      }catch(e){ ECHECS.push(mnom+' — '+e.message); }
    }));
  })();

  /* ---- sonde des identifiants hors de portée, notamment les suisses ---- */
  const tacheSONDE = (async()=>{
    /* Apres le releve principal : Open-Meteo compte PAR MINUTE, et une sonde de
       portee ne vaut pas de faire tomber les modeles que l'on affiche. */
    try{ await tacheOM; }catch(e){}
    const dehors = MODELES.filter(m=>m[0]!==MB_ID && m[0]!==MN_ID && m[0]!==AR_ID && m[2] < jours).map(m=>m[0]);
    try{ await sonderIdentifiants(dehors); }catch(e){}
  })();

  /* ---- ensembles ---- */
  const tacheENS = (async()=>{
    /* Apres le releve principal, et pour la meme raison. Un ensemble porte des
       dizaines de membres par point : c'est de loin l'appel le plus lourd, et le
       laisser partir en meme temps que le releve faisait perdre les deux. */
    try{ await tacheOM; }catch(e){}
    try{
      const e=await ensembles(POIS, p=>p.t[SCENARIO]);
      if(Object.keys(e).length){ ENS=e;
        log('Ensembles : '+Object.keys(e).length+' points'); rendre(); }
    }catch(e){}
  })();

  await Promise.all([tacheOM, tacheMB, tacheMN, tacheAR, tacheWY, tacheENS, tacheSONDE]);

  /* un modèle sorti de portée ne doit pas survivre indéfiniment dans l'affichage */
  REPORTES.forEach(r=>{ const id=r[2]; if(id&&!rafraichis[id]){ delete nD[id]; delete nJ[id]; } });
  if(Object.keys(rafraichis).length){ DATA=Object.assign({}, nD); DATA_J=Object.assign({}, nJ); }

  q('#go').disabled=false; EN_COURS=false;
  if(!Object.keys(DATA).length || !rendus){
    if(!Object.keys(DATA).length){ DATA=anciens.D; DATA_J=anciens.J; }
    TS_DONNEES=anciens.ts; HORS_LIGNE=true;
    majSelecteurModele(); majEtat(); rendre();
    log('Aucun mod\u00e8le joignable. Les donn\u00e9es pr\u00e9c\u00e9dentes restent affich\u00e9es.'
        + (N429? ' Quota des fournisseurs \u00e9puis\u00e9 ('+N429+' refus) \u2014 '
                 +'r\u00e9essaie dans une heure, ce n\u00b4est pas une absence de pr\u00e9vision.' : '')
        + (WY_TEST? ' Windy r\u00e9pond en mode test, ses donn\u00e9es sont \u00e9cart\u00e9es.' : '')
        + (ECHECS.length? ' D\u00e9tail : '+ECHECS.join(' | ') : ''));
    afficheDispo(dispo); return;
  }
  if(WY_TEST) ECHECS.push('Windy \u00e9cart\u00e9 \u2014 cl\u00e9 de test, donn\u00e9es m\u00e9lang\u00e9es par le fournisseur');
  const n=Object.keys(DATA).length, nEns=Object.keys(ENS).length;
  log(n+' mod\u00e8le'+(n>1?'s':'')+' en '+((Date.now()-debut)/1000).toFixed(0)+' s le '
      + new Date().toLocaleString('fr-FR')
      + (nEns? ' \u00b7 ensembles sur '+nEns+' points' : '')
      + (WY_APPELS? ' \u00b7 Windy '+WY_APPELS+' requ\u00eates' : '')
      + (REPORTES.length? ' \u00b7 trop loin : '+REPORTES.map(r=>r[0]).join(', ') : '')
      + (ECHECS.length? ' \u00b7 en \u00e9chec : '+ECHECS.map(x=>x.split(' — ')[0]).join(', ') : ''));
  rendre();
  await cacheEcrire();
  await archive();
}

function afficheDispo(d){
  const ul=q('#dispo'); ul.innerHTML='';
  const dep=new Date(POIS[0].t[SCENARIO]);
  d.sort((a,b)=>b[1]-a[1]).forEach(([nom,c,n,fourn])=>{
    const li=document.createElement('li');
    /* Trois etats et non deux. Imputer a l'echeance ce qui tient a la cle
       oriente vers la mauvaise action : on attend, alors qu'il faut regenerer
       la cle. Verifie en direct le 18/08, les trois cles Windy repondent
       HTTP 400 "Invalid API key" - elles ne sont pas limitees, elles sont
       mortes. */
    const refus = (c===0 && fourn && CLE_KO[fourn]) ? CLE_KO[fourn] : null;
    const txt = refus? ('cl\u00e9 refus\u00e9e \u2014 ' + refus)
              : (c===0? 'répond, mais aucune valeur à cette échéance'
              : (c===n? 'valeurs sur tout le parcours' : 'valeurs sur '+c+' points sur '+n));
    li.innerHTML='<span>'+nom+'</span><span class="'+(c?'ok':'ko')+'">'+txt+'</span>';
    ul.appendChild(li);
  });
  REPORTES.forEach(([nom,portee,id])=>{
    const arr=new Date(dep.getTime()-portee*864e5);
    const s=id? SONDE_IDS[id] : null;
    const li=document.createElement('li');
    const verdict = s? (s.ok? ' \u00b7 identifiant v\u00e9rifi\u00e9' : ' \u00b7 identifiant refus\u00e9') : '';
    li.innerHTML='<span>'+nom+'</span><span class="'+(s&&s.ok?'ok':'ko')+'">à partir du '
      +arr.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})+verdict+'</span>';
    ul.appendChild(li);
  });
  ECHECS.forEach(e=>{ const li=document.createElement('li');
    li.innerHTML='<span>'+e.split(' — ')[0]+'</span><span class="ko">échec de la requête</span>'; ul.appendChild(li); });
  if(!ul.children.length) ul.innerHTML='<li><span class="ko">Aucun modèle interrogé.</span></li>';
}

/* ---------- agrégation ---------- */
function agrege(out){
  /* une ligne sans température est une ligne vide : le modèle n'atteint pas l'échéance */
  out = out.filter(o=>o.t!==null&&o.t!==undefined);
  if(!out.length) return null;

  const presents={}; out.forEach(o=>presents[o.id]=1);
  out.forEach(function(o){
    const d=DOUBLON[o.id];
    o.doublon = (d && presents[d.parent])? (d.garde||[]) : null;
    /* L'API Windy renvoie la valeur à l'altitude de la maille du modèle,
       sans descente d'échelle. Au Lac du Cos, 2195 m, elle donne 18,8 °C
       quand le même ICON-EU corrigé en donne 8,9. Windy ne vote donc que
       sur les deux variables qu'il est seul à fournir. */
    /* Windy est désormais corrigé en altitude : il peut de nouveau voter,
       sauf s'il double une source déjà présente. Seule ALADIN est unique. */
    if(o.id && o.id.indexOf('windy_')===0 && !o.corrige_alt) o.doublon=['pr_conv'];
  });
  const ids=out.filter(o=>!o.doublon||o.doublon.length).map(o=>o.id);
  const wFam=poidsFamille(out.map(o=>o.id));
  out.forEach(o=>{ const base=wFam[o.id]!==undefined? wFam[o.id] : 0.5;
    o.couverture=facteurCouverture(o.id);
    o.fraicheur=facteurFraicheur(o.id);
    o.poids=base*o.couverture*o.fraicheur; o.divergent=false; });
  plafonnerPart(out);

  const CLES=['t','res','ressT','ros','hum','tw','pr','pr_moy','pr_conv','pp','neige','nu','nub','num','nuh',
    'sol','ray','uv','vis','cbase','v','vterrain','raf','dir','iso0','cape','pres',
    'tlibre','vcrete','iso0calc','li','tpi','speedup'];

  const S={};
  CLES.forEach(function(k){
    const vals=out.map(function(o){
      if(o.doublon && o.doublon.indexOf(k)<0) return null;   // doublon : muet sur cette variable
      return (o[k]===null||o[k]===undefined)? null : o[k];
    });
    const w0=out.map(o=>o.poids);
    const bruts=vals.filter(v=>v!==null);
    if(!bruts.length){ S[k]=null; return; }
    const m0=medPond(vals.map((v,i)=>[v,w0[i]]));
    /* les rafales n'ont pas la même définition d'un modèle à l'autre :
       on ne pénalise pas la divergence dessus, on la montre */
    const pen = (k==='raf')? w0.map(()=>1) : penaliteDivergence(vals, w0, m0);
    const w1=w0.map((w,i)=>w*pen[i]);
    if(k==='t') out.forEach((o,i)=>{ if(pen[i]<0.7) o.divergent=true; });
    const m=medPond(vals.map((v,i)=>[v,w1[i]]));
    const tri=bruts.slice().sort((a,b)=>a-b);
    /* Extremes CORROBORES : la valeur la plus extreme qu'au moins deux modeles
       atteignent, soit la deuxieme la plus extreme. Un maximum sur echantillon
       croit mecaniquement avec le nombre de modeles - en passant de sept a treize
       la page s'alarmait davantage sans que la meteo change ; un extremum
       corrobore, non. Les verdicts se prononcent sur ceux-la, l'enveloppe brute
       reste exposee pour dire le desaccord. */
    S[k]={ m:m, lo:tri[0], hi:tri[tri.length-1],
           loC: tri.length>1? tri[1] : tri[0],
           hiC: tri.length>1? tri[tri.length-2] : tri[tri.length-1],
           n:bruts.length,
           brut: tri[Math.floor(tri.length/2)] };
  });

  /* Pour la pluie, la médiane pondérée sous-estime : la variable est
     asymétrique et pleine de zéros. On expose aussi la moyenne pondérée,
     qui est la bonne statistique pour un cumul attendu. */
  (function(){
    let sw=0, sv=0, n=0;
    out.forEach(function(o){
      if(o.doublon) return;
      if(o.pr===null||o.pr===undefined) return;
      sw+=o.poids; sv+=o.poids*o.pr; n++;
    });
    S.pr_moy = n? {m:Math.round(sv/sw*100)/100, lo:null, hi:null, n:n} : null;
  })();

  /* Un code convectif ne compte que depuis une maille admissible. On refuse le
     vote ICI, en amont, parce que c'est le seul endroit ou la ligne porte encore
     son identifiant : cielCoherent, qui leve le drapeau d'orage, recoit une
     sonde deja agregee et ne peut plus savoir d'ou vient le code. Le modele
     ecarte continue de voter pleinement sur sa pluie, ses nuages et sa neige,
     qui sont ce que cielCoherent recombine - on ne perd rien, on refuse une
     seule affirmation. Voir finPourOrage() et la v122. */
  const codes=out.filter(o=>!o.doublon).map(o=>[o.code, o.poids, o.id])
    .filter(c=>c[0]!==null&&c[0]!==undefined)
    .filter(c=>c[0]<95 || finPourOrage(c[2]));
  if(codes.length){
    const score={};
    codes.forEach(c=>{ score[c[0]]=(score[c[0]]||0)+c[1]; });
    S.code = +Object.keys(score).sort((a,b)=>score[b]-score[a]||b-a)[0];
  } else S.code=null;

  /* La CAPE des seules mailles admissibles, pour les consommateurs qui en tirent
     une affirmation convective. Meme statistique que S.cape - mediane ponderee
     et non maximum - pour ne pas durcir le signal en le corrigeant. */
  (function(){
    const v = out.filter(o=>!o.doublon && finPourOrage(o.id)
                            && o.cape!==null && o.cape!==undefined)
                 .map(o=>[o.cape, o.poids]);
    S.capeAdmis = v.length? medPond(v) : null;
  })();

  /* confiance : nombre de familles indépendantes présentes, et resserrement en T */
  const familles={}; out.filter(o=>!o.doublon).forEach(o=>familles[famille(o.id)]=1);
  const nFam=Object.keys(familles).length;
  S.independants=nFam; S.doublons=out.filter(o=>o.doublon).length;
  const etendue = S.t? (S.t.hi-S.t.lo) : 99;
  let conf = 'faible';
  if(nFam>=3 && etendue<=3) conf='bonne';
  else if(nFam>=2 && etendue<=5) conf='moyenne';
  S.confiance={niveau:conf, familles:nFam, etendue:Math.round(etendue*10)/10,
               poidsTotal:Math.round(out.reduce((a,o)=>a+o.poids,0)*100)/100};
  return {lignes:out, ...S};
}
function sonde(i, filtre){
  const out=[];
  for(const id in DATA){
    if(MODELE_ACTIF && id!==MODELE_ACTIF) continue;
    if(filtre && !filtre(id)) continue;
    const e=extraitPoi(DATA[id], i); if(e) out.push({id, nom:nomModele(id), ...e}); }
  const a=agrege(out); return a? {p:POIS[i], ...a} : null;
}
/* les jalons ne sont plus téléchargés : on les dérive des séries déjà en main,
   en interpolant entre les deux points du parcours qui les encadrent */
function encadrants(km){
  let a=0;
  for(let i=0;i<POIS.length-1;i++){ if(km>=POIS[i].km&&km<=POIS[i+1].km){ a=i; break; }
                                    if(km>POIS[i].km) a=i; }
  const b=Math.min(POIS.length-1, a+1);
  const f=(POIS[b].km>POIS[a].km)? (km-POIS[a].km)/(POIS[b].km-POIS[a].km) : 0;
  return [a,b,Math.max(0,Math.min(1,f))];
}
function extraitJalonD(d, k){
  if(!d||!JALONS[k]) return null;
  if(d.jal) return d.jal[k]||null;
  const J=JALONS[k], [a,b,f]=encadrants(J.km);
  const lire=i=>{
    if(d.serie) return d.serie(i, J.t);
    if(d.pts) return (d.pts[SCENARIO]||{})[i] || null;
    if(!d.reps) return null;
    return extraitSuffixe(d.reps[i], J.t, d.suffixe||'');
  };
  const ea=lire(a), eb=lire(b);
  if(!ea&&!eb) return null;
  if(!ea) return enrichir(Object.assign({},eb), J.alt, null, J);
  if(!eb||a===b) return enrichir(Object.assign({},ea), J.alt, null, J);
  const m={};
  Object.keys(ea).forEach(cle=>{
    const x=ea[cle], y=eb[cle];
    if(typeof x==='number'&&typeof y==='number') m[cle]=x+(y-x)*f;
    else m[cle]=(f<0.5? x : y);
  });
  return enrichir(m, J.alt, null, J);
}
function sondeJalon(k, filtre){
  if(!JALONS[k]) return null;
  const out=[];
  for(const id in DATA_J){
    if(MODELE_ACTIF && id!==MODELE_ACTIF) continue;
    if(filtre && !filtre(id)) continue;
    const e=extraitJalonD(DATA_J[id], k);
    if(e) out.push({id, nom:nomModele(id), ...e}); }
  return agrege(out);
}

/* ================= METEOBLUE ================= */
/* Intérêt propre : meteoblue applique un MOS, une correction statistique calée
   sur la topographie réelle. C'est la seule source du lot qui ne se contente pas
   d'interpoler une maille — donc une information indépendante en montagne.
   Contrepartie : pas de niveaux de pression, donc ni air libre ni vent de crête. */
/* Les cles viennent de config.js quand il est charge, ce qui permet au
   runner GitHub Actions de les surcharger par variable d'environnement.
   Le repli garde index.html utilisable seul, sans aucun fichier a cote. */
const CLES_CFG = (typeof globalThis !== 'undefined' && globalThis.EB26_CONFIG) || null;
const CLE_RANG = {};      /* rang de la cle en service, par fournisseur */
const CLE_REPLI = {meteoblue:'QTysmp2OSKP7ba3j',
                   windy:'LMtKS6ka4dr1ta1qijmvXBFLUorC6aar'};
function clesDe(fournisseur){
  const l = CLES_CFG && CLES_CFG[fournisseur];
  if(l && l.length) return l;
  const r = CLE_REPLI[fournisseur];
  return r? [r] : [];
}
function cleDe(fournisseur){
  const l = clesDe(fournisseur);
  if(!l.length) return null;
  return l[Math.min(CLE_RANG[fournisseur]||0, l.length-1)];
}
/* Trois issues distinctes, et les confondre coutait cher.

     'credits' : la cle n'a plus de credits. Sa contribution est terminee pour la
                 session ; la roue de secours prend le relais. Mesure en direct :
                 429 + "Available credits exceeded for this API key".
     'cle'     : la cle est refusee en tant que telle - 401, cle invalide. Meme
                 traitement, mais le motif journalise differe.
     'paquet'  : ce PAQUET n'est pas ouvert a cette cle - 403 sur un package.
                 Mesure en direct : la cle 2 rend 403 sur basic-1h_clouds-1h et
                 200 sur basic-1h. La cle est bonne, il ne faut surtout pas la
                 mettre au rebut : on retient le couple cle-paquet.
     null      : rien qui concerne la cle. */
function diagnosticCle(statut, corps, paquet){
  const t = String(corps||'').toLowerCase();
  if(/available credits|credits? exceeded|out of credits|credit limit/.test(t)) return 'credits';
  if(statut===429 && /credit/.test(t)) return 'credits';
  if(statut===403 && paquet) return 'paquet';
  if(statut===401) return 'cle';
  if(/invalid[ _-]?api[ _-]?key|invalid[ _-]?key|unauthoriz|not authorized/.test(t)) return 'cle';
  if(statut===403) return 'cle';
  return null;
}
/* Conserve pour Windy, qui n'a pas de notion de paquet. */
function cleRefusee(statut, corps){
  const d = diagnosticCle(statut, corps, null);
  return d==='cle' || d==='credits';
}

/* Couples cle-paquet dont on sait qu'ils ne repondront pas : inutile de les
   redemander aux 51 points suivants. */
const PAQUET_KO = {};
/* Fournisseurs dont la cle a ete refusee pendant ce releve. Sert a distinguer
   "aucune valeur a cette echeance" de "cle refusee" dans la liste des modeles :
   un diagnostic faux oriente vers la mauvaise action. */
const CLE_KO = {};
function paquetKO(cle, paquet){ return PAQUET_KO[cle+'|'+paquet]===true; }
function marquerPaquetKO(cle, paquet){ PAQUET_KO[cle+'|'+paquet] = true; }
/* Passe a la cle suivante. Rend faux s'il n'y a plus de roue de secours. */
function cleSuivante(fournisseur, motif){
  CLE_KO[fournisseur] = motif || 'refus';
  const l = clesDe(fournisseur);
  const suivant = (CLE_RANG[fournisseur]||0) + 1;
  if(suivant >= l.length) return false;
  CLE_RANG[fournisseur] = suivant;
  log('Cl\u00e9 ' + fournisseur + ' refus\u00e9e (' + motif + ') : bascule sur la cl\u00e9 '
      + (suivant+1) + ' sur ' + l.length + '.');
  return true;
}
/* Vrai quand toutes les cles meteoblue sont hors service : evite de rejouer
   l'echec aux 51 points suivants. Remis a zero au debut de chaque releve. */
let MB_ABANDON = false;
const MB_ID  = 'meteoblue';
const MB_NOM = 'meteoblue MOS';

function mbCode(pr, nu, neige, orage){
  if(orage) return 95;
  if(neige>0.05) return pr>1? 75 : 71;
  if(pr>=2) return 65;
  if(pr>=0.5) return 63;
  if(pr>=0.1) return 61;
  if(nu>=85) return 3;
  if(nu>=50) return 2;
  if(nu>=20) return 1;
  return 0;
}
function rosee(t, hr){
  if(t===null||hr===null||hr<=0) return null;
  const a=17.27, b=237.7;
  const g=Math.log(hr/100)+a*t/(b+t);
  return Math.round((b*g/(a-g))*10)/10;
}

async function meteoblueBrut1(p){
  if(MB_ABANDON) return null;          /* plus une seule cle en etat : on arrete */
  const base='https://my.meteoblue.com/packages/';
  const PAQUETS = ['basic-1h_clouds-1h_wind-1h','basic-1h_clouds-1h','basic-1h'];
  const requete = () => {
    const q=new URLSearchParams();
    q.set('apikey', cleDe('meteoblue'));
    q.set('lat', p.lat); q.set('lon', p.lon); q.set('asl', p.alt);
    q.set('format','json'); q.set('tz','Europe/Paris');
    q.set('temperature','C'); q.set('windspeed','kmh'); q.set('precipitationamount','mm');
    q.set('history_days','0');
    return q;
  };
  let j=null, q=requete();
  /* On retente le point ENTIER avec chaque roue de secours : une cle a court de
     credits ne repondra plus, quel que soit le paquet demande. */
  for(let tour=0; tour<Math.max(1, clesDe('meteoblue').length); tour++){
    const cle = cleDe('meteoblue');
    q = requete();
    let bascule = null;
    for(const paquets of PAQUETS){
      if(paquetKO(cle, paquets)) continue;
      const r = await appel(ORD_MB, base+paquets+'?'+q.toString(), null, true);
      if(!r) continue;
      let corps=null, o=null;
      if(!r.ok){
        try{ corps = await r.text(); }catch(e){}
        const dg = diagnosticCle(r.status, corps, paquets);
        if(dg==='paquet'){ marquerPaquetKO(cle, paquets); continue; }
        if(dg){ bascule = dg; break; }
        continue;
      }
      try{ o = await r.json(); }catch(e){ continue; }
      if(o && o.data_1h){ j=o; break; }
      /* meteoblue rend parfois 200 avec un objet d'erreur */
      const dg2 = diagnosticCle(r.status, o && (o.error_message||o.error), paquets);
      if(dg2==='paquet'){ marquerPaquetKO(cle, paquets); continue; }
      if(dg2){ bascule = dg2; break; }
    }
    if(j) break;
    if(!bascule) break;                /* echec non imputable a la cle */
    if(!cleSuivante('meteoblue', bascule)){
      /* Plus de roue de secours : inutile de refaire l'essai aux 51 points
         suivants, on le dit une fois et on arrete pour cette session. */
      MB_ABANDON = true;
      log('meteoblue : plus aucune cl\u00e9 disponible (' + bascule + ').');
      break;
    }
  }
  if(!j) return null;
  if(!j.data_1h.totalcloudcover){
    const r2=await appel(ORD_MB, base+'clouds-1h?'+q.toString(), null, true);
    if(r2&&r2.ok){ try{ const o2=await r2.json();
      if(o2&&o2.data_1h) Object.keys(o2.data_1h).forEach(k=>{
        if(k!=='time'&&!j.data_1h[k]) j.data_1h[k]=o2.data_1h[k]; }); }catch(e){} }
    else if(r2 && !r2.ok){
      /* le paquet nuages peut manquer a cette cle sans que la cle soit en cause */
      let c2=null; try{ c2 = await r2.text(); }catch(e){}
      if(diagnosticCle(r2.status, c2, 'clouds-1h')==='paquet')
        marquerPaquetKO(cleDe('meteoblue'), 'clouds-1h');
    }
  }
  return j.data_1h;
}

/* une seule série de 7 jours par point : les jalons s'y servent aussi */
function mbExtrait(d, iso, p){
  const T=d.time||[]; if(!T.length) return null;
  const vise=new Date(iso).getTime();
  let bi=-1, dt=1e15;
  for(let i=0;i<T.length;i++){
    const dd=Math.abs(new Date(String(T[i]).replace(' ','T')).getTime()-vise);
    if(dd<dt){ dt=dd; bi=i; }
  }
  if(bi<0||dt>1.6*3.6e6) return null;
  const g=(k,f)=>{ const a=d[k]; if(!a||a[bi]===null||a[bi]===undefined) return null;
                   return f? f(a[bi]) : a[bi]; };
  const r1=x=>x===null||x===undefined?null:Math.round(x*10)/10;
  const r0=x=>x===null||x===undefined?null:Math.round(x);
  const t=g('temperature'), hr=g('relativehumidity'), pr=g('precipitation');
  const nu=g('totalcloudcover'), sf=g('snowfraction');
  const neige=(sf!==null&&pr!==null)? Math.round(sf*pr*0.7*10)/10 : null;
  const orage=(d.pictocode&&[8,17].indexOf(d.pictocode[bi])>=0);
  return {
    t:r1(t), res:r1(g('felttemperature')),
    ros:r1(g('dewpointtemperature')!==null? g('dewpointtemperature') : rosee(t,hr)),
    hum:r0(hr), pr:r1(pr), pp:r0(g('precipitation_probability')), neige:neige,
    code:mbCode(pr||0, nu===null?0:nu, neige||0, orage),
    nu:r0(nu), nub:r0(g('lowclouds')), num:r0(g('midclouds')), nuh:r0(g('highclouds')),
    sol:r0(g('sunshinetime', x=>x*60)), uv:r1(g('uvindex')), vis:r0(g('visibility')),
    v:r0(g('windspeed')), raf:r0(g('windgust')), dir:r0(g('winddirection')),
    iso0:null, cape:null, li:null, pres:null, pres_mer:r0(g('sealevelpressure')),
    alt_demandee:p.alt, source_mb:true
  };
}

async function meteoblueBrut(points, avance){
  const out=new Array(points.length).fill(null);
  out[0]=await meteoblueBrut1(points[0]);
  if(!out[0]) return out;           /* accès refusé : on ne lance pas les 51 autres */
  const ordre=ordreServiceParImportance(points).filter(k=>k!==0);
  let i=0, faits=1;
  const FILE=6;
  async function ouvrier(){
    while(i<ordre.length){
      const k=ordre[i++];
      out[k]=await meteoblueBrut1(points[k]);
      faits++; if(avance) avance(faits, points.length);
    }
  }
  await Promise.all(Array.from({length:FILE}, ouvrier));
  return out;
}


/* ================= WINDY POINT FORECAST ================= */
/* Les modèles de Windy sont ceux qu'on interroge déjà via Open-Meteo. L'apport
   n'est donc pas un modèle de plus, mais :
   - AROME par un second chemin, avec une interpolation différente ;
   - deux variables qu'Open-Meteo n'expose pas : précipitations convectives
     (le signal orageux propre) et base des nuages (serai-je dans la purée ?).
   Le regroupement par famille évite qu'AROME compte deux fois. */
/* la cle Windy en service se relit a chaque appel : voir cleSuivante() */
/* ---- Windy desactive ----
   Decision assumee, appuyee sur la mesure du 17/08 : le niveau gratuit de Windy
   est la "testing API". Ses reponses portent l'avertissement "This data is
   randomly shuffled and slightly modified", et deux cles differentes rendent
   17,1 et 17,9 C pour le meme point au meme instant. Aucune offre payante ne
   sera prise, donc ces valeurs resteront volontairement alterees : les verser
   dans le consensus ajouterait du bruit, et les telecharger coute 52 requetes
   par modele pour rien.
   Ce qu'on perd : pr_conv et cbase, les deux variables propres a Windy.
   Ce qui les remplace, mieux : `cape` pour le signal orageux, deja utilise, et
   la nebulosite par niveau de pression d'Open-Meteo pour la base des nuages,
   qui donne une coupe verticale complete au lieu d'un plafond unique.
   Repasser a true suffit si une vraie cle arrive un jour. */
let WY_ACTIF = false;   /* modifiable : les harnais le passent a true pour tester la logique */
let WY_TEST = null;   /* renseigne si l'API repond en mode test (donnees melangees) */
const WY_URL = 'https://api.windy.com/api/point-forecast/v2';
const WY_MODELES = [
  ['arome',   'Windy AROME 1,3 km', 2.1, 'MF'],
  ['iconD2',  'Windy ICON-D2',      2.0, 'DWD'],
  ['iconEu',  'Windy ICON-EU',      5.0, 'DWD'],
  ['aladin',  'Windy ALADIN 2,3 km', 2.5, 'MF']
];
/* On ne demande que ce qui est relu. `snowPrecip` et `ptype` ne l'etaient
   jamais : la cle pluie exclut explicitement `snow`, et aucun
   wyVal(o,'ptype-...') n'existe dans le fichier. */
const WY_PARAMS = ['temp','dewpoint','rh','precip','convPrecip',
                   'wind','windGust','cape','lclouds','mclouds','hclouds',
                   'pressure','cbase','gh'];
const WY_NIVEAUX = ['surface','850h','800h','700h'];
let WY_APPELS = 0;

function wyVal(o, cle, i){
  const a=o[cle];
  return (a&&a[i]!==null&&a[i]!==undefined)? a[i] : null;
}
function wyVent(o, niv, i){
  const u=wyVal(o,'wind_u-'+niv,i), v=wyVal(o,'wind_v-'+niv,i);
  if(u===null||v===null) return {v:null, dir:null};
  const un=((o.units||{})['wind_u-'+niv]||'m*s-1').toLowerCase();
  const k=(un.indexOf('km')===0)? 1 : 3.6;
  return { v: Math.round(Math.sqrt(u*u+v*v)*k),
           dir: Math.round((270-Math.atan2(v,u)*180/Math.PI+360)%360) };
}

async function windyPoint(p, iso, modele){
  if(!WY_ACTIF) return null;   /* voir WY_ACTIF ci-dessus */
  const corps={ lat:+p.lat.toFixed(2), lon:+p.lon.toFixed(2), model:modele,
                parameters:WY_PARAMS, levels:WY_NIVEAUX, key:cleDe('windy') };
  let o=null;
  try{
    WY_APPELS++;
    const r=await appel(ORD_WY, WY_URL, {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(corps)});
    if(!r) return null;
    if(r.status===204) return null;          /* modèle sans les paramètres demandés */
    if(!r.ok){
      let txt=null; try{ txt=await r.text(); }catch(e){}
      if(cleRefusee(r.status, txt) && cleSuivante('windy', 'HTTP '+r.status)){
        corps.key = cleDe('windy');
        const r2=await appel(ORD_WY, WY_URL, {method:'POST',
          headers:{'Content-Type':'application/json'}, body:JSON.stringify(corps)});
        if(!r2||!r2.ok) return null;
        o=await r2.json();
      } else {
        throw new Error('HTTP '+r.status);
      }
    }
    if(!o) o=await r.json();
    /* La cle publique est une cle de test : Windy annonce lui-meme que les
       donnees sont melangees. On ne les verse pas dans le consensus. */
    if(o && o.warning && /test|shuffl/i.test(o.warning)){ WY_TEST = o.warning; return null; }
  }catch(e){ return null; }
  if(!o||!o.ts||!o.ts.length) return null;

  const vise=new Date(iso).getTime();
  let bi=-1, dt=1e15;
  for(let i=0;i<o.ts.length;i++){ const d=Math.abs(o.ts[i]-vise); if(d<dt){dt=d;bi=i;} }
  if(bi<0||dt>1.6*3.6e6) return null;

  /* on lit les unités renvoyées plutôt que de les supposer */
  /* Windy ne descend pas en altitude : il renvoie la valeur à l'altitude de sa
     maille, donnée dans l'en-tête. On corrige nous-mêmes plutôt que d'écarter
     la source : au lac du Cos, 2195 m contre une maille vers 1200 m, ça vaut
     une dizaine de degrés. */
  const altMaille = (o.header && (o.header.elevation!==undefined? o.header.elevation
                     : o.header.modelElevation)) ??
                    (o.elevation!==undefined? o.elevation : null);
  const corrige_alt = (altMaille!==null && altMaille!==undefined
                       && Math.abs(p.alt-altMaille)>30);

  const U=o.units||{};
  /* écart d'altitude à corriger, et gradient : celui du profil de pression
     du point si on l'a, sinon la valeur standard de l'atmosphère */
  const dz = (altMaille===null||altMaille===undefined)? 0 : (p.alt-altMaille);
  const grad = (typeof GRAD_LOCAL==='number' && isFinite(GRAD_LOCAL))? GRAD_LOCAL : 6.5;
  const corrT = -grad*dz/1000;
  const K=(x,cle)=>{ if(x===null) return null;
    const u=(U[cle]||'K').toLowerCase();
    const c=(u.indexOf('k')===0? x-273.15 : x)+corrT;
    return Math.round(c*10)/10; };
  const enMM=(x,cle)=>{ if(x===null) return null;
    const u=(U[cle]||'mm').toLowerCase();
    return u==='m'? x*1000 : x; };
  const enKMH=(x,cle)=>{ if(x===null) return null;
    const u=(U[cle]||'m*s-1').toLowerCase();
    return (u.indexOf('km')===0)? x : x*3.6; };
  /* la précipitation est cumulée sur le pas du modèle : on cherche la clé réelle */
  const clePluie=Object.keys(o).filter(k=>/precip/i.test(k)&&!/conv|snow/i.test(k))[0];
  const pasH=(o.ts.length>1)? Math.max(1,Math.round((o.ts[1]-o.ts[0])/3.6e6)) : 1;
  const brut=clePluie? enMM(wyVal(o,clePluie,bi), clePluie) : null;
  const pr=brut===null? null : Math.round(brut/pasH*100)/100;
  const conv=Object.keys(o).filter(k=>/convPrecip/i.test(k))[0];
  const prConv=conv? (wyVal(o,conv,bi)===null?null
    : Math.round(enMM(wyVal(o,conv,bi),conv)/pasH*100)/100) : null;
  const neigeK=Object.keys(o).filter(k=>/snowPrecip/i.test(k))[0];

  const vs=wyVent(o,'surface',bi);
  const nub=wyVal(o,'lclouds-surface',bi), num=wyVal(o,'mclouds-surface',bi),
        nuh=wyVal(o,'hclouds-surface',bi);
  const nu=(nub===null&&num===null&&nuh===null)? null
    : Math.round(100*(1-(1-(nub||0)/100)*(1-(num||0)/100)*(1-(nuh||0)/100)));
  const cape=wyVal(o,'cape-surface',bi);
  const t=K(wyVal(o,'temp-surface',bi),'temp-surface');

  const e={
    corrige_alt: corrige_alt, alt_modele: altMaille, dz_corrige: Math.round(corrT*10)/10,
    t: t, res: null, ros: K(wyVal(o,'dewpoint-surface',bi),'dewpoint-surface'),
    hum: wyVal(o,'rh-surface',bi)===null?null:Math.round(wyVal(o,'rh-surface',bi)),
    pr: pr, pr_conv: prConv, pp: null,
    neige: neigeK? (wyVal(o,neigeK,bi)===null?null:Math.round(wyVal(o,neigeK,bi)*10)/10) : null,
    nu: nu, nub: nub===null?null:Math.round(nub), num: num===null?null:Math.round(num),
    nuh: nuh===null?null:Math.round(nuh),
    sol: null, uv: null, vis: null,
    cbase: wyVal(o,'cbase-surface',bi)===null?null:Math.round(wyVal(o,'cbase-surface',bi)),
    v: vs.v, dir: vs.dir,
    raf: wyVal(o,'gust-surface',bi)===null?null:Math.round(enKMH(wyVal(o,'gust-surface',bi),'gust-surface')),
    cape: cape===null?null:Math.max(0,Math.round(cape)), li: null, iso0: null,
    pres: wyVal(o,'pressure-surface',bi)===null?null:Math.round(((o.units||{})['pressure-surface']||'pa').toLowerCase()==='pa'? wyVal(o,'pressure-surface',bi)/100 : wyVal(o,'pressure-surface',bi)),
    t850:K(wyVal(o,'temp-850h',bi),'temp-850h'), t800:K(wyVal(o,'temp-800h',bi),'temp-800h'), t700:K(wyVal(o,'temp-700h',bi),'temp-700h'),
    z850:wyVal(o,'gh-850h',bi), z800:wyVal(o,'gh-800h',bi), z700:wyVal(o,'gh-700h',bi),
    v850:wyVent(o,'850h',bi).v, v800:wyVent(o,'800h',bi).v, v700:wyVent(o,'700h',bi).v,
    alt_demandee: p.alt, source_wy: true
  };
  /* Windy ne fournit pas le ressenti : on l'approche par le refroidissement éolien */
  if(e.t!==null&&e.v!==null){
    e.res = (e.t<=10&&e.v>=5)
      ? Math.round((13.12+0.6215*e.t-11.37*Math.pow(e.v,0.16)+0.3965*e.t*Math.pow(e.v,0.16))*10)/10
      : e.t;
  }
  e.code = mbCode(e.pr||0, e.nu===null?0:e.nu, e.neige||0, (e.cape||0)>900&&(e.pr_conv||0)>0.3);
  return e;
}

async function windySerie(points, cible, modele, avance){
  const out=new Array(points.length).fill(null);
  out[0]=await windyPoint(points[0], cible(points[0]), modele);
  if(!out[0]) return out;      /* clé refusée ou modèle hors domaine : on s'arrête */
  const FILE=5;
  let i=1, faits=1;
  async function ouvrier(){
    while(i<points.length){
      const k=i++;
      out[k]=await windyPoint(points[k], cible(points[k]), modele);
      faits++;
      if(avance&&faits%10===0) avance(faits, points.length);
    }
  }
  await Promise.all(Array.from({length:FILE}, ouvrier));
  return out;
}

/* Gradient thermique local, estimé une fois par relevé depuis les profils de
   pression déjà téléchargés. Le −6,5 °C/km standard est une moyenne d'atmosphère
   libre ; en montagne le gradient de surface varie de −3 à −8 selon l'heure et
   la nébulosité. */
let GRAD_LOCAL = 6.5;
function estimerGradient(){
  const ec=[];
  for(let i=0;i<POIS.length;i++){
    const s=sonde(i);
    if(!s||!s.t||s.t.m===null) continue;
    for(let j=i+1;j<POIS.length;j++){
      const dz=POIS[i].alt-POIS[j].alt;
      if(Math.abs(dz)<600) continue;
      const s2=sonde(j);
      if(!s2||!s2.t||s2.t.m===null) continue;
      const dt=new Date(POIS[i].t[SCENARIO])-new Date(POIS[j].t[SCENARIO]);
      if(Math.abs(dt)>2.5*3.6e6) continue;      /* même moment, sinon le cycle diurne pollue */
      ec.push(-(s.t.m-s2.t.m)/dz*1000);
      break;
    }
  }
  if(ec.length<4) return;
  ec.sort((a,b)=>a-b);
  const md=ec[Math.floor(ec.length/2)];
  if(md>2.0 && md<9.5) GRAD_LOCAL=Math.round(md*10)/10;
}

/* ================= PHYSIQUE DE TERRAIN =================
   Tout ce qui suit se calcule depuis la trace GPX, sans donnée extérieure.
   Trois corrections que les modèles ne font pas à cette maille. */

/* --- 1. Position topographique le long du parcours ---
   Altitude du point moins altitude moyenne sur ±750 m de trace.
   > 0 : convexe, col ou croupe, couplé au flux libre.
   < 0 : concave, cuvette ou fond de vallon, l'air froid s'y accumule.
   Réserve : c'est un indice le long de la trace, pas un vrai indice
   topographique calculé sur un modèle numérique de terrain. Un col traversé
   dans le sens de la crête peut être mal classé. */
function _altKm(km){
  km=Math.max(0,Math.min(TRACE[TRACE.length-1][0],km));
  for(let i=0;i<TRACE.length-1;i++){
    if(km>=TRACE[i][0]&&km<=TRACE[i+1][0]){
      const f=(km-TRACE[i][0])/Math.max(1e-9,TRACE[i+1][0]-TRACE[i][0]);
      return TRACE[i][1]+f*(TRACE[i+1][1]-TRACE[i][1]);
    }
  }
  return TRACE[TRACE.length-1][1];
}
function tpiKm(km, demi){
  demi=demi||0.75;
  let s=0,n=0;
  for(let i=0;i<TRACE.length;i++){
    if(TRACE[i][0]>=km-demi&&TRACE[i][0]<=km+demi){ s+=TRACE[i][1]; n++; }
  }
  if(n<3) return 0;
  return _altKm(km)-s/n;
}

/* --- 2. Accélération du vent au relief ---
   Approximation linéaire usuelle en éolien : environ 2·H/L au sommet,
   où H est la hauteur au-dessus des creux voisins et L la demi-largeur.
   Ne s'applique qu'aux formes convexes ; une cuvette est abritée. */
function speedupKm(km){
  const t=tpiKm(km);
  if(t<-8) return Math.max(0.55, 1+t/90);
  if(t<8)  return 1.0;
  let mn=1e9;
  for(let i=0;i<TRACE.length;i++)
    if(TRACE[i][0]>=km-2&&TRACE[i][0]<=km+2) mn=Math.min(mn,TRACE[i][1]);
  const H=_altKm(km)-mn;
  if(H<=15) return 1.0;
  const seuil=_altKm(km)-H/2;
  let g=km-2, d=km+2;
  for(let i=0;i<TRACE.length;i++){
    if(TRACE[i][0]<km&&TRACE[i][1]<=seuil) g=TRACE[i][0];
    if(TRACE[i][0]>km&&TRACE[i][1]<=seuil){ d=TRACE[i][0]; break; }
  }
  const L=Math.max(120,(d-g)*1000/2);
  return Math.min(2.0, 1+2*H/L);
}

/* --- 3. Température du thermomètre mouillé (approximation de Stull) ---
   La limite pluie-neige suit l'humide, pas le sec : par air sec il peut
   neiger à 3 ou 4 °C au thermomètre sec. */
function humide(T, HR){
  if(T===null||HR===null||HR<=0) return null;
  const h=Math.max(1,Math.min(100,HR));
  return T*Math.atan(0.151977*Math.sqrt(h+8.313659))
       + Math.atan(T+h) - Math.atan(h-1.676331)
       + 0.00391838*Math.pow(h,1.5)*Math.atan(0.023101*h) - 4.686035;
}

/* --- 4. Ressenti corrigé du terrain ---
   Le ressenti des modèles est calculé sans soleil et pour un corps immobile,
   à l'altitude lissée de la maille. On y ajoute trois choses. */
function ressTerrain(e, p, nuit){
  if(!e || e.res===null||e.res===undefined) return null;
  let R=e.res;

  // (a) rayonnement solaire : jusqu'à environ 8 °C de gain sur un corps exposé
  if(!nuit && e.ray!==null && e.ray!==undefined && e.ray>50)
    R += Math.min(8.0, e.ray/120.0);

  // (b) vent réel du lieu : accéléré sur un col, freiné dans une cuvette.
  //     On corrige l'écart de refroidissement entre le vent modèle et celui-ci.
  const su=speedupKm(p.km);
  if(e.v!==null && e.v!==undefined && Math.abs(su-1)>0.05){
    const f=v=>0.6*Math.sqrt(Math.max(0,v));
    R -= (f(e.v*su)-f(e.v));
  }

  // (c) accumulation d'air froid : nuit claire, vent faible, forme concave.
  //     C'est le mécanisme qui gèle un fond de vallon sous ciel dégagé.
  const t=tpiKm(p.km);
  if(nuit && t<-15){
    const ciel = (e.nu===null||e.nu===undefined)? 0.5 : Math.max(0,(60-e.nu)/60);
    const calme= (e.v===null||e.v===undefined)? 0.5 : Math.max(0,(10-e.v)/10);
    R -= Math.min(4.0, (-t-15)/12) * ciel * calme;
  }
  return Math.round(R*10)/10;
}

/* Doublons : un modèle qui redit ce qu'un autre a déjà dit ne doit pas
   gonfler le consensus. On le garde uniquement pour ce qu'il apporte seul. */
const DOUBLON = {

};
const poidsBase = id => (POIDS[id]||[0.5,'?',''])[0];
const famille   = id => (POIDS[id]||[0.5,'?',''])[1];

/* ---- Ponderation par la couverture ----
   Principe, et il est important : une valeur livree est valide, qu'elle vienne
   d'une livraison complete ou partielle. Une couverture partielle est le cas
   NORMAL - un modele hors domaine, hors portee, ou dont quelques requetes ont
   echoue. Le multimodele ne doit donc PAS etre degrade parce qu'un fournisseur
   n'a repondu que sur une partie des points : la ou il a repondu, sa valeur
   vaut celle des autres. ICON-EU et ICON-CH2 a 29 points sur 52 gardent ainsi
   tout leur poids.
   Le seul cas attenue est la couverture si faible que la valeur ne peut plus
   etre recoupee : mesure du 17/08, ARPEGE Europe repondait sur 4 points sur 52
   avec un biais de +3,4 C et +2,9 mm/h, en portant un poids de 0,80. Sur si
   peu de points son biais ne peut pas etre estime, et il tire le consensus
   precisement la ou il est seul a parler. En dessous de 15 % de couverture le
   modele s'efface donc progressivement, sans jamais etre exclu : il reste
   visible, comparable et exportable. */
const COUV_PLEINE = 0.15;
let COUV = {};
function majCouverture(){
  const n = POIS.length || 1;
  const c = {};
  for(const id in DATA){
    let k = 0;
    for(let i=0;i<n;i++){
      let e = null;
      try{ e = extraitPoi(DATA[id], i); }catch(err){ e = null; }
      if(e && e.t!==null && e.t!==undefined) k++;
    }
    c[id] = k / n;
  }
  COUV = c;
}
/* Decote d'age. Un modele dont le run date de la veille a vu la situation
   evoluer : il vote encore, mais il ne doit pas decider seul face a huit modeles
   du matin. Clement jusqu'a 8 h, les mailles fines publiant toutes les 3 h avec
   environ 3,5 h de latence - un modele parfaitement a jour affiche donc
   couramment 6 a 7 h d'age. */
const AGE_FRANC_H = 8, AGE_PLANCHER_H = 24, FRAICHEUR_MIN = 0.45;
function facteurFraicheur(id){
  const maj = MAJ_MODELE[id];
  if(!maj) return 1;                       /* age inconnu : on ne penalise pas */
  const h = (Date.now() - maj) / 3.6e6;
  if(!(h > AGE_FRANC_H)) return 1;
  const f = (h - AGE_FRANC_H) / (AGE_PLANCHER_H - AGE_FRANC_H);
  return Math.max(FRAICHEUR_MIN, 1 - (1 - FRAICHEUR_MIN) * Math.min(1, f));
}

/* Aucun modele ne decide seul. Mesure du 18/08 : meteoblue pesait 2,20 sur 4,33,
   soit 50,8 % - le consensus etait donc meteoblue, ce que confirmait un ecart au
   consensus nul a tous les points. Ce n'etait pas l'intention : Windy est hors
   service et Meteo-France reduit a ARPEGE sur 4 points, si bien que meteoblue
   avait herite de la part des deux autres.

   Le plafond porte sur la PART, pas sur le poids, donc il se relache tout seul
   des que les autres reviennent - notamment quand AROME entrera dans la portee.
   C'est une garde structurelle, pas un reglage a maintenir a la main. */
const PART_MAX = 0.40;
function plafonnerPart(out){
  const vivants = out.filter(o => o && o.poids > 0);
  if(vivants.length < 2) return;                 /* seul, on ne se plafonne pas */
  /* Une part de 40 % est inatteignable a deux modeles : l'un d'eux en detient
     forcement la moitie. Viser plus bas que la part egale ferait osciller le
     plafond d'un modele a l'autre sans jamais converger, et produirait des poids
     absurdes - exactement le cas de ce matin, ou deux modeles seulement
     repondaient. La cible ne descend donc jamais sous la part egale. */
  const cible = Math.max(PART_MAX, 1 / vivants.length);
  for(let tour=0; tour<4; tour++){               /* plafonner l'un releve les autres */
    const total = vivants.reduce((a,o)=>a+o.poids, 0);
    if(!(total > 0)) return;
    const chef = vivants.reduce((a,o)=> o.poids>a.poids? o : a, vivants[0]);
    if(chef.poids / total <= cible + 1e-9) return;
    /* part visee p : chef.poids = p/(1-p) * somme des autres */
    const autres = total - chef.poids;
    chef.plafonne = true;
    chef.poids = autres * cible / (1 - cible);
  }
}

function facteurCouverture(id){
  const part = COUV[id];
  if(part===undefined || part===null) return 1;     /* couverture inconnue : on ne penalise pas */
  return Math.max(0.05, Math.min(1, part / COUV_PLEINE));
}

/* une famille ne peut pas peser plus que 1,4 fois son meilleur membre */
function poidsFamille(ids){
  const parFam={};
  ids.forEach(id=>{ const f=famille(id); (parFam[f]=parFam[f]||[]).push(id); });
  const w={};
  Object.keys(parFam).forEach(f=>{
    const membres=parFam[f];
    const somme=membres.reduce((a,id)=>a+poidsBase(id),0);
    const plafond=Math.max.apply(null,membres.map(poidsBase))*1.4;
    const k = somme>plafond? plafond/somme : 1;
    membres.forEach(id=>{ w[id]=poidsBase(id)*k; });
  });
  return w;
}

function medPond(paires){        // [[valeur, poids], …]
  const v=paires.filter(p=>p[0]!==null&&p[0]!==undefined&&p[1]>0)
                .sort((a,b)=>a[0]-b[0]);
  if(!v.length) return null;
  const tot=v.reduce((a,p)=>a+p[1],0);
  let c=0;
  for(const p of v){ c+=p[1]; if(c>=tot/2) return p[0]; }
  return v[v.length-1][0];
}

/* un modèle très éloigné du groupe voit son poids réduit, jamais annulé :
   il peut avoir raison, mais il ne doit pas tirer la médiane à lui seul */
function penaliteDivergence(valeurs, poids, mediane){
  const ecarts=valeurs.map(v=>v===null?null:Math.abs(v-mediane));
  const bruts=valeurs.filter(v=>v!==null);
  if(bruts.length<3) return poids.map(()=>1);
  const mad=medPond(ecarts.map((e,i)=>[e,poids[i]]));
  const etendue=Math.max.apply(null,bruts)-Math.min.apply(null,bruts);
  /* plancher : plusieurs modèles partagent la même analyse et se ressemblent
     beaucoup ; sans plancher, un écart normal passerait pour une aberration */
  const sigma=Math.max((mad||0)*1.4826, etendue*0.15, 1e-6);
  return ecarts.map(e=>{
    if(e===null) return 1;
    const z=e/sigma;
    return z<=1.8? 1 : 1/(1+(z-1.8));
  });
}

/* ================= NIVEAUX DE PRESSION ================= */
/* À 2887 m, la température « 2 m » d'un modèle à 11 km de maille est une
   extrapolation depuis une orographie à ~1900 m. Le profil de pression donne
   la température de l'air libre au bon niveau, et le vent de crête. */
const NIVEAUX = [850, 750, 700];

function profil(e){
  const P=[];
  NIVEAUX.forEach(n=>{
    const z=e['z'+n], t=e['t'+n];
    if(z!==null&&z!==undefined&&t!==null&&t!==undefined) P.push({n, z, t});
  });
  return P.sort((a,b)=>a.z-b.z);
}
function tAuNiveau(e, alt){
  const P=profil(e);
  if(P.length<2) return null;
  if(alt<=P[0].z) return P[0].t + (P[0].z-alt)*0.0065;
  if(alt>=P[P.length-1].z) return P[P.length-1].t - (alt-P[P.length-1].z)*0.0065;
  for(let i=0;i<P.length-1;i++) if(alt>=P[i].z&&alt<=P[i+1].z){
    const f=(alt-P[i].z)/((P[i+1].z-P[i].z)||1);
    return P[i].t + f*(P[i+1].t-P[i].t);
  }
  return null;
}
function isothermeZero(e){
  const P=profil(e);
  for(let i=0;i<P.length-1;i++){
    if(P[i].t>=0&&P[i+1].t<0){
      const f=P[i].t/((P[i].t-P[i+1].t)||1);
      return Math.round(P[i].z + f*(P[i+1].z-P[i].z));
    }
  }
  if(P.length&&P[P.length-1].t>0) return null;
  return null;
}
/* vent au niveau de pression le plus proche au-dessus du point : c'est celui
   qui souffle sur la crête, pas le vent 10 m d'une vallée fictive */
function ventCrete(e, alt){
  const cand=[[700,e.v700,e.z700],[750,e.v750,e.z750]]
    .filter(c=>c[1]!==null&&c[1]!==undefined&&c[2]!==null&&c[2]!==undefined);
  if(!cand.length) return null;
  const dessus=cand.filter(c=>c[2]>=alt-150).sort((a,b)=>a[2]-b[2]);
  return (dessus[0]||cand.sort((a,b)=>Math.abs(a[2]-alt)-Math.abs(b[2]-alt))[0])[1];
}

let ENS = {};   // par nom de point : probabilités issues des ensembles


async function ensembles(points, cible){
  const jours=(new Date(POIS[0].t[SCENARIO]) - Date.now())/864e5;
  const modeles=[['ecmwf_ifs025','ECMWF ENS',15],['gfs025','GEFS',16],
                 ['icon_eu','ICON-EU EPS',5],['meteoswiss_icon_ch2','ICON-CH2 EPS',5],
                 ['meteoswiss_icon_ch1','ICON-CH1 EPS',1.4],
                 ['meteofrance_arpege_europe','ARPEGE EPS',4]]
                .filter(m=>m[2]>=jours);
  const acc={};
  await Promise.all(modeles.map(async function(m){
    for(let d=0;d<points.length;d+=26){
      const lot=points.slice(d,d+26);
      const qp=new URLSearchParams();
      qp.set('latitude',  lot.map(p=>p.lat).join(','));
      qp.set('longitude', lot.map(p=>p.lon).join(','));
      qp.set('elevation', lot.map(p=>p.alt).join(','));
      qp.set('hourly','temperature_2m,precipitation,wind_gusts_10m');
      qp.set('models', m[0]); qp.set('timezone','Europe/Paris');
      qp.set('start_hour',FENETRE.h0); qp.set('end_hour',FENETRE.h1);
      let j=null;
      for(let essai=0; essai<3 && !j; essai++){
        const rr=await appel(ORD_OM, 'https://ensemble-api.open-meteo.com/v1/ensemble?'+qp.toString());
        if(!rr||!rr.ok){ await new Promise(z=>setTimeout(z,1200*(essai+1))); continue; }
        try{ j=await rr.json(); }catch(e){ }
      }
      if(!j) continue;
      if(!Array.isArray(j)) j=[j];
      j.forEach((o,k)=>{
        const p=lot[k]; if(!o||!o.hourly) return;
        const T=o.hourly.time||[]; if(!T.length) return;
        const vise=new Date(cible(p)).getTime();
        let bi=-1, dt=1e15;
        for(let i2=0;i2<T.length;i2++){ const dd=Math.abs(new Date(T[i2]).getTime()-vise);
          if(dd<dt){dt=dd;bi=i2;} }
        if(bi<0||dt>2*3.6e6) return;
        const rec=acc[p.nom]=acc[p.nom]||{t:[],pr:[],raf:[],src:[]};
        Object.keys(o.hourly).forEach(cle=>{
          if(cle==='time') return;
          const v=o.hourly[cle][bi];
          if(v===null||v===undefined) return;
          if(cle.indexOf('temperature_2m')===0) rec.t.push(v);
          else if(cle.indexOf('precipitation')===0) rec.pr.push(v);
          else if(cle.indexOf('wind_gusts_10m')===0) rec.raf.push(v);
        });
        if(rec.src.indexOf(m[1])<0) rec.src.push(m[1]);
      });
    }
  }));
  const out={};
  Object.keys(acc).forEach(nom=>{
    const r=acc[nom];
    if(!r.t.length) return;
    const s=r.t.slice().sort((a,b)=>a-b);
    const pct=q2=>s[Math.min(s.length-1, Math.max(0, Math.floor(q2*s.length)))];
    /* Quantile sur une s\u00e9rie de membres quelconque. La pluie est asym\u00e9trique
       et pleine de z\u00e9ros : une fourchette p25-p75 dit ce qu'un chiffre unique
       cache, \u00e0 savoir qu'un quart des membres peut annoncer z\u00e9ro pendant
       qu'un autre quart annonce beaucoup. Aucun appel r\u00e9seau : les membres
       sont d\u00e9j\u00e0 t\u00e9l\u00e9charg\u00e9s. */
    const quant=(arr,q2)=>{
      if(!arr.length) return null;
      const z=arr.slice().sort((a,b)=>a-b);
      return z[Math.min(z.length-1, Math.max(0, Math.floor(q2*z.length)))];
    };
    const q1=v=>v===null? null : Math.round(v*10)/10;
    const q0=v=>v===null? null : Math.round(v);
    out[nom]={
      membres:r.t.length, sources:r.src,
      t10:+pct(.1).toFixed(1), t50:+pct(.5).toFixed(1), t90:+pct(.9).toFixed(1),
      pluie02: r.pr.length? Math.round(100*r.pr.filter(v=>v>0.2).length/r.pr.length) : null,
      pluie1:  r.pr.length? Math.round(100*r.pr.filter(v=>v>1.0).length/r.pr.length) : null,
      pluie5:  r.pr.length? Math.round(100*r.pr.filter(v=>v>5.0).length/r.pr.length) : null,
      raf50:   r.raf.length? Math.round(100*r.raf.filter(v=>v>50).length/r.raf.length) : null,
      pr25:q1(quant(r.pr,.25)), pr50:q1(quant(r.pr,.50)), pr75:q1(quant(r.pr,.75)),
      rafP50:q0(quant(r.raf,.50)), rafP90:q0(quant(r.raf,.90))
    };
  });
  return out;
}

/* ================= CACHE LOCAL ================= */
const CLE_CACHE='cache:v3';
const PERIME_H=3;              // au-delà, on rafraîchit tout seul
let TS_DONNEES=null, EN_COURS=false, HORS_LIGNE=false;
/* date de rafraichissement par modele : un paquet porte un seul horodatage
   mais ses modeles peuvent venir de moments differents, puisque livrer()
   fusionne au fur et a mesure et qu'un modele en echec reste en place. */
let MAJ_MODELE = {};
/* Horodatage du releve partage, distinct de TS_DONNEES qui melange local et
   partage. Sert a detecter une panne de la chaine automatique : si le cron
   meurt, TS_DONNEES peut rester frais grace au cache local alors que plus
   personne n'alimente les autres appareils. Rien ne le dirait sans ca. */
let TS_PARTAGE = null;
/* Derniere TENTATIVE de releve, distincte du dernier SUCCES (TS_DONNEES).
   Sert a borner les reprises quand des modeles manquent durablement. */
let TS_TENTATIVE = 0;

/* on ne stocke pas les réponses brutes (trop volumineuses) mais les valeurs extraites,
   arrondies et débarrassées des champs vides */
function compacte(e){
  if(!e) return null;
  const o={};
  for(const k in e){
    const v=e[k];
    if(v===null||v===undefined) continue;
    o[k] = typeof v==='number'? Math.round(v*10)/10 : v;
  }
  return o;
}
async function cacheEcrire(){
  const m={};
  for(const id in DATA){
    m[id]={nom:nomModele(id),
           maj:MAJ_MODELE[id]||null,
           pts:POIS.map((p,i)=>compacte(extraitPoi(DATA[id], i))),
           jal:JALONS.map((j,k)=>compacte(extraitJalonD(DATA_J[id], k)))};
  }
  const paquet={ts:Date.now(), scenario:SCENARIO, jalons:JALONS,
                reportes:REPORTES, echecs:ECHECS, modeles:m, ens:ENS};
  try{ await MEM.set(CLE_CACHE, JSON.stringify(paquet)); }
  catch(e){ log('Cache non écrit ('+e.message+') — les données restent affichées.'); }
}
async function cacheLire(){
  try{
    const r=await MEM.get(CLE_CACHE);
    if(!r) return null;
    const c=JSON.parse(r.value);
    return (c&&c.modeles&&Object.keys(c.modeles).length)? c : null;
  }catch(e){ return null; }
}
/* Releve partage, produit toutes les 3 h par .github/workflows/releve.yml et
   servi par Pages. Un seul releve pour tous les appareils : la consommation de
   quota ne depend plus du nombre de consultations. Facultatif : si le fichier
   est absent, la page se comporte comme avant. */
const URL_PARTAGE = 'data/dernier.json';
async function partageLire(){
  try{
    /* le CDN de Pages garde le fichier une dizaine de minutes */
    const r = await fetch(URL_PARTAGE + '?t=' + Math.floor(Date.now()/60000),
                          {cache:'no-store'});
    if(!r.ok) return null;
    const c = await r.json();
    return (c && c.modeles && Object.keys(c.modeles).length)? c : null;
  }catch(e){ return null; }
}
/* Fusionne deux paquets de cache au lieu d'en sacrifier un. La v43 gardait le
   plus recent, ce qui faisait remplacer 11 modeles en cache local par les 2
   d'un releve partage produit pendant une panne de quota. C'est exactement
   l'erreur que la v17 avait corrigee dans livrer() : on fusionne, on ne
   remplace pas. Un modele present des deux cotes est pris dans le paquet le
   plus recent ; les autres sont conserves.
   La fusion exige le meme scenario et le meme nombre de jalons, sinon les
   tableaux pts et jal ne sont pas comparables. */
function fusionneCaches(a, b){
  if(!a) return b || null;
  if(!b) return a;
  const recent = ((b.ts||0) >= (a.ts||0))? b : a;
  const autre  = (recent === b)? a : b;
  if(recent.scenario !== autre.scenario
     || (recent.jalons||[]).length !== (autre.jalons||[]).length){
    return recent;                 /* pas comparables : on ne bricole pas */
  }
  const c = Object.assign({}, autre, recent);
  /* modele par modele : on garde la version la plus fraiche de CHACUN, et non
     celle du paquet globalement le plus recent. `maj` est la date propre du
     modele ; a defaut on retombe sur l'horodatage de son paquet. */
  c.modeles = {};
  const quand = (paquet, id) => (paquet.modeles[id] && paquet.modeles[id].maj) || paquet.ts || 0;
  const tous = new Set(Object.keys(autre.modeles||{}).concat(Object.keys(recent.modeles||{})));
  tous.forEach(function(id){
    const dansR = recent.modeles && recent.modeles[id];
    const dansA = autre.modeles && autre.modeles[id];
    if(dansR && dansA) c.modeles[id] = (quand(recent,id) >= quand(autre,id))? dansR : dansA;
    else c.modeles[id] = dansR || dansA;
  });
  /* les ensembles ne se fusionnent pas point par point : on garde le jeu le
     plus fourni des deux */
  const eR = recent.ens && Object.keys(recent.ens).length;
  const eA = autre.ens && Object.keys(autre.ens).length;
  c.ens = (eR >= eA)? (recent.ens||{}) : (autre.ens||{});
  c.fusion = {recent:Object.keys(recent.modeles||{}).length,
              autre:Object.keys(autre.modeles||{}).length,
              total:Object.keys(c.modeles).length};
  return c;
}
function appliqueCache(c){
  DATA={}; DATA_J={}; JALONS=c.jalons||[];
  MAJ_MODELE={};
  for(const id in (c.modeles||{})) MAJ_MODELE[id]=c.modeles[id].maj || c.ts || null;
  for(const id in c.modeles){
    DATA[id]  ={nom:c.modeles[id].nom, pts:{[c.scenario]:c.modeles[id].pts}};
    DATA_J[id]={nom:c.modeles[id].nom, jal:c.modeles[id].jal};
  }
  REPORTES=(c.reportes||[]).filter(r=>!r[2]||modeleConnu(r[2]));
  ECHECS=c.echecs||[]; ENS=c.ens||{};
  const purges=purgerInconnus();
  if(purges) log(purges+' modèle'+(purges>1?'s':'')+' obsolète'+(purges>1?'s':'')
    +' retiré'+(purges>1?'s':'')+' du cache.');
  TS_DONNEES=c.ts; SCENARIO=c.scenario;
  const sel=q('#scen'); if(sel) sel.value=String(SCENARIO);
}
function ageHeures(){ return TS_DONNEES? (Date.now()-TS_DONNEES)/3.6e6 : Infinity; }
function ageTexte(){
  if(!TS_DONNEES) return 'aucune donnée';
  const min=Math.round((Date.now()-TS_DONNEES)/6e4);
  if(min<2) return 'à l\'instant';
  if(min<60) return 'il y a '+min+' min';
  const hh=Math.floor(min/60);
  if(hh<24) return 'il y a '+hh+' h'+(min%60?String(min%60).padStart(2,'0'):'');
  return 'il y a '+Math.floor(hh/24)+' j';
}
function majEtat(){
  const el=q('#etat'); if(!el) return;
  el.className='etat';
  let txt;
  if(EN_COURS){ el.classList.add('charge');
    txt='<span class="pulse">mise à jour…</span>'
        + (TS_DONNEES? ' <b>'+ageTexte()+'</b>' : ''); }
  else if(!TS_DONNEES){ el.classList.add('vieux'); txt='aucune donnée'; }
  else {
    const n=Object.keys(DATA).length;
    const fam={}; modelesDisponibles().forEach(function(id){
      const d=DOUBLON[id];
      if(!(d && DATA[d.parent])) fam[famille(id)]=1;
    });
    const nS=Object.keys(fam).length;
    txt='<b>'+nS+'</b> source'+(nS>1?'s':'')+' · '+n+' modèles · '+ageTexte();
    if(HORS_LIGNE){ el.classList.add('horsligne'); txt+=' · <b>hors ligne</b>'; }
    else if(ageHeures()>PERIME_H) el.classList.add('vieux');
    /* Etat de la chaine automatique. Le cron tente chaque heure et les runs
       changent toutes les 3 h : au-dela de 5 h sans relevé partagé, quelque
       chose est casse et il vaut mieux le voir maintenant qu'en course. */
    const SEUIL_PARTAGE_H = 5;
    if(TS_PARTAGE===null){
      txt+=' · <b title="Aucun relèvement partagé n’a été lu : '
        +'données de cet appareil uniquement">serveur muet</b>';
      el.classList.add('vieux');
    } else {
      const hp=(Date.now()-TS_PARTAGE)/36e5;
      if(hp>SEUIL_PARTAGE_H){
        txt+=' · <b title="La chaîne automatique ne publie plus">serveur '
          +Math.round(hp)+' h</b>';
        el.classList.add('vieux');
      }
    }
  }
  el.innerHTML='<span class="pastille"></span><span>'+txt+'</span>'
    + '';
}

/* ================= MÉTÉOGRAMME ================= */
/* Jalons horaires : où suis-je à H+0, H+1, … et quel temps là-bas. */
function dureeCourse(){
  return (new Date(POIS[POIS.length-1].t[SCENARIO]) - new Date(POIS[0].t[SCENARIO]))/3.6e6;
}
function construireJalons(){
  const t0=new Date(POIS[0].t[SCENARIO]).getTime();
  const kmP=POIS.map(p=>p.km), hP=POIS.map(p=>(new Date(p.t[SCENARIO]).getTime()-t0)/3.6e6);
  const kmDeH=h=>{
    if(h<=hP[0]) return kmP[0];
    for(let i=0;i<hP.length-1;i++) if(h>=hP[i]&&h<=hP[i+1]){
      const f=(h-hP[i])/((hP[i+1]-hP[i])||1); return kmP[i]+f*(kmP[i+1]-kmP[i]); }
    return kmP[kmP.length-1];
  };
  const surTrace=km=>{
    for(let i=0;i<TRACE.length-1;i++) if(km>=TRACE[i][0]&&km<=TRACE[i+1][0]){
      const f=(km-TRACE[i][0])/((TRACE[i+1][0]-TRACE[i][0])||1);
      return {alt:Math.round(TRACE[i][1]+f*(TRACE[i+1][1]-TRACE[i][1])),
              lat:+(TRACE[i][2]+f*(TRACE[i+1][2]-TRACE[i][2])).toFixed(5),
              lon:+(TRACE[i][3]+f*(TRACE[i+1][3]-TRACE[i][3])).toFixed(5)};
    }
    const d=TRACE[TRACE.length-1]; return {alt:d[1], lat:d[2], lon:d[3]};
  };
  const J=[], D=Math.ceil(dureeCourse());
  for(let h=0;h<=D;h++){
    const km=kmDeH(h), g=surTrace(km);
    J.push({h, km:+km.toFixed(2), ...g,
            t:isoLocal(new Date(t0+h*3.6e6)),   /* heure locale : les modèles répondent en Europe/Paris */
            nom:'H+'+h});
  }
  return J;
}
function abrege(n){
  const M={'Croix de Belledonne':'Belledonne','R2 Refuge de la Pra':'La Pra',
    'R3 Refuge Jean Collet':'Jean Collet','R4 Habert d\'Aiguebelle':'Aiguebelle',
    'R5 Fond de France Base vie':'Fond de France','R10 Le Bourget-en-Huile':'Le Bourget',
    'Arrivée Aiguebelle':'ARRIVÉE','Col de Morétan':'Morétan','Col de la Vache':'Col Vache',
    'Sommet du Grand Chat':'Grand Chat','Col de la Mine de Fer':'Mine de Fer',
    'R1 Arselle':'Arselle','R6 Gleyzin':'Gleyzin','R7 Périoule':'Périoule',
    'R8 Super Collet':'Super Collet','R9 Val Pelouse':'Val Pelouse',
    'Col de l\'Aigleton':'Aigleton','Rochers Rouges':'Roch. Rouges','Col de Freydane':'Freydane',
    'Vizille':'Vizille'};
  return M[n] || n.replace(/^R\d+ /,'').replace('Refuge ','').replace(/^Col (de la|de l'|du|de|des|d')\s*/,'')
                  .trim().slice(0,16);
}
function altAuKm(km){
  for(let i=0;i<TRACE.length-1;i++) if(km>=TRACE[i][0]&&km<=TRACE[i+1][0]){
    const f=(km-TRACE[i][0])/((TRACE[i+1][0]-TRACE[i][0])||1);
    return TRACE[i][1]+f*(TRACE[i+1][1]-TRACE[i][1]); }
  return TRACE[TRACE.length-1][1];
}
function heureAuKm(km){
  const t0=new Date(POIS[0].t[SCENARIO]).getTime();
  const kmP=POIS.map(p=>p.km), hP=POIS.map(p=>(new Date(p.t[SCENARIO]).getTime()-t0)/3.6e6);
  if(km<=kmP[0]) return 0;
  for(let i=0;i<kmP.length-1;i++) if(km>=kmP[i]&&km<=kmP[i+1]){
    const f=(km-kmP[i])/((kmP[i+1]-kmP[i])||1); return hP[i]+f*(hP[i+1]-hP[i]); }
  return hP[hP.length-1];
}

/* couleur du ciel selon l'heure locale — lit le jour et la nuit d'un coup d'oeil */
function luminance(hex){
  const v=[1,3,5].map(k=>parseInt(hex.substr(k,2),16)/255)
    .map(c=>c<=0.03928? c/12.92 : Math.pow((c+0.055)/1.055,2.4));
  return 0.2126*v[0]+0.7152*v[1]+0.0722*v[2];
}
/* noir ou blanc selon le fond : sur la même ligne le ciel passe du bleu pâle
   de midi à l'indigo de minuit, une couleur fixe serait illisible quelque part */
function contraste(hex){ return luminance(hex)>0.42? '#0A1018' : '#FFFFFF'; }

function couleurCiel(hLoc){
  const s = (PAL.jour==='clair')
    /* Nuit en ardoise moyenne et non en bleu marine : un theme clair doit rester
       clair, la nuit comprise. Deux pavés quasi noirs au milieu d'une page
       blanche se lisaient comme une panne de rendu et ecrasaient le reste. */
    /* Le jour gagne en SATURATION, pas en obscurite : la luminance bouge a peine,
       mais le bleu devient franc, donc le blanc du nuage s'y detache enfin. */
    ? [[0,'#66779A'],[4.5,'#7488A8'],[6.2,'#C89A80'],[7.2,'#E4C6B0'],[8.5,'#93C6EA'],
       [13,'#7FBDEE'],[17,'#8DC3E9'],[19.5,'#E1B18A'],[20.8,'#9F8DA2'],[21.8,'#77879F'],[24,'#66779A']]
    : [[0,'#0A1020'],[4.5,'#101B33'],[6.2,'#4A3B55'],[7.2,'#6E5A66'],[8.5,'#2F5F87'],
       [13,'#3C7CA8'],[17,'#3A6E94'],[19.5,'#7A5147'],[20.8,'#3A2E43'],[21.8,'#111B31'],[24,'#0A1020']];
  const x=Math.max(0,Math.min(23.999,hLoc));
  for(let i=0;i<s.length-1;i++) if(x>=s[i][0]&&x<=s[i+1][0]){
    const f=(x-s[i][0])/(s[i+1][0]-s[i][0]);
    const hx=c=>[1,3,5].map(k=>parseInt(c.substr(k,2),16));
    const a=hx(s[i][1]), b=hx(s[i+1][1]);
    return '#'+a.map((v,k)=>Math.round(v+(b[k]-v)*f).toString(16).padStart(2,'0')).join('');
  }
  return '#0A1020';
}

/* pictogrammes dessinés à la main : lisibles à 22 px sur un téléphone */
function picto(code, cx, cy, r, nuit, surSombre){
  /* Sur un fond sombre on emprunte les tons clairs, quel que soit le theme.
     En theme clair le ciel de nuit est une ardoise moyenne, et des
     pictogrammes gris ardoise y disparaissaient sur les deux nuits de la
     course. Meme regle et meme seuil que contraste() pour le texte, afin que
     les deux elements de la bande ciel restent coherents. */
  /* Les deux autres appelants - fiche du point et tableau horaire - dessinent
     sur PAL.fond et omettent donc surSombre a juste titre : la palette du
     theme y est deja la bonne. Ne pas 'corriger' cette omission. */
  const P = surSombre
    ? {pNuage:'#C9D3E2', pNuageF:'#9FAEC4', pNuageS:'#7C8CA5', pGoutte:'#7FB2E8',
       pSoleil:'#F2C14E', pLune:'#D8DEEA', pFlocon:'#DCE7F5'}
    : PAL;
  if(code===null||code===undefined) return '';
  const g=[];
  const soleil=(x,y,rr)=>{ let o='<circle cx="'+x+'" cy="'+y+'" r="'+rr+'" fill="'+P.pSoleil+'"/>'; return o; };
  const astre=(x,y,rr)=>{
    if(nuit) return '<path d="M '+(x+rr*.45)+' '+(y-rr)+' a '+rr+' '+rr+' 0 1 0 '+(rr*.72)+' '+(rr*1.5)
      +' a '+(rr*.8)+' '+(rr*.8)+' 0 1 1 '+(-rr*.72)+' '+(-rr*1.5)+' z" fill="'+P.pLune+'"/>';
    let o='<circle cx="'+x+'" cy="'+y+'" r="'+(rr*.62)+'" fill="'+P.pSoleil+'"/>';
    for(let k=0;k<8;k++){ const a=k*Math.PI/4;
      o+='<line x1="'+(x+Math.cos(a)*rr*.85)+'" y1="'+(y+Math.sin(a)*rr*.85)
        +'" x2="'+(x+Math.cos(a)*rr*1.25)+'" y2="'+(y+Math.sin(a)*rr*1.25)
        +'" stroke="'+P.pSoleil+'" stroke-width="1.5" stroke-linecap="round"/>'; }
    return o;
  };
  const nuage=(x,y,w,c)=>'<path d="M '+(x-w/2)+' '+y+' a '+(w*.22)+' '+(w*.22)+' 0 0 1 '+(w*.1)+' '+(-w*.26)
    +' a '+(w*.28)+' '+(w*.28)+' 0 0 1 '+(w*.52)+' '+(-w*.04)
    +' a '+(w*.2)+' '+(w*.2)+' 0 0 1 '+(w*.38)+' '+(w*.3)+' z" fill="'+(c||P.pNuage)+'"/>';
  const gouttes=(x,y,n,c)=>{ let o=''; for(let k=0;k<n;k++){ const dx=(k-(n-1)/2)*r*.5;
    o+='<line x1="'+(x+dx)+'" y1="'+y+'" x2="'+(x+dx-r*.12)+'" y2="'+(y+r*.5)
      +'" stroke="'+(c||P.pGoutte)+'" stroke-width="1.7" stroke-linecap="round"/>'; } return o; };
  const flocons=(x,y,n)=>{ let o=''; for(let k=0;k<n;k++){ const dx=(k-(n-1)/2)*r*.5;
    o+='<text x="'+(x+dx)+'" y="'+(y+r*.45)+'" fill="'+P.pFlocon+'" font-size="'+(r*.62)+'" text-anchor="middle">✳</text>'; } return o; };
  const eclair=(x,y)=>'<path d="M '+x+' '+y+' l '+(-r*.22)+' '+(r*.5)+' l '+(r*.2)+' 0 l '+(-r*.14)+' '+(r*.46)
    +' l '+(r*.5)+' '+(-r*.66)+' l '+(-r*.24)+' 0 l '+(r*.2)+' '+(-r*.3)+' z" fill="'+P.pSoleil+'"/>';

  if(code===0) g.push(astre(cx,cy,r*.8));
  else if(code<=2){ g.push(astre(cx-r*.42,cy-r*.28,r*.58)); g.push(nuage(cx+r*.2,cy+r*.5,r*1.5)); }
  else if(code===3) g.push(nuage(cx,cy+r*.35,r*1.75,P.pNuageF));
  else if(code<=48){ g.push(nuage(cx,cy,r*1.5,P.pNuageF));
    for(let k=0;k<3;k++) g.push('<line x1="'+(cx-r*.7)+'" y1="'+(cy+r*.3+k*r*.3)+'" x2="'+(cx+r*.7)
      +'" y2="'+(cy+r*.3+k*r*.3)+'" stroke="'+P.pNuage+'" stroke-width="1.4" stroke-linecap="round"/>'); }
  else if(code<=57){ g.push(nuage(cx,cy-r*.1,r*1.6,P.pNuage)); g.push(gouttes(cx,cy+r*.45,2)); }
  else if(code<=67){ g.push(nuage(cx,cy-r*.1,r*1.65,P.pNuageF)); g.push(gouttes(cx,cy+r*.45,3)); }
  else if(code<=77){ g.push(nuage(cx,cy-r*.1,r*1.65,P.pNuage)); g.push(flocons(cx,cy+r*.35,2)); }
  else if(code<=82){ g.push(astre(cx-r*.5,cy-r*.35,r*.5)); g.push(nuage(cx+r*.18,cy+r*.15,r*1.5,P.pNuageF));
    g.push(gouttes(cx+r*.18,cy+r*.6,3)); }
  else if(code<=86){ g.push(nuage(cx,cy-r*.1,r*1.65,P.pNuage)); g.push(flocons(cx,cy+r*.35,3)); }
