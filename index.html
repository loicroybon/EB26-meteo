<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>v54 — Sonde météo — Échappée Belle Intégrale 2026</title>
<style>
:root{
  --nuit:#0A101C; --roche:#131C2C; --panneau:#182338; --trace:#26344E;
  --neige:#E9EEF6; --brume:#7A8AA5;
  --froid:#5FC8E8; --chaud:#F0A24B; --pluie:#8E7CF0; --alerte:#F0553D; --accord:#5FD3A0;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
html[data-theme="clair"]{
  /* pensé pour un écran de téléphone en plein soleil : fond blanc franc,
     texte quasi noir, bordures assez marquées pour survivre aux reflets */
  --nuit:#FFFFFF; --roche:#FFFFFF; --panneau:#EDF1F7; --trace:#9FADBF;
  --neige:#0A1018; --brume:#41506A;
  --froid:#0E6E96; --chaud:#8F4E06; --pluie:#4632B4; --alerte:#A82A17; --accord:#0F6E48;
}
html[data-theme="clair"] .cel b, html[data-theme="clair"] .gros b{color:var(--neige)}
html[data-theme="clair"] tr.consensus td{background:#DCE6F4}
html[data-theme="clair"] #smstexte{background:#F6F8FB}
html[data-theme="clair"] .segchip[aria-pressed="true"]{background:#F3E4CD}
html{color-scheme:dark}
html[data-theme="clair"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--nuit);color:var(--neige);font-family:var(--mono)}
body{padding:0 0 2.2rem;font-size:14px;line-height:1.4}
.wrap{max-width:100%;margin:0 auto;padding:0 clamp(8px,1vw,16px)}
@media (min-width:1100px){ body{font-size:15px} .wrap{padding:0 16px} }

header{padding:8px 0 6px;border-bottom:1px solid var(--trace)}
.titre{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--brume)}
.titre b{font-size:16px;font-weight:600;color:var(--neige);letter-spacing:-.02em}
.titre .v{margin-left:auto;font-size:10.5px;opacity:.6}
.eyebrow{font-family:var(--sans);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--brume)}
h1{font-size:clamp(21px,5.6vw,32px);font-weight:600;letter-spacing:-.035em;margin:6px 0 4px;line-height:1.05}
h1 span{color:var(--brume);font-weight:400}
.sub{font-size:12px;color:var(--brume)}

.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0}
.ctl .grp{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto}
.ctl .pousse{flex:1 1 0;min-width:0}
@media (max-width:600px){
  .ctl{gap:8px}
  .ctl .pousse{display:none}
  .ctl button,.ctl select{min-height:40px}
  .ctl .grp{flex:1 1 auto}
  .ctl select{flex:1 1 auto;min-width:0}
}
button,select{font-family:var(--mono);font-size:12.5px;background:var(--panneau);color:var(--neige);
  border:1px solid var(--trace);border-radius:3px;padding:7px 11px;cursor:pointer}
button:hover,select:hover{border-color:var(--froid)}
button:focus-visible,select:focus-visible,.tick:focus-visible{outline:2px solid var(--froid);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.ctl label{font-family:var(--sans);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--brume)}

h2{font-family:var(--sans);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--brume);font-weight:600;margin:16px 0 6px;display:flex;align-items:baseline;gap:8px;opacity:.75}
h2::after{content:"";flex:1;height:1px;background:var(--trace)}

/* ---- bandeau signature ---- */
.cadre{position:relative}
.smsbarre{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.smsbarre b{font-size:14px;margin-right:auto}
.smsbarre button{padding:5px 10px;font-size:11px}
.smsbarre button[aria-pressed="true"]{border-color:var(--accord);color:var(--neige);background:#182C28}
#smstexte{width:100%;background:#0C1424;color:var(--neige);border:1px solid var(--trace);
  border-radius:3px;padding:10px;font-family:var(--mono);font-size:12.5px;line-height:1.5;
  resize:vertical;-webkit-user-select:text;user-select:text}
.smspied{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:11px;color:var(--brume)}
.smspied button{margin-left:auto;border-color:var(--accord);padding:7px 14px}
#gouttiere{position:absolute;left:0;top:0;z-index:2;pointer-events:none}
.segchip{flex:0 0 auto;background:var(--panneau);border:1px solid var(--trace);border-radius:3px;
  padding:8px 11px;font-size:12.5px;min-height:44px;cursor:pointer;color:var(--brume);line-height:1.3;text-align:left}
.segchip[aria-pressed="true"]{border-color:var(--chaud);color:var(--neige);background:#1E2B44}
.segchip small{display:block;font-size:9.5px;color:var(--brume);margin-top:1px}
.bandeau{margin-top:4px;border:1px solid var(--trace);border-radius:4px;background:var(--roche);overflow:hidden}
.scroller{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.scroller svg{display:block}
/* --- résumé grand public --- */
.rtete{display:flex;flex-direction:column;gap:2px;margin-bottom:9px}
.rtete b{font-size:14px;font-weight:600}
.rtete span{font-size:11.5px;color:var(--brume)}
.rgrille{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:0;
  border:1px solid var(--trace);border-radius:5px;overflow:hidden}
.rcase{background:var(--roche);padding:8px 10px;border-right:1px solid var(--trace);
  border-bottom:1px solid var(--trace)}
.rcase s{display:block;text-decoration:none;font-family:var(--sans);font-size:9.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--brume)}
.rcase b{display:block;font-size:17px;font-weight:600;letter-spacing:-.03em;margin-top:2px}
.rcase em{display:block;font-style:normal;font-family:var(--sans);font-size:10.5px;
  color:var(--brume);margin-top:1px}
.hero{border:1px solid var(--trace);border-radius:6px;background:var(--roche);
  padding:12px 13px 11px;margin-top:12px}
.htete{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.hlieu{font-size:17px;font-weight:600;letter-spacing:-.02em}
.hquand{font-size:11.5px;color:var(--brume)}
.hcorps{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
.hchiffre b{font-size:clamp(44px,12vw,58px);font-weight:600;letter-spacing:-.055em;line-height:.95;display:block}
.hchiffre em{font-style:normal;font-size:12px;color:var(--brume)}
.hmots{flex:1 1 150px;font-family:var(--sans);font-size:14px;line-height:1.35}
.htuiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;
  border:1px solid var(--trace);border-radius:5px;overflow:hidden;background:var(--trace)}
.tuile{background:var(--roche);padding:8px 6px;text-align:center}
.tuile s{display:block;text-decoration:none;font-family:var(--sans);font-size:9.5px;
  letter-spacing:.06em;color:var(--brume);text-transform:uppercase}
.tuile b{display:block;font-size:19px;font-weight:600;margin-top:2px;letter-spacing:-.03em}
.halertes{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.halertes span{font-family:var(--sans);font-size:12px;background:var(--panneau);
  border:1px solid var(--trace);border-radius:20px;padding:4px 10px}
.hnote{font-family:var(--sans);font-size:13px;color:var(--brume)}

/* --- bande horaire --- */
.heures{display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px;
  border:1px solid var(--trace);border-radius:6px;background:var(--roche);padding:8px 2px}
.hcarte{flex:0 0 auto;width:56px;text-align:center;padding:2px 0;
  border-left:1px solid transparent}
.hcarte.jour{border-left:1px solid var(--trace)}
.hcarte s{display:block;text-decoration:none;font-family:var(--sans);font-size:10.5px;color:var(--brume)}
.hcarte b{display:block;font-size:15px;font-weight:600;letter-spacing:-.02em}
.hcarte i{display:block;font-style:normal;font-size:10.5px;line-height:1.3}
.hcarte .pp{color:var(--pluie)}
.hcarte .rf{color:var(--brume)} .hcarte .rf.moyen{color:var(--chaud)} .hcarte .rf.fort{color:var(--alerte);font-weight:600}
.hcarte u{display:block;text-decoration:none;font-size:9.5px;color:var(--brume);opacity:.7}

.detail{border-top:0;margin-top:4px}
.detail .fiche{margin-top:0}
.repli{margin-top:10px;border-top:1px solid var(--trace)}
.repli summary{font-family:var(--sans);font-size:11.5px;color:var(--brume);cursor:pointer;
  padding:9px 0;list-style:none;display:flex;align-items:center;gap:7px;min-height:38px}
.repli summary::-webkit-details-marker{display:none}
.repli summary::before{content:"\25B8";font-size:10px;transition:transform .15s}
.repli[open] summary::before{transform:rotate(90deg)}
.repli .note{padding-bottom:10px}
.legrepli{border-top:0;margin:0;padding:0 12px 6px}
.legende{display:flex;gap:14px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--trace);
  font-family:var(--sans);font-size:10.5px;color:var(--brume)}
.legende i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---- tableau modèles ---- */
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 5px;border-bottom:1px solid var(--trace);white-space:nowrap}
th{font-family:var(--sans);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--brume);font-weight:600}
td:first-child,th:first-child{text-align:left;white-space:normal;min-width:112px}
tr.consensus td{background:var(--panneau);font-weight:600;border-bottom:1px solid var(--froid)}
.res{font-size:10.5px;color:var(--brume)}
.tw{overflow-x:auto}

/* ---- fiche POI ---- */
.fiche{border:1px solid var(--trace);border-radius:4px;background:var(--roche);padding:11px;margin-top:6px}
.fiche h3{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
.fiche .meta{font-size:11.5px;color:var(--brume);margin-top:3px}
.gros{display:flex;gap:20px;flex-wrap:wrap;margin:14px 0 4px}
.gros div{min-width:74px}
.gros b{display:block;font-size:clamp(28px,7vw,34px);font-weight:600;letter-spacing:-.045em;line-height:1}
.gros s{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brume);text-decoration:none;margin-top:5px}
.spread{font-size:11px;color:var(--brume);margin-top:2px}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;
  border:1px solid var(--trace);border-radius:4px;overflow:hidden;margin:12px 0 4px}
.cel{background:var(--roche);padding:10px 11px;
  border-right:1px solid var(--trace);border-bottom:1px solid var(--trace)}
.cel s{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--brume);text-decoration:none}
.cel b{display:block;font-size:19px;font-weight:600;letter-spacing:-.03em;margin-top:3px}
.cel em{display:block;font-family:var(--sans);font-style:normal;font-size:10px;color:var(--brume);margin-top:2px}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;background:var(--panneau);border:1px solid var(--trace);border-radius:3px;
  padding:9px 11px;font-size:12.5px;min-height:38px;cursor:pointer;color:var(--brume)}
.chip[aria-pressed="true"]{border-color:var(--froid);color:var(--neige)}

.note{font-family:var(--sans);font-size:11.5px;color:var(--brume);line-height:1.55}
.note b{color:var(--neige);font-weight:600}
.alerte{color:var(--alerte)}
ul.dispo{list-style:none;padding:0;margin:0;font-size:12px}
ul.dispo li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--trace);align-items:baseline}
ul.dispo li span:first-child{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--accord)} .ko{color:var(--brume)}
.log{font-size:11px;color:var(--brume);margin-top:8px;white-space:pre-wrap}
.etat{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--brume);margin-left:4px}
.etat b{color:var(--neige);font-weight:600}
.etat .pastille{width:7px;height:7px;border-radius:50%;background:var(--accord);flex:0 0 auto}
.etat.vieux .pastille{background:var(--chaud)} .etat.charge .pastille{background:var(--froid)}
.etat.horsligne .pastille{background:var(--alerte)}
.etat button{padding:4px 9px;font-size:11px;margin-left:auto}
.theme{display:inline-flex;border:1px solid var(--trace);border-radius:3px;overflow:hidden}
.theme button{border:0;border-radius:0;padding:6px 9px;font-size:12px;background:var(--panneau)}
.theme button+button{border-left:1px solid var(--trace)}
.theme button[aria-pressed="true"]{background:var(--panneau);color:var(--neige);
  box-shadow:inset 0 -2px 0 var(--froid);font-weight:600}
@media(prefers-reduced-motion:no-preference){.pulse{animation:p 1.4s ease-in-out infinite}}
@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>

<div class="wrap">

<header>
  <div class="ctl">
    <select id="scen" aria-label="Scénario"></select>
    <select id="modele" aria-label="Modèle"><option value="">Multimodèle</option></select>
    <span class="theme" role="group" aria-label="Apparence">
      <button id="th-clair" title="Clair">☀</button>
      <button id="th-sombre" title="Sombre">☾</button>
      <button id="th-auto" title="Système">A</button>

    <button id="go" title="Actualiser">⟳</button>
    <span class="etat" id="etat"></span>
  </div>
  <div class="log" id="log" hidden></div>
  <div class="note" id="fiabilite" hidden></div>
  <span id="fiabresume" hidden></span>
</header>

<div class="chips" id="segchips"></div>
<div class="bandeau">
  <div class="cadre"><svg id="gouttiere"></svg>
    <div class="scroller" id="scroller"><svg id="ruban"></svg></div></div>
  <div class="legende" id="mgnote" style="border:0;padding:6px 12px 0"></div>
  
</div>

<div class="fiche" id="segresume"></div>

<div class="hero" id="hero"></div>
<div class="heures" id="heures"></div>

<h2>Points du parcours</h2>
<div class="chips" id="chips"></div>
<details class="repli detail"><summary>Détail du point et comparaison des modèles</summary>
  <div class="fiche" id="fiche"></div></details>

<div class="fiche" id="smszone" style="margin-bottom:10px">
  <div class="smsbarre">
    <b>SMS</b>
    <button id="smscourt" aria-pressed="true">Court</button>
    <button id="smscomplet" aria-pressed="false">Tous les points</button>
  </div>
  <textarea id="smstexte" readonly rows="7" spellcheck="false"></textarea>
  <div class="smspied"><span id="smsinfo"></span><button id="smscopie">Copier le SMS</button></div>
  <div class="smspied" style="border-top:1px solid var(--trace);padding-top:10px;margin-top:12px">
    <button id="exportmd">Export Markdown</button>
    <button id="raz" title="Effacer l'historique">Vider</button>
  </div>
</div>

<h2>Modèles</h2>
<ul class="dispo" id="dispo"><li><span class="ko">En attente d'interrogation.</span></li></ul>

<h2>Convergence</h2>
<div id="conv" class="note">Aucun relevé archivé pour l'instant.</div>

<h2 id="htp">Tous les points</h2>
<div class="tw"><table id="tousp"><tbody></tbody></table></div>

</div>

  if(t>=s[s.length-1][0]) return s[s.length-1][1];
  for(let i=0;i<s.length-1;i++){
    if(t>=s[i][0]&&t<=s[i+1][0]){
      const f=(t-s[i][0])/(s[i+1][0]-s[i][0]);
      const A=s[i][1], B=s[i+1][1], h=x=>[1,3,5].map(k=>parseInt(x.substr(k,2),16));
      const a=h(A), b=h(B);
      return '#'+a.map((v,k)=>Math.round(v+(b[k]-v)*f).toString(16).padStart(2,'0')).join('');
    }
  }
  return '#888';
}

/* ================= COUCHE DE RÉCUPÉRATION RAPIDE ================= */
/* Cinq leviers, du plus rentable au moins :
   1. un seul appel Open-Meteo pour tous les modèles à la fois (models=a,b,c) ;
   2. fenêtre horaire resserrée sur la course au lieu de trois jours pleins ;
   3. les quatre fournisseurs interrogés en parallèle, quotas indépendants ;
   4. concurrence adaptative : on accélère tant que ça passe, on freine sur 429 ;
   5. les jalons du météogramme dérivés des séries déjà téléchargées. */

const FENETRE = {h0:'2026-08-21T05:00', h1:'2026-08-23T03:00',
                 d0:'2026-08-21', d1:'2026-08-23'};

/* ---- ordonnanceur adaptatif ---- */
function ordonnanceur(nomServeur, concurrenceMax){
  return {
    nom:nomServeur, max:concurrenceMax, actuel:Math.min(2,concurrenceMax),
    enCours:0, file:[], pause:0, echecs:0,
    async prendre(){
      while(true){
        const attente=this.pause-Date.now();
        if(attente>0){ await new Promise(z=>setTimeout(z,Math.min(attente,400))); continue; }
        if(this.enCours<this.actuel){ this.enCours++; return; }
        await new Promise(z=>setTimeout(z,40));
      }
    },
    rendre(ok){
      this.enCours--;
      if(ok){ this.echecs=0;
        if(this.actuel<this.max) this.actuel=Math.min(this.max, this.actuel+1); }
      else { this.echecs++;
        this.actuel=Math.max(1, Math.floor(this.actuel/2));
        /* la limite Open-Meteo se réarme en moins d'une minute : inutile
           d'attendre davantage, et une progression linéaire suffit */
        this.pause=Date.now()+Math.min(15000, 2500*this.echecs);
      }
    }
  };
}
const ORD_OM = ordonnanceur('open-meteo', 4);
const ORD_MB = ordonnanceur('meteoblue', 6);
const ORD_WY = ordonnanceur('windy', 5);
const ORD_MN = ordonnanceur('met.no', 4);

let N429 = 0;   /* refus pour depassement de quota sur le releve en cours */
async function appel(ord, url, options){
  for(let essai=0; essai<3; essai++){
    await ord.prendre();
    let r=null;
    try{ r = await fetch(url, options); }
    catch(e){ ord.rendre(false); continue; }
    if(r.status===429 || r.status===503){ if(r.status===429) N429++; ord.rendre(false); continue; }
    ord.rendre(true);
    return r;
  }
  return null;
}

/* ---- un seul appel pour tous les modèles ---- */
async function lotOpenMeteo(ids, points, vars){
  const LOT=40;
  const res=new Array(points.length).fill(null);
  const morceaux=[];
  for(let d=0;d<points.length;d+=LOT) morceaux.push([d, points.slice(d,d+LOT)]);

  await Promise.all(morceaux.map(async function([decalage, lot]){
    const base=new URLSearchParams();
    base.set('latitude',  lot.map(x=>x.lat).join(','));
    base.set('longitude', lot.map(x=>x.lon).join(','));
    base.set('elevation', lot.map(x=>x.alt).join(','));
    base.set('hourly', vars.join(','));
    base.set('models', ids.join(','));
    base.set('timezone','Europe/Paris');

    /* fenêtre horaire si l'API l'accepte, sinon repli sur les dates pleines */
    let j=null;
    for(const mode of ['heures','jours']){
      const qp=new URLSearchParams(base);
      if(mode==='heures'){ qp.set('start_hour',FENETRE.h0); qp.set('end_hour',FENETRE.h1); }
      else { qp.set('start_date',FENETRE.d0); qp.set('end_date',FENETRE.d1); }
      const r=await appel(ORD_OM, 'https://api.open-meteo.com/v1/forecast?'+qp.toString());
      if(!r||!r.ok) continue;
      let o=null;
      try{ o=await r.json(); }catch(e){ continue; }
      if(!Array.isArray(o)) o=[o];
      if(o[0]&&o[0].hourly&&o[0].hourly.time&&o[0].hourly.time.length){ j=o; break; }
    }
    if(!j) return;
    j.forEach((o,k)=>{ res[decalage+k]=o; });
  }));
  return res;
}

/* extraction depuis une réponse multi-modèles : les clés portent le suffixe du modèle */
function extraitSuffixe(rep, isoCible, suffixe){
  if(!rep||!rep.hourly) return null;
  const T=rep.hourly.time; if(!T||!T.length) return null;
  const cible=new Date(isoCible).getTime();
  let best=-1, dt=1e15;
  for(let i=0;i<T.length;i++){ const d=Math.abs(new Date(T[i]).getTime()-cible); if(d<dt){dt=d;best=i;} }
  if(best<0 || dt>1.6*3600*1000) return null;
  const g=v=>{ let a=rep.hourly[v+suffixe];
               if(!a) a=rep.hourly[v];        /* un seul modèle : pas de suffixe */
               return (a&&a[best]!==null&&a[best]!==undefined)? a[best] : null; };
  const e={t:g('temperature_2m'), res:g('apparent_temperature'), ros:g('dew_point_2m'),
    hum:g('relative_humidity_2m'), pr:g('precipitation'), pp:g('precipitation_probability'),
    neige:g('snowfall'), code:g('weather_code'),
    nu:g('cloud_cover'), nub:g('cloud_cover_low'), num:g('cloud_cover_mid'), nuh:g('cloud_cover_high'),
    sol:g('sunshine_duration'), ray:g('shortwave_radiation'), uv:g('uv_index'), vis:g('visibility'),
    v:g('wind_speed_10m'), raf:g('wind_gusts_10m'), dir:g('wind_direction_10m'),
    iso0:g('freezing_level_height'), cape:g('cape'), li:g('lifted_index'), pres:g('surface_pressure'),
    /* seuls z750/z700/v750/v700 sont lus, par ventCrete() */
    z750:g('geopotential_height_750hPa'), z700:g('geopotential_height_700hPa'),
    v750:g('wind_speed_750hPa'), v700:g('wind_speed_700hPa'),
    alt_demandee: rep.elevation};
  return (e.t===null&&e.nu===null&&e.pr===null)? null : e;
}

/* ================= AROME 1,3 km, asset committe =================
   Produit hors ligne par scripts/arome.py depuis les GRIB ouverts Meteo-France,
   sans aucune cle, puis commite dans data/arome.json. La page ne fait donc
   qu'un fetch de fichier statique : aucun quota, aucune cle dans le client.
   Le paquet SP1 donne temperature, humidite et vent. Pas de pluie ni de
   rafales : les cles correspondantes restent nulles, on n'invente rien.
   Declare doublon de meteofrance_arome_france_hd : silencieux quand la version
   Open-Meteo repond, seul a parler quand elle manque. */
const AR_ID = 'arome_direct';
const AR_NOM = 'AROME 1,3 km direct';
const AR_URL = 'data/arome.json';
async function aromeLire(){
  try{
    const r = await fetch(AR_URL + '?t=' + Math.floor(Date.now()/60000), {cache:'no-store'});
    if(!r.ok) return null;
    const o = await r.json();
    return (o && o.points && Object.keys(o.points).length)? o : null;
  }catch(e){ return null; }
}
/* Le producteur a deja interpole a l'heure de passage : ici on ne fait que
   traduire vers les cles du moteur. */
function aromeExtrait(paquet, i, p){
  const e = paquet.points[String(i)];
  if(!e || e.t2m===null || e.t2m===undefined) return null;
  const t = e.t2m, hum = (e.r2===undefined? null : Math.round(e.r2));
  const v = (e.vent_kmh===undefined? null : e.vent_kmh);
  let dir = null;
  if(typeof e.u10==='number' && typeof e.v10==='number'){
    /* direction d'ou vient le vent, convention meteo */
    dir = Math.round((270 - Math.atan2(e.v10, e.u10)*180/Math.PI + 360) % 360);
  }
  const vms = (v===null)? null : v/3.6;
  return {
    t: Math.round(t*10)/10,
    res: (function(){ const r=ressentiAT(t, hum, vms); return r===null? null : Math.round(r*10)/10; })(),
    ros: rosee(Math.round(t*10)/10, hum),
    hum: hum, pr:null, pp:null, neige:null, code:null,
    nu:null, nub:null, num:null, nuh:null,
    sol:null, ray:null, uv:null, vis:null,
    v: v, raf:null, dir: dir,
    iso0:null, cape:null, li:null, pres:null,
    /* le GRIB est lu sur sa grille native a 1,3 km : pas de descente d'echelle
       a faire, l'altitude de maille est celle du modele */
    alt_demandee: p.alt, corrige_alt:false
  };
}

/* ================= MET NORWAY (api.met.no) =================
   Source libre, sans cle ni quota, CORS ouvert, et surtout : elle prend
   l'altitude en parametre et la respecte. C'est le filet de securite quand
   le quota Open-Meteo est epuise.
   Deux pieges traites ici :
   - wind_speed est en m/s, pas en km/h ;
   - precipitation_amount est un CUMUL sur la periode annoncee (1 h ou 6 h),
     il faut le ramener en mm/h pour rester homogene avec le reste. */
const MN_ID  = 'metno_direct';
const MN_NOM = 'MET Norway direct';
const MN_URL = 'https://api.met.no/weatherapi/locationforecast/2.0/complete';

/* Temperature apparente australienne, formule sur laquelle Open-Meteo assoit
   son `apparent_temperature`. On l'emploie pour MET Norway, qui donne T,
   humidite et vent mais pas de ressenti : sans elle, la physique de terrain
   et le modele de tenue n'auraient rien a se mettre sous la dent quand
   MET Norway est la seule source joignable. v en m/s. */
function ressentiAT(t, hr, vms){
  if(t===null||t===undefined||!isFinite(t)) return null;
  const h=(hr===null||hr===undefined||!isFinite(hr))? 70 : hr;
  const v=(vms===null||vms===undefined||!isFinite(vms))? 0 : vms;
  const e=(h/100)*6.105*Math.exp(17.27*t/(237.7+t));
  return t + 0.33*e - 0.70*v - 4.00;
}

/* symbol_code de met.no vers code WMO, pour les pictogrammes */
function mnCode(sym){
  if(!sym) return null;
  const s=String(sym).split('_')[0];
  if(s.indexOf('thunder')>=0) return 95;
  if(s.indexOf('sleet')>=0)   return s.indexOf('heavy')>=0? 67 : 66;
  if(s.indexOf('snow')>=0)    return s.indexOf('heavy')>=0? 75 : (s.indexOf('light')>=0? 71 : 73);
  if(s.indexOf('rain')>=0)    return s.indexOf('heavy')>=0? 65 : (s.indexOf('light')>=0? 61 : 63);
  if(s==='fog')               return 45;
  if(s==='cloudy')            return 3;
  if(s==='partlycloudy')      return 2;
  if(s==='fair')              return 1;
  if(s==='clearsky')          return 0;
  return null;
}

async function mnBrut1(p){
  /* met.no demande de tronquer les coordonnees : ca evite de casser son cache */
  const q=new URLSearchParams();
  q.set('lat', (+p.lat).toFixed(4));
  q.set('lon', (+p.lon).toFixed(4));
  q.set('altitude', String(Math.round(p.alt)));
  const r=await appel(ORD_MN, MN_URL+'?'+q.toString());
  if(!r||!r.ok) return null;
  try{
    const o=await r.json();
    const ts=o&&o.properties&&o.properties.timeseries;
    return (ts&&ts.length)? ts : null;
  }catch(e){ return null; }
}

async function mnBrut(points, avance){
  const out=new Array(points.length).fill(null);
  const ordre=ordreServiceParImportance(points);
  let i=0, faits=0;
  const FILE=4;
  async function ouvrier(){
    while(i<ordre.length){
      const k=ordre[i++];
      out[k]=await mnBrut1(points[k]);
      faits++; if(avance) avance(faits, points.length);

/* A J-4 la serie est en pas de 6 h : prendre le pas le plus proche
   introduirait jusqu'a 3 h d'erreur sur des grandeurs a fort cycle diurne.
   On interpole donc lineairement entre les deux pas qui encadrent l'heure
   visee. La pluie, elle, se lit sur la periode qui contient l'heure visee. */
function mnExtrait(ts, iso, p){
  if(!ts||!ts.length) return null;
  const vise=new Date(iso).getTime();
  const t=ts.map(x=>new Date(x.time).getTime());
  if(vise<t[0]-1.6*3.6e6 || vise>t[t.length-1]+1.6*3.6e6) return null;

  let a=-1;
  for(let i=0;i<t.length-1;i++){ if(t[i]<=vise && vise<=t[i+1]){ a=i; break; } }
  let det=null, frac=0, ia=a;
  if(a<0){
    /* hors encadrement : on se rabat sur le pas le plus proche */
    let dt=1e15;
    for(let i=0;i<t.length;i++){ const d=Math.abs(t[i]-vise); if(d<dt){dt=d;ia=i;} }
    if(dt>1.6*3.6e6) return null;
    det=ts[ia].data.instant.details||{};
  } else {
    frac=(t[a+1]-t[a])>0? (vise-t[a])/(t[a+1]-t[a]) : 0;
    const d1=ts[a].data.instant.details||{}, d2=ts[a+1].data.instant.details||{};
    det={};
    Object.keys(d1).forEach(function(k){
      const v1=d1[k], v2=d2[k];
      if(typeof v1!=='number'){ det[k]=v1; return; }
      if(typeof v2!=='number'){ det[k]=v1; return; }
      if(k==='wind_from_direction'){
        /* moyenne angulaire : 350 et 10 donnent 0, pas 180 */
        const r=Math.PI/180;
        const x=(1-frac)*Math.cos(v1*r)+frac*Math.cos(v2*r);
        const y=(1-frac)*Math.sin(v1*r)+frac*Math.sin(v2*r);
        let ang=Math.atan2(y,x)/r; if(ang<0) ang+=360;
        det[k]=ang; return;
      }
      det[k]=v1+(v2-v1)*frac;
    });
    ia=a;
  }

  /* Pluie : il faut la periode qui COMMENCE a l'heure visee ou juste avant,
     donc le dernier pas situe a ou avant `vise`. La recherche d'encadrement
     ci-dessus ne convient pas : quand `vise` tombe pile sur un pas, elle
     retient l'intervalle precedent et on lisait la periode qui se termine
     la, pas celle qui commence. Ecart mesure a Belledonne : 2,8 mm/6h au
     lieu de 11,1. Ramenee en mm/h pour rester homogene. */
  let ib=0;
  for(let i=0;i<t.length;i++){ if(t[i]<=vise) ib=i; else break; }
  if(a<0) ib=ia;
  let pr=null, sym=null;
  const bloc=ts[ib].data||{};
  if(bloc.next_1_hours){
    const d=bloc.next_1_hours.details||{};
    if(typeof d.precipitation_amount==='number') pr=d.precipitation_amount;
    sym=(bloc.next_1_hours.summary||{}).symbol_code||null;
  } else if(bloc.next_6_hours){
    const d=bloc.next_6_hours.details||{};
    if(typeof d.precipitation_amount==='number') pr=d.precipitation_amount/6;
    sym=(bloc.next_6_hours.summary||{}).symbol_code||null;
  }

  const r1=x=>(x===null||x===undefined||!isFinite(x))? null : Math.round(x*10)/10;
  const r0=x=>(x===null||x===undefined||!isFinite(x))? null : Math.round(x);
  const num=k=>(typeof det[k]==='number')? det[k] : null;

  const vKmh = num('wind_speed')===null? null : num('wind_speed')*3.6;
  const e={
    t:r1(num('air_temperature')),
    res:r1(ressentiAT(num('air_temperature'), num('relative_humidity'), num('wind_speed'))),
    ros:r1(num('dew_point_temperature')), hum:r0(num('relative_humidity')),
    pr:r1(pr), pp:null, neige:null, code:mnCode(sym),
    nu:r0(num('cloud_area_fraction')), nub:r0(num('cloud_area_fraction_low')),
    num_:r0(num('cloud_area_fraction_medium')), nuh:r0(num('cloud_area_fraction_high')),
    sol:null, ray:null, uv:r1(num('ultraviolet_index_clear_sky')), vis:null,
    v:r1(vKmh), raf:null, dir:r0(num('wind_from_direction')),
    iso0:null, cape:null, li:null, pres:r1(num('air_pressure_at_sea_level')),
    /* met.no rend la valeur a l'altitude demandee : aucune correction a faire */
    alt_demandee:p.alt, corrige_alt:false
  };
  /* la cle attendue par le moteur est `num`, que l'on ne peut pas nommer
     directement au-dessus sans masquer la fonction locale */
  e.num=e.num_; delete e.num_;
  return (e.t===null&&e.nu===null&&e.pr===null)? null : e;
}

/* ---------- stockage : API artefact si présente, sinon navigateur ---------- */
const MEM = (window.storage) ? window.storage : {
  async set(k,v){ localStorage.setItem(k,v); return {key:k,value:v}; },
  async get(k){ const v=localStorage.getItem(k); if(v===null) throw new Error('absent'); return {key:k,value:v}; },
  async delete(k){ localStorage.removeItem(k); return {key:k,deleted:true}; },
  async list(p){ const ks=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    if(!p||k.startsWith(p)) ks.push(k); } return {keys:ks}; }
};

/* Ordre de service pour les fournisseurs qui interrogent un point par requete
   et peuvent s'arreter en route (credits epuises, refus, echec reseau).
   On sert d'abord les endroits ou une decision se prend : ravitos officiels,
   points de controle, puis les points que la passation designe comme
   decisifs. Le reste ensuite. Les resultats restent ranges a leur index
   d'origine, seul l'ordre de passage change. */
const POI_DECISIFS = ['Croix de Belledonne','Col de la Mine de Fer',
  'Col de la Vache','Col de Mor\u00e9tan','Sommet du Grand Chat','Lac du Cos'];
function rangImportance(p){
  if(p.type==='Ravito') return 0;
  if(POI_DECISIFS.indexOf(p.nom)>=0) return 1;
  if(p.type==='Point ctrl') return 2;
  if(p.type==='Col'||p.type==='Sommet') return 3;
  return 4;
}
/* Etat des donnees deja disponibles a un point, tous modeles confondus, en
   tenant compte du cache local ET du releve partage puisqu'ils sont fusionnes
   dans DATA au demarrage. Rend le nombre de modeles qui ont une valeur et la
   date du plus recemment rafraichi d'entre eux. */
function etatPoint(i){
  let n = 0, recent = 0;
  for(const id in DATA){
    let e = null;
    try{ e = extraitPoi(DATA[id], i); }catch(err){ e = null; }
    if(e && e.t!==null && e.t!==undefined){
      n++;
      const q = MAJ_MODELE[id] || 0;
      if(q > recent) recent = q;
    }
  }
  return {n:n, recent:recent};
}
/* Ordre de service : on veut les reponses les plus utiles AVANT de se faire
   limiter par un fournisseur. Trois cles, dans cet ordre.
   1. l'importance du point : les ravitos d'abord, pour tous les modeles, puis
      les points decisifs, les points de controle, les cols et sommets ;
   2. a importance egale, les points qui n'ont AUCUNE donnee passent devant :
      un trou coute plus cher qu'une valeur un peu vieille ;
   3. ensuite les plus anciennes d'abord, pour que ce qui a le plus vieilli
      soit rafraichi en priorite.
   A defaut d'etat connu, on retombe sur l'ordre du parcours. */
function ordreServiceParImportance(points){
  let etats = null;
  try{
    if(typeof DATA==='object' && DATA && Object.keys(DATA).length){
      etats = points.map((p,i)=>etatPoint(i));
    }
  }catch(e){ etats = null; }
  return points.map((p,i)=>i).sort(function(a,b){
    const dr = rangImportance(points[a]) - rangImportance(points[b]);
    if(dr) return dr;
    if(etats){
      const ea = etats[a], eb = etats[b];
      const trouA = ea.n===0? 0 : 1, trouB = eb.n===0? 0 : 1;
      if(trouA !== trouB) return trouA - trouB;      /* les trous d'abord */
      if(ea.recent !== eb.recent) return ea.recent - eb.recent;  /* plus vieux d'abord */
    }
    return a - b;                                    /* sinon, sens de la course */
  });
}

/* ---------- interrogation Open-Meteo ---------- */

function extrait(rep, isoCible){
  if(!rep||!rep.hourly) return null;
  const T=rep.hourly.time; if(!T) return null;
  const cible=new Date(isoCible).getTime();
  let best=-1, dt=1e15;
  for(let i=0;i<T.length;i++){ const d=Math.abs(new Date(T[i]).getTime()-cible); if(d<dt){dt=d;best=i;} }
  if(best<0 || dt>2*3600*1000) return null;
  const g=v=>{const a=rep.hourly[v]; return a&&a[best]!==null&&a[best]!==undefined?a[best]:null;};
  return {t:g('temperature_2m'), res:g('apparent_temperature'), ros:g('dew_point_2m'),
          hum:g('relative_humidity_2m'), pr:g('precipitation'), pp:g('precipitation_probability'),
          neige:g('snowfall'), code:g('weather_code'),
          nu:g('cloud_cover'), nub:g('cloud_cover_low'), num:g('cloud_cover_mid'), nuh:g('cloud_cover_high'),
          sol:g('sunshine_duration'), ray:g('shortwave_radiation'), uv:g('uv_index'), vis:g('visibility'),
          v:g('wind_speed_10m'), raf:g('wind_gusts_10m'), dir:g('wind_direction_10m'),
          iso0:g('freezing_level_height'), cape:g('cape'), pres:g('surface_pressure'),
          li:g('lifted_index'),
          z750:g('geopotential_height_750hPa'), z700:g('geopotential_height_700hPa'),
          v750:g('wind_speed_750hPa'), v700:g('wind_speed_700hPa'),
          alt_demandee:rep.elevation};
}

function enrichir(e, alt, altNative, p){
  if(!e) return e;
  if(p){
    e.tpi=Math.round(tpiKm(p.km));
    e.speedup=Math.round(speedupKm(p.km)*100)/100;
    e.vterrain=(e.v===null||e.v===undefined)? null : Math.round(e.v*e.speedup);
    const d=new Date((p.t&&p.t.length>10)? p.t : POIS[0].t[SCENARIO]);
    const hh=d.getHours(); const nuit=(hh>=21||hh<6);
    e.nuit=nuit;
    e.ressT=ressTerrain(e,p,nuit);
    e.tw=humide(e.t, e.hum);
  }
  e.alt_modele = (altNative===null||altNative===undefined)? null : altNative;
  e.ecart_relief = (altNative===null||altNative===undefined)? null : Math.round(alt-altNative);
  /* sous 1400 m on serait sous le niveau 850 hPa : l'extrapolation n'a plus de sens */
  if(alt>=1400){
    const tl=tAuNiveau(e, alt);
    if(tl!==null) e.tlibre=Math.round(tl*10)/10;
    const vc=ventCrete(e, alt);
    if(vc!==null&&vc!==undefined) e.vcrete=Math.round(vc);
  }
  const z0=isothermeZero(e);
  if(z0!==null) e.iso0calc=z0;
  if(e.cape!==null&&e.cape!==undefined&&e.cape<0) e.cape=0;
  return e;
}
function extraitPoi(d, i){
  if(d.pts) return (d.pts[SCENARIO]||{})[i] || null;
  if(!d.reps) return null;
  return enrichir(extraitSuffixe(d.reps[i], POIS[i].t[SCENARIO], d.suffixe||''), POIS[i].alt, null, POIS[i]);
}

/* ================= SONDE D'IDENTIFIANTS ================= */
/* Un modèle hors de portée n'est jamais interrogé, donc on ne sait pas si son
   identifiant existe ni si son domaine couvre Belledonne. Une requête légère
   sur le point culminant du parcours répond aux deux questions à la fois :
   si une température revient à ces coordonnées, le domaine les contient. */
const PT_SONDE = {lat:45.16800, lon:5.98800, nom:'Croix de Belledonne'};
let SONDE_IDS = {};          // id -> {ok, alt}

async function sonderIdentifiants(ids){
  if(!ids.length) return;
  /* résultat valable une journée : l'orographie d'un modèle ne bouge pas */
  const cle='sonde_ids:'+new Date().toISOString().slice(0,10);
  try{
    const r=await MEM.get(cle);
    const c=JSON.parse(r.value);
    if(c && ids.every(id=>id in c)){ SONDE_IDS=Object.assign(SONDE_IDS,c); return; }
    Object.assign(SONDE_IDS, c||{});
  }catch(e){}

  const manquants=ids.filter(id=>!(id in SONDE_IDS));
  if(!manquants.length) return;
  const qp=new URLSearchParams();
  qp.set('latitude', PT_SONDE.lat); qp.set('longitude', PT_SONDE.lon);
  qp.set('hourly','temperature_2m'); qp.set('models', manquants.join(','));
  qp.set('forecast_days','1'); qp.set('timezone','Europe/Paris');
  const r=await appel(ORD_OM, 'https://api.open-meteo.com/v1/forecast?'+qp.toString());
  if(!r||!r.ok){ return; }
  let o=null; try{ o=await r.json(); }catch(e){ return; }
  if(Array.isArray(o)) o=o[0];
  const hy=(o&&o.hourly)||{};
  manquants.forEach(id=>{
    const a = hy['temperature_2m_'+id] || (manquants.length===1? hy['temperature_2m'] : null);
    const ok = !!(a && a.some(v=>v!==null&&v!==undefined));
    SONDE_IDS[id]={ok, alt:(o&&o.elevation!==undefined)? Math.round(o.elevation):null};
  });
  try{ await MEM.set(cle, JSON.stringify(SONDE_IDS)); }catch(e){}
}

function mentionSonde(id){
  const s=SONDE_IDS[id];
  if(!s) return '';
  return s.ok? ' · identifiant vérifié, domaine couvre Belledonne'
             : ' · identifiant refusé ou domaine hors zone';
}

/* Un modèle retiré de la liste survit dans le cache du téléphone :
   il faut le purger explicitement, sinon il continue d'être affiché et compté. */
function modeleConnu(id){
  if(id===MB_ID) return true;
  if(MODELES.some(m=>m[0]===id)) return true;
  if(WY_MODELES.some(m=>('windy_'+m[0])===id)) return true;
  return false;
}
function purgerInconnus(){
  let n=0;
  Object.keys(DATA).forEach(function(id){
    if(!modeleConnu(id)){ delete DATA[id]; delete DATA_J[id]; n++; }
  });
  return n;
}

function modelesDisponibles(){
  purgerInconnus();
  return Object.keys(DATA).filter(id=>{
    for(let i=0;i<POIS.length;i++){ const e=extraitPoi(DATA[id], i);
      if(e&&e.t!==null&&e.t!==undefined) return true; }
    return false;
  });
}

function majSelecteurModele(){
  const sel=q('#modele'); if(!sel) return;
  const dispo=modelesDisponibles();
  /* si le modèle choisi a disparu, on retombe sur meteoblue puis sur le consensus */
  if(MODELE_ACTIF && dispo.indexOf(MODELE_ACTIF)<0){
    MODELE_ACTIF = (dispo.indexOf(MB_ID)>=0 && dispo.length===1)? MB_ID : '';
  }
  if(!dispo.length){ MODELE_ACTIF=''; }
  else if(dispo.length===1 && !MODELE_ACTIF){ /* un seul modèle : ce n'est pas un consensus */ }

  const ordre=dispo.slice().sort((a,b)=>poidsBase(b)-poidsBase(a));
  /* le nombre de modèles flatte : ce qui compte, ce sont les sources indépendantes */
  const fam={}; dispo.forEach(function(id){
    const d=DOUBLON[id];
    if(!(d && dispo.indexOf(d.parent)>=0)) fam[famille(id)]=1;
  });
  const nSrc=Object.keys(fam).length;
  let h='<option value=""'+(MODELE_ACTIF===''?' selected':'')+'>'
       +(dispo.length>1? 'Multimodèle \u00b7 '+nSrc+' source'+(nSrc>1?'s':'') : 'Multimodèle')
       +'</option>';
  ordre.forEach(id=>{
    h+='<option value="'+id+'"'+(MODELE_ACTIF===id?' selected':'')+'>'
      +(DATA[id].nom||id)+'</option>';
  });
  if(!dispo.length) h='<option value="">Aucun modèle</option>';
  sel.innerHTML=h;
  majNoteFiabilite();
}

function majNoteFiabilite(){
  const el=q('#fiabilite'); if(!el) return;
  const r=q('#fiabresume');
  if(r){
    const n=modelesDisponibles().length;
    r.textContent = MODELE_ACTIF
      ? 'Modèle isolé : '+((DATA[MODELE_ACTIF]&&DATA[MODELE_ACTIF].nom)||MODELE_ACTIF)
        +' — aucune mesure d\'incertitude'
      : (n>1? 'Multimodèle : médiane pondérée de '+n+' modèles, familles plafonnées'
            : 'Un seul modèle disponible : ce n\'est pas un consensus');
  }
  const dispo=modelesDisponibles();
  let t = FIABILITE[MODELE_ACTIF] || 'Modèle sans note de fiabilité renseignée.';
  if(MODELE_ACTIF===''){
    if(dispo.length===1) t='Un seul modèle répond : ce n\'est pas un consensus, il n\'y a ni '
      +'écart ni confiance à en tirer. '+(FIABILITE[dispo[0]]||'');
    else if(!dispo.length) t='Aucun modèle en mémoire. Lance une actualisation.';
  } else {

}

/* ---------- pipeline : quatre fournisseurs en parallèle ---------- */
let OM_PAUSE = 0;
async function attendreQuota(){}
function signalerQuota(){}

/* Les modeles ne changent de run que toutes les 3 a 6 h. Deux releves
   rapproches coutent deux fois le quota pour la meme donnee, et le quota
   gratuit Open-Meteo se compte en quelques releves par jour. */
/* Les mailles fines tournent aux heures UTC multiples de 3 et sont publi\u00e9es
   avec environ 3 h 30 de retard. Tant que le dernier relev\u00e9 contient d\u00e9j\u00e0 le
   dernier run publi\u00e9, un nouveau relev\u00e9 ret\u00e9l\u00e9chargerait la m\u00eame donn\u00e9e : il
   ne peut rien apporter, et le quota gratuit se compte en quelques relev\u00e9s
   par jour. On refuse alors, en annon\u00e7ant l'heure du prochain run. */
const RUN_H = 3;
const RUN_LAG_MS = 3.5*3600*1000;
const PLANCHER_MS = 5*60*1000;      /* contre le double appui accidentel */
function runPublie(maintenant){
  const d=new Date(maintenant-RUN_LAG_MS);
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(),
                  Math.floor(d.getUTCHours()/RUN_H)*RUN_H);
}
function prochainRun(maintenant){
  return runPublie(maintenant)+RUN_H*3600000+RUN_LAG_MS;
}
async function interroger(force){
  if(EN_COURS) return;
  /* Avant de depenser le moindre quota : le releve partage est-il plus frais
     que ce qu'on affiche ? Si oui on l'applique gratuitement. C'est le cas
     courant sur un telephone qui revient sur la page. */
  if(!EN_COURS){
    const p = await partageLire();
    if(p && p.ts) TS_PARTAGE = p.ts;
    if(p && (p.ts||0) > (TS_DONNEES||0)){
      const avant = Object.keys(DATA).length;
      const f = fusionneCaches({ts:TS_DONNEES, scenario:SCENARIO, jalons:JALONS,
                                modeles:(await cacheLire()||{}).modeles || {}, ens:ENS}, p);
      if(f && f.modeles && Object.keys(f.modeles).length){
        appliqueCache(f); TS_DONNEES=f.ts; HORS_LIGNE=false;
        try{ await cacheEcrire(); }catch(e){}
        majSelecteurModele(); rendreTout();
        log('Relev\u00e9 partag\u00e9 plus frais appliqu\u00e9 : '
            +Object.keys(DATA).length+' mod\u00e8les (avant '+avant+') \u2014 '
            +'aucun quota consomm\u00e9.');
        if(!force) return;
      }
    }
  }
  if(!force && TS_DONNEES && !HORS_LIGNE){
    const age=Date.now()-TS_DONNEES;
    const dejaAJour = TS_DONNEES >= runPublie(Date.now());
    /* au-del\u00e0 de PERIME_H on autorise toujours : le rafra\u00eechissement
       automatique ne doit jamais \u00eatre bloqu\u00e9 */
    if((dejaAJour && age < PERIME_H*3600000) || age < PLANCHER_MS){
      const min=Math.round(age/60000);
      const hh=new Date(prochainRun(Date.now()));
      log('Donn\u00e9es d\u2019il y a '+min+' min, conserv\u00e9es : elles contiennent d\u00e9j\u00e0 '
        + 'le dernier run publi\u00e9. Prochain run vers '
        + hh.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})
        + '. Le bouton force un relevé immédiat.');
      rendreTout(); return;
    }
  }
  const debut=Date.now();
  EN_COURS=true; majEtat(); q('#go').disabled=true;
  const anciens={D:DATA, J:DATA_J, ts:TS_DONNEES};
  /* on repart de ce qui est déjà à l'écran : chaque fournisseur remplace ses
     propres modèles au fur et à mesure, rien ne disparaît entre-temps */
  const nD=Object.assign({}, DATA), nJ=Object.assign({}, DATA_J);
  const rafraichis={};
  ECHECS=[]; REPORTES=[]; WY_APPELS=0; N429=0; WY_TEST=null;
  JALONS = construireJalons();
  const jours = (new Date(POIS[0].t[SCENARIO]) - Date.now())/864e5;
  const dispo=[];
  let rendus=0;

  /* On delegue a rendreTout() : il couvre exactement les memes blocs, plus
     heuresRender, heroRender et estimerGradient qui manquaient ici, et il
     isole chaque bloc dans son propre try comme la v26 l'a etabli. Le
     try/catch unique d'avant faisait qu'un seul bloc en echec emportait tous
     les suivants. */
  const rendre=()=>{ try{ afficheDispo(dispo); }catch(e){} rendreTout(); };
  const livrer=(etiquette, ids)=>{
    const maintenant=Date.now();
    (ids||[]).forEach(id=>{ rafraichis[id]=1; MAJ_MODELE[id]=maintenant; });
    if(!Object.keys(nD).length) return;
    DATA=Object.assign({}, nD); DATA_J=Object.assign({}, nJ);
    if(Object.keys(rafraichis).length){ TS_DONNEES=Date.now(); HORS_LIGNE=false; rendus++; }
    log(etiquette+' \u00b7 '+Object.keys(rafraichis).length+' mod\u00e8le'
        +(Object.keys(rafraichis).length>1?'s':'')+' rafra\u00eechi'
        +(Object.keys(rafraichis).length>1?'s':'')+' sur '+Object.keys(nD).length
        +' affich\u00e9s ('+((Date.now()-debut)/1000).toFixed(0)+' s)');
    rendre();
  };

  /* ---- Open-Meteo : un seul appel pour tous les modèles à portée ---- */
  const tacheOM = (async()=>{
    const utiles=[];
    for(const [id,nom,portee] of MODELES){
      if(id===MB_ID || id===MN_ID || id===AR_ID) continue;
      if(portee < jours){ REPORTES.push([nom, portee, id]); continue; }
      utiles.push([id,nom]);
    }
    /* Un doublon strict n'a rien de propre a garder : des que son parent
       repond, ses valeurs sont ecartees du consensus. Le telecharger coute
       52 points x 27 variables pour rien. On ne le demande donc pas.
       Cas permanent : metno_seamless, parent ecmwf_ifs025 (portee 15 j). */
    const demandes = new Set(utiles.map(u=>u[0]));
    const ecartes = [];
    const retenus = utiles.filter(function([id,nom]){
      const d = DOUBLON[id];
      if(d && (!d.garde || !d.garde.length) && demandes.has(d.parent)){
        ecartes.push(nom); return false;
      }
      return true;
    });
    if(ecartes.length){
      utiles.length=0; retenus.forEach(u=>utiles.push(u));
      log('Doublons non interrog\u00e9s (leur source r\u00e9pond d\u00e9j\u00e0) : '+ecartes.join(', '));
    }
    if(!utiles.length) return;
    log('Open-Meteo : '+utiles.length+' mod\u00e8les en un appel group\u00e9\u2026');
    const ids=utiles.map(u=>u[0]);
    let repP=null;
    try{ repP = await lotOpenMeteo(ids, POIS, VARS); }
    catch(e){ ECHECS.push('Open-Meteo group\u00e9 — '+e.message); }
    /* repli : si l'appel groupé échoue, on repart modèle par modèle */
    if(!repP || !repP.filter(Boolean).length){
      log('Appel group\u00e9 sans r\u00e9ponse, repli mod\u00e8le par mod\u00e8le\u2026');
      for(const [id,nom] of utiles){
        try{
          const r = await lotOpenMeteo([id], POIS, VARS);
          const d={nom, reps:r, suffixe:''};
          const c=POIS.filter((p,i)=>{const e=extraitPoi(d,i); return e&&e.t!==null;}).length;
          if(c>0){ nD[id]=d; nJ[id]=d; }
          dispo.push([nom, c, POIS.length]);
        }catch(e){ ECHECS.push(nom+' — '+e.message); }
      }
      livrer('Open-Meteo', utiles.map(u=>u[0]));
      return;
    }
    utiles.forEach(([id,nom])=>{
      const d={nom, reps:repP, suffixe:'_'+id};
      const c=POIS.filter((p,i)=>{ const e=extraitPoi(d,i); return e&&e.t!==null&&e.t!==undefined; }).length;
      if(c>0){ nD[id]=d; nJ[id]=d; }
      dispo.push([nom, c, POIS.length]);
    });
    livrer('Open-Meteo', utiles.map(u=>u[0]));
  })();

  /* ---- meteoblue : points seulement, jalons dérivés de la même série ---- */
  const tacheMB = (async()=>{
    try{
      const raw = await meteoblueBrut(POIS, (f,n)=>{ if(f%16===0) log('meteoblue '+f+'/'+n); });
      const pts = POIS.map((p,i)=> raw[i]? mbExtrait(raw[i], p.t[SCENARIO], p) : null);
      const c = pts.filter(e=>e&&e.t!==null&&e.t!==undefined).length;
      if(c>0){
        const d={nom:MB_NOM, pts:{[SCENARIO]:pts},
                 serie:(i,iso)=> raw[i]? mbExtrait(raw[i], iso, POIS[i]) : null};
        nD[MB_ID]=d; nJ[MB_ID]=d;
        livrer('meteoblue', [MB_ID]);
      }
      dispo.push([MB_NOM, c, POIS.length]);
    }catch(e){ ECHECS.push(MB_NOM+' — '+e.message); }
  })();

  /* ---- AROME 1,3 km : asset committe, aucun quota ---- */
  const tacheAR = (async()=>{
    try{
      const paquet = await aromeLire();
      if(!paquet){ return; }
      const pts = POIS.map((p,i)=> aromeExtrait(paquet, i, p));
      const c = pts.filter(e=>e&&e.t!==null&&e.t!==undefined).length;
      if(c>0){
        const d={nom:AR_NOM, pts:{[SCENARIO]:pts},
                 serie:(i)=> aromeExtrait(paquet, i, POIS[i])};
        nD[AR_ID]=d; nJ[AR_ID]=d;
        livrer('AROME direct', [AR_ID]);
        log('AROME 1,3 km : '+c+' points depuis le run '+(paquet.run||'?')
            +' \u2014 asset commit\u00e9, aucun quota.');
      }
      dispo.push([AR_NOM, c, POIS.length]);
    }catch(e){ ECHECS.push(AR_NOM+' \u2014 '+e.message); }
  })();

  /* ---- MET Norway : libre et sans quota, donc toujours interroge ---- */
  const tacheMN = (async()=>{
    try{
      const raw = await mnBrut(POIS, (f,n)=>{ if(f%16===0) log('met.no '+f+'/'+n); });
      const pts = POIS.map((p,i)=> raw[i]? mnExtrait(raw[i], p.t[SCENARIO], p) : null);
      const c = pts.filter(e=>e&&e.t!==null&&e.t!==undefined).length;
      if(c>0){
        const d={nom:MN_NOM, pts:{[SCENARIO]:pts},
                 serie:(i,iso)=> raw[i]? mnExtrait(raw[i], iso, POIS[i]) : null};
        nD[MN_ID]=d; nJ[MN_ID]=d;
        livrer('met.no', [MN_ID]);
      }
      dispo.push([MN_NOM, c, POIS.length]);
    }catch(e){ ECHECS.push(MN_NOM+' \u2014 '+e.message); }
  })();

  /* ---- Windy : modèles à portée, en parallèle entre eux ---- */
  const tacheWY = (async()=>{
    const utiles=WY_MODELES.filter(m=>{
      if(m[2] < jours){ REPORTES.push([m[1], m[2], 'windy_'+m[0]]); return false; }
      return true; });
    await Promise.all(utiles.map(async function([mid,mnom]){
      try{
        const s=await windySerie(POIS, p=>p.t[SCENARIO], mid, null);
        const c=s.filter(e=>e&&e.t!==null).length;
        if(c>0){
          const enr=s.map((e,i)=>e? enrichir(e,POIS[i].alt,null,POIS[i]):null);
          nD['windy_'+mid]={nom:mnom, pts:{[SCENARIO]:enr}};
          livrer('Windy '+mnom, ['windy_'+mid]);
        }
        dispo.push([mnom, c, POIS.length]);
      }catch(e){ ECHECS.push(mnom+' — '+e.message); }
    }));
  })();

  /* ---- sonde des identifiants hors de portée, notamment les suisses ---- */
  const tacheSONDE = (async()=>{
    const dehors = MODELES.filter(m=>m[0]!==MB_ID && m[0]!==MN_ID && m[0]!==AR_ID && m[2] < jours).map(m=>m[0]);
    try{ await sonderIdentifiants(dehors); }catch(e){}
  })();

  /* ---- ensembles ---- */
  const tacheENS = (async()=>{
    try{
      const e=await ensembles(POIS, p=>p.t[SCENARIO]);
      if(Object.keys(e).length){ ENS=e;
        log('Ensembles : '+Object.keys(e).length+' points'); rendre(); }
    }catch(e){}
  })();

  await Promise.all([tacheOM, tacheMB, tacheMN, tacheAR, tacheWY, tacheENS, tacheSONDE]);

  /* un modèle sorti de portée ne doit pas survivre indéfiniment dans l'affichage */
  REPORTES.forEach(r=>{ const id=r[2]; if(id&&!rafraichis[id]){ delete nD[id]; delete nJ[id]; } });
  if(Object.keys(rafraichis).length){ DATA=Object.assign({}, nD); DATA_J=Object.assign({}, nJ); }

  q('#go').disabled=false; EN_COURS=false;
  if(!Object.keys(DATA).length || !rendus){
    if(!Object.keys(DATA).length){ DATA=anciens.D; DATA_J=anciens.J; }
    TS_DONNEES=anciens.ts; HORS_LIGNE=true;
    majSelecteurModele(); majEtat(); rendre();
    log('Aucun mod\u00e8le joignable. Les donn\u00e9es pr\u00e9c\u00e9dentes restent affich\u00e9es.'
        + (N429? ' Quota des fournisseurs \u00e9puis\u00e9 ('+N429+' refus) \u2014 '
                 +'r\u00e9essaie dans une heure, ce n\u00b4est pas une absence de pr\u00e9vision.' : '')
        + (WY_TEST? ' Windy r\u00e9pond en mode test, ses donn\u00e9es sont \u00e9cart\u00e9es.' : '')
        + (ECHECS.length? ' D\u00e9tail : '+ECHECS.join(' | ') : ''));
    afficheDispo(dispo); return;
  }
  if(WY_TEST) ECHECS.push('Windy \u00e9cart\u00e9 \u2014 cl\u00e9 de test, donn\u00e9es m\u00e9lang\u00e9es par le fournisseur');
  const n=Object.keys(DATA).length, nEns=Object.keys(ENS).length;
  log(n+' mod\u00e8le'+(n>1?'s':'')+' en '+((Date.now()-debut)/1000).toFixed(0)+' s le '
      + new Date().toLocaleString('fr-FR')
      + (nEns? ' \u00b7 ensembles sur '+nEns+' points' : '')
      + (WY_APPELS? ' \u00b7 Windy '+WY_APPELS+' requ\u00eates' : '')
      + (REPORTES.length? ' \u00b7 trop loin : '+REPORTES.map(r=>r[0]).join(', ') : '')
      + (ECHECS.length? ' \u00b7 en \u00e9chec : '+ECHECS.map(x=>x.split(' — ')[0]).join(', ') : ''));
  rendre();
  await cacheEcrire();
  await archive();
}

/* ---------- agrégation ---------- */
function agrege(out){
  /* une ligne sans température est une ligne vide : le modèle n'atteint pas l'échéance */
  out = out.filter(o=>o.t!==null&&o.t!==undefined);
  if(!out.length) return null;

  const presents={}; out.forEach(o=>presents[o.id]=1);
  out.forEach(function(o){
    const d=DOUBLON[o.id];
    o.doublon = (d && presents[d.parent])? (d.garde||[]) : null;
    /* L'API Windy renvoie la valeur à l'altitude de la maille du modèle,
       sans descente d'échelle. Au Lac du Cos, 2195 m, elle donne 18,8 °C
       quand le même ICON-EU corrigé en donne 8,9. Windy ne vote donc que
       sur les deux variables qu'il est seul à fournir. */
    /* Windy est désormais corrigé en altitude : il peut de nouveau voter,
       sauf s'il double une source déjà présente. Seule ALADIN est unique. */
    if(o.id && o.id.indexOf('windy_')===0 && !o.corrige_alt) o.doublon=['pr_conv'];
  });
  const ids=out.filter(o=>!o.doublon||o.doublon.length).map(o=>o.id);
  const wFam=poidsFamille(out.map(o=>o.id));
  out.forEach(o=>{ const base=wFam[o.id]!==undefined? wFam[o.id] : 0.5;
    o.couverture=facteurCouverture(o.id);
    o.poids=base*o.couverture; o.divergent=false; });

  const CLES=['t','res','ressT','ros','hum','tw','pr','pr_moy','pr_conv','pp','neige','nu','nub','num','nuh',
    'sol','ray','uv','vis','cbase','v','vterrain','raf','dir','iso0','cape','pres',
    'tlibre','vcrete','iso0calc','li','tpi','speedup'];

  const S={};
  CLES.forEach(function(k){
    const vals=out.map(function(o){
      if(o.doublon && o.doublon.indexOf(k)<0) return null;   // doublon : muet sur cette variable
      return (o[k]===null||o[k]===undefined)? null : o[k];
    });
    const w0=out.map(o=>o.poids);
    const bruts=vals.filter(v=>v!==null);
    if(!bruts.length){ S[k]=null; return; }
    const m0=medPond(vals.map((v,i)=>[v,w0[i]]));
    /* les rafales n'ont pas la même définition d'un modèle à l'autre :
       on ne pénalise pas la divergence dessus, on la montre */
    const pen = (k==='raf')? w0.map(()=>1) : penaliteDivergence(vals, w0, m0);
    const w1=w0.map((w,i)=>w*pen[i]);
    if(k==='t') out.forEach((o,i)=>{ if(pen[i]<0.7) o.divergent=true; });
    const m=medPond(vals.map((v,i)=>[v,w1[i]]));
    S[k]={ m:m, lo:Math.min.apply(null,bruts), hi:Math.max.apply(null,bruts),
           n:bruts.length,
           brut: bruts.slice().sort((a,b)=>a-b)[Math.floor(bruts.length/2)] };
  });

  /* Pour la pluie, la médiane pondérée sous-estime : la variable est
     asymétrique et pleine de zéros. On expose aussi la moyenne pondérée,
     qui est la bonne statistique pour un cumul attendu. */
  (function(){
    let sw=0, sv=0, n=0;
    out.forEach(function(o){
      if(o.doublon) return;
      if(o.pr===null||o.pr===undefined) return;
      sw+=o.poids; sv+=o.poids*o.pr; n++;
    });
    S.pr_moy = n? {m:Math.round(sv/sw*100)/100, lo:null, hi:null, n:n} : null;
  })();

  const codes=out.filter(o=>!o.doublon).map(o=>[o.code, o.poids])
    .filter(c=>c[0]!==null&&c[0]!==undefined);
  if(codes.length){
    const score={};
    codes.forEach(c=>{ score[c[0]]=(score[c[0]]||0)+c[1]; });
    S.code = +Object.keys(score).sort((a,b)=>score[b]-score[a]||b-a)[0];
  } else S.code=null;

  /* confiance : nombre de familles indépendantes présentes, et resserrement en T */
  const familles={}; out.filter(o=>!o.doublon).forEach(o=>familles[famille(o.id)]=1);
  const nFam=Object.keys(familles).length;
  S.independants=nFam; S.doublons=out.filter(o=>o.doublon).length;
  const etendue = S.t? (S.t.hi-S.t.lo) : 99;
  let conf = 'faible';
  if(nFam>=3 && etendue<=3) conf='bonne';
  else if(nFam>=2 && etendue<=5) conf='moyenne';
  S.confiance={niveau:conf, familles:nFam, etendue:Math.round(etendue*10)/10,
               poidsTotal:Math.round(out.reduce((a,o)=>a+o.poids,0)*100)/100};
  return {lignes:out, ...S};
}
function sonde(i){
  const out=[];
  for(const id in DATA){
    if(MODELE_ACTIF && id!==MODELE_ACTIF) continue;
    const e=extraitPoi(DATA[id], i); if(e) out.push({id, nom:DATA[id].nom, ...e}); }
  const a=agrege(out); return a? {p:POIS[i], ...a} : null;
}
/* les jalons ne sont plus téléchargés : on les dérive des séries déjà en main,
   en interpolant entre les deux points du parcours qui les encadrent */
function encadrants(km){
  let a=0;
  for(let i=0;i<POIS.length-1;i++){ if(km>=POIS[i].km&&km<=POIS[i+1].km){ a=i; break; }
                                    if(km>POIS[i].km) a=i; }
  const b=Math.min(POIS.length-1, a+1);
  const f=(POIS[b].km>POIS[a].km)? (km-POIS[a].km)/(POIS[b].km-POIS[a].km) : 0;
  return [a,b,Math.max(0,Math.min(1,f))];
}
function extraitJalonD(d, k){
  if(!d||!JALONS[k]) return null;
  if(d.jal) return d.jal[k]||null;
  const J=JALONS[k], [a,b,f]=encadrants(J.km);
  const lire=i=>{
    if(d.serie) return d.serie(i, J.t);
    if(d.pts) return (d.pts[SCENARIO]||{})[i] || null;
    if(!d.reps) return null;
    return extraitSuffixe(d.reps[i], J.t, d.suffixe||'');
  };
  const ea=lire(a), eb=lire(b);
  if(!ea&&!eb) return null;
  if(!ea) return enrichir(Object.assign({},eb), J.alt, null, J);
  if(!eb||a===b) return enrichir(Object.assign({},ea), J.alt, null, J);
  const m={};
  Object.keys(ea).forEach(cle=>{
    const x=ea[cle], y=eb[cle];
    if(typeof x==='number'&&typeof y==='number') m[cle]=x+(y-x)*f;
    else m[cle]=(f<0.5? x : y);
  });
  return enrichir(m, J.alt, null, J);
}
function sondeJalon(k){
  if(!JALONS[k]) return null;
  const out=[];
  for(const id in DATA_J){
    if(MODELE_ACTIF && id!==MODELE_ACTIF) continue;
    const e=extraitJalonD(DATA_J[id], k);
    if(e) out.push({id, nom:DATA_J[id].nom, ...e}); }
  return agrege(out);
}

/* ================= METEOBLUE ================= */
/* Intérêt propre : meteoblue applique un MOS, une correction statistique calée
   sur la topographie réelle. C'est la seule source du lot qui ne se contente pas
   d'interpoler une maille — donc une information indépendante en montagne.
   Contrepartie : pas de niveaux de pression, donc ni air libre ni vent de crête. */
/* Les cles viennent de config.js quand il est charge, ce qui permet au
   runner GitHub Actions de les surcharger par variable d'environnement.
   Le repli garde index.html utilisable seul, sans aucun fichier a cote. */
const CLES_CFG = (typeof globalThis !== 'undefined' && globalThis.EB26_CONFIG) || null;
const CLE_RANG = {};      /* rang de la cle en service, par fournisseur */
const CLE_REPLI = {meteoblue:'QTysmp2OSKP7ba3j',
                   windy:'LMtKS6ka4dr1ta1qijmvXBFLUorC6aar'};
function clesDe(fournisseur){
  const l = CLES_CFG && CLES_CFG[fournisseur];
  if(l && l.length) return l;
  const r = CLE_REPLI[fournisseur];
  return r? [r] : [];
}
function cleDe(fournisseur){
  const l = clesDe(fournisseur);
  if(!l.length) return null;
  return l[Math.min(CLE_RANG[fournisseur]||0, l.length-1)];
}
/* Vrai si la reponse indique que la CLE est refusee, et non que le plafond est
   atteint. On ne bascule que dans le premier cas : un depassement de credits
   n'est pas un probleme de cle, changer de cle ne ferait que deplacer le
   plafond. */
function cleRefusee(statut, corps){
  if(statut===401 || statut===403) return true;
  const t = String(corps||'').toLowerCase();
  if(/credit|quota|limit|exceeded|too many/.test(t)) return false;
  return /unauthoriz|invalid[ _-]?key|api[ _-]?key|forbidden|not authorized/.test(t);
}
/* Passe a la cle suivante. Rend faux s'il n'y a plus de roue de secours. */
function cleSuivante(fournisseur, motif){
  const l = clesDe(fournisseur);
  const suivant = (CLE_RANG[fournisseur]||0) + 1;
  if(suivant >= l.length) return false;
  CLE_RANG[fournisseur] = suivant;
  log('Cl\u00e9 ' + fournisseur + ' refus\u00e9e (' + motif + ') : bascule sur la cl\u00e9 '
      + (suivant+1) + ' sur ' + l.length + '.');
  return true;
}
const MB_ID  = 'meteoblue';
const MB_NOM = 'meteoblue MOS';

function mbCode(pr, nu, neige, orage){
  if(orage) return 95;
  if(neige>0.05) return pr>1? 75 : 71;
  if(pr>=2) return 65;
  if(pr>=0.5) return 63;
  if(pr>=0.1) return 61;
  if(nu>=85) return 3;
  if(nu>=50) return 2;
  if(nu>=20) return 1;
  return 0;
}
function rosee(t, hr){
  if(t===null||hr===null||hr<=0) return null;
  const a=17.27, b=237.7;
  const g=Math.log(hr/100)+a*t/(b+t);
  return Math.round((b*g/(a-g))*10)/10;
}

async function meteoblueBrut1(p){
  const base='https://my.meteoblue.com/packages/';
  const q=new URLSearchParams();
  q.set('apikey', cleDe('meteoblue'));
  q.set('lat', p.lat); q.set('lon', p.lon); q.set('asl', p.alt);
  q.set('format','json'); q.set('tz','Europe/Paris');
  q.set('temperature','C'); q.set('windspeed','kmh'); q.set('precipitationamount','mm');
  q.set('history_days','0');
  let j=null, refus=null;
  for(const paquets of ['basic-1h_clouds-1h_wind-1h','basic-1h_clouds-1h','basic-1h']){
    const r=await appel(ORD_MB, base+paquets+'?'+q.toString());
    if(!r) continue;
    let txt=null;
    if(!r.ok){
      try{ txt=await r.text(); }catch(e){}
      if(cleRefusee(r.status, txt)) refus = 'HTTP '+r.status;
      continue;
    }
    try{ const o=await r.json();
         if(o&&o.data_1h){ j=o; break; }
         if(o&&o.error && cleRefusee(r.status, o.error_message)) refus = o.error_message;
    }catch(e){}
  }
  if(!j){
    /* une cle refusee vaut la peine d'essayer la roue de secours, une fois */
    if(refus && cleSuivante('meteoblue', refus)){
      q.set('apikey', cleDe('meteoblue'));
      for(const paquets of ['basic-1h_clouds-1h_wind-1h','basic-1h']){
        const r=await appel(ORD_MB, base+paquets+'?'+q.toString());
        if(!r||!r.ok) continue;
        try{ const o=await r.json(); if(o&&o.data_1h){ j=o; break; } }catch(e){}
      }
    }
    if(!j) return null;
  }
  if(!j.data_1h.totalcloudcover){
    const r2=await appel(ORD_MB, base+'clouds-1h?'+q.toString());
    if(r2&&r2.ok){ try{ const o2=await r2.json();
      if(o2&&o2.data_1h) Object.keys(o2.data_1h).forEach(k=>{
        if(k!=='time'&&!j.data_1h[k]) j.data_1h[k]=o2.data_1h[k]; }); }catch(e){} }
  }
  return j.data_1h;
}

/* une seule série de 7 jours par point : les jalons s'y servent aussi */
function mbExtrait(d, iso, p){
  const T=d.time||[]; if(!T.length) return null;
  const vise=new Date(iso).getTime();
  let bi=-1, dt=1e15;
  for(let i=0;i<T.length;i++){
    const dd=Math.abs(new Date(String(T[i]).replace(' ','T')).getTime()-vise);
    if(dd<dt){ dt=dd; bi=i; }
  }
  if(bi<0||dt>1.6*3.6e6) return null;
  const g=(k,f)=>{ const a=d[k]; if(!a||a[bi]===null||a[bi]===undefined) return null;
                   return f? f(a[bi]) : a[bi]; };
  const r1=x=>x===null||x===undefined?null:Math.round(x*10)/10;
  const r0=x=>x===null||x===undefined?null:Math.round(x);
  const t=g('temperature'), hr=g('relativehumidity'), pr=g('precipitation');
  const nu=g('totalcloudcover'), sf=g('snowfraction');
  const neige=(sf!==null&&pr!==null)? Math.round(sf*pr*0.7*10)/10 : null;
  const orage=(d.pictocode&&[8,17].indexOf(d.pictocode[bi])>=0);
  return {
    t:r1(t), res:r1(g('felttemperature')),
    ros:r1(g('dewpointtemperature')!==null? g('dewpointtemperature') : rosee(t,hr)),
    hum:r0(hr), pr:r1(pr), pp:r0(g('precipitation_probability')), neige:neige,
    code:mbCode(pr||0, nu===null?0:nu, neige||0, orage),
    nu:r0(nu), nub:r0(g('lowclouds')), num:r0(g('midclouds')), nuh:r0(g('highclouds')),
    sol:r0(g('sunshinetime', x=>x*60)), uv:r1(g('uvindex')), vis:r0(g('visibility')),
    v:r0(g('windspeed')), raf:r0(g('windgust')), dir:r0(g('winddirection')),
    iso0:null, cape:null, li:null, pres:null, pres_mer:r0(g('sealevelpressure')),
    alt_demandee:p.alt, source_mb:true
  };
}

async function meteoblueBrut(points, avance){
  const out=new Array(points.length).fill(null);
  out[0]=await meteoblueBrut1(points[0]);
  if(!out[0]) return out;           /* accès refusé : on ne lance pas les 51 autres */
  const ordre=ordreServiceParImportance(points).filter(k=>k!==0);
  let i=0, faits=1;
  const FILE=6;
  async function ouvrier(){
    while(i<ordre.length){
      const k=ordre[i++];
      out[k]=await meteoblueBrut1(points[k]);
      faits++; if(avance) avance(faits, points.length);
    }
  }
  await Promise.all(Array.from({length:FILE}, ouvrier));
  return out;
}


/* ================= WINDY POINT FORECAST ================= */
/* Les modèles de Windy sont ceux qu'on interroge déjà via Open-Meteo. L'apport
   n'est donc pas un modèle de plus, mais :
   - AROME par un second chemin, avec une interpolation différente ;
   - deux variables qu'Open-Meteo n'expose pas : précipitations convectives
     (le signal orageux propre) et base des nuages (serai-je dans la purée ?).
   Le regroupement par famille évite qu'AROME compte deux fois. */
/* la cle Windy en service se relit a chaque appel : voir cleSuivante() */
/* ---- Windy desactive ----
   Decision assumee, appuyee sur la mesure du 17/08 : le niveau gratuit de Windy
   est la "testing API". Ses reponses portent l'avertissement "This data is
   randomly shuffled and slightly modified", et deux cles differentes rendent
   17,1 et 17,9 C pour le meme point au meme instant. Aucune offre payante ne
   sera prise, donc ces valeurs resteront volontairement alterees : les verser
   dans le consensus ajouterait du bruit, et les telecharger coute 52 requetes
   par modele pour rien.
   Ce qu'on perd : pr_conv et cbase, les deux variables propres a Windy.
   Ce qui les remplace, mieux : `cape` pour le signal orageux, deja utilise, et
   la nebulosite par niveau de pression d'Open-Meteo pour la base des nuages,
   qui donne une coupe verticale complete au lieu d'un plafond unique.
   Repasser a true suffit si une vraie cle arrive un jour. */
let WY_ACTIF = false;   /* modifiable : les harnais le passent a true pour tester la logique */
let WY_TEST = null;   /* renseigne si l'API repond en mode test (donnees melangees) */
const WY_URL = 'https://api.windy.com/api/point-forecast/v2';
const WY_MODELES = [
  ['arome',   'Windy AROME 1,3 km', 2.1, 'MF'],
  ['iconD2',  'Windy ICON-D2',      2.0, 'DWD'],
  ['iconEu',  'Windy ICON-EU',      5.0, 'DWD'],
  ['aladin',  'Windy ALADIN 2,3 km', 2.5, 'MF']
];
/* On ne demande que ce qui est relu. `snowPrecip` et `ptype` ne l'etaient
   jamais : la cle pluie exclut explicitement `snow`, et aucun
   wyVal(o,'ptype-...') n'existe dans le fichier. */
const WY_PARAMS = ['temp','dewpoint','rh','precip','convPrecip',
                   'wind','windGust','cape','lclouds','mclouds','hclouds',
                   'pressure','cbase','gh'];
const WY_NIVEAUX = ['surface','850h','800h','700h'];
let WY_APPELS = 0;

function wyVal(o, cle, i){
  const a=o[cle];
  return (a&&a[i]!==null&&a[i]!==undefined)? a[i] : null;
}
function wyVent(o, niv, i){
  const u=wyVal(o,'wind_u-'+niv,i), v=wyVal(o,'wind_v-'+niv,i);
  if(u===null||v===null) return {v:null, dir:null};
  const un=((o.units||{})['wind_u-'+niv]||'m*s-1').toLowerCase();
  const k=(un.indexOf('km')===0)? 1 : 3.6;
  return { v: Math.round(Math.sqrt(u*u+v*v)*k),
           dir: Math.round((270-Math.atan2(v,u)*180/Math.PI+360)%360) };
}

async function windyPoint(p, iso, modele){
  if(!WY_ACTIF) return null;   /* voir WY_ACTIF ci-dessus */
  const corps={ lat:+p.lat.toFixed(2), lon:+p.lon.toFixed(2), model:modele,
                parameters:WY_PARAMS, levels:WY_NIVEAUX, key:cleDe('windy') };
  let o=null;
  try{
    WY_APPELS++;
    const r=await appel(ORD_WY, WY_URL, {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(corps)});
    if(!r) return null;
    if(r.status===204) return null;          /* modèle sans les paramètres demandés */
    if(!r.ok){
      let txt=null; try{ txt=await r.text(); }catch(e){}
      if(cleRefusee(r.status, txt) && cleSuivante('windy', 'HTTP '+r.status)){
        corps.key = cleDe('windy');
        const r2=await appel(ORD_WY, WY_URL, {method:'POST',
          headers:{'Content-Type':'application/json'}, body:JSON.stringify(corps)});
        if(!r2||!r2.ok) return null;
        o=await r2.json();
      } else {
        throw new Error('HTTP '+r.status);
      }
    }
    if(!o) o=await r.json();
    /* La cle publique est une cle de test : Windy annonce lui-meme que les
       donnees sont melangees. On ne les verse pas dans le consensus. */
    if(o && o.warning && /test|shuffl/i.test(o.warning)){ WY_TEST = o.warning; return null; }
  }catch(e){ return null; }
  if(!o||!o.ts||!o.ts.length) return null;

  const vise=new Date(iso).getTime();
  let bi=-1, dt=1e15;
  for(let i=0;i<o.ts.length;i++){ const d=Math.abs(o.ts[i]-vise); if(d<dt){dt=d;bi=i;} }
  if(bi<0||dt>1.6*3.6e6) return null;

  /* on lit les unités renvoyées plutôt que de les supposer */
  /* Windy ne descend pas en altitude : il renvoie la valeur à l'altitude de sa
     maille, donnée dans l'en-tête. On corrige nous-mêmes plutôt que d'écarter
     la source : au lac du Cos, 2195 m contre une maille vers 1200 m, ça vaut
     une dizaine de degrés. */
  const altMaille = (o.header && (o.header.elevation!==undefined? o.header.elevation
                     : o.header.modelElevation)) ??
                    (o.elevation!==undefined? o.elevation : null);
  const corrige_alt = (altMaille!==null && altMaille!==undefined
                       && Math.abs(p.alt-altMaille)>30);

  const U=o.units||{};
  /* écart d'altitude à corriger, et gradient : celui du profil de pression
     du point si on l'a, sinon la valeur standard de l'atmosphère */
  const dz = (altMaille===null||altMaille===undefined)? 0 : (p.alt-altMaille);
  const grad = (typeof GRAD_LOCAL==='number' && isFinite(GRAD_LOCAL))? GRAD_LOCAL : 6.5;
  const corrT = -grad*dz/1000;
  const K=(x,cle)=>{ if(x===null) return null;
    const u=(U[cle]||'K').toLowerCase();
    const c=(u.indexOf('k')===0? x-273.15 : x)+corrT;
    return Math.round(c*10)/10; };
  const enMM=(x,cle)=>{ if(x===null) return null;
    const u=(U[cle]||'mm').toLowerCase();
    return u==='m'? x*1000 : x; };
  const enKMH=(x,cle)=>{ if(x===null) return null;
    const u=(U[cle]||'m*s-1').toLowerCase();
    return (u.indexOf('km')===0)? x : x*3.6; };
  /* la précipitation est cumulée sur le pas du modèle : on cherche la clé réelle */
  const clePluie=Object.keys(o).filter(k=>/precip/i.test(k)&&!/conv|snow/i.test(k))[0];
  const pasH=(o.ts.length>1)? Math.max(1,Math.round((o.ts[1]-o.ts[0])/3.6e6)) : 1;
  const brut=clePluie? enMM(wyVal(o,clePluie,bi), clePluie) : null;
  const pr=brut===null? null : Math.round(brut/pasH*100)/100;
  const conv=Object.keys(o).filter(k=>/convPrecip/i.test(k))[0];
  const prConv=conv? (wyVal(o,conv,bi)===null?null
    : Math.round(enMM(wyVal(o,conv,bi),conv)/pasH*100)/100) : null;
  const neigeK=Object.keys(o).filter(k=>/snowPrecip/i.test(k))[0];

  const vs=wyVent(o,'surface',bi);
  const nub=wyVal(o,'lclouds-surface',bi), num=wyVal(o,'mclouds-surface',bi),
        nuh=wyVal(o,'hclouds-surface',bi);
  const nu=(nub===null&&num===null&&nuh===null)? null
    : Math.round(100*(1-(1-(nub||0)/100)*(1-(num||0)/100)*(1-(nuh||0)/100)));
  const cape=wyVal(o,'cape-surface',bi);
  const t=K(wyVal(o,'temp-surface',bi),'temp-surface');

  const e={
    corrige_alt: corrige_alt, alt_modele: altMaille, dz_corrige: Math.round(corrT*10)/10,
    t: t, res: null, ros: K(wyVal(o,'dewpoint-surface',bi),'dewpoint-surface'),
    hum: wyVal(o,'rh-surface',bi)===null?null:Math.round(wyVal(o,'rh-surface',bi)),
    pr: pr, pr_conv: prConv, pp: null,
    neige: neigeK? (wyVal(o,neigeK,bi)===null?null:Math.round(wyVal(o,neigeK,bi)*10)/10) : null,
    nu: nu, nub: nub===null?null:Math.round(nub), num: num===null?null:Math.round(num),
    nuh: nuh===null?null:Math.round(nuh),
    sol: null, uv: null, vis: null,
    cbase: wyVal(o,'cbase-surface',bi)===null?null:Math.round(wyVal(o,'cbase-surface',bi)),
    v: vs.v, dir: vs.dir,
    raf: wyVal(o,'gust-surface',bi)===null?null:Math.round(enKMH(wyVal(o,'gust-surface',bi),'gust-surface')),
    cape: cape===null?null:Math.max(0,Math.round(cape)), li: null, iso0: null,
    pres: wyVal(o,'pressure-surface',bi)===null?null:Math.round(((o.units||{})['pressure-surface']||'pa').toLowerCase()==='pa'? wyVal(o,'pressure-surface',bi)/100 : wyVal(o,'pressure-surface',bi)),
    t850:K(wyVal(o,'temp-850h',bi),'temp-850h'), t800:K(wyVal(o,'temp-800h',bi),'temp-800h'), t700:K(wyVal(o,'temp-700h',bi),'temp-700h'),
    z850:wyVal(o,'gh-850h',bi), z800:wyVal(o,'gh-800h',bi), z700:wyVal(o,'gh-700h',bi),
    v850:wyVent(o,'850h',bi).v, v800:wyVent(o,'800h',bi).v, v700:wyVent(o,'700h',bi).v,
    alt_demandee: p.alt, source_wy: true
  };
  /* Windy ne fournit pas le ressenti : on l'approche par le refroidissement éolien */
  if(e.t!==null&&e.v!==null){
    e.res = (e.t<=10&&e.v>=5)
      ? Math.round((13.12+0.6215*e.t-11.37*Math.pow(e.v,0.16)+0.3965*e.t*Math.pow(e.v,0.16))*10)/10
      : e.t;
  }
  e.code = mbCode(e.pr||0, e.nu===null?0:e.nu, e.neige||0, (e.cape||0)>900&&(e.pr_conv||0)>0.3);
  return e;
}

async function windySerie(points, cible, modele, avance){
  const out=new Array(points.length).fill(null);
  out[0]=await windyPoint(points[0], cible(points[0]), modele);
  if(!out[0]) return out;      /* clé refusée ou modèle hors domaine : on s'arrête */
  const FILE=5;
  let i=1, faits=1;
  async function ouvrier(){
    while(i<points.length){
      const k=i++;
      out[k]=await windyPoint(points[k], cible(points[k]), modele);
      faits++;
      if(avance&&faits%10===0) avance(faits, points.length);
    }
  }
  await Promise.all(Array.from({length:FILE}, ouvrier));
  return out;
}

/* Gradient thermique local, estimé une fois par relevé depuis les profils de
   pression déjà téléchargés. Le −6,5 °C/km standard est une moyenne d'atmosphère
   libre ; en montagne le gradient de surface varie de −3 à −8 selon l'heure et
   la nébulosité. */
let GRAD_LOCAL = 6.5;
function estimerGradient(){
  const ec=[];
  for(let i=0;i<POIS.length;i++){
    const s=sonde(i);
    if(!s||!s.t||s.t.m===null) continue;
    for(let j=i+1;j<POIS.length;j++){
      const dz=POIS[i].alt-POIS[j].alt;
      if(Math.abs(dz)<600) continue;
      const s2=sonde(j);
      if(!s2||!s2.t||s2.t.m===null) continue;
      const dt=new Date(POIS[i].t[SCENARIO])-new Date(POIS[j].t[SCENARIO]);
      if(Math.abs(dt)>2.5*3.6e6) continue;      /* même moment, sinon le cycle diurne pollue */
      ec.push(-(s.t.m-s2.t.m)/dz*1000);
      break;
    }
  }
  if(ec.length<4) return;
  ec.sort((a,b)=>a-b);
  const md=ec[Math.floor(ec.length/2)];
  if(md>2.0 && md<9.5) GRAD_LOCAL=Math.round(md*10)/10;
}

/* ================= PHYSIQUE DE TERRAIN =================
   Tout ce qui suit se calcule depuis la trace GPX, sans donnée extérieure.
   Trois corrections que les modèles ne font pas à cette maille. */

/* --- 1. Position topographique le long du parcours ---
   Altitude du point moins altitude moyenne sur ±750 m de trace.
   > 0 : convexe, col ou croupe, couplé au flux libre.
   < 0 : concave, cuvette ou fond de vallon, l'air froid s'y accumule.
   Réserve : c'est un indice le long de la trace, pas un vrai indice
   topographique calculé sur un modèle numérique de terrain. Un col traversé
   dans le sens de la crête peut être mal classé. */
function _altKm(km){
  km=Math.max(0,Math.min(TRACE[TRACE.length-1][0],km));
  for(let i=0;i<TRACE.length-1;i++){
    if(km>=TRACE[i][0]&&km<=TRACE[i+1][0]){
      const f=(km-TRACE[i][0])/Math.max(1e-9,TRACE[i+1][0]-TRACE[i][0]);
      return TRACE[i][1]+f*(TRACE[i+1][1]-TRACE[i][1]);
    }
  }
  return TRACE[TRACE.length-1][1];
}
function tpiKm(km, demi){
  demi=demi||0.75;
  let s=0,n=0;
  for(let i=0;i<TRACE.length;i++){
    if(TRACE[i][0]>=km-demi&&TRACE[i][0]<=km+demi){ s+=TRACE[i][1]; n++; }
  }
  if(n<3) return 0;
  return _altKm(km)-s/n;
}

/* --- 2. Accélération du vent au relief ---
   Approximation linéaire usuelle en éolien : environ 2·H/L au sommet,
   où H est la hauteur au-dessus des creux voisins et L la demi-largeur.
   Ne s'applique qu'aux formes convexes ; une cuvette est abritée. */
function speedupKm(km){
  const t=tpiKm(km);
  if(t<-8) return Math.max(0.55, 1+t/90);
  if(t<8)  return 1.0;
  let mn=1e9;
  for(let i=0;i<TRACE.length;i++)
    if(TRACE[i][0]>=km-2&&TRACE[i][0]<=km+2) mn=Math.min(mn,TRACE[i][1]);
  const H=_altKm(km)-mn;
  if(H<=15) return 1.0;
  const seuil=_altKm(km)-H/2;
  let g=km-2, d=km+2;
  for(let i=0;i<TRACE.length;i++){
    if(TRACE[i][0]<km&&TRACE[i][1]<=seuil) g=TRACE[i][0];
    if(TRACE[i][0]>km&&TRACE[i][1]<=seuil){ d=TRACE[i][0]; break; }
  }
  const L=Math.max(120,(d-g)*1000/2);
  return Math.min(2.0, 1+2*H/L);
}

/* --- 3. Température du thermomètre mouillé (approximation de Stull) ---
   La limite pluie-neige suit l'humide, pas le sec : par air sec il peut
   neiger à 3 ou 4 °C au thermomètre sec. */
function humide(T, HR){
  if(T===null||HR===null||HR<=0) return null;
  const h=Math.max(1,Math.min(100,HR));
  return T*Math.atan(0.151977*Math.sqrt(h+8.313659))
       + Math.atan(T+h) - Math.atan(h-1.676331)
       + 0.00391838*Math.pow(h,1.5)*Math.atan(0.023101*h) - 4.686035;
}

/* --- 4. Ressenti corrigé du terrain ---
   Le ressenti des modèles est calculé sans soleil et pour un corps immobile,
   à l'altitude lissée de la maille. On y ajoute trois choses. */
function ressTerrain(e, p, nuit){
  if(!e || e.res===null||e.res===undefined) return null;
  let R=e.res;

  // (a) rayonnement solaire : jusqu'à environ 8 °C de gain sur un corps exposé
  if(!nuit && e.ray!==null && e.ray!==undefined && e.ray>50)
    R += Math.min(8.0, e.ray/120.0);

  // (b) vent réel du lieu : accéléré sur un col, freiné dans une cuvette.
  //     On corrige l'écart de refroidissement entre le vent modèle et celui-ci.
  const su=speedupKm(p.km);
  if(e.v!==null && e.v!==undefined && Math.abs(su-1)>0.05){
    const f=v=>0.6*Math.sqrt(Math.max(0,v));
    R -= (f(e.v*su)-f(e.v));
  }

  // (c) accumulation d'air froid : nuit claire, vent faible, forme concave.
  //     C'est le mécanisme qui gèle un fond de vallon sous ciel dégagé.
  const t=tpiKm(p.km);
  if(nuit && t<-15){
    const ciel = (e.nu===null||e.nu===undefined)? 0.5 : Math.max(0,(60-e.nu)/60);
    const calme= (e.v===null||e.v===undefined)? 0.5 : Math.max(0,(10-e.v)/10);
    R -= Math.min(4.0, (-t-15)/12) * ciel * calme;
  }
  return Math.round(R*10)/10;
}

};
