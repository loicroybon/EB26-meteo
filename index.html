/* ---- Risque orageux ----
   Le parametre qui decide des coupures de parcours, donc celui qui ne se lit pas
   comme les autres : ce qui compte n'est pas la mediane mais le PIRE CAS
   CREDIBLE. A Belledonne vendredi 13h18 la mediane donne 280 J/kg quand ECMWF
   IFS en annonce 980 - la dispersion de 900 EST l'information, et un
   organisateur regarde le haut de la fourchette, pas son milieu.

   Trois entrees, toutes relevees et verifiees presentes :
     - CAPE, cinq modeles, lue au quantile HAUT ;
     - indice de soulevement LI, fourni par GFS seul, negatif = instable ;
     - code temps OMM, 95 et au-dela signalant l'orage.

   La vigilance officielle de Meteo-France demande une cle d'API - verifie, elle
   repond 401 sans - donc elle n'est pas integrable ici. Cet indice ne la
   remplace pas et ne pretend pas le faire.

   Seuils de l'usage operationnel, abaisses pour la montagne : le relief fournit
   le declencheur, une CAPE modeste y suffit la ou il en faudrait le double en
   plaine. */
/* Maille de chaque modele, en km. null = pas de maille au sens propre : MOS
   statistique ou echo post-traite d'un autre modele. */
const MAILLE_KM = {
  meteofrance_arome_france_hd: 1.3, arome_direct: 1.3, windy_arome: 1.3,
  meteoswiss_icon_ch1: 1.0, meteoswiss_icon_ch2: 2.0,
  dwd_icon_d2: 2.2, windy_iconD2: 2.2,
  italia_meteo_arpae_icon_2i: 2.2, windy_aladin: 2.3,
  meteofrance_arome_france: 2.5,
  knmi_harmonie_arome_europe: 5.5,
  dwd_icon_eu: 7.0, windy_iconEu: 7.0,
  ecmwf_ifs025: 9.0, ukmo_global_deterministic_10km: 10.0,
  meteofrance_arpege_europe: 11.0, dwd_icon_global: 11.0,
  gfs_seamless: 13.0, windy_gfs: 13.0,
  ecmwf_aifs025_single: 28.0, gfs_graphcast025: 28.0,
  meteoblue: null, metno_seamless: null, metno_direct: null,
  jma_seamless: null, cma_grapes_global: null, bom_access_global: null
};

/* ---- Qui a le droit de voter sur l'orage ----
   En montagne, un risque orageux annonce par un modele a 13 km ne veut rien
   dire : la convection alpine tient dans un vallon, et une maille de 13 km ne
   represente meme pas le relief qui la declenche. Un modele global ne se trompe
   pas sur la masse d'air, il se trompe sur le fait qu'il puisse s'y passer
   quelque chose de local.

   Seuil pose a 3 km, pour ce parametre SEULEMENT : ces modeles continuent de
   voter sur la temperature, la pluie et le vent, ou leur maille n'est pas
   disqualifiante. Un modele sans maille propre - MOS ou post-traitement - ne
   vote pas non plus : on ne sait pas a quelle resolution sa convection est
   resolue. */
const ORAGE_MAILLE_MAX = 3;
function finPourOrage(id){
  const m = MAILLE_KM[id];
  return m !== null && m !== undefined && m <= ORAGE_MAILLE_MAX;
}

const ORAGE_MOTS = ['nul', 'faible', 'mod\u00e9r\u00e9', 'fort'];
/* Deux sondes et non une, parce que les deux affirmations ne demandent pas la
   meme resolution.

   ACCUSER demande une maille fine : dire qu'un orage se declenche ICI suppose de
   representer le vallon qui le declenche. C'est la CAPE et le code temps, lus
   sur `s`, deja filtre a 3 km par l'appelant.

   OPPOSER UN VETO n'en demande pas : un indice de soulevement positif dit que la
   masse d'air est capee sur des dizaines de kilometres, ce qu'un modele global
   decrit correctement - c'est meme ce pour quoi il est bon. Il se lit donc sur
   `sLarge`, tous modeles confondus. Sans cela le veto serait inerte, l'indice
   n'etant fourni que par GFS, a 13 km, donc exclu du vote.

   Une maille large ne peut pas accuser, elle peut disculper. */
function risqueOrage(s, sLarge){
  if(!s) return null;
  const q = (k, w) => (s[k] && s[k][w]!==null && s[k][w]!==undefined)? s[k][w] : null;
  const src = sLarge || s;
  const qL = (k, w) => (src[k] && src[k][w]!==null && src[k][w]!==undefined)? src[k][w] : null;
  const capeHi = q('cape','hi'), capeM = q('cape','m');
  /* Deux lectures distinctes de l'indice de soulevement, et c'est tout l'objet :
     liFin  - mailles fines seules, seul autorise a ACCUSER ;
     liVeto - tous modeles, seul autorise a DISCULPER.
     Les confondre faisait accuser GFS a 13 km, dont le LI de -2 portait a lui
     seul un niveau modere que ni ICON-CH2 ni ICON-2I ne voyaient. */
  const liFin = q('li','m'), liVeto = qL('li','m');
  const code = cielCoherent(s);
  /* Residu du renommage de la v66 corrige ici : cette garde lisait encore `li`,
     nom qui n'existe plus. Le court-circuit de && la protegeait tant que capeHi
     n'etait pas nul, donc pour tous les modeles Open-Meteo ; AROME, lu depuis le
     GRIB, n'a pas de CAPE et faisait echouer dessine() en silence. */
  if(capeHi===null && liFin===null && liVeto===null && (code===null||code<95)) return null;
  let n = 0;
  /* Un code convectif ACCUSE l'occurrence, il ne prononce pas l'intensite. Il
     posait le sommet de l'echelle a lui seul : mesure aux points 5 et 6, "orage
     fort" sur 30 J/kg de CAPE et sans indice de soulevement. Or 95 vaut "orage
     faible ou modere" dans la nomenclature WMO elle-meme, et les crans de grele
     sont distincts. Le code pose donc un PLANCHER, et l'energie escalade depuis
     ce plancher par les seuils qui la justifient - voir plus bas. */
  if(code!==null && code>=95){
    if(code>=99) n = Math.max(n, 3);        /* orage avec forte grele */
    else if(code>=96) n = Math.max(n, 2);   /* orage avec grele legere */
    else n = Math.max(n, 1);                /* 95 : orage faible ou modere */
  }
  /* Seuils de l'usage operationnel, et non abaisses "pour la montagne". La
     precaution montagnarde est deja portee par le choix du quantile HAUT : la
     compter une seconde fois en divisant les seuils par deux decalait tout le
     bareme d'un cran et sur-evaluait le risque. */
  if(capeHi!==null){
    if(capeHi >= 2500) n = Math.max(n, 3);
    else if(capeHi >= 1000) n = Math.max(n, 2);
    else if(capeHi >= 300) n = Math.max(n, 1);
  }
  /* Escalade : mailles fines uniquement. */
  if(liFin!==null){
    if(liFin <= -5) n = Math.max(n, 3);
    else if(liFin <= -2) n = Math.max(n, 2);
    else if(liFin < 0)   n = Math.max(n, 1);
  }
  /* Veto : n'importe quel modele. Un LI positif dit que la masse d'air est capee
     sur des dizaines de kilometres, ce qu'une maille large decrit correctement. */
  if(liVeto!==null){
    /* Veto de stabilite. La CAPE dit l'energie disponible, le LI dit si une
       parcelle peut monter : un LI franchement positif signifie une atmosphere
       capee, ou l'energie reste enfermee sous l'inversion. Les deux grandeurs
       sont complementaires et non interchangeables - les traiter par un simple
       maximum classait Vizille en risque FORT au depart le 19/08, sur une CAPE
       haute de 1050 J/kg alors que le LI valait +2. Fausse alerte au point le
       plus frequente du parcours.
       Exception necessaire : un code temps d'orage n'est pas contredit par un
       indice que seul GFS fournit. */
    if(liVeto >= 1 && (code===null || code < 95)) n = Math.min(n, 1);
  }
  return {n: n, mot: ORAGE_MOTS[n], cape: capeM, capeHi: capeHi,
          li: liFin, liVeto: liVeto};
}

/* Synthese sur la fenetre. On distingue le PIC de la periode de surveillance :
   melanger les deux fait lire treize heures de risque fort la ou le pic tient en
   quatre, et masque justement les quatre heures sur lesquelles la decision se
   prend. Mesure du 18/08 : niveau fort de 14 h a 17 h vendredi, modere de 7 h a
   19 h, samedi stable. */
function orageFenetre(niveaux, heures){
  const vus = niveaux.filter(v => v!==null && v!==undefined);
  if(!vus.length) return ['risque orageux', '\u2014', 'donn\u00e9e absente', ''];
  const pire = Math.max.apply(null, vus);
  if(pire <= 1)
    return ['risque orageux', ORAGE_MOTS[pire],
            pire? 'instabilit\u00e9 faible, sans orage' : 'atmosph\u00e8re stable', ''];

  /* fenetre du pic, et fenetre plus large de surveillance */
  const plage = seuil => {
    let n = 0, deb = null, fin = null;
    for(let i=0;i<niveaux.length;i++){
      const v = niveaux[i];
      if(v===null || v===undefined || v < seuil) continue;
      n++; if(deb===null) deb = heures[i]; fin = heures[i];
    }
    return {n: n, deb: deb, fin: fin};
  };
  const pic = plage(pire), surv = plage(2);
  const dire = p => (p.deb===p.fin? p.deb : p.deb+' \u2192 '+p.fin);
  let note = pic.n + ' h \u00b7 ' + dire(pic);
  /* la periode de surveillance n'est rappelee que si elle deborde le pic */
  if(surv.n > pic.n) note += ' \u00b7 \u00e0 surveiller d\u00e8s ' + surv.deb;
  return ['risque orageux', ORAGE_MOTS[pire], note,
          pire>=3? 'var(--alerte)' : 'var(--chaud)'];
}

function cielCoherent(s){
  if(!s) return null;
  const nu = (s.nu && s.nu.m!==null && s.nu.m!==undefined)? s.nu.m : null;
  if(nu===null) return (s.code!==null&&s.code!==undefined)? s.code : null;
  const pr = (s.pr && s.pr.m!==null)? s.pr.m
           : ((s.pr_moy && s.pr_moy.m!==null)? s.pr_moy.m : 0);
  const neige = (s.neige && s.neige.m!==null)? s.neige.m : 0;
  /* capeAdmis et non cape : la CAPE d'une maille large ne suffit pas a dire
     qu'un orage eclate ICI. Le code, lui, est deja filtre dans agrege(). */
  const orage = (s.code!==null && s.code>=95)
             || (s.capeAdmis!==null && s.capeAdmis!==undefined && s.capeAdmis>900);
  return mbCode(pr||0, nu, neige, !!orage);
}
function phraseMeteo(s, p){
  if(!s||!s.t) return '';
  const bouts=[];
  const cc = cielCoherent(s);
  const ciel = (cc!==null&&cc!==undefined)? (WMO[cc]||'') : '';
  if(ciel) bouts.push(ciel.charAt(0).toUpperCase()+ciel.slice(1));
  const v = s.v&&s.v.m!==null? s.v.m : null;
  const mv = motVent(v);
  if(mv) bouts.push(mv + (s.dir&&s.dir.m!==null? ' de '+cap(s.dir.m) : ''));
  if(s.res&&s.t&&Math.abs(s.res.m-s.t.m)>=2)
    bouts.push('ressenti '+Math.round(s.res.m)+'\u00b0');
  return bouts.join(' \u00b7 ');
}

function alertesSimples(s, p){
  const A=[];
  /* hiC et non hi : au point 11, hi valait 95 km/h sur le seul HARMONIE quand le
     deuxieme modele disait 36. Une valeur annoncee doit etre atteinte par deux
     modeles au moins. */
  const rafH = (s.raf && s.raf.hiC!==null && s.raf.hiC!==undefined)? s.raf.hiC : null;
  if(rafH!==null && rafH>60) A.push(['\u26a0','Rafales jusqu\'\u00e0 '+Math.round(rafH)+' km/h']);
  else if(rafH!==null && rafH>40) A.push(['\u2691','Rafales '+Math.round(rafH)+' km/h']);
  /* meme derivation que partout ailleurs : le code brut pouvait valoir 0 sur un
     ciel d'orage et l'alerte ne se levait pas */
  /* L'alerte d'orage se lit sur les seules mailles fines, comme partout
     ailleurs. Les entrees de POIS ne portent pas leur indice - verifie - donc on
     le retrouve par identite, ce qui reste exact meme si deux points portaient
     le meme nom. */
  const iP = POIS.indexOf(p);
  const sO = (iP >= 0)? sonde(iP, finPourOrage) : null;
  const rO = risqueOrage(sO, s);
  if(rO && rO.n >= 2) A.push(['\u26a1','Risque d\'orage \u2014 '+rO.mot]);
  if(s.cbase&&s.cbase.m!==null&&s.cbase.m<p.alt) A.push(['\u2601','Vous serez dans les nuages']);
  if(s.res&&s.res.loC!==null&&s.res.loC!==undefined&&s.res.loC<3)
    A.push(['\u2744','Ressenti possible \u00e0 '+Math.round(s.res.loC)+'\u00b0']);
  if(s.pr&&s.pr.hiC!==null&&s.pr.hiC!==undefined&&s.pr.hiC>2)
    A.push(['\u2614','Averses jusqu\'\u00e0 '+s.pr.hiC.toFixed(1)+' mm/h']);
  return A;
}

/* chaque bloc se rend isolément : si l'un échoue, les autres s'affichent quand même */
function rendreTout(){
  try{ majCouverture(); }catch(e){}
  try{ estimerGradient(); }catch(e){}
  const etapes=[['selecteur',majSelecteurModele],['etat',majEtat],['meteogramme',dessine],
    ['resume',resumeSegment],['hero',heroRender],['heures',heuresRender],
    ['fiche',fiche],['sms',majSMS],['tableau',tableauTous]];
  const casses=[];
  etapes.forEach(function(e){ try{ e[1](); }catch(err){ casses.push(e[0]+' : '+err.message); } });
  if(casses.length) console.warn('rendu partiel \u2014 '+casses.join(' | '));
}

function heroRender(){
  const el=q('#hero'); if(!el) return;
  const p=POIS[SEL], s=Object.keys(DATA).length? sonde(SEL):null;
  if(!s){ el.innerHTML=''; el.style.display='none'; return; }
  el.style.display='';
  const nuit = (()=>{ const hh=new Date(p.t[SCENARIO]).getHours(); return hh>=21||hh<6; })();
  const svg='<svg viewBox="0 0 64 64" width="62" height="62" aria-hidden="true">'
    +picto(cielCoherent(s), 32, 30, 19, nuit)+'</svg>';
  const T=s.t&&s.t.m!==null? Math.round(s.t.m) : '\u2014';
  const pr=s.pr&&s.pr.m!==null? s.pr.m : 0;
  const proba=s.pp&&s.pp.m!==null? Math.round(s.pp.m) : null;

  let h='<div class="htete"><span class="hlieu">'+p.nom+'</span>'
      +'<span class="hquand">'+hhmm(p.t[SCENARIO])+' \u00b7 '+p.alt+' m \u00b7 km '+p.km.toFixed(0)+'</span></div>'
    +'<div class="hcorps">'+svg
    +'<div class="hchiffre"><b>'+T+'\u00b0</b>'
    +(s.t? '<em>'+Math.round(s.t.lo)+'\u00b0 \u00e0 '+Math.round(s.t.hi)+'\u00b0</em>':'')+'</div>'
    +'<div class="hmots">'+phraseMeteo(s,p)+'</div></div>';

  const tuiles=[
    ['\u2614', proba!==null? proba+' %' : (pr>0.05? pr.toFixed(1)+' mm':'0'), 'pluie'],
    ['\uD83D\uDCA8', s.raf&&s.raf.m!==null? Math.round(s.raf.m)+'' : '\u2014', 'rafales km/h'],
    ['\u2601', s.nu&&s.nu.m!==null? Math.round(s.nu.m)+' %' : '\u2014', 'nuages'],
    ['\u2600', s.sol&&s.sol.m!==null? Math.round(s.sol.m/36)+' %' : '\u2014', 'soleil']
  ];
  h+='<div class="htuiles">';
  tuiles.forEach(t=>{ h+='<div class="tuile"><s>'+t[2]+'</s><b>'+t[1]+'</b></div>'; });
  h+='</div>';

  const A=alertesSimples(s,p);
  if(A.length) h+='<div class="halertes">'
    +A.map(a=>'<span>'+a[0]+' '+a[1]+'</span>').join('')+'</div>';
  el.innerHTML=h;
}

/* bande horaire : le format que tout le monde reconnaît */
function heuresRender(){
  const el=q('#heures'); if(!el) return;
  if(!JALONS.length) JALONS=construireJalons();
  const bornes=fenetre();
  const t0=new Date(POIS[0].t[SCENARIO]).getTime();
  let h='';
  for(let k=bornes[0];k<=bornes[1] && k<JALONS.length;k++){
    const j=JALONS[k], s=Object.keys(DATA).length? sondeJalon(k):null;
    const d=new Date(t0+j.h*3.6e6);
    const hh=d.getHours(), nuit=hh>=21||hh<6;
    const jour=['dim','lun','mar','mer','jeu','ven','sam'][d.getDay()];
    const svg='<svg viewBox="0 0 44 44" width="34" height="34" aria-hidden="true">'
      +(s? picto(cielCoherent(s),22,20,12,nuit) : '')+'</svg>';
    const T=s&&s.t&&s.t.m!==null? Math.round(s.t.m)+'\u00b0' : '\u2014';
    const pp=s&&s.pp&&s.pp.m!==null? Math.round(s.pp.m) : null;
    const raf=s&&s.raf&&s.raf.m!==null? Math.round(s.raf.m) : null;
    h+='<div class="hcarte'+(hh===0||k===bornes[0]?' jour':'')+'">'
      +'<s>'+(hh===0||k===bornes[0]? jour+' ':'')+String(hh).padStart(2,'0')+'h</s>'
      +svg+'<b>'+T+'</b>'
      +'<i class="pp">'+(pp!==null&&pp>=15? pp+'%':'')+'</i>'
      +'<i class="rf'+(raf>60?' fort':raf>40?' moyen':'')+'">'+(raf!==null? raf:'')+'</i>'
      +'<u>'+Math.round(j.alt)+'</u></div>';
  }
  el.style.display = h? '' : 'none';
  el.innerHTML=h;
}

/* ---------- fiche POI ---------- */
function fiche(){
  const p=POIS[SEL], s=Object.keys(DATA).length? sonde(SEL):null;
  const f=q('#fiche');
  const nDispo=modelesDisponibles().length;
  /* Lien vers le site public de Windy, centre sur le point.
     Pourquoi un lien et pas la carte embarquee : le Map Forecast API gratuit est
     lui aussi un niveau "Testing", declare "not intended for production", limite
     a GFS seul et a trois couches - vent, temperature, pression - donc SANS
     couche nuages, justement celle qui servirait ici. Le site public, lui, est
     gratuit, sans cle, sans restriction d'usage, et donne toutes les couches.
     Un lien ne pese rien, n'ajoute aucune dependance externe au fichier unique,
     et ne casse rien si Windy est injoignable en montagne. */
  const wy = 'https://www.windy.com/?clouds,'+p.lat.toFixed(3)+','+p.lon.toFixed(3)+',11';
  let h='<h3>'+p.nom+'</h3><div class="meta">km '+p.km.toFixed(1)+' \u00b7 '+p.alt+' m \u00b7 '
    +hhmm(p.t[SCENARIO])
    +' \u00b7 <a href="'+wy+'" target="_blank" rel="noopener noreferrer"'
    +' style="color:var(--froid)">nuages sur Windy \u2197</a></div>';
  if(!s){ h+='<div class="note" style="margin-top:12px">Pas encore de données. Lance « Interroger les modèles ».</div>';
    f.innerHTML=h; return; }

  /* null-safe : un modèle qui ne fournit pas la variable ne casse plus le rendu */
  const V=(o,d=1,su='')=> (o&&o.m!==null&&o.m!==undefined)? o.m.toFixed(d)+su : '—';
  const E=(o,d=0,su='')=> (o&&o.lo!==null&&o.lo!==undefined)? o.lo.toFixed(d)+' à '+o.hi.toFixed(d)+su : '';

  /* Le verdict d'orage de la fiche vient du moteur, il ne s'invente pas ici.
     Meme sonde de maille fine que le bandeau et que les alertes. */
  const sO = sonde(SEL, finPourOrage);
  const rO = risqueOrage(sO, s);
  const ccF=cielCoherent(s);
  if(ccF!==null) h+='<div style="margin:10px 0 2px;font-size:15px">'+(WMO[ccF]||'—')+'</div>';
  if(!MODELE_ACTIF && s.lignes.length<nDispo)
    h+='<div class="note alerte" style="margin:4px 0 0">'+s.lignes.length+'/'+nDispo
      +' mod\u00e8les couvrent ce point</div>';
  if(s.confiance){
    const c=s.confiance;
    const coul = c.niveau==='bonne'?'var(--accord)':c.niveau==='moyenne'?'var(--chaud)':'var(--alerte)';
    h+= (s.lignes.length<2)
      ? '<div class="note alerte" style="margin:4px 0 0">mod\u00e8le unique \u2014 aucune incertitude mesur\u00e9e</div>'
      : '<div class="note" style="margin:4px 0 0">confiance <b style="color:'+coul+'">'+c.niveau
        +'</b> \u00b7 '+c.familles+' source'+(c.familles>1?'s':'')
        +' \u00b7 \u00b1'+(c.etendue/2).toFixed(1)+' \u00b0C</div>';
  }
  const en=ENS[p.nom];
  if(en) h+='<div class="note" style="margin:4px 0 0;color:var(--froid)">ens. '+en.membres+'m \u00b7 '
    +'pluie '+(en.pluie02!==null?en.pluie02+'%':'?')
    /* fourchette interquartile : ce qu'un chiffre unique cache */
    +(en.pr75!==null? ' \u00b7 '+en.pr25+'\u2013'+en.pr75+' mm/h':'')
    +(en.pluie1!==null? ' (>1mm '+en.pluie1+'%)':'')
    +(en.rafP90!==null? ' \u00b7 raf '+en.rafP50+'/'+en.rafP90:'')
    +(en.raf50!==null? ' (>50 '+en.raf50+'%)':'')
    +' \u00b7 T '+en.t10+'\u2013'+en.t90+'\u00b0</div>';

  h+='<div class="gros">'
   +'<div><b style="color:'+couleurT(s.t?s.t.m:null)+'">'+V(s.t,1,'°')+'</b><s>température</s>'
     +'<div class="spread">'+E(s.t,0,'°')+'</div></div>'
   +'<div><b>'+V((s.ressT&&s.ressT.m!==null)? s.ressT : s.res,1,'°')+'</b><s>ressenti terrain</s>'
     +((s.ressT&&s.res&&s.ressT.m!==null&&Math.abs(s.ressT.m-s.res.m)>=1)
        ? '<div class="spread">modèles '+s.res.m.toFixed(1)+'°</div>':'')+'</div>'
   +'<div><b style="color:'+(s.pr&&s.pr.m>0.2?'var(--pluie)':'')+'">'+V(s.pr,1,'')+'</b><s>pluie mm/h</s>'
     +'<div class="spread">'+(s.pp&&s.pp.m!==null? V(s.pp,0,' % de risque') : (s.pr?'max '+V(s.pr,1,' mm'):''))+'</div></div>'
   +'<div><b>'+V(s.raf,0,'')+'</b><s>rafales km/h</s>'
     +'<div class="spread">moyen '+V(s.v,0,'')+' de '+cap(s.dir?s.dir.m:null)+'</div></div>'
   +'</div>';

  /* grille secondaire : ce qu'on ne lit pas d'un coup d'oeil mais qui décide de l'équipement */
  const soleil = s.sol&&s.sol.m!==null? Math.round(s.sol.m/36) : null;
  const cellules=[
    ['air libre \u00e0 l\'altitude', V(s.tlibre,1,'\u00b0'),
      s.ecart_relief&&s.ecart_relief.m!==null? 'relief mod\u00e8le '+(-s.ecart_relief.m).toFixed(0)+' m sous le point':''],
    ['vent de cr\u00eate', V(s.vcrete,0,' km/h'), 'niveau de pression, pas le 10 m'],
    ['couverture nuageuse', s.nu&&s.nu.m!==null? V(s.nu,0,' %'):'—',
      s.nub&&s.nub.m!==null? 'basses '+V(s.nub,0)+' · moy '+V(s.num,0)+' · hautes '+V(s.nuh,0):''],
    ['ensoleillement', soleil!==null? soleil+' %':'—',
      s.ray&&s.ray.m!==null? V(s.ray,0)+' W/m²':''],
    ['humidité', V(s.hum,0,' %'), s.ros&&s.ros.m!==null? 'rosée '+V(s.ros,1,'°'):''],
    ['vent du lieu', V((s.vterrain&&s.vterrain.m!==null)? s.vterrain : s.v,0,' km/h'),
      (s.speedup&&s.speedup.m!==null&&Math.abs(s.speedup.m-1)>0.05
        ? (s.speedup.m>1? 'accéléré ×'+s.speedup.m.toFixed(2)+' par le relief'
                        : 'abrité ×'+s.speedup.m.toFixed(2)+' en creux')
        : 'de '+cap(s.dir?s.dir.m:null))],
    ['visibilité', s.vis&&s.vis.m!==null? (s.vis.m/1000).toFixed(1)+' km':'—',
      s.vis&&s.vis.m<1000? 'brouillard' : ''],
    ['indice UV', V(s.uv,1), soleil!==null&&soleil>50? 'crème et lunettes':''],
    ['thermomètre mouillé', V(s.tw,1,'°'),
      (s.tw&&s.tw.m!==null)? (s.tw.m<1.5? 'neige possible ici':'pluie') : ''],
    ['forme du terrain', (s.tpi&&s.tpi.m!==null)?
      (s.tpi.m>12? 'col ou croupe' : (s.tpi.m<-12? 'cuvette' : 'versant')) : '—',
      (s.tpi&&s.tpi.m!==null)? ((s.tpi.m>0?'+':'')+s.tpi.m.toFixed(0)+' m sur 1,5 km') : ''],
    ['limite pluie-neige', s.iso0&&s.iso0.m!==null? V(s.iso0,0,' m') : V(s.iso0calc,0,' m'),
      (s.iso0&&s.iso0.m!==null? (s.iso0.m-p.alt).toFixed(0)
       : (s.iso0calc&&s.iso0calc.m!==null? (s.iso0calc.m-p.alt).toFixed(0):null))!==null?
      'au-dessus du point':'au-dessus du sommet du profil'],
    /* La valeur de l'indice reste celle de tous les modeles - c'est une mesure,
       elle est honnete telle quelle. Le VERDICT d'instabilite, lui, est une
       accusation : il se lit sur les mailles fines, comme partout ailleurs. */
    ['indice de soul\u00e8vement', V(s.li,1),
      (rO && rO.li!==null && rO.li<-2)?'atmosph\u00e8re instable':''],
    /* Le mot du moteur, et non une seconde echelle. L'ancienne case ne savait pas
       dire "nul" : sous 300 J/kg elle ecrivait "faible", si bien que la fiche de
       CHAQUE point annoncait un risque d'orage permanent, sur des seuils qui
       n'etaient pas ceux du moteur et sans filtre de maille. Faute de donnee
       admissible elle vaut tiret, et le filtre en fin de tableau la retire. */
    ['risque d\u2019orage', rO? rO.mot : '\u2014',
      (rO && rO.capeHi!==null && rO.capeHi!==undefined)?
        Math.round(rO.capeHi)+' J/kg de CAPE (mailles fines)':''],
    ['neige', V(s.neige,1,' cm'), ''],
    ['pression', V(s.pres,0,' hPa'), '']
  ].filter(c=>c[1]!=='—');

  h+='<div class="grille">';
  cellules.forEach(c=>{ h+='<div class="cel"><s>'+c[0]+'</s><b>'+c[1]+'</b>'
    +(c[2]?'<em>'+c[2]+'</em>':'')+'</div>'; });
  h+='</div>';

  const risques=[];
  /* Cette ligne se levait sur la CAPE maximale de TOUS les modeles : le plus
     convectif des globaux suffisait a l'ecrire. Elle suit desormais le seuil du
     moteur, sur les seules mailles fines, et ne parait qu'a partir de "modere". */
  if(rO && rO.n>=2){
    /* Nommer le declencheur reel. La phrase precedente attribuait le verdict a la
       CAPE en toute circonstance, et affichait "CAPE jusqu'a 30 J/kg - potentiel
       orageux" quand c'etait le code temps qui avait parle. Une justification qui
       contredit son propre chiffre ruine la confiance dans toute la page. */
    const ing=[];
    if(rO.capeHi!==null && rO.capeHi!==undefined && rO.capeHi>=1000)
      ing.push('CAPE '+Math.round(rO.capeHi)+' J/kg');
    if(rO.li!==null && rO.li!==undefined && rO.li<=-2)
      ing.push('indice de soul\u00e8vement '+rO.li.toFixed(1));
    risques.push('potentiel orageux '+rO.mot
      +(ing.length? ' \u2014 '+ing.join(', ') : ' \u2014 code convectif d\'un mod\u00e8le fin'));
  }
  /* Lue sur l'enveloppe, cette alerte franchissait 55 km/h a SEPT points du
     parcours ; sur la statistique centrale, a UN seul. Et six modeles differents
     se relayaient pour porter le maximum. */
  if(s.raf&&s.raf.hiC!==null&&s.raf.hiC!==undefined&&s.raf.hiC>55)
    risques.push('rafales possibles à '+s.raf.hiC.toFixed(0)+' km/h');
  if(s.iso0&&s.iso0.loC!==null&&s.iso0.loC!==undefined&&s.iso0.loC<p.alt+200)
    risques.push('isotherme 0 °C proche du point ('+s.iso0.loC.toFixed(0)+' m)');
  if(s.res&&s.res.loC!==null&&s.res.loC!==undefined&&s.res.loC<3)
    risques.push('ressenti jusqu\'à '+s.res.loC.toFixed(0)+' °C');
  if(s.ressT&&s.res&&s.ressT.m!==null&&s.ressT.m<s.res.m-1.5)
    risques.push('creux par nuit claire : '+(s.res.m-s.ressT.m).toFixed(0)+' °C sous la maille');
  if(s.speedup&&s.speedup.m>1.35)
    risques.push('vent accéléré ×'+s.speedup.m.toFixed(2)+' par le relief');
  if(s.vis&&s.vis.loC!==null&&s.vis.loC!==undefined&&s.vis.loC<500)
    risques.push('visibilité réduite à '+(s.vis.loC/1000).toFixed(1)+' km');
  if(s.t&&s.t.hi-s.t.lo>8) risques.push('désaccord des modèles : '+(s.t.hi-s.t.lo).toFixed(0)+' °C d\'écart');
  if(risques.length) h+='<div class="note alerte" style="margin:10px 0">⚠ '+risques.join(' · ')+'</div>';

  h+='<div class="tw"><table><thead><tr><th>Mod\u00e8le</th><th>Poids</th><th>T</th><th>Air libre</th>'
   +'<th>Ress.</th><th>Hum.</th><th>Nuages</th><th>Pluie</th><th>Vent</th><th>Cr\u00eate</th>'
   +'<th>Raf.</th><th>Dir.</th></tr></thead><tbody>';
  const L=(o,k,d,su)=> (o[k]===null||o[k]===undefined)? '—' : o[k].toFixed(d)+su;
  if(s.lignes.length>1){
    h+='<tr class="consensus"><td>Consensus pond\u00e9r\u00e9 ('+s.lignes.length+')</td><td>'
     +(s.confiance?s.confiance.poidsTotal:'')+'</td><td>'+V(s.t,1)+'</td><td>'+V(s.tlibre,1)+'</td><td>'
     +V(s.res,1)+'</td><td>'+V(s.hum,0)+'</td><td>'+V(s.nu,0)+'</td><td>'+V(s.pr,1)+'</td><td>'
     +V(s.v,0)+'</td><td>'+V(s.vcrete,0)+'</td><td>'+V(s.raf,0)+'</td><td>'+cap(s.dir?s.dir.m:null)+'</td></tr>';
  }
  s.lignes.slice().sort((a,b)=>b.poids-a.poids).forEach(l=>{
    const rel = l.source_wy? 'via Windy \u00b7 points seulement, absent du m\u00e9t\u00e9ogramme'
      : l.source_mb? 'correction statistique sur le relief \u00b7 pas de niveaux de pression'
      : (l.ecart_relief===null||l.ecart_relief===undefined)? 'maille non sond\u00e9e'
      : 'relief mod\u00e8le '+Math.round(l.alt_modele)+' m ('+(l.ecart_relief>0?'+':'')+l.ecart_relief+' m)';
    h+='<tr'+(l.doublon?' style="opacity:.45"':(l.divergent?' style="opacity:.62"':''))+'><td>'+l.nom
     +(l.doublon?' <span style="color:var(--brume)">doublon</span>':'')
     +(l.divergent&&!l.doublon?' <span style="color:var(--chaud)">\u26a0 diverge</span>':'')
     +'</td>'
     +'<td>'+l.poids.toFixed(2)+'</td>'
     +'<td>'+L(l,'t',1,'')+'</td><td>'+L(l,'tlibre',1,'')+'</td><td>'+L(l,'res',1,'')+'</td>'
     +'<td>'+L(l,'hum',0,'')+'</td><td>'+L(l,'nu',0,'')+'</td><td>'+L(l,'pr',1,'')+'</td>'
     +'<td>'+L(l,'v',0,'')+'</td><td>'+L(l,'vcrete',0,'')+'</td><td>'+L(l,'raf',0,'')+'</td>'
     +'<td>'+cap(l.dir)+'</td></tr>';
  });
  h+='</tbody></table></div><div class="note" style="margin-top:8px">T, ressenti et rosée en °C · humidité, '
   +'nuages et soleil en % · pluie en mm/h · vent et rafales en km/h · visibilité en km. '
   +'\u00ab Air libre \u00bb = temp\u00e9rature lue sur le profil de pression \u00e0 '+p.alt
   +' m, sans extrapolation depuis le relief du mod\u00e8le. \u00ab Cr\u00eate \u00bb = vent au niveau '
   +'de pression du point, plus repr\u00e9sentatif qu\u2019un vent 10 m. Le poids tient compte de la '
   +'finesse de maille et du fait que plusieurs mod\u00e8les partagent la m\u00eame analyse. '
   +'Un tiret signifie que le modèle ne fournit pas la variable, pas qu\'elle vaut zéro.</div>';
  f.innerHTML=h;
}

  q('#chips').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed', (+c.dataset.i===SEL)+''));
}

  const V=(o,d=0)=> (o&&o.m!==null&&o.m!==undefined)? o.m.toFixed(d) : '\u2014';
  let segCourant=-1;

    const p=POIS[i];
    if(!SEG){
      const tr=SEGMENTS.filter(s=>p.km>s.km0-0.4&&p.km<=s.km1+0.4)[0];
      if(tr&&tr.n!==segCourant){ segCourant=tr.n;
        h+='<tr><td colspan="13" style="background:#1A2438;color:var(--chaud);font-size:11px;padding:6px">S'
         +String(tr.n).padStart(2,'0')+' \u00b7 '+tr.de+' \u2192 '+tr.vers+' \u00b7 '
         +tr.dist.toFixed(1)+' km \u00b7 +'+tr.dp+' m</td></tr>'; }
    }
    const s=Object.keys(DATA).length? sonde(i):null;
    const sol = s&&s.sol&&s.sol.m!==null? Math.round(s.sol.m/36) : null;
    h+='<tr'+(i===SEL?' style="background:#1E2B44"':'')+'><td>'+p.nom+'</td><td>'+p.km.toFixed(1)+'</td>'
     +'<td>'+p.alt+'</td><td>'+hhmm(p.t[SCENARIO])+'</td>'
     +'<td'+(s&&s.t&&s.t.m!==null?' style="color:'+couleurT(s.t.m)+'"':'')+'>'+(s?V(s.t,1):'\u2014')+'</td>'
     +'<td>'+(s?V(s.res,1):'\u2014')+'</td><td>'+(s?V(s.hum):'\u2014')+'</td>'
     +'<td>'+(s?V(s.nu):'\u2014')+'</td><td>'+(sol!==null?sol:'\u2014')+'</td>'
     +'<td'+(s&&s.pr&&s.pr.m>0.2?' style="color:var(--pluie)"':'')+'>'+(s?V(s.pr,1):'\u2014')+'</td>'
     +'<td>'+(s?V(s.v):'\u2014')+'</td>'
     +'<td'+(s&&s.raf&&s.raf.m>50?' style="color:var(--alerte)"':'')+'>'+(s?V(s.raf):'\u2014')+'</td>'
     +'<td>'+(s&&s.dir?cap(s.dir.m):'\u2014')+'</td></tr>';
  });
  tb.innerHTML=h;
}

/* ---------- archivage & convergence ---------- */
async function archive(){
  const cle='snapshot:'+new Date().toISOString().slice(0,13).replace(/[-T:]/g,'');
  const inst={};
  const DECISION=['Croix de Belledonne','Col de la Mine de Fer','Col de la Vache',
    'R5 Fond de France Base vie','Col de Morétan','R8 Super Collet',
    'Sommet du Grand Chat','Arrivée Aiguebelle'];
  const detail={};
  POIS.forEach((p,i)=>{
    if(DECISION.indexOf(p.nom)<0) return;
    const s=sonde(i); if(!s) return;
    detail[p.nom]={};
    s.lignes.forEach(l=>{ detail[p.nom][l.nom]={t:l.t, pr:l.pr, raf:l.raf, nu:l.nu}; });
  });
  const g=(o,k)=>o&&o[k]!==null&&o[k]!==undefined?o[k]:null;
  POIS.forEach((p,i)=>{ const s=sonde(i); if(s&&s.t) inst[p.nom]={
    t:g(s.t,'m'), tlo:g(s.t,'lo'), thi:g(s.t,'hi'), pr:g(s.pr,'m'), prhi:g(s.pr,'hi'),
    raf:g(s.raf,'m'), nu:g(s.nu,'m'), hum:g(s.hum,'m'), v:g(s.v,'m'), n:s.lignes.length}; });
  try{ await MEM.set(cle, JSON.stringify({date:new Date().toISOString(), scen:SCENARIO, pts:inst, detail:detail})); }
  catch(e){}
  convergence();
}
async function convergence(){
  const el=q('#conv');
  let cles=[];
  try{ const r=await MEM.list('snapshot:'); cles=(r&&r.keys)||[]; }catch(e){ }
  if(cles.length<1){ el.textContent='Aucun relevé archivé pour l\'instant.'; return; }
  cles.sort();
  const snaps=[];
  for(const k of cles.slice(-10)){
    try{ const r=await MEM.get(k); if(r) snaps.push(JSON.parse(r.value)); }catch(e){}
  }
  if(!snaps.length){ el.textContent='Aucun relevé lisible.'; return; }
  const cible=POIS[SEL].nom;
  let h='<div class="tw"><table><thead><tr><th>Relevé</th><th>Mod.</th><th>T médiane</th><th>Écart</th>'
   +'<th>Pluie méd.</th><th>Nuages</th><th>Vent</th><th>Rafales</th></tr></thead><tbody>';
  snaps.forEach(s=>{
    const v=s.pts[cible];
    h+='<tr><td>'+new Date(s.date).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</td>'
     +'<td>'+(v&&v.n?v.n:'?')+'</td>'
     +'<td>'+(v&&v.t!=null?v.t.toFixed(1)+' °':'—')+'</td>'
     +'<td>'+(v&&v.thi!=null?(v.thi-v.tlo).toFixed(1)+' °':'—')+'</td>'
     +'<td>'+(v&&v.pr!=null?v.pr.toFixed(1):'—')+'</td>'
     +'<td>'+(v&&v.nu!=null?v.nu.toFixed(0)+' %':'—')+'</td>'
     +'<td>'+(v&&v.v!=null?v.v.toFixed(0):'—')+'</td>'
     +'<td>'+(v&&v.raf!=null?v.raf.toFixed(0):'—')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  el.innerHTML=h;
}

/* ---------- heure de depart ----------
   Le road book donne l'heure de passage absolue de chacun des 52 points, pour
   chaque scenario. Decaler le depart decale toutes ces heures du meme
   intervalle, et donc les heures auxquelles chaque modele est interroge.

   On garde une copie intacte du road book et on repart TOUJOURS d'elle : appliquer
   un decalage sur un etat deja decale derive, et l'erreur ne se verrait qu'apres
   un aller-retour. */
const DEPART_REF = '06:30';
const ROADBOOK = POIS.map(p => Object.assign({}, p.t));

function minutesDe(hhmm){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm||''));
  if(!m) return null;
  const h = +m[1], mn = +m[2];
  if(h>23 || mn>59) return null;
  return h*60 + mn;
}

function appliquerDepart(hhmm){
  const cible = minutesDe(hhmm), ref = minutesDe(DEPART_REF);
  if(cible===null) return false;
  const delta = (cible - ref) * 60000;
  POIS.forEach(function(p, i){
    const src = ROADBOOK[i];
    Object.keys(src).forEach(function(s){
      /* Format LOCAL, surtout pas toISOString() : le road book est en heure
         locale, et toISOString rend de l'UTC - le decalage se serait ajoute aux
         deux heures du fuseau d'ete. Le test en navigateur l'a montre, 05:00
         demande donnait 03:00 ; le test en Python, qui rejouait la formule et
         non le code, ne pouvait pas le voir. */
      const q2 = n => String(n).padStart(2,'0');
      const dd = new Date(new Date(src[s]).getTime() + delta);
      p.t[s] = dd.getFullYear()+'-'+q2(dd.getMonth()+1)+'-'+q2(dd.getDate())
             +'T'+q2(dd.getHours())+':'+q2(dd.getMinutes());
    });
  });
  DEPART_ACTUEL = hhmm;
  try{ localStorage.setItem('depart', hhmm); }catch(e){}
  return true;
}
let DEPART_ACTUEL = DEPART_REF;

/* ---------- init ---------- */
(function(){
  const dep=q('#depart');
  if(dep){
    let voulu = DEPART_REF;
    try{ voulu = localStorage.getItem('depart') || DEPART_REF; }catch(e){}
    if(minutesDe(voulu)===null) voulu = DEPART_REF;
    dep.value = voulu;
    if(voulu !== DEPART_REF) appliquerDepart(voulu);
    dep.onchange=function(){
      if(!appliquerDepart(dep.value)){ dep.value = DEPART_ACTUEL; return; }
      /* Meme regle que le selecteur de scenario : les valeurs du cache sont
         extraites pour des heures precises, changer le depart les perime. On
         redessine tout de suite, et on reinterroge si la meteo ne vient pas de
         reponses brutes encore en memoire. */
      const surCache = Object.keys(DATA).some(id=>DATA[id].pts && !DATA[id].reps);
      JALONS = construireJalons();
      dessine(); fiche(); tableauTous(); resumeSegment(); convergence();
      if(surCache && !(PRECHARGE && PRECHARGE.modeles)){
        log('D\u00e9part \u00e0 '+dep.value+' : les heures de passage changent, '
          +'r\u00e9interrogation des mod\u00e8les\u2026');
        interroger();
      } else {
        log('D\u00e9part r\u00e9gl\u00e9 \u00e0 '+dep.value+'.');
      }
    };
  }
  const sel=q('#scen');
  for(let s=36;s<=52;s++){ const o=document.createElement('option'); o.value=s; o.textContent=s+' h'; if(s===43)o.selected=true; sel.appendChild(o); }
  sel.onchange=()=>{
    SCENARIO=+sel.value;
    /* les valeurs du cache sont extraites pour un scénario précis : si on en change,
       le relief et les horaires se redessinent tout de suite, la météo est réinterrogée */
    const surCache = Object.keys(DATA).some(id=>DATA[id].pts && !DATA[id].reps);
    dessine(); fiche(); tableauTous(); resumeSegment(); convergence();
    if(surCache && !(PRECHARGE && PRECHARGE.modeles)){
      log('Scénario '+SCENARIO+' h : les heures de passage changent, réinterrogation des modèles…');
      interroger();
    }
  };
  /* Un simple clic force le relev\u00e9 : quand on appuie sur le bouton, on veut
     des donn\u00e9es. Le garde-fou align\u00e9 sur le run ne s'applique donc plus qu'aux
     rafra\u00eechissements automatiques, o\u00f9 il \u00e9vite de d\u00e9penser du quota pour
     ret\u00e9l\u00e9charger une donn\u00e9e identique. Le relev\u00e9 partag\u00e9 reste consult\u00e9
     d'abord, gratuitement, pour un affichage imm\u00e9diat. */
  q('#go').onclick=function(){ interroger(true); };
  q('#raz').onclick=async()=>{
    if(!confirm('Effacer l\'historique des relevés ? C\'est lui qui permet de suivre la '
      +'convergence des modèles jour après jour, et il ne peut pas être reconstitué.')) return;
      try{ const r=await MEM.list('snapshot:'); for(const k of (r.keys||[])) await MEM.delete(k); }catch(e){}
    convergence(); log('Historique effacé.');
  };
  if(PRECHARGE && PRECHARGE.modeles){
    DATA = PRECHARGE.modeles;
    ECHECS = PRECHARGE.echecs || [];
    afficheDispo(Object.keys(DATA).map(id=>[nomModele(id),
      POIS.filter((p,i)=>extraitPoi(DATA[id], i)).length, POIS.length]));
    log('Relevé du '+new Date(PRECHARGE.releve).toLocaleString('fr-FR')
        +' — '+Object.keys(DATA).length+' modèles, données intégrées au fichier.'
        + (ECHECS.length? ' Non renvoyés : '+ECHECS.join(', ') : ''));
    q('#go').disabled=true; q('#go').textContent='Données intégrées';
    const sc=q('#scen'); [...sc.options].forEach(o=>{ if(!PRECHARGE.scenarios.includes(+o.value)) o.disabled=true; });
  }
  initTheme();
  ['clair','sombre','auto'].forEach(k=>{
    const b=q('#th-'+k); if(b) b.onclick=()=>appliquerTheme(k, true);
  });
  q('#modele').onchange=()=>{
    MODELE_ACTIF=q('#modele').value;
    majNoteFiabilite(); rendreTout();
  };
  segChips(); chips();
  q('#smscopie').onclick=copierSMS;
  q('#exportmd').onclick=exportMD;
  q('#exportpng').onclick=exportPNG;
  q('#exportpile').onclick=exportPile;
  q('#smscourt').onclick=()=>{ q('#smscourt').setAttribute('aria-pressed','true');
    q('#smscomplet').setAttribute('aria-pressed','false'); majSMS(); };
  q('#smscomplet').onclick=()=>{ q('#smscomplet').setAttribute('aria-pressed','true');
    q('#smscourt').setAttribute('aria-pressed','false'); majSMS(); };

  /* 1. on affiche immédiatement ce qu'on a en mémoire, même périmé */
  (async()=>{
    if(!(PRECHARGE && PRECHARGE.modeles)){
      /* on interroge les deux en parallele et on garde le plus recent : le
         releve partage est en general plus frais que la memoire de l'appareil,
         mais l'inverse arrive si l'utilisateur vient de forcer une actualisation */
      const [local, partage] = await Promise.all([cacheLire(), partageLire()]);
      /* fusion : le partage apporte ce que l'appareil n'a pas, sans jamais
         retirer ce qu'il avait deja */
      if(partage && partage.ts) TS_PARTAGE = partage.ts;
      const c = fusionneCaches(local, partage);
      const dOu = (partage && c && c.ts === partage.ts)? 'partagé' : 'local';
      if(c){
        appliqueCache(c);
        /* AROME ne transite pas par le cache partage : le cron ecrit l'asset
           puis capture la page, qui sert encore le precedent, et le garde-fou
           decline aux cycles suivants puisque l'arrivee d'un modele ne modifie
           pas TS_DONNEES. On lit donc l'asset directement, ce qui ne coute
           qu'une requete locale. */
        try{ await aromeAppliquer(DATA, DATA_J); }catch(e){}
        afficheDispo(Object.keys(DATA).map(id=>[nomModele(id),
          POIS.filter((p,i)=>{const e=extraitPoi(DATA[id],i); return e&&e.t!==null&&e.t!==undefined;}).length,
          POIS.length]));
        if(dOu==='partagé'){
          const src=(c.partage&&c.partage.genere_par)||'serveur';
          log('Relevé partagé ('+src+') du '+ageTexte()+', '
              +Object.keys(c.modeles).length+' modèles — aucun quota consommé '
              +'par cet appareil.');
          /* on le recopie en memoire locale : la page reste utilisable hors ligne */
          try{ await cacheEcrire(); }catch(e){}
        } else {
          log('Données restaurées depuis la mémoire du téléphone, relevé '+ageTexte()+'.');
        }
      }
    }
    majSelecteurModele();
    rendreTout(); convergence();

    /* 2. le rafraîchissement ne part qu'une fois l'écran rempli, et il complète
       l'affichage au lieu de le remplacer */
    if(!(PRECHARGE && PRECHARGE.modeles) && ageHeures()>PERIME_H){
      await new Promise(z=>setTimeout(z,120));
      interroger();
    }
  })();

  /* 3. au retour sur l'onglet, on revérifie la fraîcheur */
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){
      majEtat();
      if(!EN_COURS && !(PRECHARGE && PRECHARGE.modeles) && ageHeures()>PERIME_H) interroger();
    }
  });
  setInterval(majEtat, 60000);
})();
</script>
