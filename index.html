<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>v129 — Sonde météo — Échappée Belle Intégrale 2026</title>
<style>
:root{
  --nuit:#0A101C; --roche:#131C2C; --panneau:#182338; --trace:#26344E;
  --neige:#E9EEF6; --brume:#7A8AA5;
  --froid:#5FC8E8; --chaud:#F0A24B; --pluie:#8E7CF0; --alerte:#F0553D; --accord:#5FD3A0;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
html[data-theme="clair"]{
  /* pensé pour un écran de téléphone en plein soleil : fond blanc franc,
     texte quasi noir, bordures assez marquées pour survivre aux reflets */
  --nuit:#FFFFFF; --roche:#FFFFFF; --panneau:#EDF1F7; --trace:#9FADBF;
  --neige:#0A1018; --brume:#41506A;
  --froid:#0E6E96; --chaud:#8F4E06; --pluie:#4632B4; --alerte:#A82A17; --accord:#0F6E48;
}
html[data-theme="clair"] .cel b, html[data-theme="clair"] .gros b{color:var(--neige)}
html[data-theme="clair"] tr.consensus td{background:#DCE6F4}
html[data-theme="clair"] #smstexte{background:#F6F8FB}
html[data-theme="clair"] .segchip[aria-pressed="true"]{background:#F3E4CD}
html{color-scheme:dark}
html[data-theme="clair"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--nuit);color:var(--neige);font-family:var(--mono)}
body{padding:0 0 2.2rem;font-size:14px;line-height:1.4}
.wrap{max-width:100%;margin:0 auto;padding:0 clamp(8px,1vw,16px)}
@media (min-width:1100px){ body{font-size:15px} .wrap{padding:0 16px} }

header{padding:8px 0 6px;border-bottom:1px solid var(--trace)}
.titre{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--brume)}
.titre b{font-size:16px;font-weight:600;color:var(--neige);letter-spacing:-.02em}
.titre .v{margin-left:auto;font-size:10.5px;opacity:.6}
.eyebrow{font-family:var(--sans);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--brume)}
h1{font-size:clamp(21px,5.6vw,32px);font-weight:600;letter-spacing:-.035em;margin:6px 0 4px;line-height:1.05}
h1 span{color:var(--brume);font-weight:400}
.sub{font-size:12px;color:var(--brume)}

.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0}
.ctl .grp{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto}
.ctl .pousse{flex:1 1 0;min-width:0}
@media (max-width:600px){
  .ctl{gap:8px}
  .ctl .pousse{display:none}
  .ctl button,.ctl select{min-height:40px}
  .ctl .grp{flex:1 1 auto}
  .ctl select{flex:1 1 auto;min-width:0}
}
button,select,#depart{font-family:var(--mono);font-size:12.5px;background:var(--panneau);color:var(--neige);
  border:1px solid var(--trace);border-radius:3px;padding:7px 11px;cursor:pointer}
/* le champ d'heure reste discret : il ne s'etire pas comme les listes et son
   contenu ne fait que cinq caracteres */
#depart{flex:0 0 auto;width:auto;min-height:40px}
button:hover,select:hover,#depart:hover{border-color:var(--froid)}
button:focus-visible,select:focus-visible,#depart:focus-visible,.tick:focus-visible{outline:2px solid var(--froid);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.ctl label{font-family:var(--sans);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--brume)}

h2{font-family:var(--sans);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--brume);font-weight:600;margin:16px 0 6px;display:flex;align-items:baseline;gap:8px;opacity:.75}
h2::after{content:"";flex:1;height:1px;background:var(--trace)}

/* ---- bandeau signature ---- */
.cadre{position:relative}
.smsbarre{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.smsbarre b{font-size:14px;margin-right:auto}
.smsbarre button{padding:5px 10px;font-size:11px}
.smsbarre button[aria-pressed="true"]{border-color:var(--accord);color:var(--neige);background:#182C28}
#smstexte{width:100%;background:#0C1424;color:var(--neige);border:1px solid var(--trace);
  border-radius:3px;padding:10px;font-family:var(--mono);font-size:12.5px;line-height:1.5;
  resize:vertical;-webkit-user-select:text;user-select:text}
.smspied{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:11px;color:var(--brume)}
.smspied button{margin-left:auto;border-color:var(--accord);padding:7px 14px}
#gouttiere{position:absolute;left:0;top:0;z-index:2;pointer-events:none}
.segchip{flex:0 0 auto;background:var(--panneau);border:1px solid var(--trace);border-radius:3px;
  padding:8px 11px;font-size:12.5px;min-height:44px;cursor:pointer;color:var(--brume);line-height:1.3;text-align:left}
.segchip[aria-pressed="true"]{border-color:var(--chaud);color:var(--neige);background:#1E2B44}
.segchip small{display:block;font-size:9.5px;color:var(--brume);margin-top:1px}
.bandeau{margin-top:4px;border:1px solid var(--trace);border-radius:4px;background:var(--roche);overflow:hidden}
.scroller{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.scroller svg{display:block}
/* --- résumé grand public --- */
.rtete{display:flex;flex-direction:column;gap:2px;margin-bottom:9px}
.rtete b{font-size:14px;font-weight:600}
.rtete span{font-size:11.5px;color:var(--brume)}
.rgrille{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:0;
  border:1px solid var(--trace);border-radius:5px;overflow:hidden}
.rcase{background:var(--roche);padding:8px 10px;border-right:1px solid var(--trace);
  border-bottom:1px solid var(--trace)}
.rcase s{display:block;text-decoration:none;font-family:var(--sans);font-size:9.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--brume)}
.rcase b{display:block;font-size:17px;font-weight:600;letter-spacing:-.03em;margin-top:2px}
.rcase em{display:block;font-style:normal;font-family:var(--sans);font-size:10.5px;
  color:var(--brume);margin-top:1px}
.hero{border:1px solid var(--trace);border-radius:6px;background:var(--roche);
  padding:12px 13px 11px;margin-top:12px}
.htete{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.hlieu{font-size:17px;font-weight:600;letter-spacing:-.02em}
.hquand{font-size:11.5px;color:var(--brume)}
.hcorps{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
.hchiffre b{font-size:clamp(44px,12vw,58px);font-weight:600;letter-spacing:-.055em;line-height:.95;display:block}
.hchiffre em{font-style:normal;font-size:12px;color:var(--brume)}
.hmots{flex:1 1 150px;font-family:var(--sans);font-size:14px;line-height:1.35}
.htuiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;
  border:1px solid var(--trace);border-radius:5px;overflow:hidden;background:var(--trace)}
.tuile{background:var(--roche);padding:8px 6px;text-align:center}
.tuile s{display:block;text-decoration:none;font-family:var(--sans);font-size:9.5px;
  letter-spacing:.06em;color:var(--brume);text-transform:uppercase}
.tuile b{display:block;font-size:19px;font-weight:600;margin-top:2px;letter-spacing:-.03em}
.halertes{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.halertes span{font-family:var(--sans);font-size:12px;background:var(--panneau);
  border:1px solid var(--trace);border-radius:20px;padding:4px 10px}
.hnote{font-family:var(--sans);font-size:13px;color:var(--brume)}

/* --- bande horaire --- */
.heures{display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px;
  border:1px solid var(--trace);border-radius:6px;background:var(--roche);padding:8px 2px}
.hcarte{flex:0 0 auto;width:56px;text-align:center;padding:2px 0;
  border-left:1px solid transparent}
.hcarte.jour{border-left:1px solid var(--trace)}
.hcarte s{display:block;text-decoration:none;font-family:var(--sans);font-size:10.5px;color:var(--brume)}
.hcarte b{display:block;font-size:15px;font-weight:600;letter-spacing:-.02em}
.hcarte i{display:block;font-style:normal;font-size:10.5px;line-height:1.3}
.hcarte .pp{color:var(--pluie)}
.hcarte .rf{color:var(--brume)} .hcarte .rf.moyen{color:var(--chaud)} .hcarte .rf.fort{color:var(--alerte);font-weight:600}
.hcarte u{display:block;text-decoration:none;font-size:9.5px;color:var(--brume);opacity:.7}

.detail{border-top:0;margin-top:4px}
.detail .fiche{margin-top:0}
.repli{margin-top:10px;border-top:1px solid var(--trace)}
.repli summary{font-family:var(--sans);font-size:11.5px;color:var(--brume);cursor:pointer;
  padding:9px 0;list-style:none;display:flex;align-items:center;gap:7px;min-height:38px}
.repli summary::-webkit-details-marker{display:none}
.repli summary::before{content:"\25B8";font-size:10px;transition:transform .15s}
.repli[open] summary::before{transform:rotate(90deg)}
.repli .note{padding-bottom:10px}
.legrepli{border-top:0;margin:0;padding:0 12px 6px}
.legende{display:flex;gap:14px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--trace);
  font-family:var(--sans);font-size:10.5px;color:var(--brume)}
.legende i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---- tableau modèles ---- */
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 5px;border-bottom:1px solid var(--trace);white-space:nowrap}
th{font-family:var(--sans);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--brume);font-weight:600}
td:first-child,th:first-child{text-align:left;white-space:normal;min-width:112px}
tr.consensus td{background:var(--panneau);font-weight:600;border-bottom:1px solid var(--froid)}
.res{font-size:10.5px;color:var(--brume)}
.tw{overflow-x:auto}

/* ---- fiche POI ---- */
.fiche{border:1px solid var(--trace);border-radius:4px;background:var(--roche);padding:11px;margin-top:6px}
.fiche h3{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
.fiche .meta{font-size:11.5px;color:var(--brume);margin-top:3px}
.gros{display:flex;gap:20px;flex-wrap:wrap;margin:14px 0 4px}
.gros div{min-width:74px}
.gros b{display:block;font-size:clamp(28px,7vw,34px);font-weight:600;letter-spacing:-.045em;line-height:1}
.gros s{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brume);text-decoration:none;margin-top:5px}
.spread{font-size:11px;color:var(--brume);margin-top:2px}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;
  border:1px solid var(--trace);border-radius:4px;overflow:hidden;margin:12px 0 4px}
.cel{background:var(--roche);padding:10px 11px;
  border-right:1px solid var(--trace);border-bottom:1px solid var(--trace)}
.cel s{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--brume);text-decoration:none}
.cel b{display:block;font-size:19px;font-weight:600;letter-spacing:-.03em;margin-top:3px}
.cel em{display:block;font-family:var(--sans);font-style:normal;font-size:10px;color:var(--brume);margin-top:2px}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;background:var(--panneau);border:1px solid var(--trace);border-radius:3px;
  padding:9px 11px;font-size:12.5px;min-height:38px;cursor:pointer;color:var(--brume)}
.chip[aria-pressed="true"]{border-color:var(--froid);color:var(--neige)}

.note{font-family:var(--sans);font-size:11.5px;color:var(--brume);line-height:1.55}
.note b{color:var(--neige);font-weight:600}
.alerte{color:var(--alerte)}
ul.dispo{list-style:none;padding:0;margin:0;font-size:12px}
ul.dispo li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--trace);align-items:baseline}
ul.dispo li span:first-child{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--accord)} .ko{color:var(--brume)}
.log{font-size:11px;color:var(--brume);margin-top:8px;white-space:pre-wrap}
.etat{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--brume);margin-left:4px}
.etat b{color:var(--neige);font-weight:600}
.etat .pastille{width:7px;height:7px;border-radius:50%;background:var(--accord);flex:0 0 auto}
.etat.vieux .pastille{background:var(--chaud)} .etat.charge .pastille{background:var(--froid)}
.etat.horsligne .pastille{background:var(--alerte)}
.etat button{padding:4px 9px;font-size:11px;margin-left:auto}
.theme{display:inline-flex;border:1px solid var(--trace);border-radius:3px;overflow:hidden}
.theme button{border:0;border-radius:0;padding:6px 9px;font-size:12px;background:var(--panneau)}
.theme button+button{border-left:1px solid var(--trace)}
.theme button[aria-pressed="true"]{background:var(--panneau);color:var(--neige);
  box-shadow:inset 0 -2px 0 var(--froid);font-weight:600}
@media(prefers-reduced-motion:no-preference){.pulse{animation:p 1.4s ease-in-out infinite}}
@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="ctl">
    <select id="scen" aria-label="Scénario"></select>
    <input id="depart" type="time" step="300" value="06:30" title="Heure de départ"
           aria-label="Heure de départ">
    <select id="modele" aria-label="Modèle"><option value="">Multimodèle</option></select>
    <span class="theme" role="group" aria-label="Apparence">
      <button id="th-clair" title="Clair">☀</button>
      <button id="th-sombre" title="Sombre">☾</button>
      <button id="th-auto" title="Système">A</button>
    </span>
    <button id="go" title="Actualiser">⟳</button>
    <span class="etat" id="etat"></span>
  </div>
  <div class="log" id="log" hidden></div>
  <div class="note" id="fiabilite" hidden></div>
  <span id="fiabresume" hidden></span>
</header>

<div class="chips" id="segchips"></div>
<div class="bandeau">
  <div class="cadre"><svg id="gouttiere"></svg>
    <div class="scroller" id="scroller"><svg id="ruban"></svg></div></div>
  <div class="legende" id="mgnote" style="border:0;padding:6px 12px 0"></div>
  
</div>

<div class="fiche" id="segresume"></div>

<div class="hero" id="hero"></div>
<div class="heures" id="heures"></div>

<h2>Points du parcours</h2>
<div class="chips" id="chips"></div>
<details class="repli detail"><summary>Détail du point et comparaison des modèles</summary>
  <div class="fiche" id="fiche"></div></details>

<div class="fiche" id="smszone" style="margin-bottom:10px">
  <div class="smsbarre">
    <b>SMS</b>
    <button id="smscourt" aria-pressed="true">Court</button>
    <button id="smscomplet" aria-pressed="false">Tous les points</button>
  </div>
  <textarea id="smstexte" readonly rows="7" spellcheck="false"></textarea>
  <div class="smspied"><span id="smsinfo"></span><button id="smscopie">Copier le SMS</button></div>
  <div class="smspied" style="border-top:1px solid var(--trace);padding-top:10px;margin-top:12px">
    <button id="exportmd">Export Markdown</button>
    <button id="exportpng">Export image</button>
    <button id="exportpile">Export par modèle</button>
    <button id="raz" title="Effacer l'historique">Vider</button>
  </div>
</div>

<h2>Modèles</h2>
<ul class="dispo" id="dispo"><li><span class="ko">En attente d'interrogation.</span></li></ul>

<h2>Convergence</h2>
<div id="conv" class="note">Aucun relevé archivé pour l'instant.</div>

<h2 id="htp">Tous les points</h2>
<div class="tw"><table id="tousp"><tbody></tbody></table></div>

</div>

function couleurT(t){

  const s=[[-5,'#3D7FD1'],[0,'#5FC8E8'],[8,'#9AD9C0'],[15,'#D8CE86'],[22,'#F0A24B'],[30,'#F0553D']];
  if(t<=s[0][0]) return s[0][1];
  if(t>=s[s.length-1][0]) return s[s.length-1][1];
  for(let i=0;i<s.length-1;i++){
    if(t>=s[i][0]&&t<=s[i+1][0]){
      const f=(t-s[i][0])/(s[i+1][0]-s[i][0]);
      const A=s[i][1], B=s[i+1][1], h=x=>[1,3,5].map(k=>parseInt(x.substr(k,2),16));
      const a=h(A), b=h(B);
      return '#'+a.map((v,k)=>Math.round(v+(b[k]-v)*f).toString(16).padStart(2,'0')).join('');
    }
  }
  return '#888';
}

/* ================= COUCHE DE RÉCUPÉRATION RAPIDE ================= */
/* Cinq leviers, du plus rentable au moins :
   1. un seul appel Open-Meteo pour tous les modèles à la fois (models=a,b,c) ;
   2. fenêtre horaire resserrée sur la course au lieu de trois jours pleins ;
   3. les quatre fournisseurs interrogés en parallèle, quotas indépendants ;
   4. concurrence adaptative : on accélère tant que ça passe, on freine sur 429 ;
   5. les jalons du météogramme dérivés des séries déjà téléchargées. */

const FENETRE = {h0:'2026-08-21T05:00', h1:'2026-08-23T03:00',
                 d0:'2026-08-21', d1:'2026-08-23'};

/* ---- ordonnanceur adaptatif ---- */
function ordonnanceur(nomServeur, concurrenceMax, repriseMs, depart){
  return {
    nom:nomServeur, max:concurrenceMax,
    actuel:Math.min(depart||2, concurrenceMax),
    /* Duree de reprise apres un refus, propre au serveur. Open-Meteo limite PAR
       MINUTE et le dit dans sa reponse : reprendre avant que la fenetre se
       rearme garantit un second echec. */
    reprise: repriseMs || 2500,
    enCours:0, file:[], pause:0, echecs:0,
    async prendre(){
      while(true){
        const attente=this.pause-Date.now();
        if(attente>0){ await new Promise(z=>setTimeout(z,Math.min(attente,400))); continue; }
        if(this.enCours<this.actuel){ this.enCours++; return; }
        await new Promise(z=>setTimeout(z,40));
      }
    },
    rendre(ok){
      this.enCours--;
      if(ok){ this.echecs=0;
        if(this.actuel<this.max) this.actuel=Math.min(this.max, this.actuel+1); }
      else { this.echecs++;
        this.actuel=Math.max(1, Math.floor(this.actuel/2));
        /* Mesure a l'appui : Open-Meteo repond "Minutely API request limit
           exceeded. Please try again in one minute". Reprendre avant que la
           fenetre se rearme ne fait que consommer une tentative pour rien -
           c'est ce qui vidait les trois essais en quinze secondes. */
        this.pause=Date.now()+Math.min(this.reprise*3, this.reprise*this.echecs);
      }
    }
  };
}
/* Open-Meteo : un appel porte deja 52 points x 9 modeles x 15 variables. On
   part donc a UN seul appel simultane, et on reprend au-dela de la minute. */
const ORD_OM = ordonnanceur('open-meteo', 4, 62000, 1);
const ORD_MB = ordonnanceur('meteoblue', 6);
const ORD_WY = ordonnanceur('windy', 5);
const ORD_MN = ordonnanceur('met.no', 4);

let N429 = 0;   /* refus pour depassement de quota sur le releve en cours */
/* surfacer429 : rendre la reponse 429 a l'appelant au lieu de la rejouer.
   Un 429 "credits epuises" est definitif pour la cle en service - le rejouer
   trois fois ne peut pas reussir, et cela masquait le motif a l'appelant, qui
   aurait pu basculer sur la roue de secours. */
async function appel(ord, url, options, surfacer429){
  for(let essai=0; essai<3; essai++){
    await ord.prendre();
    let r=null;
    try{ r = await fetch(url, options); }
    catch(e){ ord.rendre(false); continue; }
    if(r.status===429 || r.status===503){
      if(r.status===429) N429++;
      ord.rendre(false);
      if(surfacer429 && r.status===429) return r;
      continue;
    }
    ord.rendre(true);
    return r;
  }
  return null;
}

/* ---- un seul appel pour tous les modèles ---- */
async function lotOpenMeteo(ids, points, vars){
  /* 60 et non 40 : les 52 points tiennent dans un seul appel, verifie en direct
     contre l'API. Deux appels concurrents doublaient la pression sur la limite
     par minute pour un resultat identique. */
  const LOT=60;
  const res=new Array(points.length).fill(null);
  const morceaux=[];
  for(let d=0;d<points.length;d+=LOT) morceaux.push([d, points.slice(d,d+LOT)]);

  await Promise.all(morceaux.map(async function([decalage, lot]){
    const base=new URLSearchParams();
    base.set('latitude',  lot.map(x=>x.lat).join(','));
    base.set('longitude', lot.map(x=>x.lon).join(','));
    base.set('elevation', lot.map(x=>x.alt).join(','));
    base.set('hourly', vars.join(','));
    base.set('models', ids.join(','));
    base.set('timezone','Europe/Paris');

    /* fenêtre horaire si l'API l'accepte, sinon repli sur les dates pleines */
    let j=null;
    for(const mode of ['heures','jours']){
      const qp=new URLSearchParams(base);
      if(mode==='heures'){ qp.set('start_hour',FENETRE.h0); qp.set('end_hour',FENETRE.h1); }
      else { qp.set('start_date',FENETRE.d0); qp.set('end_date',FENETRE.d1); }
      const r=await appel(ORD_OM, 'https://api.open-meteo.com/v1/forecast?'+qp.toString());
      if(!r||!r.ok) continue;
      let o=null;
      try{ o=await r.json(); }catch(e){ continue; }
      if(!Array.isArray(o)) o=[o];
      if(o[0]&&o[0].hourly&&o[0].hourly.time&&o[0].hourly.time.length){ j=o; break; }
    }
    if(!j) return;
    j.forEach((o,k)=>{ res[decalage+k]=o; });
  }));
  return res;
}

/* extraction depuis une réponse multi-modèles : les clés portent le suffixe du modèle */
function extraitSuffixe(rep, isoCible, suffixe){
  if(!rep||!rep.hourly) return null;
  const T=rep.hourly.time; if(!T||!T.length) return null;
  const cible=new Date(isoCible).getTime();
  let best=-1, dt=1e15;
  for(let i=0;i<T.length;i++){ const d=Math.abs(new Date(T[i]).getTime()-cible); if(d<dt){dt=d;best=i;} }
  if(best<0 || dt>1.6*3600*1000) return null;
  const g=v=>{ let a=rep.hourly[v+suffixe];
               if(!a) a=rep.hourly[v];        /* un seul modèle : pas de suffixe */
               return (a&&a[best]!==null&&a[best]!==undefined)? a[best] : null; };
  const e={t:g('temperature_2m'), res:g('apparent_temperature'), ros:g('dew_point_2m'),
    hum:g('relative_humidity_2m'), pr:g('precipitation'), pp:g('precipitation_probability'),
    neige:g('snowfall'), code:g('weather_code'),
    nu:g('cloud_cover'), nub:g('cloud_cover_low'), num:g('cloud_cover_mid'), nuh:g('cloud_cover_high'),
    sol:g('sunshine_duration'), ray:g('shortwave_radiation'), uv:g('uv_index'), vis:g('visibility'),
    v:g('wind_speed_10m'), raf:g('wind_gusts_10m'), dir:g('wind_direction_10m'),
    iso0:g('freezing_level_height'), cape:g('cape'), li:g('lifted_index'), pres:g('surface_pressure'),
    /* seuls z750/z700/v750/v700 sont lus, par ventCrete() */
    z750:g('geopotential_height_750hPa'), z700:g('geopotential_height_700hPa'),
    v750:g('wind_speed_750hPa'), v700:g('wind_speed_700hPa'),
    alt_demandee: rep.elevation};
  return (e.t===null&&e.nu===null&&e.pr===null)? null : e;
}

/* ================= AROME 1,3 km, asset committe =================
   Produit hors ligne par scripts/arome.py depuis les GRIB ouverts Meteo-France,
   sans aucune cle, puis commite dans data/arome.json. La page ne fait donc
   qu'un fetch de fichier statique : aucun quota, aucune cle dans le client.
   Le paquet SP1 donne temperature, humidite et vent. Pas de pluie ni de
   rafales : les cles correspondantes restent nulles, on n'invente rien.
   Declare doublon de meteofrance_arome_france_hd : silencieux quand la version
   Open-Meteo repond, seul a parler quand elle manque. */
const AR_ID = 'arome_direct';
const AR_NOM = 'AROME 1,3 km direct';
const AR_URL = 'data/arome.json';
/* Applique l'asset AROME a un couple de dictionnaires, et rend le nombre de
   points obtenus. Factorise parce que DEUX chemins doivent l'appeler : le releve,
   et le simple chargement de page.

   La raison est qu'AROME n'est pas une requete reseau vers un tiers, c'est un
   fichier commite dans le depot - ni cle, ni quota. Le lire ne coute rien, donc
   rien ne justifie de le reserver aux relevés. Ne l'appeler que depuis
   interroger() le faisait disparaitre pour qui ouvrait simplement la page, le
   cache partage ne le portant pas. */
async function aromeAppliquer(cible, cibleJ){
  const paquet = await aromeLire();
  if(!paquet) return 0;
  const pts = POIS.map((p,i)=> aromeExtrait(paquet, i, p));
  const c = pts.filter(e=>e&&e.t!==null&&e.t!==undefined).length;
  if(!c) return 0;
  const d = {nom:AR_NOM, pts:{[SCENARIO]:pts},
             serie:(i)=> aromeExtrait(paquet, i, POIS[i])};
  cible[AR_ID]=d; cibleJ[AR_ID]=d;
  /* l'age affiche est celui du RUN du modele, pas celui de la lecture du
     fichier : un asset relu ne rajeunit pas la prevision qu'il contient */
  const t = paquet.run? Date.parse(String(paquet.run).replace(' ', 'T')) : NaN;
  if(!isNaN(t)) MAJ_MODELE[AR_ID] = t;
  return c;
}

async function aromeLire(){
  try{
    const r = await fetch(AR_URL + '?t=' + Math.floor(Date.now()/60000), {cache:'no-store'});
    if(!r.ok) return null;
    const o = await r.json();
    return (o && o.points && Object.keys(o.points).length)? o : null;
  }catch(e){ return null; }
}
/* Le producteur a deja interpole a l'heure de passage : ici on ne fait que
   traduire vers les cles du moteur. */
function aromeExtrait(paquet, i, p){
  const e = paquet.points[String(i)];
  if(!e || e.t2m===null || e.t2m===undefined) return null;
  const t = e.t2m, hum = (e.r2===undefined? null : Math.round(e.r2));
  const v = (e.vent_kmh===undefined? null : e.vent_kmh);
  let dir = null;
  if(typeof e.u10==='number' && typeof e.v10==='number'){
    /* direction d'ou vient le vent, convention meteo */
    dir = Math.round((270 - Math.atan2(e.v10, e.u10)*180/Math.PI + 360) % 360);
  }
  const vms = (v===null)? null : v/3.6;
  return {
    t: Math.round(t*10)/10,
    res: (function(){ const r=ressentiAT(t, hum, vms); return r===null? null : Math.round(r*10)/10; })(),
    ros: rosee(Math.round(t*10)/10, hum),
    hum: hum, pr:null, pp:null, neige:null, code:null,
    nu:null, nub:null, num:null, nuh:null,
    sol:null, ray:null, uv:null, vis:null,
    v: v, raf:null, dir: dir,
    iso0:null, cape:null, li:null, pres:null,
    /* le GRIB est lu sur sa grille native a 1,3 km : pas de descente d'echelle
       a faire, l'altitude de maille est celle du modele */
    alt_demandee: p.alt, corrige_alt:false
  };
}

/* ================= MET NORWAY (api.met.no) =================
   Source libre, sans cle ni quota, CORS ouvert, et surtout : elle prend
   l'altitude en parametre et la respecte. C'est le filet de securite quand
   le quota Open-Meteo est epuise.
   Deux pieges traites ici :
   - wind_speed est en m/s, pas en km/h ;
   - precipitation_amount est un CUMUL sur la periode annoncee (1 h ou 6 h),
     il faut le ramener en mm/h pour rester homogene avec le reste. */
const MN_ID  = 'metno_direct';
const MN_NOM = 'MET Norway direct';
const MN_URL = 'https://api.met.no/weatherapi/locationforecast/2.0/complete';

/* Temperature apparente australienne, formule sur laquelle Open-Meteo assoit
   son `apparent_temperature`. On l'emploie pour MET Norway, qui donne T,
   humidite et vent mais pas de ressenti : sans elle, la physique de terrain
   et le modele de tenue n'auraient rien a se mettre sous la dent quand
   MET Norway est la seule source joignable. v en m/s. */
function ressentiAT(t, hr, vms){
  if(t===null||t===undefined||!isFinite(t)) return null;
  const h=(hr===null||hr===undefined||!isFinite(hr))? 70 : hr;
  const v=(vms===null||vms===undefined||!isFinite(vms))? 0 : vms;
  const e=(h/100)*6.105*Math.exp(17.27*t/(237.7+t));
  return t + 0.33*e - 0.70*v - 4.00;
}

/* symbol_code de met.no vers code WMO, pour les pictogrammes */
function mnCode(sym){
  if(!sym) return null;
  const s=String(sym).split('_')[0];
  if(s.indexOf('thunder')>=0) return 95;
  if(s.indexOf('sleet')>=0)   return s.indexOf('heavy')>=0? 67 : 66;
  if(s.indexOf('snow')>=0)    return s.indexOf('heavy')>=0? 75 : (s.indexOf('light')>=0? 71 : 73);
  if(s.indexOf('rain')>=0)    return s.indexOf('heavy')>=0? 65 : (s.indexOf('light')>=0? 61 : 63);
  if(s==='fog')               return 45;
  if(s==='cloudy')            return 3;
  if(s==='partlycloudy')      return 2;
  if(s==='fair')              return 1;
  if(s==='clearsky')          return 0;
  return null;
}

async function mnBrut1(p){
  /* met.no demande de tronquer les coordonnees : ca evite de casser son cache */
  const q=new URLSearchParams();
  q.set('lat', (+p.lat).toFixed(4));
  q.set('lon', (+p.lon).toFixed(4));
  q.set('altitude', String(Math.round(p.alt)));
  const r=await appel(ORD_MN, MN_URL+'?'+q.toString());
  if(!r||!r.ok) return null;
  try{
    const o=await r.json();
    const ts=o&&o.properties&&o.properties.timeseries;
    return (ts&&ts.length)? ts : null;
  }catch(e){ return null; }
}

async function mnBrut(points, avance){
  const out=new Array(points.length).fill(null);
  const ordre=ordreServiceParImportance(points);
  let i=0, faits=0;
  const FILE=4;
  async function ouvrier(){
    while(i<ordre.length){
      const k=ordre[i++];
      out[k]=await mnBrut1(points[k]);
      faits++; if(avance) avance(faits, points.length);
    }
  }
  await Promise.all(Array.from({length:FILE}, ouvrier));
  return out;
}

/* A J-4 la serie est en pas de 6 h : prendre le pas le plus proche
   introduirait jusqu'a 3 h d'erreur sur des grandeurs a fort cycle diurne.
   On interpole donc lineairement entre les deux pas qui encadrent l'heure
   visee. La pluie, elle, se lit sur la periode qui contient l'heure visee. */
function mnExtrait(ts, iso, p){
  if(!ts||!ts.length) return null;
  const vise=new Date(iso).getTime();
  const t=ts.map(x=>new Date(x.time).getTime());
  if(vise<t[0]-1.6*3.6e6 || vise>t[t.length-1]+1.6*3.6e6) return null;

  let a=-1;
  for(let i=0;i<t.length-1;i++){ if(t[i]<=vise && vise<=t[i+1]){ a=i; break; } }
  let det=null, frac=0, ia=a;
  if(a<0){
    /* hors encadrement : on se rabat sur le pas le plus proche */
    let dt=1e15;
    for(let i=0;i<t.length;i++){ const d=Math.abs(t[i]-vise); if(d<dt){dt=d;ia=i;} }
    if(dt>1.6*3.6e6) return null;
    det=ts[ia].data.instant.details||{};
  } else {
    frac=(t[a+1]-t[a])>0? (vise-t[a])/(t[a+1]-t[a]) : 0;
    const d1=ts[a].data.instant.details||{}, d2=ts[a+1].data.instant.details||{};
    det={};
    Object.keys(d1).forEach(function(k){
      const v1=d1[k], v2=d2[k];
      if(typeof v1!=='number'){ det[k]=v1; return; }
      if(typeof v2!=='number'){ det[k]=v1; return; }
      if(k==='wind_from_direction'){
        /* moyenne angulaire : 350 et 10 donnent 0, pas 180 */
        const r=Math.PI/180;
        const x=(1-frac)*Math.cos(v1*r)+frac*Math.cos(v2*r);
        const y=(1-frac)*Math.sin(v1*r)+frac*Math.sin(v2*r);
        let ang=Math.atan2(y,x)/r; if(ang<0) ang+=360;
        det[k]=ang; return;
      }
      det[k]=v1+(v2-v1)*frac;
    });
    ia=a;
  }

  /* Pluie : il faut la periode qui COMMENCE a l'heure visee ou juste avant,
     donc le dernier pas situe a ou avant `vise`. La recherche d'encadrement
     ci-dessus ne convient pas : quand `vise` tombe pile sur un pas, elle
     retient l'intervalle precedent et on lisait la periode qui se termine
     la, pas celle qui commence. Ecart mesure a Belledonne : 2,8 mm/6h au
     lieu de 11,1. Ramenee en mm/h pour rester homogene. */
  let ib=0;
  for(let i=0;i<t.length;i++){ if(t[i]<=vise) ib=i; else break; }
  if(a<0) ib=ia;
  let pr=null, sym=null;
  const bloc=ts[ib].data||{};
  if(bloc.next_1_hours){
    const d=bloc.next_1_hours.details||{};
    if(typeof d.precipitation_amount==='number') pr=d.precipitation_amount;
    sym=(bloc.next_1_hours.summary||{}).symbol_code||null;
  } else if(bloc.next_6_hours){
    const d=bloc.next_6_hours.details||{};
    if(typeof d.precipitation_amount==='number') pr=d.precipitation_amount/6;
    sym=(bloc.next_6_hours.summary||{}).symbol_code||null;
  }

  const r1=x=>(x===null||x===undefined||!isFinite(x))? null : Math.round(x*10)/10;
  const r0=x=>(x===null||x===undefined||!isFinite(x))? null : Math.round(x);
  const num=k=>(typeof det[k]==='number')? det[k] : null;

  const vKmh = num('wind_speed')===null? null : num('wind_speed')*3.6;
  const e={
    t:r1(num('air_temperature')),
    res:r1(ressentiAT(num('air_temperature'), num('relative_humidity'), num('wind_speed'))),
    ros:r1(num('dew_point_temperature')), hum:r0(num('relative_humidity')),
    pr:r1(pr), pp:null, neige:null, code:mnCode(sym),
    nu:r0(num('cloud_area_fraction')), nub:r0(num('cloud_area_fraction_low')),
    num_:r0(num('cloud_area_fraction_medium')), nuh:r0(num('cloud_area_fraction_high')),
    sol:null, ray:null, uv:r1(num('ultraviolet_index_clear_sky')), vis:null,
    v:r1(vKmh), raf:null, dir:r0(num('wind_from_direction')),
    iso0:null, cape:null, li:null, pres:r1(num('air_pressure_at_sea_level')),
    /* met.no rend la valeur a l'altitude demandee : aucune correction a faire */
    alt_demandee:p.alt, corrige_alt:false
  };
  /* la cle attendue par le moteur est `num`, que l'on ne peut pas nommer
     directement au-dessus sans masquer la fonction locale */
  e.num=e.num_; delete e.num_;
  return (e.t===null&&e.nu===null&&e.pr===null)? null : e;
}

/* ---------- stockage : API artefact si présente, sinon navigateur ---------- */
const MEM = (window.storage) ? window.storage : {
  async set(k,v){ localStorage.setItem(k,v); return {key:k,value:v}; },
  async get(k){ const v=localStorage.getItem(k); if(v===null) throw new Error('absent'); return {key:k,value:v}; },
  async delete(k){ localStorage.removeItem(k); return {key:k,deleted:true}; },
  async list(p){ const ks=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    if(!p||k.startsWith(p)) ks.push(k); } return {keys:ks}; }
};

/* Ordre de service pour les fournisseurs qui interrogent un point par requete
   et peuvent s'arreter en route (credits epuises, refus, echec reseau).
   On sert d'abord les endroits ou une decision se prend : ravitos officiels,
   points de controle, puis les points que la passation designe comme
   decisifs. Le reste ensuite. Les resultats restent ranges a leur index
   d'origine, seul l'ordre de passage change. */
const POI_DECISIFS = ['Croix de Belledonne','Col de la Mine de Fer',
  'Col de la Vache','Col de Mor\u00e9tan','Sommet du Grand Chat','Lac du Cos'];
function rangImportance(p){
  if(p.type==='Ravito') return 0;
  if(POI_DECISIFS.indexOf(p.nom)>=0) return 1;
  if(p.type==='Point ctrl') return 2;
  if(p.type==='Col'||p.type==='Sommet') return 3;
  return 4;
}
/* Etat des donnees deja disponibles a un point, tous modeles confondus, en
   tenant compte du cache local ET du releve partage puisqu'ils sont fusionnes
   dans DATA au demarrage. Rend le nombre de modeles qui ont une valeur et la
   date du plus recemment rafraichi d'entre eux. */
function etatPoint(i){
  let n = 0, recent = 0;
  for(const id in DATA){
    let e = null;
    try{ e = extraitPoi(DATA[id], i); }catch(err){ e = null; }
    if(e && e.t!==null && e.t!==undefined){
      n++;
      const q = MAJ_MODELE[id] || 0;
      if(q > recent) recent = q;
    }
  }
  return {n:n, recent:recent};
}
/* Ordre de service : on veut les reponses les plus utiles AVANT de se faire
   limiter par un fournisseur. Trois cles, dans cet ordre.
   1. l'importance du point : les ravitos d'abord, pour tous les modeles, puis
      les points decisifs, les points de controle, les cols et sommets ;
   2. a importance egale, les points qui n'ont AUCUNE donnee passent devant :
      un trou coute plus cher qu'une valeur un peu vieille ;
   3. ensuite les plus anciennes d'abord, pour que ce qui a le plus vieilli
      soit rafraichi en priorite.
   A defaut d'etat connu, on retombe sur l'ordre du parcours. */
function ordreServiceParImportance(points){
  let etats = null;
  try{
    if(typeof DATA==='object' && DATA && Object.keys(DATA).length){
      etats = points.map((p,i)=>etatPoint(i));
    }
  }catch(e){ etats = null; }
  return points.map((p,i)=>i).sort(function(a,b){
    const dr = rangImportance(points[a]) - rangImportance(points[b]);
    if(dr) return dr;
    if(etats){
      const ea = etats[a], eb = etats[b];
      const trouA = ea.n===0? 0 : 1, trouB = eb.n===0? 0 : 1;
      if(trouA !== trouB) return trouA - trouB;      /* les trous d'abord */
      if(ea.recent !== eb.recent) return ea.recent - eb.recent;  /* plus vieux d'abord */
    }
    return a - b;                                    /* sinon, sens de la course */
  });
}

/* ---------- interrogation Open-Meteo ---------- */

function extrait(rep, isoCible){
  if(!rep||!rep.hourly) return null;
  const T=rep.hourly.time; if(!T) return null;
  const cible=new Date(isoCible).getTime();
  let best=-1, dt=1e15;
  for(let i=0;i<T.length;i++){ const d=Math.abs(new Date(T[i]).getTime()-cible); if(d<dt){dt=d;best=i;} }
  if(best<0 || dt>2*3600*1000) return null;
  const g=v=>{const a=rep.hourly[v]; return a&&a[best]!==null&&a[best]!==undefined?a[best]:null;};
  return {t:g('temperature_2m'), res:g('apparent_temperature'), ros:g('dew_point_2m'),
          hum:g('relative_humidity_2m'), pr:g('precipitation'), pp:g('precipitation_probability'),
          neige:g('snowfall'), code:g('weather_code'),
          nu:g('cloud_cover'), nub:g('cloud_cover_low'), num:g('cloud_cover_mid'), nuh:g('cloud_cover_high'),
          sol:g('sunshine_duration'), ray:g('shortwave_radiation'), uv:g('uv_index'), vis:g('visibility'),
          v:g('wind_speed_10m'), raf:g('wind_gusts_10m'), dir:g('wind_direction_10m'),
          iso0:g('freezing_level_height'), cape:g('cape'), pres:g('surface_pressure'),
          li:g('lifted_index'),
          z750:g('geopotential_height_750hPa'), z700:g('geopotential_height_700hPa'),
          v750:g('wind_speed_750hPa'), v700:g('wind_speed_700hPa'),
          alt_demandee:rep.elevation};
}

function enrichir(e, alt, altNative, p){
  if(!e) return e;
  if(p){
    e.tpi=Math.round(tpiKm(p.km));
    e.speedup=Math.round(speedupKm(p.km)*100)/100;
    e.vterrain=(e.v===null||e.v===undefined)? null : Math.round(e.v*e.speedup);
    const d=new Date((p.t&&p.t.length>10)? p.t : POIS[0].t[SCENARIO]);
    const hh=d.getHours(); const nuit=(hh>=21||hh<6);
    e.nuit=nuit;
    e.ressT=ressTerrain(e,p,nuit);
    e.tw=humide(e.t, e.hum);
  }
  e.alt_modele = (altNative===null||altNative===undefined)? null : altNative;
  e.ecart_relief = (altNative===null||altNative===undefined)? null : Math.round(alt-altNative);
  /* sous 1400 m on serait sous le niveau 850 hPa : l'extrapolation n'a plus de sens */
  if(alt>=1400){
    const tl=tAuNiveau(e, alt);
    if(tl!==null) e.tlibre=Math.round(tl*10)/10;
    const vc=ventCrete(e, alt);
    if(vc!==null&&vc!==undefined) e.vcrete=Math.round(vc);
  }
  const z0=isothermeZero(e);
  if(z0!==null) e.iso0calc=z0;
  if(e.cape!==null&&e.cape!==undefined&&e.cape<0) e.cape=0;
  return e;
}
function extraitPoi(d, i){
  if(d.pts) return (d.pts[SCENARIO]||{})[i] || null;
  if(!d.reps) return null;
  return enrichir(extraitSuffixe(d.reps[i], POIS[i].t[SCENARIO], d.suffixe||''), POIS[i].alt, null, POIS[i]);
}

/* ================= SONDE D'IDENTIFIANTS ================= */
/* Un modèle hors de portée n'est jamais interrogé, donc on ne sait pas si son
   identifiant existe ni si son domaine couvre Belledonne. Une requête légère
   sur le point culminant du parcours répond aux deux questions à la fois :
   si une température revient à ces coordonnées, le domaine les contient. */
const PT_SONDE = {lat:45.16800, lon:5.98800, nom:'Croix de Belledonne'};
let SONDE_IDS = {};          // id -> {ok, alt}

async function sonderIdentifiants(ids){
  if(!ids.length) return;
  /* résultat valable une journée : l'orographie d'un modèle ne bouge pas */
  const cle='sonde_ids:'+new Date().toISOString().slice(0,10);
  try{
    const r=await MEM.get(cle);
    const c=JSON.parse(r.value);
    if(c && ids.every(id=>id in c)){ SONDE_IDS=Object.assign(SONDE_IDS,c); return; }
    Object.assign(SONDE_IDS, c||{});
  }catch(e){}

  const manquants=ids.filter(id=>!(id in SONDE_IDS));
  if(!manquants.length) return;
  const qp=new URLSearchParams();
  qp.set('latitude', PT_SONDE.lat); qp.set('longitude', PT_SONDE.lon);
  qp.set('hourly','temperature_2m'); qp.set('models', manquants.join(','));
  qp.set('forecast_days','1'); qp.set('timezone','Europe/Paris');
  const r=await appel(ORD_OM, 'https://api.open-meteo.com/v1/forecast?'+qp.toString());
  if(!r||!r.ok){ return; }
  let o=null; try{ o=await r.json(); }catch(e){ return; }
  if(Array.isArray(o)) o=o[0];
  const hy=(o&&o.hourly)||{};
  manquants.forEach(id=>{
    const a = hy['temperature_2m_'+id] || (manquants.length===1? hy['temperature_2m'] : null);
    const ok = !!(a && a.some(v=>v!==null&&v!==undefined));
    SONDE_IDS[id]={ok, alt:(o&&o.elevation!==undefined)? Math.round(o.elevation):null};
  });
  try{ await MEM.set(cle, JSON.stringify(SONDE_IDS)); }catch(e){}
}

function mentionSonde(id){
  const s=SONDE_IDS[id];
  if(!s) return '';
  return s.ok? ' · identifiant vérifié, domaine couvre Belledonne'
             : ' · identifiant refusé ou domaine hors zone';
}
